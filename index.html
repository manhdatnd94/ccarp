he repository and dynamically delegates each file edit to a worker LLM"], ["B", "Prompt chaining, where the assistant edits files in a fixed sequence determined before inspecting the repository"], ["C", "Parallelization by sectioning, where the assistant edits every file in the repository simultaneously using a predetermined split"], ["D", "Routing, where the assistant classifies the feature request and sends it to one of several fixed file-editing prompts"]]}, "vi": {"stem": "Một trợ lý lập trình phải sửa đổi một số lượng file chưa biết trước trên toàn repository để triển khai một tính năng, trong đó các file cụ thể và phạm vi thay đổi chỉ có thể xác định sau khi trợ lý kiểm tra codebase.\n\nMẫu (pattern) nào phù hợp nhất?", "opts": [["A", "Orchestrator-workers, trong đó một LLM trung tâm kiểm tra repository và ủy quyền một cách linh động từng thao tác sửa file cho một LLM worker"], ["B", "Prompt chaining, trong đó trợ lý sửa các file theo một trình tự cố định được xác định trước khi kiểm tra repository"], ["C", "Parallelization theo kiểu sectioning, trong đó trợ lý sửa đồng thời mọi file trong repository theo một cách chia định sẵn"], ["D", "Routing, trong đó trợ lý phân loại yêu cầu tính năng và gửi nó tới một trong số các prompt sửa file cố định"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Orchestrator-workers, trong đó một LLM trung tâm kiểm tra repository và ủy quyền một cách linh động từng thao tác sửa file cho một LLM worker\n\nChỉ sau khi đọc repo mới biết cần sửa những file nào. Orchestrator-workers cho phép khám phá trước rồi tạo các phần việc tương ứng, thay vì đoán trước danh sách file và trình tự. Việc điều phối vẫn phải xử lý phụ thuộc và xung đột giữa các sửa đổi.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Prompt chaining, trong đó trợ lý sửa các file theo một trình tự cố định được xác định trước khi kiểm tra repository**: Chuỗi file cố định trước khám phá giả định điều đề nói chưa biết.\n- **Parallelization theo kiểu sectioning, trong đó trợ lý sửa đồng thời mọi file trong repository theo một cách chia định sẵn**: Chia sẵn mọi file tạo công việc không cần thiết và không phản ánh phạm vi vừa khám phá.\n- **Routing, trong đó trợ lý phân loại yêu cầu tính năng và gửi nó tới một trong số các prompt sửa file cố định**: Routing chọn một nhánh cố định, không phân rã phạm vi nhiều file xuất hiện khi khảo sát.\n\n**Tham khảo:**\n\n- [Building effective agents](https://www.anthropic.com/research/building-effective-agents)"}, {"n": 139, "set": 4, "i": 13, "multi": false, "answer": ["A"], "en": {"stem": "A developer is building an email-triage agent that reads inbound email bodies via a tool and drafts replies.\n\nTo harden it against embedded instructions in email bodies, which combination of design choices should the developer apply? (Select all that apply)", "opts": [["A", "State a system prompt policy that content returned by tools is untrusted data and must never override the system prompt or the user's original request"], ["B", "JSON-encode the email body when passing it as a tool result so quotes or tags in the content cannot break out of the surrounding structure"], ["C", "Screen tool outputs with a lightweight classifier model before passing them to the main agent, and strip or flag content if an injection is suspected"], ["D", "Place the developer's own operating instructions inside the same tool_result block as the email body so both travel together in one message"], ["E", "Grant the agent broad, unscoped access to the user's full mailbox and account settings so it never needs to ask for additional permissions mid-task"]]}, "vi": {"stem": "Một developer đang xây dựng một agent phân loại email (email triage), đọc nội dung các email đến thông qua một tool và soạn thư trả lời.\n\nĐể gia cố agent chống lại các chỉ dẫn được nhúng trong nội dung email, developer nên áp dụng tổ hợp lựa chọn thiết kế nào? (Chọn tất cả các đáp án phù hợp.)", "opts": [["A", "Nêu rõ trong system prompt một chính sách rằng nội dung do tool trả về là dữ liệu không đáng tin cậy và tuyệt đối không được ghi đè system prompt hay yêu cầu ban đầu của người dùng"], ["B", "Mã hóa JSON (JSON-encode) nội dung email khi truyền nó dưới dạng tool result để các dấu ngoặc kép hoặc thẻ (tag) trong nội dung không thể thoát ra khỏi cấu trúc bao quanh"], ["C", "Sàng lọc đầu ra của tool bằng một model phân loại (classifier) nhẹ trước khi chuyển cho agent chính, và loại bỏ hoặc gắn cờ nội dung nếu nghi ngờ có injection"], ["D", "Đặt các chỉ dẫn vận hành của chính developer vào cùng block tool_result với nội dung email để cả hai được truyền cùng nhau trong một message"], ["E", "Cấp cho agent quyền truy cập rộng, không giới hạn phạm vi vào toàn bộ hộp thư và các thiết lập tài khoản của người dùng để nó không bao giờ phải xin thêm quyền giữa chừng tác vụ"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Nêu rõ trong system prompt một chính sách rằng nội dung do tool trả về là dữ liệu không đáng tin cậy và tuyệt đối không được ghi đè system prompt hay yêu cầu ban đầu của người dùng\n\nChính sách system phải phân biệt email do tool trả về là dữ liệu không đáng tin với chỉ dẫn có thẩm quyền. Đây là một lớp phòng vệ; JSON encoding để giữ ranh giới cấu trúc và sàng lọc output cũng có ích. Không lớp nào một mình loại bỏ mọi prompt injection, và khóa Select all đang thiếu hai biện pháp hợp lệ.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Mã hóa JSON (JSON-encode) nội dung email khi truyền nó dưới dạng tool result để các dấu ngoặc kép hoặc thẻ (tag) trong nội dung không thể thoát ra khỏi cấu trúc bao quanh**: JSON encoding ngăn nội dung phá cấu trúc bao quanh, là lớp hữu ích bị bỏ sót; nó không chặn mọi chỉ dẫn độc hại theo ngữ nghĩa.\n- **Sàng lọc đầu ra của tool bằng một model phân loại (classifier) nhẹ trước khi chuyển cho agent chính, và loại bỏ hoặc gắn cờ nội dung nếu nghi ngờ có injection**: Classifier có thể phát hiện và chặn hoặc gắn cờ injection, là lớp hợp lệ dù vẫn có false negative.\n- **Đặt các chỉ dẫn vận hành của chính developer vào cùng block tool_result với nội dung email để cả hai được truyền cùng nhau trong một message**: Trộn chỉ dẫn vận hành vào cùng dữ liệu email làm mờ ranh giới tin cậy.\n- **Cấp cho agent quyền truy cập rộng, không giới hạn phạm vi vào toàn bộ hộp thư và các thiết lập tài khoản của người dùng để nó không bao giờ phải xin thêm quyền giữa chừng tác vụ**: Quyền mailbox rộng làm tăng tác hại nếu bị injection và không cần để soạn reply trong phạm vi.\n\n**Cần xem lại:** Khóa PDF bỏ sót JSON-encoding và tool-output screening dù “Select all”. Giữ nguyên khóa trong output; cần sửa theo nội dung sau khi duyệt.\n\n**Tham khảo:**\n\n- [Mitigate jailbreaks and prompt injections](https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/mitigate-jailbreaks)", "review": {"verdict": "missing", "key": ["A", "B", "C"], "conf": "cao", "note": "'Select all that apply': trang Mitigate jailbreaks liệt kê đủ ba biện pháp cho indirect prompt injection: nêu policy untrusted trong system prompt (A), 'JSON-encode untrusted content' (B), và 'Screen tool outputs before Claude acts on them' bằng model nhẹ (C). D bị docs khuyên tránh ('Don't put your own instructions in tool results'), E trái least privilege; giải thích của site cũng xác nhận B, C bị bỏ sót.", "src": ["https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/mitigate-jailbreaks"]}}, {"n": 140, "set": 4, "i": 14, "multi": false, "answer": ["A"], "en": {"stem": "A team is building an English-to-Spanish translation feature that will be called repeatedly with different user-submitted text.\n\nThey want to keep the instructional wording consistent across calls while making it easy to swap in new text and track changes to the instructions separately from the text being translated.\n\nWhich approach best fits this goal?", "opts": [["A", "Define a prompt template with the fixed instruction text and a placeholder such as {{text}}, substituting only the variable content on each call while the surrounding instructions stay constant."], ["B", "Regenerate the complete translation prompt on every call by constructing the instruction string dynamically with the user's text, ensuring that each request carries an up-to-date version of the wording."], ["C", "Store the entire prompt containing the fixed instructions and the user's text as one static string, editing the string by hand for each new translation request so the prompt is always up to date."], ["D", "Send the fixed instruction text and the user's text to the model in two separate API calls, then concatenate the responses, placing the translation after the instruction output to form the final result."]]}, "vi": {"stem": "Một nhóm đang xây dựng tính năng dịch tiếng Anh sang tiếng Tây Ban Nha, sẽ được gọi lặp lại nhiều lần với các đoạn văn bản khác nhau do người dùng gửi.\n\nHọ muốn giữ phần câu chữ hướng dẫn nhất quán giữa các lần gọi, đồng thời dễ dàng thay văn bản mới vào và theo dõi các thay đổi đối với phần hướng dẫn tách biệt với văn bản cần dịch.\n\nCách tiếp cận nào phù hợp nhất với mục tiêu này?", "opts": [["A", "Định nghĩa một prompt template với phần hướng dẫn cố định và một placeholder như {{text}}, chỉ thay thế phần nội dung biến đổi ở mỗi lần gọi trong khi phần hướng dẫn xung quanh giữ nguyên."], ["B", "Tạo lại toàn bộ prompt dịch ở mỗi lần gọi bằng cách dựng chuỗi hướng dẫn một cách động cùng với văn bản của người dùng, bảo đảm mỗi yêu cầu đều mang phiên bản câu chữ mới nhất."], ["C", "Lưu toàn bộ prompt chứa phần hướng dẫn cố định và văn bản của người dùng thành một chuỗi tĩnh duy nhất, sửa chuỗi đó thủ công cho mỗi yêu cầu dịch mới để prompt luôn được cập nhật."], ["D", "Gửi phần hướng dẫn cố định và văn bản của người dùng tới model trong hai lệnh gọi API riêng biệt, sau đó nối các phản hồi lại, đặt bản dịch sau đầu ra của phần hướng dẫn để tạo thành kết quả cuối cùng."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Định nghĩa một prompt template với phần hướng dẫn cố định và một placeholder như {{text}}, chỉ thay thế phần nội dung biến đổi ở mỗi lần gọi trong khi phần hướng dẫn xung quanh giữ nguyên.\n\nTemplate cố định chỉ dẫn dịch Anh sang Tây Ban Nha và dùng placeholder cho nội dung thay đổi. Nhóm có thể version chỉ dẫn độc lập với từng đoạn text, giúp so sánh kết quả giữa các phiên bản và tránh sửa nhầm hướng dẫn khi thay dữ liệu.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Tạo lại toàn bộ prompt dịch ở mỗi lần gọi bằng cách dựng chuỗi hướng dẫn một cách động cùng với văn bản của người dùng, bảo đảm mỗi yêu cầu đều mang phiên bản câu chữ mới nhất.**: Dựng lại toàn bộ wording mỗi lượt tăng nguy cơ lệch chỉ dẫn và khó theo dõi thay đổi riêng.\n- **Lưu toàn bộ prompt chứa phần hướng dẫn cố định và văn bản của người dùng thành một chuỗi tĩnh duy nhất, sửa chuỗi đó thủ công cho mỗi yêu cầu dịch mới để prompt luôn được cập nhật.**: Sửa tay chuỗi chung vừa chậm vừa dễ sửa nhầm phần chỉ dẫn.\n- **Gửi phần hướng dẫn cố định và văn bản của người dùng tới model trong hai lệnh gọi API riêng biệt, sau đó nối các phản hồi lại, đặt bản dịch sau đầu ra của phần hướng dẫn để tạo thành kết quả cuối cùng.**: Hai API call riêng không cho lần dịch nhìn thấy cả chỉ dẫn và dữ liệu cùng lúc; ghép câu trả lời không sửa được điều đó.\n\n**Tham khảo:**\n\n- [Prompting best practices](https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices)"}, {"n": 141, "set": 4, "i": 15, "multi": false, "answer": ["A"], "en": {"stem": "An agent runs long tool-use loops involving dozens of file reads per session.\n\nThe team wants old tool results automatically cleared once input tokens exceed 30,000, while always preserving the 3 most recent tool exchanges and never clearing results from the web_search tool.\n\nWhich context_management configuration achieves this?", "opts": [["A", "Configure a clear_tool_uses_20250919 edit with trigger set to 30000 input tokens, keep 3 tool uses, exclude_tools set to web_search."], ["B", "A clear_thinking_20251015 edit with trigger set to 30000 input tokens, keep set to 3 thinking turns, and exclude_tools set to web_search should be used."], ["C", "A clear_tool_uses_20250919 edit with trigger set to tool_uses 30000, with no keep value explicitly set, and with no exclude_tools value explicitly set."], ["D", "A clear_tool_uses_20250919 edit with trigger set to 30000 input tokens, keep set to 3 tool uses, and exclude_tools set to file_read should be used."]]}, "vi": {"stem": "Một agent chạy các vòng lặp tool use dài, gồm hàng chục lần đọc file trong mỗi phiên.\n\nNhóm muốn các kết quả tool cũ được tự động xóa khi số input token vượt quá 30,000, đồng thời luôn giữ lại 3 lượt trao đổi tool gần nhất và không bao giờ xóa kết quả từ tool web_search.\n\nCấu hình context_management nào đạt được điều này?", "opts": [["A", "Cấu hình một edit clear_tool_uses_20250919 với trigger đặt ở 30000 input token, keep 3 tool use, exclude_tools đặt là web_search."], ["B", "Nên dùng một edit clear_thinking_20251015 với trigger đặt ở 30000 input token, keep đặt là 3 lượt thinking, và exclude_tools đặt là web_search."], ["C", "Một edit clear_tool_uses_20250919 với trigger đặt là tool_uses 30000, không đặt tường minh giá trị keep, và không đặt tường minh giá trị exclude_tools."], ["D", "Nên dùng một edit clear_tool_uses_20250919 với trigger đặt ở 30000 input token, keep đặt là 3 tool use, và exclude_tools đặt là file_read."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Cấu hình một edit clear_tool_uses_20250919 với trigger đặt ở 30000 input token, keep 3 tool use, exclude_tools đặt là web_search.\n\nclear_tool_uses_20250919 với trigger input_tokens = 30000 kích hoạt theo dung lượng đầu vào; keep tool_uses = 3 giữ ba trao đổi gần nhất. exclude_tools chứa web_search bảo vệ kết quả tìm kiếm khỏi dọn. Ba tham số khớp ba yêu cầu riêng.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Nên dùng một edit clear_thinking_20251015 với trigger đặt ở 30000 input token, keep đặt là 3 lượt thinking, và exclude_tools đặt là web_search.**: clear_thinking quản lý thinking blocks, không dọn kết quả file-read cũ.\n- **Một edit clear_tool_uses_20250919 với trigger đặt là tool_uses 30000, không đặt tường minh giá trị keep, và không đặt tường minh giá trị exclude_tools.**: Ngưỡng tool_uses đếm lần dùng tool thay vì input token; thiếu danh sách ngoại lệ web_search.\n- **Nên dùng một edit clear_tool_uses_20250919 với trigger đặt ở 30000 input token, keep đặt là 3 tool use, và exclude_tools đặt là file_read.**: Loại trừ file_read bảo vệ sai tool và vẫn cho phép dọn web_search.\n\n**Tham khảo:**\n\n- [Context editing](https://platform.claude.com/docs/en/build-with-claude/context-editing)"}, {"n": 142, "set": 4, "i": 16, "multi": false, "answer": ["B"], "en": {"stem": "A code-review prompt needs Claude to generate a fix, verify the fix against a set of criteria, and then refine the fix if criteria are not met.\n\nThe team wants to inspect the intermediate review step and log it separately before the final refinement is produced.\n\nWhich approach best fits this requirement?", "opts": [["A", "Ask Claude to generate, verify, and refine the fix in one response using extended reasoning, but this keeps the review internal and unloggable."], ["B", "Break the task into separate API calls: generate a fix, review it against the criteria, then refine the fix, so each step can be logged independently."], ["C", "Add tags around the review step so Claude places the review inside and the fix outside, and the review can be extracted and logged apart."], ["D", "Provide five few-shot examples of correct fixes for Claude to mimic, bypassing the review step, removing the intermediate step and preventing logging."]]}, "vi": {"stem": "Một prompt rà soát mã (code review) cần Claude tạo ra một bản sửa lỗi, kiểm chứng bản sửa đó theo một bộ tiêu chí, rồi tinh chỉnh bản sửa nếu chưa đạt tiêu chí.\n\nNhóm muốn xem xét bước rà soát trung gian và ghi log nó riêng trước khi bản tinh chỉnh cuối cùng được tạo ra.\n\nCách tiếp cận nào phù hợp nhất với yêu cầu này?", "opts": [["A", "Yêu cầu Claude tạo, kiểm chứng và tinh chỉnh bản sửa trong một phản hồi duy nhất bằng suy luận mở rộng (extended reasoning), nhưng cách này giữ bước rà soát ở bên trong và không thể ghi log."], ["B", "Chia tác vụ thành các lệnh gọi API riêng biệt: tạo bản sửa, rà soát nó theo các tiêu chí, rồi tinh chỉnh bản sửa, để mỗi bước có thể được ghi log độc lập."], ["C", "Thêm thẻ (tag) bao quanh bước rà soát để Claude đặt phần rà soát bên trong và bản sửa bên ngoài, nhờ đó phần rà soát có thể được tách ra và ghi log riêng."], ["D", "Cung cấp năm ví dụ few-shot về các bản sửa đúng để Claude bắt chước, bỏ qua bước rà soát, loại bỏ bước trung gian và khiến không thể ghi log."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Chia tác vụ thành các lệnh gọi API riêng biệt: tạo bản sửa, rà soát nó theo các tiêu chí, rồi tinh chỉnh bản sửa, để mỗi bước có thể được ghi log độc lập.\n\nTách generate, review và refine thành các API call tạo ra một kết quả review rõ ràng mà ứng dụng có thể lưu trước khi gửi sang bước sửa tiếp. Cấu trúc này cho phép kiểm tra từng chặng thay vì phụ thuộc vào suy luận nội bộ của một phản hồi.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Yêu cầu Claude tạo, kiểm chứng và tinh chỉnh bản sửa trong một phản hồi duy nhất bằng suy luận mở rộng (extended reasoning), nhưng cách này giữ bước rà soát ở bên trong và không thể ghi log.**: Một phản hồi có thể chứa review công khai nếu yêu cầu, nhưng không tạo checkpoint riêng trước refinement như đề muốn; suy luận nội bộ không phải log kiểm chứng.\n- **Thêm thẻ (tag) bao quanh bước rà soát để Claude đặt phần rà soát bên trong và bản sửa bên ngoài, nhờ đó phần rà soát có thể được tách ra và ghi log riêng.**: Tag thinking chỉ là markup, không bảo đảm suy luận nội bộ được xuất hoặc có bước dừng để log trước refine.\n- **Cung cấp năm ví dụ few-shot về các bản sửa đúng để Claude bắt chước, bỏ qua bước rà soát, loại bỏ bước trung gian và khiến không thể ghi log.**: Ví dụ fix mẫu không tạo review trung gian theo tiêu chí.\n\n**Tham khảo:**\n\n- [Prompting best practices](https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices)"}, {"n": 143, "set": 4, "i": 17, "multi": false, "answer": ["A"], "en": {"stem": "A platform wants Claude to discover tools using an existing embeddings index rather than the built-in regex or BM25 matching, because tool descriptions are sparse but semantically related through the embedding space.\n\nWhich implementation matches this requirement?", "opts": [["A", "Build a custom tool that runs the embeddings search and returns tool_reference blocks in its tool_result for Claude to expand."], ["B", "Enable the built-in BM25 tool search variant, since BM25 ranking approximates embedding-based semantic similarity closely enough."], ["C", "Enable the built-in regex tool search variant and rely on broad wildcard patterns to approximate semantic matching."], ["D", "Disable tool search and load every tool definition up front so the embeddings index becomes unnecessary."]]}, "vi": {"stem": "Một nền tảng muốn Claude khám phá tool bằng một chỉ mục embedding (embeddings index) sẵn có thay vì cơ chế so khớp regex hoặc BM25 tích hợp sẵn, vì phần mô tả tool khá sơ sài nhưng có liên hệ ngữ nghĩa với nhau thông qua không gian embedding.\n\nCách triển khai nào đáp ứng yêu cầu này?", "opts": [["A", "Xây dựng một tool tùy chỉnh chạy tìm kiếm embedding và trả về các block tool_reference trong tool_result của nó để Claude mở rộng (expand)."], ["B", "Bật biến thể tool search BM25 tích hợp sẵn, vì xếp hạng BM25 xấp xỉ đủ sát với độ tương đồng ngữ nghĩa dựa trên embedding."], ["C", "Bật biến thể tool search regex tích hợp sẵn và dựa vào các mẫu wildcard rộng để xấp xỉ việc so khớp ngữ nghĩa."], ["D", "Tắt tool search và nạp trước toàn bộ định nghĩa tool ngay từ đầu để chỉ mục embedding trở nên không cần thiết."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Xây dựng một tool tùy chỉnh chạy tìm kiếm embedding và trả về các block tool_reference trong tool_result của nó để Claude mở rộng (expand).\n\nCustom search tool có thể gọi embeddings index sẵn có và trả tool_reference blocks trong tool_result. Claude dùng các tham chiếu đó để mở định nghĩa cần thiết, nên thuật toán tìm tool có thể theo ngữ nghĩa thay vì bị ràng buộc bởi matcher tích hợp.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Bật biến thể tool search BM25 tích hợp sẵn, vì xếp hạng BM25 xấp xỉ đủ sát với độ tương đồng ngữ nghĩa dựa trên embedding.**: BM25 xếp hạng theo từ vựng; không thực hiện tìm kiếm trên embeddings index của nhóm.\n- **Bật biến thể tool search regex tích hợp sẵn và dựa vào các mẫu wildcard rộng để xấp xỉ việc so khớp ngữ nghĩa.**: Regex khớp mẫu ký tự, không khai thác khoảng cách ngữ nghĩa của vector.\n- **Tắt tool search và nạp trước toàn bộ định nghĩa tool ngay từ đầu để chỉ mục embedding trở nên không cần thiết.**: Nạp toàn bộ tool bỏ yêu cầu dùng index và làm tăng context ban đầu.\n\n**Tham khảo:**\n\n- [Tool search tool](https://platform.claude.com/docs/en/agents-and-tools/tool-use/tool-search-tool)"}, {"n": 144, "set": 4, "i": 18, "multi": false, "answer": ["A"], "en": {"stem": "A support-ticket assistant retrieves passages from a 500-document internal knowledge base for each incoming ticket and must cite the exact source passage in every reply, without re-sending the entire corpus on each request.\n\nWhich approach best matches this data shape and query pattern?", "opts": [["A", "Return the retrieved passages as search result content blocks from a retrieval tool, each carrying source and title metadata, so Claude generates natural citations per ticket."], ["B", "Upload all 500 documents as citable text documents in the system prompt so that Claude can reference any passage directly, and then instruct it to cite the source document and section for every reply."], ["C", "Concatenate the full corpus into a single long-context user message with all 500 documents separated by titles, then prompt Claude to extract the relevant passage and cite its source."], ["D", "Store the corpus in the memory tool by saving each document as a separate entry, configure assistant to load all entries before answering, and prompt it to cite source document for any retrieved passage."]]}, "vi": {"stem": "Một trợ lý xử lý ticket hỗ trợ truy xuất các đoạn văn (passage) từ một knowledge base nội bộ gồm 500 tài liệu cho mỗi ticket gửi đến, và phải trích dẫn chính xác đoạn nguồn trong mọi câu trả lời, mà không gửi lại toàn bộ kho tài liệu (corpus) ở mỗi yêu cầu.\n\nCách tiếp cận nào phù hợp nhất với dạng dữ liệu và mẫu truy vấn này?", "opts": [["A", "Trả về các đoạn văn đã truy xuất dưới dạng các content block search result từ một tool truy xuất, mỗi block mang metadata về nguồn (source) và tiêu đề (title), để Claude tạo trích dẫn tự nhiên cho từng ticket."], ["B", "Tải toàn bộ 500 tài liệu lên dưới dạng các tài liệu văn bản có thể trích dẫn trong system prompt để Claude có thể tham chiếu trực tiếp bất kỳ đoạn nào, rồi hướng dẫn nó trích dẫn tài liệu nguồn và mục tương ứng trong mọi câu trả lời."], ["C", "Ghép toàn bộ kho tài liệu thành một user message ngữ cảnh dài duy nhất với cả 500 tài liệu được phân tách bằng tiêu đề, rồi prompt Claude trích xuất đoạn liên quan và trích dẫn nguồn của nó."], ["D", "Lưu kho tài liệu vào memory tool bằng cách lưu mỗi tài liệu thành một mục riêng, cấu hình trợ lý nạp tất cả các mục trước khi trả lời, và prompt nó trích dẫn tài liệu nguồn cho bất kỳ đoạn nào được truy xuất."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Trả về các đoạn văn đã truy xuất dưới dạng các content block search result từ một tool truy xuất, mỗi block mang metadata về nguồn (source) và tiêu đề (title), để Claude tạo trích dẫn tự nhiên cho từng ticket.\n\nTruy hồi theo từng ticket chỉ đưa đoạn liên quan vào context. Search result blocks kèm source, title và nội dung cho phép attribution đến đoạn được trả về, đáp ứng yêu cầu citation mà không gửi lại cả 500 tài liệu. Cần bật citations cho các search result blocks được trả về.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Tải toàn bộ 500 tài liệu lên dưới dạng các tài liệu văn bản có thể trích dẫn trong system prompt để Claude có thể tham chiếu trực tiếp bất kỳ đoạn nào, rồi hướng dẫn nó trích dẫn tài liệu nguồn và mục tương ứng trong mọi câu trả lời.**: Đưa cả 500 tài liệu vào prompt vẫn gửi toàn kho, trái hình dạng truy vấn theo ticket.\n- **Ghép toàn bộ kho tài liệu thành một user message ngữ cảnh dài duy nhất với cả 500 tài liệu được phân tách bằng tiêu đề, rồi prompt Claude trích xuất đoạn liên quan và trích dẫn nguồn của nó.**: Nối toàn kho tiêu tốn context và không thực hiện lựa chọn đoạn liên quan trước khi gọi model.\n- **Lưu kho tài liệu vào memory tool bằng cách lưu mỗi tài liệu thành một mục riêng, cấu hình trợ lý nạp tất cả các mục trước khi trả lời, và prompt nó trích dẫn tài liệu nguồn cho bất kỳ đoạn nào được truy xuất.**: Memory không phải thay thế vector index; nạp mọi entry vẫn đưa toàn kho vào mỗi lượt.\n\n**Tham khảo:**\n\n- [Search results](https://platform.claude.com/docs/en/build-with-claude/search-results)"}, {"n": 145, "set": 4, "i": 19, "multi": false, "answer": ["A"], "en": {"stem": "A team originally split their onboarding manual into fixed 500-character chunks with no overlap.\n\nThey now find that many chunks begin or end mid-sentence, and answers near a chunk boundary are frequently missed because the relevant sentence is split across two separate embeddings.\n\nWhich chunking adjustment most directly addresses this specific failure?", "opts": [["A", "Split chunks along natural boundaries such as paragraphs or sections, and add a small overlap between adjacent chunks so boundary sentences appear intact in at least one chunk."], ["B", "Reduce the chunk size so each chunk contains exactly one sentence, splitting on punctuation such as periods or exclamation points, and drop the fixed character limit to prevent mid-sentence breaks."], ["C", "Remove overlap and set a smaller fixed chunk size, such as 250 characters, to lower the vector index count and accelerate semantic search without changing how sentences are split."], ["D", "Keep the fixed 500-character boundaries and increase the embedding model's context window so that each vector encodes more surrounding text, reducing missed answers near splits."]]}, "vi": {"stem": "Ban đầu, một nhóm chia sổ tay hướng dẫn nhân viên mới (onboarding manual) thành các chunk cố định 500 ký tự, không có chồng lấn (overlap).\n\nGiờ họ nhận thấy nhiều chunk bắt đầu hoặc kết thúc giữa câu, và các câu trả lời nằm gần ranh giới chunk thường bị bỏ sót vì câu liên quan bị tách ra giữa hai embedding riêng biệt.\n\nĐiều chỉnh chunking nào giải quyết trực tiếp nhất lỗi cụ thể này?", "opts": [["A", "Chia chunk theo các ranh giới tự nhiên như đoạn văn hoặc mục (section), và thêm một phần chồng lấn nhỏ giữa các chunk liền kề để các câu ở ranh giới xuất hiện nguyên vẹn trong ít nhất một chunk."], ["B", "Giảm kích thước chunk để mỗi chunk chứa đúng một câu, tách theo dấu câu như dấu chấm hoặc dấu chấm than, và bỏ giới hạn ký tự cố định để tránh bị cắt giữa câu."], ["C", "Bỏ phần chồng lấn và đặt kích thước chunk cố định nhỏ hơn, chẳng hạn 250 ký tự, để giảm số lượng vector trong chỉ mục và tăng tốc tìm kiếm ngữ nghĩa mà không thay đổi cách tách câu."], ["D", "Giữ ranh giới cố định 500 ký tự và tăng context window của model embedding để mỗi vector mã hóa thêm phần văn bản xung quanh, giảm số câu trả lời bị bỏ sót gần các điểm cắt."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Chia chunk theo các ranh giới tự nhiên như đoạn văn hoặc mục (section), và thêm một phần chồng lấn nhỏ giữa các chunk liền kề để các câu ở ranh giới xuất hiện nguyên vẹn trong ít nhất một chunk.\n\nChia theo đoạn hoặc mục giữ đơn vị ý nghĩa liền mạch; overlap nhỏ giúp câu gần ranh giới xuất hiện đủ trong ít nhất một chunk. Đây là cách sửa trực tiếp lỗi câu bị cắt của đề. Kích thước và overlap cần đo trên dữ liệu thực, không có một giá trị tối ưu cho mọi kho.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Giảm kích thước chunk để mỗi chunk chứa đúng một câu, tách theo dấu câu như dấu chấm hoặc dấu chấm than, và bỏ giới hạn ký tự cố định để tránh bị cắt giữa câu.**: Một câu mỗi chunk tránh cắt câu nhưng dễ mất ngữ cảnh nối nhiều câu; không bổ sung liên tục qua ranh giới như phương án phù hợp hơn.\n- **Bỏ phần chồng lấn và đặt kích thước chunk cố định nhỏ hơn, chẳng hạn 250 ký tự, để giảm số lượng vector trong chỉ mục và tăng tốc tìm kiếm ngữ nghĩa mà không thay đổi cách tách câu.**: Chunk nhỏ hơn làm tăng số vector với cùng tài liệu, không giảm; vẫn cắt câu nếu giữ cách chia ký tự.\n- **Giữ ranh giới cố định 500 ký tự và tăng context window của model embedding để mỗi vector mã hóa thêm phần văn bản xung quanh, giảm số câu trả lời bị bỏ sót gần các điểm cắt.**: Cửa sổ embedding lớn hơn không tự thêm văn bản nằm ngoài chunk đã truyền.\n\n**Tham khảo:**\n\n- [Chunk documents for vector search](https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-chunk-documents)"}, {"n": 146, "set": 4, "i": 20, "multi": false, "answer": ["A"], "en": {"stem": "An agent's project has accumulated a dozen skills, several of which perform side-effecting actions such as sending Slack messages or deleting stale branches.\n\nReviewers notice Claude occasionally auto-triggers these side-effecting skills based on vague description matches, and want to reduce the agent's effective capability surface so these skills only run when a person explicitly invokes them.\n\nWhat is the most direct fix?", "opts": [["A", "Set disable-model-invocation: true in the frontmatter of each side-effecting skill so Claude cannot select them automatically and only the user can invoke them with /name."], ["B", "Delete the skill descriptions from the frontmatter of each side-effecting skill so Claude has no basis for automatic matching and only the user can invoke those skills by name."], ["C", "Move the side-effecting skills into CLAUDE.md so they load as always-on context, which ensures Claude only uses them when the user explicitly invokes them by name in a request."], ["D", "Rewrite the instructions of each side-effecting skill to instruct Claude to ask for confirmation before performing the side effect, without modifying frontmatter fields."]]}, "vi": {"stem": "Dự án của một agent đã tích lũy khoảng một tá skill, trong đó một số skill thực hiện các hành động có tác dụng phụ (side effect) như gửi tin nhắn Slack hoặc xóa các branch đã cũ.\n\nNgười rà soát nhận thấy Claude đôi khi tự động kích hoạt các skill có tác dụng phụ này dựa trên việc khớp mô tả một cách mơ hồ, và muốn thu hẹp phạm vi năng lực thực tế của agent để các skill này chỉ chạy khi có người chủ động gọi chúng.\n\nCách khắc phục trực tiếp nhất là gì?", "opts": [["A", "Đặt disable-model-invocation: true trong frontmatter của từng skill có tác dụng phụ để Claude không thể tự động chọn chúng và chỉ người dùng mới có thể gọi chúng bằng /name."], ["B", "Xóa phần mô tả skill khỏi frontmatter của từng skill có tác dụng phụ để Claude không có cơ sở tự động khớp và chỉ người dùng mới có thể gọi các skill đó theo tên."], ["C", "Chuyển các skill có tác dụng phụ vào CLAUDE.md để chúng được nạp như context luôn bật, điều này bảo đảm Claude chỉ dùng chúng khi người dùng chủ động gọi theo tên trong một yêu cầu."], ["D", "Viết lại phần hướng dẫn của từng skill có tác dụng phụ để yêu cầu Claude xin xác nhận trước khi thực hiện tác dụng phụ, mà không sửa các trường frontmatter."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Đặt disable-model-invocation: true trong frontmatter của từng skill có tác dụng phụ để Claude không thể tự động chọn chúng và chỉ người dùng mới có thể gọi chúng bằng /name.\n\ndisable-model-invocation: true chặn Claude tự chọn skill và dành việc gọi /name cho người dùng. Đây là cấu hình đúng điểm ra quyết định kích hoạt, giảm khả năng skill có side effect chạy chỉ vì mô tả khớp mơ hồ.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Xóa phần mô tả skill khỏi frontmatter của từng skill có tác dụng phụ để Claude không có cơ sở tự động khớp và chỉ người dùng mới có thể gọi các skill đó theo tên.**: Bỏ mô tả làm discovery kém rõ nhưng không phải cơ chế disable invocation được hỗ trợ.\n- **Chuyển các skill có tác dụng phụ vào CLAUDE.md để chúng được nạp như context luôn bật, điều này bảo đảm Claude chỉ dùng chúng khi người dùng chủ động gọi theo tên trong một yêu cầu.**: CLAUDE.md đưa chỉ dẫn vào ngữ cảnh thường trực, không thiết lập chế độ chỉ gọi thủ công.\n- **Viết lại phần hướng dẫn của từng skill có tác dụng phụ để yêu cầu Claude xin xác nhận trước khi thực hiện tác dụng phụ, mà không sửa các trường frontmatter.**: Yêu cầu hỏi xác nhận điều khiển hành động sau khi skill đã kích hoạt, không ngăn auto-trigger.\n\n**Tham khảo:**\n\n- [Extend Claude with skills](https://code.claude.com/docs/en/skills)"}, {"n": 147, "set": 4, "i": 21, "multi": false, "answer": ["A"], "en": {"stem": "A team is defining the success criteria for a new claims-summarization feature before building the evaluation dataset.\n\nThe current draft criterion reads: \"the summaries should be concise and helpful.\"\n\nWhich revised criterion best follows the SMART framework for evaluation design?", "opts": [["A", "Require summaries to average at least 4 out of 5 on a completeness rubric across a 500-claim sample"], ["B", "Require summaries to earn a perfect 5 out of 5 completeness score from every adjuster in the sample"], ["C", "Require summaries to sound less robotic and read more naturally to the adjusters who review them"], ["D", "Require every summary to be signed off by a senior adjuster before it counts as acceptable"]]}, "vi": {"stem": "Một nhóm đang xác định tiêu chí thành công cho một tính năng tóm tắt hồ sơ bồi thường (claims) mới trước khi xây dựng tập dữ liệu đánh giá.\n\nTiêu chí bản nháp hiện tại ghi: \"các bản tóm tắt phải ngắn gọn và hữu ích.\"\n\nTiêu chí sửa đổi nào tuân theo khung SMART cho thiết kế đánh giá tốt nhất?", "opts": [["A", "Yêu cầu các bản tóm tắt đạt trung bình ít nhất 4/5 điểm theo một rubric về độ đầy đủ trên một mẫu gồm 500 hồ sơ bồi thường"], ["B", "Yêu cầu các bản tóm tắt đạt điểm tuyệt đối 5/5 về độ đầy đủ từ mọi chuyên viên thẩm định (adjuster) trong mẫu"], ["C", "Yêu cầu các bản tóm tắt nghe bớt máy móc và đọc tự nhiên hơn đối với các chuyên viên thẩm định rà soát chúng"], ["D", "Yêu cầu mọi bản tóm tắt phải được một chuyên viên thẩm định cấp cao phê duyệt trước khi được xem là chấp nhận được"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Yêu cầu các bản tóm tắt đạt trung bình ít nhất 4/5 điểm theo một rubric về độ đầy đủ trên một mẫu gồm 500 hồ sơ bồi thường\n\nĐiểm completeness trung bình tối thiểu 4/5 trên mẫu 500 claim cho phép chấm theo rubric và kiểm tra kết quả cụ thể, tốt hơn “ngắn gọn và hữu ích”. Tuy vậy, lựa chọn này chưa nêu thời hạn hoặc chứng minh khả thi, nên không nên gọi là đầy đủ mọi yếu tố SMART.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Yêu cầu các bản tóm tắt đạt điểm tuyệt đối 5/5 về độ đầy đủ từ mọi chuyên viên thẩm định (adjuster) trong mẫu**: Đòi mọi người chấm tuyệt đối 5/5 là ngưỡng khắt khe chưa có bằng chứng khả thi.\n- **Yêu cầu các bản tóm tắt nghe bớt máy móc và đọc tự nhiên hơn đối với các chuyên viên thẩm định rà soát chúng**: Bớt máy móc và tự nhiên hơn vẫn thiếu rubric hoặc ngưỡng đo.\n- **Yêu cầu mọi bản tóm tắt phải được một chuyên viên thẩm định cấp cao phê duyệt trước khi được xem là chấp nhận được**: Chữ ký cấp cao là bước quản trị, không định lượng chất lượng tóm tắt.\n\n**Cần xem lại:** Lựa chọn nguồn tốt nhất nhưng chưa thể hiện đầy đủ SMART: thiếu time-bound và bằng chứng achievable. Không dạy rằng chỉ có điểm số và cỡ mẫu là đủ SMART.\n\n**Tham khảo:**\n\n- [Define success and build evaluations](https://platform.claude.com/docs/en/test-and-evaluate/develop-tests)"}, {"n": 148, "set": 4, "i": 22, "multi": false, "answer": ["B"], "en": {"stem": "A platform engineer sets CLAUDE_CODE_ENABLE_TELEMETRY=1 on every CI runner but the team's OTLP collector never receives any spans, metrics, or logs from Claude Code jobs.\n\nNo other telemetry variables were configured.\n\nWhat is the most likely cause of the missing data?", "opts": [["A", "The collector rejects every signal until CLAUDE_CODE_ENHANCED_TELEMETRY_BETA=1 is also set, regardless of which exporters are chosen"], ["B", "Telemetry is enabled but no exporter was selected, so OTEL_METRICS_EXPORTER and OTEL_LOGS_EXPORTER default to producing no export at all"], ["C", "The CLI only emits telemetry once the console exporter has been configured first as a required local fallback"], ["D", "The organization's Admin API key must be exported through OTEL_EXPORTER_OTLP_HEADERS before the CLI will emit any signal"]]}, "vi": {"stem": "Một kỹ sư nền tảng đặt CLAUDE_CODE_ENABLE_TELEMETRY=1 trên mọi CI runner nhưng OTLP collector của nhóm không bao giờ nhận được bất kỳ span, metric hay log nào từ các job Claude Code.\n\nKhông có biến telemetry nào khác được cấu hình.\n\nNguyên nhân có khả năng nhất khiến dữ liệu bị thiếu là gì?", "opts": [["A", "Collector từ chối mọi tín hiệu cho đến khi CLAUDE_CODE_ENHANCED_TELEMETRY_BETA=1 cũng được đặt, bất kể chọn exporter nào"], ["B", "Telemetry đã được bật nhưng chưa chọn exporter nào, nên OTEL_METRICS_EXPORTER và OTEL_LOGS_EXPORTER mặc định không xuất (export) gì cả"], ["C", "CLI chỉ phát telemetry sau khi console exporter đã được cấu hình trước như một phương án dự phòng cục bộ bắt buộc"], ["D", "Admin API key của tổ chức phải được xuất qua OTEL_EXPORTER_OTLP_HEADERS thì CLI mới phát bất kỳ tín hiệu nào"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Telemetry đã được bật nhưng chưa chọn exporter nào, nên OTEL_METRICS_EXPORTER và OTEL_LOGS_EXPORTER mặc định không xuất (export) gì cả\n\nCLAUDE_CODE_ENABLE_TELEMETRY=1 bật thu telemetry nhưng chưa chọn nơi xuất. Cần đặt OTEL_METRICS_EXPORTER và OTEL_LOGS_EXPORTER phù hợp, chẳng hạn otlp, cùng endpoint/protocol. Không nên suy ra chỉ bật cờ là mọi loại signal sẽ được gửi đến collector.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Collector từ chối mọi tín hiệu cho đến khi CLAUDE_CODE_ENHANCED_TELEMETRY_BETA=1 cũng được đặt, bất kể chọn exporter nào**: Enhanced telemetry không thay cho việc cấu hình exporter cơ bản.\n- **CLI chỉ phát telemetry sau khi console exporter đã được cấu hình trước như một phương án dự phòng cục bộ bắt buộc**: Console không phải bước bắt buộc trước OTLP; có thể chọn OTLP trực tiếp.\n- **Admin API key của tổ chức phải được xuất qua OTEL_EXPORTER_OTLP_HEADERS thì CLI mới phát bất kỳ tín hiệu nào**: Admin API key không phải điều kiện chung để phát telemetry; header tùy yêu cầu xác thực collector.\n\n**Tham khảo:**\n\n- [Monitoring](https://code.claude.com/docs/en/monitoring-usage)"}, {"n": 149, "set": 4, "i": 23, "multi": false, "answer": ["A"], "en": {"stem": "An agentic coding assistant runs long sessions that accumulate hundreds of tool calls, and the conversation regularly approaches the model's context window limit before the task is finished.\n\nEngineers want strategies that let the session continue productively without losing critical state.\n\nWhich approaches address this goal?", "opts": [["A", "Enable server-side compaction so earlier turns are automatically summarized once the conversation nears the context window limit"], ["B", "Configure context editing to clear old tool results once a token threshold is reached, keeping only recent tool use/result pairs"], ["C", "Use the memory tool to persist critical state to durable storage before old context is cleared, so a session recovers quickly"], ["D", "Lower the effort parameter to low so Claude generates shorter replies, preventing the context window from ever filling up"], ["E", "Switch the session to the Message Batches API so each turn runs as an independent asynchronous request with fresh context"], ["F", "Increase the effort parameter to max so Claude reasons more thoroughly and needs fewer total turns to finish the task"]]}, "vi": {"stem": "Một trợ lý lập trình dạng agent (agentic coding assistant) chạy các phiên dài tích lũy hàng trăm lệnh gọi tool, và cuộc hội thoại thường xuyên tiến gần giới hạn context window của model trước khi tác vụ hoàn thành.\n\nCác kỹ sư muốn có các chiến lược giúp phiên tiếp tục hiệu quả mà không mất trạng thái quan trọng.\n\nNhững cách tiếp cận nào giải quyết mục tiêu này?", "opts": [["A", "Bật compaction phía server (server-side) để các lượt trước đó được tự động tóm tắt khi cuộc hội thoại gần chạm giới hạn context window"], ["B", "Cấu hình context editing để xóa các kết quả tool cũ khi đạt đến một ngưỡng token, chỉ giữ lại các cặp tool use/result gần đây"], ["C", "Dùng memory tool để lưu trạng thái quan trọng vào kho lưu trữ bền vững trước khi context cũ bị xóa, nhờ đó phiên khôi phục nhanh chóng"], ["D", "Hạ tham số effort xuống low để Claude tạo các phản hồi ngắn hơn, ngăn context window không bao giờ bị đầy"], ["E", "Chuyển phiên sang Message Batches API để mỗi lượt chạy như một yêu cầu bất đồng bộ độc lập với context mới"], ["F", "Tăng tham số effort lên max để Claude suy luận kỹ lưỡng hơn và cần ít lượt hơn để hoàn thành tác vụ"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Bật compaction phía server (server-side) để các lượt trước đó được tự động tóm tắt khi cuộc hội thoại gần chạm giới hạn context window\n\nServer-side compaction thay lịch sử dài bằng bản tóm tắt khi gần ngưỡng, tạo chỗ để agent tiếp tục. Context editing để bỏ kết quả tool cũ và memory để lưu trạng thái bền vững cũng phù hợp, nhưng khóa chỉ chọn compaction. Những cơ chế này cần giữ thông tin quan trọng có chủ đích, không hứa không mất dữ liệu.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Cấu hình context editing để xóa các kết quả tool cũ khi đạt đến một ngưỡng token, chỉ giữ lại các cặp tool use/result gần đây**: Context editing cũng đúng: dọn kết quả cũ và giữ phần gần đây giảm áp lực context; khóa đang thiếu.\n- **Dùng memory tool để lưu trạng thái quan trọng vào kho lưu trữ bền vững trước khi context cũ bị xóa, nhờ đó phiên khôi phục nhanh chóng**: Memory cũng đúng khi ứng dụng lưu bền vững và truy hồi trạng thái cần thiết trước khi dọn; khóa đang thiếu.\n- **Hạ tham số effort xuống low để Claude tạo các phản hồi ngắn hơn, ngăn context window không bao giờ bị đầy**: Effort thấp có thể giảm output nhưng input và tool vẫn tích lũy, nên không ngăn context đầy mãi mãi.\n- **Chuyển phiên sang Message Batches API để mỗi lượt chạy như một yêu cầu bất đồng bộ độc lập với context mới**: Batch là cách chạy bất đồng bộ, không tự giữ liên tục trạng thái giữa các lượt agent.\n- **Tăng tham số effort lên max để Claude suy luận kỹ lưỡng hơn và cần ít lượt hơn để hoàn thành tác vụ**: Effort max tăng suy luận và token, không phải cơ chế giải phóng context.\n\n**Cần xem lại:** Khóa nguồn chỉ chọn compaction trong câu hỏi nhiều chiến lược. Context editing và memory cũng phù hợp; cần duyệt thêm hai nội dung này, giữ nguyên khóa hiện tại.\n\n**Tham khảo:**\n\n- [Compaction overview](https://platform.claude.com/docs/en/build-with-claude/compaction)\n- [Context editing](https://platform.claude.com/docs/en/build-with-claude/context-editing)\n- [Memory tool](https://platform.claude.com/docs/en/agents-and-tools/tool-use/memory-tool)", "review": {"verdict": "missing", "key": ["A", "B", "C"], "conf": "cao", "note": "Đề hỏi 'Which approaches' (nhiều cách). Ngoài server-side compaction (A), context editing dọn tool result cũ theo ngưỡng token (B) và memory tool lưu trạng thái quan trọng ra bộ nhớ bền vững trước khi context bị dọn (C) đều là chiến lược docs khuyến nghị cho agent dài; D/E/F không giải phóng context. Giải thích của site cũng gọi B, C là đúng nhưng bị thiếu.", "src": ["https://platform.claude.com/docs/en/build-with-claude/compaction", "https://platform.claude.com/docs/en/build-with-claude/context-editing", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/memory-tool"]}}, {"n": 150, "set": 4, "i": 24, "multi": false, "answer": ["A"], "en": {"stem": "A team wants to lower per-request cost and latency for a chat feature without switching models or losing response quality on genuinely hard questions.\n\nThey want the model itself to spend fewer tokens on easy turns while still reasoning thoroughly on complex ones.\n\nWhich lever should they reach for first?", "opts": [["A", "Lower the effort parameter for routine turns, since it reduces token spend while letting Claude think harder when warranted"], ["B", "Disable prompt caching entirely, since removing all cached writes always guarantees the very lowest possible token count of all"], ["C", "Force every request through the Message Batches API, since batch requests are billed at a flat discounted rate"], ["D", "Set max_tokens to a small fixed value on all requests so Claude cannot generate long responses on hard questions"]]}, "vi": {"stem": "Một nhóm muốn giảm chi phí và độ trễ trên mỗi yêu cầu cho một tính năng chat mà không đổi model hay làm giảm chất lượng phản hồi với những câu hỏi thực sự khó.\n\nHọ muốn chính model tiêu tốn ít token hơn ở các lượt dễ, trong khi vẫn suy luận kỹ lưỡng ở các lượt phức tạp.\n\nHọ nên dùng đòn bẩy nào trước tiên?", "opts": [["A", "Hạ tham số effort cho các lượt thông thường, vì nó giảm lượng token tiêu tốn trong khi vẫn cho phép Claude suy nghĩ kỹ hơn khi cần thiết"], ["B", "Tắt hoàn toàn prompt caching, vì loại bỏ mọi thao tác ghi cache luôn bảo đảm số token thấp nhất có thể"], ["C", "Buộc mọi yêu cầu đi qua Message Batches API, vì các yêu cầu batch được tính phí theo một mức chiết khấu cố định"], ["D", "Đặt max_tokens ở một giá trị cố định nhỏ cho mọi yêu cầu để Claude không thể tạo phản hồi dài cho các câu hỏi khó"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Hạ tham số effort cho các lượt thông thường, vì nó giảm lượng token tiêu tốn trong khi vẫn cho phép Claude suy nghĩ kỹ hơn khi cần thiết\n\nEffort là nút điều chỉnh lượng tài nguyên suy luận: dùng mức thấp cho lượt đơn giản và mức cao hơn cho việc khó sau khi đo chất lượng. Nó cho phép tránh tiêu tốn như nhau cho mọi câu, nhưng mức thấp không bảo đảm chất lượng luôn giữ nguyên và phải được kiểm chứng trên tác vụ thật.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Tắt hoàn toàn prompt caching, vì loại bỏ mọi thao tác ghi cache luôn bảo đảm số token thấp nhất có thể**: Tắt cache loại bỏ cơ hội tái sử dụng prefix, không bảo đảm chi phí thấp nhất.\n- **Buộc mọi yêu cầu đi qua Message Batches API, vì các yêu cầu batch được tính phí theo một mức chiết khấu cố định**: Batch giảm giá cho công việc chấp nhận chờ, không làm model tự phân bổ suy luận theo độ khó của chat tức thời.\n- **Đặt max_tokens ở một giá trị cố định nhỏ cho mọi yêu cầu để Claude không thể tạo phản hồi dài cho các câu hỏi khó**: max_tokens nhỏ cắt trần cả câu khó, có thể làm phản hồi chưa hoàn chỉnh.\n\n**Tham khảo:**\n\n- [Effort](https://platform.claude.com/docs/en/build-with-claude/effort)"}, {"n": 151, "set": 4, "i": 25, "multi": false, "answer": ["A"], "en": {"stem": "Ahead of launch, a product manager sets a success criterion requiring the model to achieve 100% accuracy on an open-ended reasoning task, with zero tolerance for any incorrect or incomplete answer, matching or exceeding what a domain expert could produce.\n\nWhat is the main problem with this success criterion, and how should it be revised?", "opts": [["A", "The target is unachievable because it exceeds realistic frontier-model capability. It should instead be grounded in benchmark results, prior experiments, or comparable industry performance."], ["B", "The target is not specific enough because it does not name a single numeric metric, so it should be replaced with a quantifiable percentage like a 95% accuracy score, regardless of feasibility."], ["C", "The target is not relevant because reasoning tasks should never have accuracy targets; instead, the criterion should specify maximum latency and cost, which are the only meaningful production metrics."], ["D", "The target is not measurable because open-ended tasks cannot be scored automatically under any circumstances, so the criterion should rely on subjective human ratings with no automated evaluation."]]}, "vi": {"stem": "Trước khi ra mắt, một product manager đặt tiêu chí thành công yêu cầu model đạt độ chính xác 100% trên một tác vụ suy luận mở (open-ended), không chấp nhận bất kỳ câu trả lời sai hoặc thiếu sót nào, ngang bằng hoặc vượt mức mà một chuyên gia trong lĩnh vực có thể tạo ra.\n\nVấn đề chính của tiêu chí thành công này là gì, và nên sửa nó như thế nào?", "opts": [["A", "Mục tiêu không thể đạt được vì vượt quá năng lực thực tế của các model tiên tiến nhất (frontier model). Thay vào đó, nó nên dựa trên kết quả benchmark, các thử nghiệm trước đó hoặc hiệu năng tương đương trong ngành."], ["B", "Mục tiêu chưa đủ cụ thể vì không nêu một chỉ số định lượng duy nhất, nên cần thay bằng một tỷ lệ phần trăm định lượng được như điểm độ chính xác 95%, bất kể tính khả thi."], ["C", "Mục tiêu không phù hợp (relevant) vì các tác vụ suy luận không bao giờ nên có mục tiêu độ chính xác; thay vào đó, tiêu chí nên quy định độ trễ và chi phí tối đa, vốn là những chỉ số production duy nhất có ý nghĩa."], ["D", "Mục tiêu không đo lường được vì các tác vụ mở không thể được chấm điểm tự động trong bất kỳ trường hợp nào, nên tiêu chí cần dựa vào đánh giá chủ quan của con người mà không có đánh giá tự động."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Mục tiêu không thể đạt được vì vượt quá năng lực thực tế của các model tiên tiến nhất (frontier model). Thay vào đó, nó nên dựa trên kết quả benchmark, các thử nghiệm trước đó hoặc hiệu năng tương đương trong ngành.\n\nCam kết tuyệt đối 100% trên suy luận mở chưa có cơ sở khả thi, kể cả chuyên gia cũng có thể sai. Nên đặt mục tiêu từ benchmark đại diện, thử nghiệm và mức rủi ro chấp nhận, với quy tắc chấm rõ cho câu thiếu hoặc sai.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Mục tiêu chưa đủ cụ thể vì không nêu một chỉ số định lượng duy nhất, nên cần thay bằng một tỷ lệ phần trăm định lượng được như điểm độ chính xác 95%, bất kể tính khả thi.**: 100% đã là số cụ thể; thay bằng 95% tùy ý vẫn chưa chứng minh khả thi.\n- **Mục tiêu không phù hợp (relevant) vì các tác vụ suy luận không bao giờ nên có mục tiêu độ chính xác; thay vào đó, tiêu chí nên quy định độ trễ và chi phí tối đa, vốn là những chỉ số production duy nhất có ý nghĩa.**: Độ chính xác vẫn liên quan đến nhiệm vụ suy luận, cùng với cost và latency.\n- **Mục tiêu không đo lường được vì các tác vụ mở không thể được chấm điểm tự động trong bất kỳ trường hợp nào, nên tiêu chí cần dựa vào đánh giá chủ quan của con người mà không có đánh giá tự động.**: Tác vụ mở vẫn có thể chấm bằng rubric, quy tắc hoặc grader được hiệu chuẩn; không bắt buộc hoàn toàn chủ quan.\n\n**Tham khảo:**\n\n- [Define success and build evaluations](https://platform.claude.com/docs/en/test-and-evaluate/develop-tests)"}, {"n": 152, "set": 4, "i": 26, "multi": false, "answer": ["A"], "en": {"stem": "A team has been iterating on a claims-processing prompt using the same 200-example development set for every round of refinement.\n\nThey now want to declare a final winning version before shipping.\n\nWhat should they do before making that final decision?", "opts": [["A", "Evaluate the leading prompt candidate on a separate held-out test set not used during iteration to confirm that improvements generalize beyond the development set."], ["B", "Run one more round of refinement on the same 200-example development set, perhaps switching to a different model or adding few-shot examples, to maximize the score before finalizing the prompt."], ["C", "Reduce the development set to only the examples that the current prompt candidate already passes, then present the accuracy on that subset as the final metric to make the score appear higher."], ["D", "Ship the candidate that achieves the highest score on the 200-example development set right away, as iteratively refining on that same set already demonstrates its production readiness."]]}, "vi": {"stem": "Một nhóm đã liên tục tinh chỉnh một prompt xử lý hồ sơ bồi thường (claims) bằng cùng một tập phát triển (development set) gồm 200 ví dụ cho mọi vòng tinh chỉnh.\n\nGiờ họ muốn chốt một phiên bản chiến thắng cuối cùng trước khi phát hành.\n\nHọ nên làm gì trước khi đưa ra quyết định cuối cùng đó?", "opts": [["A", "Đánh giá ứng viên prompt dẫn đầu trên một tập kiểm thử giữ riêng (held-out test set) tách biệt, không được dùng trong quá trình lặp, để xác nhận rằng các cải thiện có tính tổng quát hóa vượt ra ngoài tập phát triển."], ["B", "Chạy thêm một vòng tinh chỉnh trên cùng tập phát triển 200 ví dụ, có thể chuyển sang model khác hoặc bổ sung ví dụ few-shot, để tối đa hóa điểm số trước khi chốt prompt."], ["C", "Thu gọn tập phát triển chỉ còn những ví dụ mà ứng viên prompt hiện tại đã vượt qua, rồi trình bày độ chính xác trên tập con đó làm chỉ số cuối cùng để điểm số trông cao hơn."], ["D", "Phát hành ngay ứng viên đạt điểm cao nhất trên tập phát triển 200 ví dụ, vì việc tinh chỉnh lặp đi lặp lại trên chính tập đó đã chứng minh mức sẵn sàng cho production."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Đánh giá ứng viên prompt dẫn đầu trên một tập kiểm thử giữ riêng (held-out test set) tách biệt, không được dùng trong quá trình lặp, để xác nhận rằng các cải thiện có tính tổng quát hóa vượt ra ngoài tập phát triển.\n\nĐánh giá ứng viên trên test set giữ riêng giúp kiểm tra liệu prompt học quy luật hữu ích hay chỉ được điều chỉnh khớp 200 ví dụ quen thuộc. Không dùng kết quả test để tiếp tục tinh chỉnh rồi vẫn gọi đó là phép thử độc lập.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Chạy thêm một vòng tinh chỉnh trên cùng tập phát triển 200 ví dụ, có thể chuyển sang model khác hoặc bổ sung ví dụ few-shot, để tối đa hóa điểm số trước khi chốt prompt.**: Tối ưu thêm trên cùng tập chỉ tăng sự phụ thuộc vào dữ liệu đã thấy.\n- **Thu gọn tập phát triển chỉ còn những ví dụ mà ứng viên prompt hiện tại đã vượt qua, rồi trình bày độ chính xác trên tập con đó làm chỉ số cuối cùng để điểm số trông cao hơn.**: Chỉ giữ ví dụ đã qua tạo thiên lệch chọn mẫu và làm metric không đại diện.\n- **Phát hành ngay ứng viên đạt điểm cao nhất trên tập phát triển 200 ví dụ, vì việc tinh chỉnh lặp đi lặp lại trên chính tập đó đã chứng minh mức sẵn sàng cho production.**: Điểm development cao sau nhiều vòng không chứng minh tổng quát hóa production.\n\n**Tham khảo:**\n\n- [Define success and build evaluations](https://platform.claude.com/docs/en/test-and-evaluate/develop-tests)"}, {"n": 153, "set": 4, "i": 27, "multi": false, "answer": ["A"], "en": {"stem": "A team currently runs a moderately complex data-extraction workflow on Claude Haiku 4.5.\n\nWhich of the following observations would be valid evidence that the workflow has a model-capability mismatch and should be evaluated on a more capable model like Claude Opus 4.8? (Select all that apply.)", "opts": [["A", "On a use-case benchmark, accuracy on multi-step reasoning subtasks stays below threshold even after prompt revisions."], ["B", "The workflow needs nuanced understanding across long chains of interdependent steps where partial errors compound."], ["C", "Manual review shows the extraction errors resemble genuine reasoning mistakes rather than missing or truncated input."], ["D", "The team's monthly API spend for the workflow is higher than they originally budgeted for the project."], ["E", "The workflow occasionally times out because of ordinary network latency between the client and the API."], ["F", "The workflow's prompt was designed for an older model and has not been adapted to the current model's capabilities."]]}, "vi": {"stem": "Một nhóm hiện đang chạy một workflow trích xuất dữ liệu có độ phức tạp vừa phải trên Claude Haiku 4.5.\n\nNhững quan sát nào sau đây là bằng chứng hợp lệ cho thấy workflow gặp tình trạng không khớp về năng lực model (model-capability mismatch) và nên được đánh giá trên một model mạnh hơn như Claude Opus 4.8? (Chọn tất cả các đáp án phù hợp.)", "opts": [["A", "Trên một benchmark theo use case, độ chính xác ở các tác vụ con suy luận nhiều bước vẫn dưới ngưỡng ngay cả sau khi đã sửa prompt."], ["B", "Workflow cần khả năng hiểu tinh tế qua các chuỗi dài gồm những bước phụ thuộc lẫn nhau, nơi các lỗi nhỏ cộng dồn."], ["C", "Rà soát thủ công cho thấy các lỗi trích xuất giống lỗi suy luận thực sự chứ không phải do đầu vào bị thiếu hoặc bị cắt cụt."], ["D", "Chi phí API hằng tháng của nhóm cho workflow cao hơn ngân sách ban đầu dành cho dự án."], ["E", "Workflow thỉnh thoảng bị timeout do độ trễ mạng thông thường giữa client và API."], ["F", "Prompt của workflow được thiết kế cho một model cũ hơn và chưa được điều chỉnh theo năng lực của model hiện tại."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Trên một benchmark theo use case, độ chính xác ở các tác vụ con suy luận nhiều bước vẫn dưới ngưỡng ngay cả sau khi đã sửa prompt.\n\nĐiểm reasoning vẫn dưới ngưỡng sau sửa prompt là bằng chứng hợp lý để thử model mạnh hơn trên cùng benchmark. Trước khi quy lỗi cho năng lực model, cần loại bỏ thiếu dữ liệu, truncation và lỗi pipeline. Nhu cầu reasoning phụ thuộc nhiều bước và lỗi reasoning được review xác nhận cũng là bằng chứng hợp lệ mà khóa Select all bỏ sót.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Workflow cần khả năng hiểu tinh tế qua các chuỗi dài gồm những bước phụ thuộc lẫn nhau, nơi các lỗi nhỏ cộng dồn.**: Các bước phụ thuộc gây lỗi cộng dồn là yêu cầu năng lực hợp lệ; cần đưa vào duyệt khóa.\n- **Rà soát thủ công cho thấy các lỗi trích xuất giống lỗi suy luận thực sự chứ không phải do đầu vào bị thiếu hoặc bị cắt cụt.**: Lỗi reasoning đã phân biệt với input thiếu là bằng chứng trực tiếp; khóa bỏ sót.\n- **Chi phí API hằng tháng của nhóm cho workflow cao hơn ngân sách ban đầu dành cho dự án.**: Vượt ngân sách phản ánh cost, không tự chứng minh model thiếu năng lực; đổi mạnh hơn có thể tăng chi phí.\n- **Workflow thỉnh thoảng bị timeout do độ trễ mạng thông thường giữa client và API.**: Timeout do mạng cần sửa đường truyền hoặc retry, không chứng minh thiếu reasoning.\n- **Prompt của workflow được thiết kế cho một model cũ hơn và chưa được điều chỉnh theo năng lực của model hiện tại.**: Prompt chưa thích nghi là biến nhiễu cần xử lý trước khi kết luận mismatch.\n\n**Cần xem lại:** Đề yêu cầu chọn tất cả nhưng khóa chỉ chọn accuracy dưới ngưỡng. Nhu cầu reasoning phụ thuộc sâu và lỗi reasoning đã xác nhận cũng hợp lệ; cần duyệt khóa theo nội dung, không tự đổi.\n\n**Tham khảo:**\n\n- [Choosing the right model](https://platform.claude.com/docs/en/about-claude/models/choosing-a-model)", "review": {"verdict": "missing", "key": ["A", "B", "C"], "conf": "trung bình", "note": "'Select all that apply': ngoài A (accuracy dưới ngưỡng dù đã sửa prompt), B (cần hiểu sắc thái qua chuỗi bước phụ thuộc, lỗi cộng dồn – loại task docs gợi ý dùng model mạnh hơn) và C (review xác nhận lỗi là lỗi reasoning, không phải input thiếu) cũng là bằng chứng mismatch năng lực. D/E là cost/network, F là biến nhiễu về prompt; giải thích của site cũng coi B, C là hợp lệ.", "src": ["https://platform.claude.com/docs/en/about-claude/models/choosing-a-model"]}}, {"n": 154, "set": 4, "i": 28, "multi": false, "answer": ["D"], "en": {"stem": "A compliance analyst asks Claude to review a 40-page vendor contract and flag every clause that conflicts with the company's data-retention policy.\n\nIn early testing, Claude cites clause numbers and language that do not actually appear in the contract.\n\nWhich prompting change is most effective at grounding the review in the actual document text for this kind of long-document task?", "opts": [["A", "Ask Claude to answer using its general knowledge of standard contract clauses instead of the specific text, since standard clauses are usually representative"], ["B", "Instruct Claude to summarize the entire contract into three paragraphs first, then perform the compliance analysis using only that summary as its source"], ["C", "Reduce the max_tokens parameter for the response so Claude produces a shorter, more focused answer that is less likely to drift from the source contract"], ["D", "Instruct Claude to first extract exact, word-for-word quotes relevant to data retention, and only then analyze compliance by referencing those extracted quotes"]]}, "vi": {"stem": "Một chuyên viên phân tích tuân thủ (compliance) yêu cầu Claude rà soát một hợp đồng nhà cung cấp dài 40 trang và gắn cờ mọi điều khoản xung đột với chính sách lưu giữ dữ liệu (data retention) của công ty.\n\nTrong giai đoạn thử nghiệm ban đầu, Claude trích dẫn số điều khoản và câu chữ không hề xuất hiện trong hợp đồng.\n\nThay đổi prompt nào hiệu quả nhất để neo (ground) việc rà soát vào văn bản thực tế của tài liệu cho loại tác vụ tài liệu dài này?", "opts": [["A", "Yêu cầu Claude trả lời dựa trên kiến thức chung về các điều khoản hợp đồng tiêu chuẩn thay vì văn bản cụ thể, vì các điều khoản tiêu chuẩn thường mang tính đại diện"], ["B", "Hướng dẫn Claude trước tiên tóm tắt toàn bộ hợp đồng thành ba đoạn, sau đó thực hiện phân tích tuân thủ chỉ dùng bản tóm tắt đó làm nguồn"], ["C", "Giảm tham số max_tokens cho phản hồi để Claude tạo câu trả lời ngắn hơn, tập trung hơn, ít có khả năng lệch khỏi hợp đồng nguồn"], ["D", "Hướng dẫn Claude trước tiên trích xuất các trích dẫn chính xác, nguyên văn từng chữ liên quan đến việc lưu giữ dữ liệu, và chỉ sau đó mới phân tích tuân thủ bằng cách tham chiếu các trích dẫn đã trích xuất đó"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Hướng dẫn Claude trước tiên trích xuất các trích dẫn chính xác, nguyên văn từng chữ liên quan đến việc lưu giữ dữ liệu, và chỉ sau đó mới phân tích tuân thủ bằng cách tham chiếu các trích dẫn đã trích xuất đó\n\nTrích nguyên văn điều khoản liên quan trước tạo tập bằng chứng kiểm tra được ngay trong hợp đồng. Bước phân tích sau phải gắn từng kết luận vào các trích đoạn đó, giúp phát hiện số điều hoặc câu chữ bị bịa; vẫn cần kiểm tra độ đầy đủ của việc tìm điều khoản.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Yêu cầu Claude trả lời dựa trên kiến thức chung về các điều khoản hợp đồng tiêu chuẩn thay vì văn bản cụ thể, vì các điều khoản tiêu chuẩn thường mang tính đại diện**: Kiến thức hợp đồng chung không chứng minh điều khoản thực tế của hợp đồng này.\n- **Hướng dẫn Claude trước tiên tóm tắt toàn bộ hợp đồng thành ba đoạn, sau đó thực hiện phân tích tuân thủ chỉ dùng bản tóm tắt đó làm nguồn**: Tóm tắt ba đoạn có thể bỏ chính điều khoản cần kiểm tra và mất nguồn nguyên văn.\n- **Giảm tham số max_tokens cho phản hồi để Claude tạo câu trả lời ngắn hơn, tập trung hơn, ít có khả năng lệch khỏi hợp đồng nguồn**: Giảm max_tokens không thêm bằng chứng nguồn và có thể cắt mất phân tích.\n\n**Tham khảo:**\n\n- [Prompting best practices](https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices)"}, {"n": 155, "set": 4, "i": 29, "multi": false, "answer": ["A"], "en": {"stem": "A fintech company's Claude-powered agent can initiate wire transfers through a custom MCP tool.\n\nEven though the operations team has configured allowedTools to auto-approve most read and reporting tools, they want every wire-transfer tool call to require a human's explicit approval no matter what permission mode the session is later switched to, including bypassPermissions.\n\nWhich approach best satisfies this requirement?", "opts": [["A", "Register a PreToolUse hook scoped to the wire-transfer tool that returns permissionDecision \"ask\" for every call, since hooks execute before deny rules, ask rules, the permission mode check, and allow rules, and their decision holds even under bypassPermissions."], ["B", "Add a bare allowedTools entry for the wire-transfer tool so it auto-approves, then depend on the canUseTool callback to intercept it, since bare allow rules approve every matching call before canUseTool is ever consulted, so the callback never runs for that tool."], ["C", "Switch the session's permission mode to acceptEdits, expecting the wire-transfer tool to fall outside its file-edit scope and always route to canUseTool, though other tools under acceptEdits still fall through to any allow rules that already approve them."], ["D", "Add the wire-transfer tool to disallowed_tools with a wildcard pattern so it is blocked by default, then have the canUseTool callback lift the deny rule per call, though deny rules are evaluated before canUseTool runs and cannot be reversed from inside that callback."]]}, "vi": {"stem": "Agent chạy bằng Claude của một công ty fintech có thể khởi tạo các giao dịch chuyển khoản (wire transfer) thông qua một MCP tool tùy chỉnh.\n\nMặc dù nhóm vận hành đã cấu hình allowedTools để tự động phê duyệt hầu hết các tool đọc và báo cáo, họ muốn mọi lệnh gọi tool chuyển khoản đều phải có sự phê duyệt tường minh của con người, bất kể phiên sau đó được chuyển sang permission mode nào, kể cả bypassPermissions.\n\nCách tiếp cận nào đáp ứng tốt nhất yêu cầu này?", "opts": [["A", "Đăng ký một PreToolUse hook giới hạn cho tool chuyển khoản, trả về permissionDecision \"ask\" cho mọi lệnh gọi, vì hook được thực thi trước các deny rule, ask rule, bước kiểm tra permission mode và các allow rule, và quyết định của nó vẫn có hiệu lực ngay cả khi ở bypassPermissions."], ["B", "Thêm một mục allowedTools trần (bare) cho tool chuyển khoản để nó được tự động phê duyệt, rồi dựa vào callback canUseTool để chặn nó, trong khi các allow rule trần phê duyệt mọi lệnh gọi khớp trước khi canUseTool kịp được tham vấn, nên callback không bao giờ chạy cho tool đó."], ["C", "Chuyển permission mode của phiên sang acceptEdits, kỳ vọng tool chuyển khoản nằm ngoài phạm vi sửa file của chế độ này và luôn được chuyển tới canUseTool, dù các tool khác dưới acceptEdits vẫn rơi xuống bất kỳ allow rule nào đã phê duyệt chúng."], ["D", "Thêm tool chuyển khoản vào disallowed_tools với một mẫu wildcard để nó bị chặn mặc định, rồi để callback canUseTool gỡ deny rule cho từng lệnh gọi, dù các deny rule được đánh giá trước khi canUseTool chạy và không thể bị đảo ngược từ bên trong callback đó."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Đăng ký một PreToolUse hook giới hạn cho tool chuyển khoản, trả về permissionDecision \"ask\" cho mọi lệnh gọi, vì hook được thực thi trước các deny rule, ask rule, bước kiểm tra permission mode và các allow rule, và quyết định của nó vẫn có hiệu lực ngay cả khi ở bypassPermissions.\n\nPreToolUse gắn đúng tool chuyển tiền có thể trả permissionDecision=\"ask\" để yêu cầu xác nhận trước khi gọi. Tuy nhiên, khóa khẳng định hook luôn thắng mọi quy tắc và mọi mode là quá rộng: tài liệu hiện vẫn xét deny/ask rules. Với yêu cầu bất biến cho giao dịch, cần cổng phê duyệt do ứng dụng/tool kiểm soát và kiểm thử theo phiên bản, không chỉ tin vào thay đổi mode.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Thêm một mục allowedTools trần (bare) cho tool chuyển khoản để nó được tự động phê duyệt, rồi dựa vào callback canUseTool để chặn nó, trong khi các allow rule trần phê duyệt mọi lệnh gọi khớp trước khi canUseTool kịp được tham vấn, nên callback không bao giờ chạy cho tool đó.**: Auto-allow tool chuyển tiền đi ngược yêu cầu phê duyệt; callback không đáng tin để chặn call đã được cho qua trước đó.\n- **Chuyển permission mode của phiên sang acceptEdits, kỳ vọng tool chuyển khoản nằm ngoài phạm vi sửa file của chế độ này và luôn được chuyển tới canUseTool, dù các tool khác dưới acceptEdits vẫn rơi xuống bất kỳ allow rule nào đã phê duyệt chúng.**: acceptEdits chỉ đổi mặc định quyền sửa file, không cưỡng chế phê duyệt MCP bất kể rule hiện có.\n- **Thêm tool chuyển khoản vào disallowed_tools với một mẫu wildcard để nó bị chặn mặc định, rồi để callback canUseTool gỡ deny rule cho từng lệnh gọi, dù các deny rule được đánh giá trước khi canUseTool chạy và không thể bị đảo ngược từ bên trong callback đó.**: Deny rule chặn trước callback; callback không phải cơ chế nâng deny thành quyền cho từng lần.\n\n**Cần xem lại:** Đáp án nguồn khẳng định thứ tự quyền quá rộng. Docs hiện nói deny/ask rules vẫn được xét bất kể hook trả gì và còn có mods. Cần viết lại câu theo phiên bản triển khai; không xem hook là bảo đảm bất biến dưới mọi mode.\n\n**Tham khảo:**\n\n- [Hooks reference](https://code.claude.com/docs/en/hooks)"}, {"n": 156, "set": 4, "i": 30, "multi": false, "answer": ["A"], "en": {"stem": "A solutions architect is scoping the ethical-risk controls for a Claude-based assistant that will draft internal performance-review summaries from manager notes across a multinational workforce.\n\nThe compliance team wants a set of concrete measures that address bias, fairness, and transparency before launch.\n\nWhich of the following measures should be included? (Select 3)", "opts": [["A", "Run paired-scenario evaluations comparing summary tone and detail across employee groups given identical underlying performance notes."], ["B", "Document, in a form reviewers can inspect, which specific decision factors the assistant is instructed to weigh whenever it drafts a summary."], ["C", "Give every employee, regardless of role or seniority, a mechanism to request the specific factors that shaped their own summary."], ["D", "Skip bias testing across the initial launch region and only extend testing later if formal complaints get filed after go-live."], ["E", "Let each manager's personal phrasing preferences silently override the standardized summary template with absolutely no logging kept."], ["F", "Restrict summary review access to a single manager with no secondary sign-off, to keep the rollout process deliberately lightweight."]]}, "vi": {"stem": "Một kiến trúc sư giải pháp đang xác định phạm vi các biện pháp kiểm soát rủi ro đạo đức cho một trợ lý dựa trên Claude sẽ soạn các bản tóm tắt đánh giá hiệu suất nội bộ từ ghi chú của quản lý trên toàn bộ lực lượng lao động đa quốc gia.\n\nNhóm tuân thủ muốn có một bộ biện pháp cụ thể giải quyết các vấn đề thiên lệch (bias), công bằng (fairness) và minh bạch (transparency) trước khi ra mắt.\n\nNhững biện pháp nào sau đây nên được đưa vào? (Chọn ba.)", "opts": [["A", "Chạy các đánh giá theo kịch bản cặp (paired-scenario) để so sánh giọng điệu và mức độ chi tiết của bản tóm tắt giữa các nhóm nhân viên khi có cùng ghi chú hiệu suất nền tảng giống hệt nhau."], ["B", "Ghi lại, dưới dạng người rà soát có thể kiểm tra, những yếu tố quyết định cụ thể mà trợ lý được hướng dẫn cân nhắc mỗi khi soạn một bản tóm tắt."], ["C", "Cung cấp cho mọi nhân viên, bất kể vai trò hay thâm niên, một cơ chế để yêu cầu xem các yếu tố cụ thể đã định hình bản tóm tắt của chính họ."], ["D", "Bỏ qua kiểm thử thiên lệch ở khu vực ra mắt ban đầu và chỉ mở rộng kiểm thử sau này nếu có khiếu nại chính thức được gửi sau khi go-live."], ["E", "Để sở thích diễn đạt cá nhân của từng quản lý âm thầm ghi đè template tóm tắt chuẩn hóa mà hoàn toàn không lưu log."], ["F", "Giới hạn quyền rà soát bản tóm tắt cho một quản lý duy nhất, không có phê duyệt thứ cấp, để giữ quy trình triển khai gọn nhẹ một cách có chủ đích."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Chạy các đánh giá theo kịch bản cặp (paired-scenario) để so sánh giọng điệu và mức độ chi tiết của bản tóm tắt giữa các nhóm nhân viên khi có cùng ghi chú hiệu suất nền tảng giống hệt nhau.\n\nPaired-scenario evaluation giữ nội dung hiệu suất giống nhau và so tone, chi tiết giữa các nhóm để tìm thiên lệch không do dữ liệu công việc. Minh bạch còn cần ghi rõ yếu tố hệ thống cân nhắc và cho nhân viên xem yếu tố ảnh hưởng bản tóm tắt của mình. Hai biện pháp này cũng phù hợp với yêu cầu chọn ba nhưng bị khóa bỏ sót.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Ghi lại, dưới dạng người rà soát có thể kiểm tra, những yếu tố quyết định cụ thể mà trợ lý được hướng dẫn cân nhắc mỗi khi soạn một bản tóm tắt.**: Ghi yếu tố được cân nhắc giúp reviewer kiểm tra và là lựa chọn đúng bị thiếu.\n- **Cung cấp cho mọi nhân viên, bất kể vai trò hay thâm niên, một cơ chế để yêu cầu xem các yếu tố cụ thể đã định hình bản tóm tắt của chính họ.**: Cho nhân viên tiếp cận yếu tố của bản tóm tắt riêng đáp ứng minh bạch và là lựa chọn đúng bị thiếu.\n- **Bỏ qua kiểm thử thiên lệch ở khu vực ra mắt ban đầu và chỉ mở rộng kiểm thử sau này nếu có khiếu nại chính thức được gửi sau khi go-live.**: Đợi khiếu nại mới kiểm tra để rủi ro thiên lệch đi vào launch mà không đo trước.\n- **Để sở thích diễn đạt cá nhân của từng quản lý âm thầm ghi đè template tóm tắt chuẩn hóa mà hoàn toàn không lưu log.**: Override âm thầm không log làm mất nhất quán và khả năng truy vết.\n- **Giới hạn quyền rà soát bản tóm tắt cho một quản lý duy nhất, không có phê duyệt thứ cấp, để giữ quy trình triển khai gọn nhẹ một cách có chủ đích.**: Một người duyệt không có kiểm tra thứ hai làm yếu khả năng phát hiện thiên lệch.\n\n**Cần xem lại:** Đề yêu cầu ba lựa chọn nhưng khóa chỉ có paired-scenario evaluations. Tài liệu hóa yếu tố và cơ chế minh bạch cho nhân viên cũng phù hợp; cần duyệt đủ ba nội dung.\n\n**Tham khảo:**\n\n- [AI Risk Management Framework](https://www.nist.gov/itl/ai-risk-management-framework)", "review": {"verdict": "missing", "key": ["A", "B", "C"], "conf": "cao", "note": "Đề 'Select 3' nhưng khóa chỉ có A. B (tài liệu hóa decision factors cho reviewer kiểm tra) và C (cho nhân viên yêu cầu biết yếu tố tạo nên bản tóm tắt của mình) là biện pháp transparency; D/E/F đều làm yếu kiểm soát. Giải thích của site cũng xác nhận B, C bị bỏ sót.", "src": ["https://www.nist.gov/itl/ai-risk-management-framework"]}}, {"n": 157, "set": 4, "i": 31, "multi": false, "answer": ["A"], "en": {"stem": "A solutions architect is running the first discovery session with a new prospect before recommending any specific Claude model. According to Anthropic's model-selection guidance, which factors should the architect establish as key criteria during this session?", "opts": [["A", "The specific capabilities the model must have to meet the prospect's needs"], ["B", "How quickly the model must respond within the prospect's application"], ["C", "The prospect's available budget for development and production usage"], ["D", "The exact number of employees currently working in the prospect's IT department"], ["E", "Which social media platforms the prospect uses for customer marketing"], ["F", "The version number of the prospect's internal ticketing software"]]}, "vi": {"stem": "Một kiến trúc sư giải pháp đang thực hiện buổi khảo sát (discovery session) đầu tiên với một khách hàng tiềm năng mới trước khi khuyến nghị bất kỳ model Claude cụ thể nào. Theo hướng dẫn chọn model của Anthropic, kiến trúc sư nên xác lập những yếu tố nào làm tiêu chí chính trong buổi này?", "opts": [["A", "Các năng lực cụ thể mà model phải có để đáp ứng nhu cầu của khách hàng tiềm năng"], ["B", "Model phải phản hồi nhanh đến mức nào trong ứng dụng của khách hàng tiềm năng"], ["C", "Ngân sách sẵn có của khách hàng tiềm năng cho việc phát triển và sử dụng trong production"], ["D", "Số lượng chính xác nhân viên hiện đang làm việc trong bộ phận IT của khách hàng tiềm năng"], ["E", "Những nền tảng mạng xã hội mà khách hàng tiềm năng dùng để marketing tới khách hàng"], ["F", "Số phiên bản của phần mềm quản lý ticket nội bộ của khách hàng tiềm năng"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Các năng lực cụ thể mà model phải có để đáp ứng nhu cầu của khách hàng tiềm năng\n\nKhám phá trước hết phải xác định model cần làm được việc gì. Thời gian phản hồi và ngân sách phát triển/vận hành cũng giới hạn lựa chọn, nên không thể đưa đề xuất chỉ từ năng lực. Khóa hiện chọn một tiêu chí trong khi câu hỏi hỏi nhiều tiêu chí phù hợp.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Model phải phản hồi nhanh đến mức nào trong ứng dụng của khách hàng tiềm năng**: Latency là tiêu chí lựa chọn trực tiếp, hợp lệ nhưng khóa bỏ sót.\n- **Ngân sách sẵn có của khách hàng tiềm năng cho việc phát triển và sử dụng trong production**: Ngân sách là tiêu chí lựa chọn trực tiếp, hợp lệ nhưng khóa bỏ sót.\n- **Số lượng chính xác nhân viên hiện đang làm việc trong bộ phận IT của khách hàng tiềm năng**: Số nhân viên IT có thể ảnh hưởng rollout nhưng không tự xác định năng lực, latency hay cost model cần có.\n- **Những nền tảng mạng xã hội mà khách hàng tiềm năng dùng để marketing tới khách hàng**: Kênh marketing không tự liên quan yêu cầu model của ứng dụng đang khảo sát.\n- **Số phiên bản của phần mềm quản lý ticket nội bộ của khách hàng tiềm năng**: Version ticketing chỉ quan trọng nếu có ràng buộc tích hợp cụ thể; đề chưa nêu.\n\n**Cần xem lại:** Khóa chỉ chọn năng lực dù câu hỏi hỏi nhiều tiêu chí. Tốc độ phản hồi và ngân sách cũng được tài liệu chọn model nêu rõ; cần duyệt thêm theo nội dung.\n\n**Tham khảo:**\n\n- [Choosing the right model](https://platform.claude.com/docs/en/about-claude/models/choosing-a-model)", "review": {"verdict": "missing", "key": ["A", "B", "C"], "conf": "cao", "note": "Trang 'Choosing the right model' nêu ba tiêu chí chính cần xác lập: capabilities (A), speed/latency (B) và cost/budget (C). D/E/F không liên quan việc chọn model; giải thích của site cũng gọi B, C là hợp lệ bị bỏ sót.", "src": ["https://platform.claude.com/docs/en/about-claude/models/choosing-a-model"]}}, {"n": 158, "set": 4, "i": 32, "multi": false, "answer": ["A"], "en": {"stem": "A financial services customer's compliance team says every AI-generated answer referencing internal policy documents must point to the exact sentence it was drawn from, so auditors can verify the source without re-reading the whole document.\n\nWhich capability addresses this discovery finding?", "opts": [["A", "Citations, which let Claude reference the exact sentences and passages in source documents used to generate a response"], ["B", "Search results, which enable natural citations for RAG applications by attaching proper source attribution to search results"], ["C", "Token counting, which determines the number of tokens in a message before it is sent to Claude"], ["D", "The Files API, which uploads and manages documents so they do not need to be re-sent with every request"]]}, "vi": {"stem": "Nhóm tuân thủ của một khách hàng dịch vụ tài chính cho biết mọi câu trả lời do AI tạo ra có tham chiếu tới tài liệu chính sách nội bộ đều phải chỉ ra chính xác câu mà nó được rút ra, để kiểm toán viên có thể xác minh nguồn mà không phải đọc lại toàn bộ tài liệu.\n\nNăng lực nào giải quyết phát hiện này từ giai đoạn khảo sát (discovery)?", "opts": [["A", "Citations, cho phép Claude tham chiếu chính xác các câu và đoạn trong tài liệu nguồn được dùng để tạo ra phản hồi"], ["B", "Search results, cho phép tạo trích dẫn tự nhiên cho các ứng dụng RAG bằng cách gắn thông tin ghi nguồn phù hợp vào kết quả tìm kiếm"], ["C", "Token counting, xác định số lượng token trong một message trước khi nó được gửi tới Claude"], ["D", "Files API, tải lên và quản lý tài liệu để chúng không cần được gửi lại cùng mọi yêu cầu"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Citations, cho phép Claude tham chiếu chính xác các câu và đoạn trong tài liệu nguồn được dùng để tạo ra phản hồi\n\nCitations gắn phản hồi với đoạn văn nguồn trong tài liệu citable để auditor mở đúng chỗ thay vì đọc cả tài liệu. Cơ chế xác định vị trí nguồn hỗ trợ kiểm chứng, không tự đảm bảo suy luận đúng. Nếu tài liệu vào qua RAG search result blocks, Search results cũng có thể đáp ứng nên cần làm rõ kiến trúc.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Search results, cho phép tạo trích dẫn tự nhiên cho các ứng dụng RAG bằng cách gắn thông tin ghi nguồn phù hợp vào kết quả tìm kiếm**: Search results cũng có thể tạo attribution ở đoạn truy hồi, là phương án khả thi bị bỏ qua nếu dùng RAG.\n- **Token counting, xác định số lượng token tron
