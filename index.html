<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>CCAR-P — Ôn tập song ngữ</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--fg:#1f2328;--muted:#656d76;--line:#d8dadd;--accent:#2457c5;
  --sel:#e6eeff;--ok:#1a7f37;--okbg:#e6f6ea;--bad:#cf222e;--badbg:#fdecec;--code:#f0f1f3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#16181c;--card:#1f2228;--fg:#e6e8eb;--muted:#9aa3ad;
  --line:#353a42;--accent:#7aa2ff;--sel:#243453;--ok:#4ac26b;--okbg:#17321f;--bad:#ff7b72;--badbg:#3b1d1d;--code:#2a2e35}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:1;background:var(--card);border-bottom:1px solid var(--line);
  padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
header h1{font-size:17px;margin:0 8px 0 0}
header .grow{flex:1}
button,select,input{font:inherit;font-size:14px;color:var(--fg);background:var(--card);
  border:1px solid var(--line);border-radius:6px;padding:5px 10px}
button{cursor:pointer}button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
input[type=number]{width:64px}
.small{font-size:13px;color:var(--muted)}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;max-width:1700px;margin:0 auto;padding:16px}
main{min-width:0}
aside{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 80px);overflow:auto;
  background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
aside summary{font-weight:600;cursor:pointer;padding:2px 0}
@media (max-width:1000px){.layout{grid-template-columns:1fr}aside{position:static;max-height:none}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
.stats div{border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:13px;color:var(--muted)}
.stats b{display:block;font-size:18px;color:var(--fg)}
.stats .ok b{color:var(--ok)}.stats .bad b{color:var(--bad)}
.mapf{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.mapf button{font-size:12px;padding:3px 8px}.mapf button.on{background:var(--sel);border-color:var(--accent);color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:4px}
.cell{position:relative;height:32px;padding:0;font-size:13px;border-radius:6px}
.cell.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:600}
.cell.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad);font-weight:600}
.cell.rev{background:var(--sel);border-color:var(--accent);color:var(--accent)}
.cell.cur{outline:2px solid var(--fg);outline-offset:1px}
.cell.warn::after{content:"";position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.cell.bm::before{content:"★";position:absolute;left:3px;top:1px;font-size:10px;line-height:1;color:var(--star)}
button.bmk{display:inline-flex;align-items:center;gap:4px}
button.bmk.on{background:var(--starbg);border-color:var(--star);color:var(--starfg);font-weight:600}
#bmopen.on{background:var(--starbg);border-color:var(--star);color:var(--starfg)}
#toast{color:var(--starfg)}
.mapf button[data-mf="bm"].on{background:var(--starbg);border-color:var(--star);color:var(--starfg)}
.bmbar{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;background:var(--starbg);border:1px solid var(--star);border-radius:10px;padding:6px 12px;margin-bottom:12px;font-size:14px;color:var(--starfg)}
.bmbar button{font-size:13px;padding:3px 8px}
.legend{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.7}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;border:1px solid;margin:0 4px 0 8px;vertical-align:-1px}
.meta{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;margin-bottom:12px}
.meta b{font-size:18px}
.tag{font-size:13px;padding:2px 8px;border-radius:99px;background:var(--sel);color:var(--accent)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:767px){.cols{grid-template-columns:1fr}}
.col{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.lang{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.opt{display:flex;gap:10px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:14px}
.opt .t{min-width:0}.opt .t>:first-child{margin-top:2px}.opt .t>:last-child{margin-bottom:0}
.opt.sel{background:var(--sel);border-color:var(--accent)}.opt.sel .l{background:var(--accent);color:#fff;border-color:var(--accent)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.ok .l{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}.opt.bad .l{background:var(--bad);color:#fff;border-color:var(--bad)}
.locked .opt{cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}
.result{font-weight:600}.result.ok{color:var(--ok)}.result.bad{color:var(--bad)}
#expl{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 18px 14px}
#expl h3{margin:12px 0 4px}
h4{margin:16px 0 4px;font-size:15px}
p{margin:8px 0}ul,ol{margin:6px 0;padding-left:22px}
code{background:var(--code);border-radius:4px;padding:1px 4px;font-size:.9em}
pre{background:var(--code);border-radius:6px;padding:10px;overflow:auto}pre code{padding:0}
.tag.warn{background:var(--warnbg);color:var(--warn)}
#review{background:var(--warnbg);border:1px solid var(--warn);border-radius:10px;padding:8px 16px;margin-bottom:14px}
#review b{color:var(--warn)}
label.toggle{display:flex;gap:6px;align-items:center;font-size:14px}
.cols.novi{grid-template-columns:1fr}.cols.novi>.col:last-child{display:none}
.timer{display:flex;gap:4px;align-items:center}
.timer select,.timer button{padding:3px 6px}
#clock{font:600 16px ui-monospace,SFMono-Regular,Menlo,monospace;min-width:64px;text-align:center}
#clock.over{color:var(--bad)}
:root{--warn:#9a6700;--warnbg:#fff8c5;--star:#d4a017;--starbg:#fff4cc;--starfg:#7a5600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--warn:#d29922;--warnbg:#2e2510;--star:#e3b341;--starbg:#3a2f10;--starfg:#f2cc60}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#16181c;--card:#1f2228;--fg:#e6e8eb;--muted:#9aa3ad;--line:#353a42;--accent:#7aa2ff;--sel:#243453;--ok:#4ac26b;--okbg:#17321f;--bad:#ff7b72;--badbg:#3b1d1d;--code:#2a2e35;--warn:#d29922;--warnbg:#2e2510;--star:#e3b341;--starbg:#3a2f10;--starfg:#f2cc60}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
header{top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
.opt,.cell,button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#jserr{display:none;margin:12px 16px;padding:10px 14px;border:1px solid var(--bad);background:var(--badbg);color:var(--bad);border-radius:8px;font-size:14px}
@media (max-width:767px){header{position:static;padding:8px 10px;gap:6px 8px}header h1{width:100%;font-size:16px}button,select,input{font-size:16px}.layout{padding:10px;gap:10px}.col{padding:12px}header .grow{display:none}#hlbox{padding:4px 12px 10px}}
:root{--hl-trap:#ffd7d5;--hl-trap-fg:#82071e;--hl-warn:#fff1a8;--hl-warn-fg:#6b4b00;--hl-good:#cdf3d6;--hl-good-fg:#0f5323;--hl-key:#dde7ff;--hl-key-fg:#1b3f99;--hl-cue:#ecdcff;--hl-cue-fg:#5a1fa3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hl-trap:#5a1d1d;--hl-trap-fg:#ffb3ad;--hl-warn:#4a3a0c;--hl-warn-fg:#f5d77a;--hl-good:#1a4228;--hl-good-fg:#9ce6b0;--hl-key:#22325a;--hl-key-fg:#b4c8ff;--hl-cue:#3a2557;--hl-cue-fg:#d9bfff}}
mark.hl{border-radius:3px;padding:0 2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hl-trap{background:var(--hl-trap);color:var(--hl-trap-fg)}.hl-warn{background:var(--hl-warn);color:var(--hl-warn-fg)}
.hl-good{background:var(--hl-good);color:var(--hl-good-fg)}.hl-key{background:var(--hl-key);color:var(--hl-key-fg)}
.hl-cue{background:var(--hl-cue);color:var(--hl-cue-fg);font-weight:600}
.hl-protect{background:transparent;color:inherit;border-bottom:2px dashed var(--ok);border-radius:0}
.opt.ok mark.hl{font-weight:600}
#hlbox{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 18px 12px;margin-bottom:14px}
#hlbox h3{margin:12px 0 6px}.legend2{line-height:2}
.chip{display:inline-block;font-size:12px;padding:1px 6px;border-radius:99px;border:1px solid var(--line);margin:1px 0}
.chip.hl-protect{border:1px dashed var(--ok)}
.hlt{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0}.hlt td,.hlt th{border-top:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
.hlt th{font-size:12px;color:var(--muted);font-weight:600}.hlt tr.rok td:first-child{color:var(--ok)}
.exc{background:var(--warnbg);border:1px solid var(--warn);border-radius:8px;padding:2px 12px;margin:8px 0}.exc b{color:var(--warn)}
summary.sm{font-size:14px;color:var(--accent);cursor:pointer}

</style>
</head>
<body>
<noscript><p style="padding:12px 16px">Trang này cần JavaScript. Nếu bạn mở file từ app Tệp/Zalo/Messenger, hãy mở bằng Safari hoặc dùng link đã publish.</p></noscript>
<div id="jserr"></div>
<header>
  <h1>CCAR-P — Ôn tập song ngữ</h1>
  <select id="filter" aria-label="Bộ câu hỏi">
    <option value="0">Tất cả</option><option value="1">Bộ 1</option><option value="2">Bộ 2</option><option value="3">Bộ 3</option><option value="4">Bộ 4 (câu mới)</option><option value="-1">★ Câu đã bookmark</option>
  </select>
  <button id="bmopen" title="Mở danh sách câu đã bookmark">★ Bookmark (<span id="bmcount">0</span>)</button>
  <span>Câu <input id="jump" type="number" min="1" aria-label="Đi tới câu"> / <span id="total"></span></span>
  <button id="prev" title="Câu trước (←)">← Trước</button>
  <button id="next" title="Câu sau (→)">Sau →</button>
  <span class="timer" title="Bộ đếm giờ">
    <select id="tmode" aria-label="Chế độ đếm giờ"><option value="up">Bấm giờ</option><option value="90">Đếm ngược 90'</option></select>
    <b id="clock">00:00</b>
    <button id="tstart" title="Bắt đầu / tạm dừng">▶</button><button id="treset" title="Đặt lại đồng hồ">↺</button>
    <span class="small" id="pace"></span>
  </span>
  <span id="toast" class="small" aria-live="polite"></span>
  <span class="grow"></span>
  <label class="toggle" title="Hiện/ẩn cột tiếng Việt"><input type="checkbox" id="showVi"> Tiếng Việt</label>
  <label class="toggle" title="Với câu có ghi chú review ⚠️: chấm theo đáp án đề xuất thay vì đáp án gốc của trang">
    <input type="checkbox" id="useReview"> Chấm theo đáp án review</label>
  <span id="score"></span>
  <button id="reset" class="small" title="Xóa toàn bộ tiến độ đã lưu">Xóa tiến độ</button>
</header>
<div class="layout">
<aside>
  <details id="mapbox" open>
    <summary>Bản đồ câu hỏi</summary>
    <div class="stats" id="stats"></div>
    <div class="mapf" id="mapf"></div>
    <div class="grid" id="grid"></div>
    <div class="legend"><i style="background:var(--okbg);border-color:var(--ok)"></i>Đúng<i style="background:var(--badbg);border-color:var(--bad)"></i>Sai<i style="background:var(--sel);border-color:var(--accent)"></i>Đã xem đáp án<i style="background:var(--warn);border-color:var(--warn);border-radius:50%"></i>Có ghi chú review<span style="color:var(--star);margin:0 4px 0 8px">★</span>Đã bookmark</div>
  </details>
</aside>
<main>
  <div class="bmbar" id="bmbar" hidden></div>
  <div class="meta"><b id="qtitle"></b><button id="bmk" class="bmk" title="Bookmark câu này (phím B)">☆ Bookmark</button><span class="tag" id="qtype"></span>
    <span class="tag warn" id="qwarn" hidden>⚠️ Đáp án gốc của trang có thể chưa chính xác</span></div>
  <div class="cols" id="cols">
    <section class="col"><div class="lang">English</div><div id="en"></div></section>
    <section class="col"><div class="lang">Tiếng Việt</div><div id="vi"></div></section>
  </div>
  <div class="actions">
    <button id="check" class="primary" title="Enter / Space">Kiểm tra</button>
    <button id="next2" class="primary" title="Enter / Space / →">Câu sau →</button>
    <button id="reveal">Xem đáp án</button>
    <button id="redo">Làm lại</button>
    <span id="result" class="result"></span>
    <span class="grow small">Enter / Space: kiểm tra / sang câu sau</span>
  </div>
  <section id="review" hidden></section>
  <section id="hlbox" hidden></section>
  <section id="expl" hidden></section>
</main>
</div>
<script>
window.onerror=function(m,u,l){var b=document.getElementById("jserr");if(b){b.style.display="block";b.textContent="Lỗi JavaScript: "+m+" (dòng "+l+")";}};
const Q = [{"n": 1, "set": 1, "i": 1, "multi": true, "answer": ["D", "E"], "en": {"stem": "You are compiling guardrail tactics for a customer-facing assistant.\n\nWhich two tactics belong on the guardrail list?\nEach correct answer presents a complete solution.", "opts": [["A", "Embed approved override phrases that let trusted users relax guardrails on demand."], ["B", "Lower sampling temperature globally to reduce the chance of off-policy completions."], ["C", "Rely on a single hardened system prompt that enumerates every disallowed behavior."], ["D", "Layer prompt-level guardrails with runtime content checks rather than relying on either alone."], ["E", "Validate the model output against a structured schema before downstream actions are taken."]]}, "vi": {"stem": "Bạn đang tổng hợp các chiến thuật hàng rào kiểm soát (guardrail) cho một trợ lý phục vụ khách hàng.\n\nHai chiến thuật nào thuộc danh sách guardrail?\nMỗi đáp án đúng là một giải pháp hoàn chỉnh.", "opts": [["A", "Nhúng các cụm từ ghi đè đã được phê duyệt, cho phép người dùng tin cậy nới lỏng guardrail theo yêu cầu."], ["B", "Hạ nhiệt độ lấy mẫu (sampling temperature) trên toàn hệ thống để giảm khả năng sinh ra nội dung trái chính sách."], ["C", "Dựa vào một system prompt duy nhất đã được gia cố, liệt kê mọi hành vi bị cấm."], ["D", "Xếp lớp guardrail ở cấp prompt cùng với kiểm tra nội dung lúc chạy (runtime), thay vì chỉ dựa vào một trong hai."], ["E", "Xác thực đầu ra của model theo một schema có cấu trúc trước khi thực hiện các hành động tiếp theo (downstream)."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Xếp lớp guardrail ở cấp prompt cùng với kiểm tra nội dung lúc chạy (runtime), thay vì chỉ dựa vào một trong hai.; Xác thực đầu ra của model theo một schema có cấu trúc trước khi thực hiện các hành động tiếp theo (downstream).\n\nKết hợp chỉ dẫn trong prompt với kiểm tra nội dung khi chạy giúp ứng dụng phát hiện vi phạm mà mô hình vẫn có thể tạo ra. Kiểm tra schema trước hành động tiếp theo chặn đầu ra sai cấu trúc hoặc thiếu trường bắt buộc. Hai lớp này xử lý các điểm lỗi khác nhau; schema hợp lệ vẫn cần được kiểm tra về nội dung và quyền.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Nhúng các cụm từ ghi đè đã được phê duyệt, cho phép người dùng tin cậy nới lỏng guardrail theo yêu cầu.**: Cụm từ ghi đè được nhúng trong hội thoại tạo đường vượt rào có thể bị sao chép; quyền phải được xác minh bên ngoài nội dung người dùng.\n- **Hạ nhiệt độ lấy mẫu (sampling temperature) trên toàn hệ thống để giảm khả năng sinh ra nội dung trái chính sách.**: Giảm temperature làm lựa chọn từ ít biến động hơn, nhưng một câu trả lời vi phạm có xác suất cao vẫn có thể được sinh ra.\n- **Dựa vào một system prompt duy nhất đã được gia cố, liệt kê mọi hành vi bị cấm.**: Một system prompt không thể liệt kê và cưỡng chế mọi tình huống; thiếu kiểm tra khi chạy khiến đầu ra vi phạm đi thẳng tới hệ thống sau.\n\n**Tham khảo:**\n\n- [Mitigate jailbreaks and prompt injections](https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/mitigate-jailbreaks)\n- [Structured outputs](https://platform.claude.com/docs/en/build-with-claude/structured-outputs)"}, {"n": 2, "set": 1, "i": 2, "multi": true, "answer": ["D", "E"], "en": {"stem": "A Claude architect is implementing safety controls for a customer-facing advice assistant that must never provide\nregulated investment recommendations.\n\nWhich two guardrail implementations most directly enforce this constraint? (Select two.)", "opts": [["A", "Increase response temperature to introduce variability that reduces the likelihood of specific recommendations."], ["B", "Log all user queries to a SIEM for post-hoc compliance review."], ["C", "Limit session length to reduce the volume of queries processed per user per day."], ["D", "Define explicit out-of-scope categories in the system prompt with fixed refusal phrasing for investment advicerequests."], ["E", "Add an output classifier that detects and blocks responses containing regulated investment- recommendation language."]]}, "vi": {"stem": "Một kiến trúc sư Claude đang triển khai các biện pháp kiểm soát an toàn cho một trợ lý tư vấn phục vụ khách hàng, trợ lý này tuyệt đối không được đưa ra các khuyến nghị đầu tư thuộc diện quản lý (regulated).\n\nHai cách triển khai guardrail nào thực thi ràng buộc này trực tiếp nhất? (Chọn hai.)", "opts": [["A", "Tăng temperature của phản hồi để tạo sự biến thiên, giảm khả năng đưa ra các khuyến nghị cụ thể."], ["B", "Ghi log mọi truy vấn của người dùng vào SIEM để rà soát tuân thủ sau sự việc."], ["C", "Giới hạn độ dài phiên để giảm số lượng truy vấn được xử lý cho mỗi người dùng mỗi ngày."], ["D", "Định nghĩa rõ các nhóm nội dung ngoài phạm vi trong system prompt, kèm câu từ chối cố định cho các yêu cầu tư vấn đầu tư."], ["E", "Thêm một bộ phân loại đầu ra (output classifier) phát hiện và chặn các phản hồi chứa ngôn ngữ khuyến nghị đầu tư thuộc diện quản lý."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Định nghĩa rõ các nhóm nội dung ngoài phạm vi trong system prompt, kèm câu từ chối cố định cho các yêu cầu tư vấn đầu tư.; Thêm một bộ phân loại đầu ra (output classifier) phát hiện và chặn các phản hồi chứa ngôn ngữ khuyến nghị đầu tư thuộc diện quản lý.\n\nNêu rõ tư vấn đầu tư thuộc phạm vi bị cấm và cách từ chối giúp định hướng lúc tạo câu trả lời. Bộ phân loại đầu ra có thể chặn nội dung khuyến nghị trước khi gửi khách hàng. Đây là hai biện pháp trực tiếp nhất trong đề, nhưng chúng giảm rủi ro chứ không chứng minh được yêu cầu tuyệt đối “không bao giờ”.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Tăng temperature của phản hồi để tạo sự biến thiên, giảm khả năng đưa ra các khuyến nghị cụ thể.**: Tăng temperature tăng tính biến động, không tạo ranh giới phân biệt lời giải thích được phép với khuyến nghị đầu tư bị cấm.\n- **Ghi log mọi truy vấn của người dùng vào SIEM để rà soát tuân thủ sau sự việc.**: Ghi SIEM giúp điều tra sau sự kiện nhưng tự nó không ngăn lời khuyên bị cấm tới khách hàng.\n- **Giới hạn độ dài phiên để giảm số lượng truy vấn được xử lý cho mỗi người dùng mỗi ngày.**: Giới hạn phiên làm giảm số lượt hỏi; một lượt duy nhất vẫn có thể tạo khuyến nghị bị cấm.\n\n**Cần xem lại:** Giữ khóa nguồn; cụm “must never” quá tuyệt đối vì hai biện pháp này không bảo đảm không bao giờ lọt lỗi.\n\n**Tham khảo:**\n\n- [Mitigate jailbreaks and prompt injections](https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/mitigate-jailbreaks)"}, {"n": 3, "set": 1, "i": 3, "multi": false, "answer": ["B"], "en": {"stem": "You are configuring tool permissions for a Claude-based assistant.\n\nThe assistant's defined responsibilities require\nread access to a knowledge base and write access to a draft queue, and nothing else.\n\nWhich scoping design best applies least privilege?", "opts": [["A", "Allow access to every tool in the catalog and rely on the model to decline tools it should not use."], ["B", "Per-role allow-list of exactly the read-knowledge-base and write-draft-queue tools, enforced at the orchestration layer."], ["C", "Disable all tools entirely to achieve a minimal permission surface, accepting that the assistant can no longer perform the read-knowledge-base or write-draft-queue tasks it was designed for."], ["D", "Allow access to all tools with read permissions globally and restrict write permissions to the draft- queue tool, without scoping to only the specific tools required for defined tasks."]]}, "vi": {"stem": "Bạn đang cấu hình quyền tool cho một trợ lý dựa trên Claude. Trách nhiệm đã định nghĩa của trợ lý yêu cầu quyền đọc một kho kiến thức (knowledge base) và quyền ghi vào một hàng đợi bản nháp (draft queue), ngoài ra không cần gì khác.\n\nThiết kế phạm vi quyền nào áp dụng nguyên tắc đặc quyền tối thiểu (least privilege) tốt nhất?", "opts": [["A", "Cho phép truy cập mọi tool trong danh mục và dựa vào model để tự từ chối những tool không nên dùng."], ["B", "Danh sách cho phép (allow-list) theo từng vai trò, gồm đúng tool đọc kho kiến thức và tool ghi hàng đợi bản nháp, được thực thi ở tầng điều phối (orchestration layer)."], ["C", "Vô hiệu hóa hoàn toàn mọi tool để đạt bề mặt quyền tối thiểu, chấp nhận rằng trợ lý không còn thực hiện được các tác vụ đọc kho kiến thức hay ghi hàng đợi bản nháp mà nó được thiết kế để làm."], ["D", "Cho phép truy cập mọi tool với quyền đọc trên toàn cục và giới hạn quyền ghi ở tool hàng đợi bản nháp, mà không thu hẹp phạm vi về đúng những tool cần cho các tác vụ đã định nghĩa."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Danh sách cho phép (allow-list) theo từng vai trò, gồm đúng tool đọc kho kiến thức và tool ghi hàng đợi bản nháp, được thực thi ở tầng điều phối (orchestration layer).\n\nDanh sách cho phép theo vai trò, chỉ gồm đọc kho tri thức và ghi hàng đợi bản nháp, vừa đủ cho hai nhiệm vụ đã định. Cưỡng chế ở lớp điều phối khiến lời yêu cầu của mô hình không tự mở thêm công cụ hoặc quyền.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Cho phép truy cập mọi tool trong danh mục và dựa vào model để tự từ chối những tool không nên dùng.**: Cấp toàn bộ công cụ rồi mong mô hình tự từ chối để lại quyền dư thừa có thể bị dùng khi prompt hoặc quyết định công cụ sai.\n- **Vô hiệu hóa hoàn toàn mọi tool để đạt bề mặt quyền tối thiểu, chấp nhận rằng trợ lý không còn thực hiện được các tác vụ đọc kho kiến thức hay ghi hàng đợi bản nháp mà nó được thiết kế để làm.**: Tắt mọi công cụ cũng loại bỏ khả năng hoàn thành công việc; đặc quyền tối thiểu là quyền tối thiểu cần thiết, không phải mất chức năng bắt buộc.\n- **Cho phép truy cập mọi tool với quyền đọc trên toàn cục và giới hạn quyền ghi ở tool hàng đợi bản nháp, mà không thu hẹp phạm vi về đúng những tool cần cho các tác vụ đã định nghĩa.**: Quyền đọc trên toàn danh mục vẫn cho phép truy cập dữ liệu ngoài kho tri thức cần thiết, dù quyền ghi đã được giới hạn.\n\n**Tham khảo:**\n\n- [Configure permissions](https://code.claude.com/docs/en/permissions)"}, {"n": 4, "set": 1, "i": 4, "multi": true, "answer": ["B", "E"], "en": {"stem": "You are compiling team-setup practices for a Claude Code rollout across an engineering organization.\n\nWhich two practices belong on the list? (Select two.)\nEach correct answer presents a complete solution.", "opts": [["A", "Use project scope for personal editor preferences so the preferences apply consistently within the project."], ["B", "Apply managed configuration centrally for security-critical settings that must not be overridden by individual engineers."], ["C", "Use local scope for security-critical permission rules so each engineer can adapt them to ongoing work."], ["D", "Use user scope for team-shared MCP servers so every engineer on the team has consistent access."], ["E", "Use project scope for team-shared Model Context Protocol (MCP) servers and permission rules under version control."]]}, "vi": {"stem": "Bạn đang tổng hợp các thực hành thiết lập nhóm cho việc triển khai Claude Code trên toàn một tổ chức kỹ thuật.\n\nHai thực hành nào thuộc danh sách này? (Chọn hai.)\n\nMỗi đáp án đúng là một giải pháp hoàn chỉnh.", "opts": [["A", "Dùng project scope cho các tùy chọn trình soạn thảo cá nhân để các tùy chọn này được áp dụng nhất quán trong project."], ["B", "Áp dụng cấu hình được quản lý (managed configuration) một cách tập trung cho các thiết lập quan trọng về bảo mật mà từng kỹ sư không được phép ghi đè."], ["C", "Dùng local scope cho các quy tắc quyền quan trọng về bảo mật để mỗi kỹ sư có thể điều chỉnh chúng theo công việc đang làm."], ["D", "Dùng user scope cho các MCP server dùng chung của nhóm để mọi kỹ sư trong nhóm có quyền truy cập nhất quán."], ["E", "Dùng project scope cho các máy chủ Model Context Protocol (MCP) dùng chung của nhóm và các quy tắc quyền, đặt dưới quản lý phiên bản (version control)."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Áp dụng cấu hình được quản lý (managed configuration) một cách tập trung cho các thiết lập quan trọng về bảo mật mà từng kỹ sư không được phép ghi đè.; Dùng project scope cho các máy chủ Model Context Protocol (MCP) dùng chung của nhóm và các quy tắc quyền, đặt dưới quản lý phiên bản (version control).\n\nCấu hình managed phù hợp cho chính sách bảo mật tổ chức cần cưỡng chế tập trung. Cấu hình project được đưa vào quản lý phiên bản giúp các thành viên nhận chung quy tắc quyền và cấu hình MCP của dự án; MCP dùng cơ chế scope riêng, không phải mọi mục đều nằm trong cùng tệp settings.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Dùng project scope cho các tùy chọn trình soạn thảo cá nhân để các tùy chọn này được áp dụng nhất quán trong project.**: Sở thích trình soạn thảo cá nhân thuộc user scope hoặc local scope nếu chỉ áp dụng một dự án; project scope chia sẻ chúng sang đồng nghiệp.\n- **Dùng local scope cho các quy tắc quyền quan trọng về bảo mật để mỗi kỹ sư có thể điều chỉnh chúng theo công việc đang làm.**: Quy tắc an ninh bắt buộc đặt ở local scope phụ thuộc máy cá nhân và có thể bị sửa riêng, không tạo chính sách chung.\n- **Dùng user scope cho các MCP server dùng chung của nhóm để mọi kỹ sư trong nhóm có quyền truy cập nhất quán.**: User scope chia sẻ cấu hình giữa các dự án của một người, không tự phân phối máy chủ MCP tới mọi thành viên.\n\n**Tham khảo:**\n\n- [Settings files and precedence](https://code.claude.com/docs/en/settings)\n- [Connect Claude Code to tools via MCP](https://code.claude.com/docs/en/mcp)"}, {"n": 5, "set": 1, "i": 5, "multi": false, "answer": ["B"], "en": {"stem": "You are designing a content moderation classifier that processes high volumes of user-generated comments under\na tight per-message latency budget using well-defined classification labels.\n\nWhich model selection best aligns with the workload?", "opts": [["A", "Sonnet, because larger general-purpose models are preferred even when workload latency requirements are strict."], ["B", "Haiku, because its latency and cost profile align with high-volume classification workloads that require limited reasoning depth."], ["C", "Sonnet with extended thinking enabled, because deeper reasoning should be applied to every moderation request to improve edge-case handling."], ["D", "Opus, because every moderation decision requires maximum reasoning depth regardless of classification complexity."]]}, "vi": {"stem": "Bạn đang thiết kế một bộ phân loại kiểm duyệt nội dung (content moderation classifier) xử lý khối lượng lớn bình luận do người dùng tạo, với ngân sách độ trễ (latency) chặt chẽ cho từng tin nhắn và sử dụng các nhãn phân loại được định nghĩa rõ ràng.\n\nLựa chọn model nào phù hợp nhất với khối lượng công việc này?", "opts": [["A", "Sonnet, vì các model đa dụng lớn hơn được ưu tiên ngay cả khi yêu cầu về latency của khối lượng công việc rất khắt khe."], ["B", "Haiku, vì đặc tính latency và chi phí của nó phù hợp với khối lượng công việc phân loại lớn, vốn chỉ đòi hỏi độ sâu suy luận hạn chế."], ["C", "Sonnet có bật extended thinking, vì nên áp dụng suy luận sâu hơn cho mọi yêu cầu kiểm duyệt để xử lý tốt hơn các trường hợp biên."], ["D", "Opus, vì mọi quyết định kiểm duyệt đều đòi hỏi độ sâu suy luận tối đa bất kể mức độ phức tạp của việc phân loại."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Haiku, vì đặc tính latency và chi phí của nó phù hợp với khối lượng công việc phân loại lớn, vốn chỉ đòi hỏi độ sâu suy luận hạn chế.\n\nHaiku phù hợp để thử nghiệm đầu tiên vì đề mô tả phân loại nhãn rõ ràng, lưu lượng lớn và thời gian xử lý ngắn. Năng lực suy luận cao hơn chỉ có giá trị nếu cải thiện chất lượng đủ để bù chi phí và độ trễ; vẫn cần đo trên dữ liệu kiểm duyệt thực tế.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Sonnet, vì các model đa dụng lớn hơn được ưu tiên ngay cả khi yêu cầu về latency của khối lượng công việc rất khắt khe.**: Sonnet có thể phân loại tốt, nhưng lý do ưu tiên mô hình lớn bất chấp yêu cầu độ trễ bỏ qua ràng buộc chính của đề.\n- **Sonnet có bật extended thinking, vì nên áp dụng suy luận sâu hơn cho mọi yêu cầu kiểm duyệt để xử lý tốt hơn các trường hợp biên.**: Suy luận mở rộng cho mọi bình luận thêm công việc xử lý dù nhiều trường hợp chỉ cần phân loại đơn giản; không có bằng chứng cần đánh đổi này.\n- **Opus, vì mọi quyết định kiểm duyệt đều đòi hỏi độ sâu suy luận tối đa bất kể mức độ phức tạp của việc phân loại.**: Opus có thể hữu ích cho trường hợp khó, nhưng khẳng định mọi quyết định kiểm duyệt đều cần mức suy luận tối đa không phù hợp khối lượng nhãn rõ ràng.\n\n**Tham khảo:**\n\n- [Models overview](https://platform.claude.com/docs/en/models/overview)"}, {"n": 6, "set": 1, "i": 6, "multi": false, "answer": ["A"], "en": {"stem": "You are supporting an engineer whose Claude Code session reports a permission denial when the engineer\nexpected the action to be allowed.\n\nWhich resolution step is most appropriate?", "opts": [["A", "Inspect the active permission rules across all scopes-managed, command-line, local, project, and user-to identify which rule is denying the action and confirm whether it should be amended or remain denied."], ["B", "Tell the engineer to retry the denied action verbatim repeatedly until the denial stops appearing, without inspecting the active permission rules to determine whether the denial is intentional."], ["C", "Disable the permission system entirely across all scopes to remove the denial, eliminating all tool-pattern and deny-rule controls rather than identifying and amending the specific rule."], ["D", "Grant the engineer unrestricted Bash access to bypass the specific rule causing the denial, removing all tool- pattern constraints rather than amending only the rule in"]]}, "vi": {"stem": "Bạn đang hỗ trợ một kỹ sư có phiên Claude Code báo lỗi từ chối quyền (permission denial), trong khi kỹ sư này cho rằng hành động đó lẽ ra phải được cho phép.\n\nBước xử lý nào phù hợp nhất?", "opts": [["A", "Kiểm tra các quy tắc quyền đang có hiệu lực trên tất cả các scope — managed, command-line, local, project và user — để xác định quy tắc nào đang từ chối hành động và xác nhận xem nên sửa đổi quy tắc đó hay tiếp tục giữ việc từ chối."], ["B", "Bảo kỹ sư thử lại nguyên văn hành động bị từ chối nhiều lần cho đến khi thông báo từ chối không còn xuất hiện, mà không kiểm tra các quy tắc quyền đang có hiệu lực để xác định việc từ chối có phải là cố ý hay không."], ["C", "Vô hiệu hóa hoàn toàn hệ thống quyền trên tất cả các scope để loại bỏ việc từ chối, xóa bỏ mọi kiểm soát theo mẫu tool (tool-pattern) và quy tắc từ chối (deny-rule) thay vì xác định và sửa đổi đúng quy tắc cụ thể."], ["D", "Cấp cho kỹ sư quyền truy cập Bash không giới hạn để vượt qua quy tắc cụ thể gây ra việc từ chối, xóa bỏ mọi ràng buộc theo mẫu tool (tool-pattern) thay vì chỉ sửa đổi quy tắc trong"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Kiểm tra các quy tắc quyền đang có hiệu lực trên tất cả các scope — managed, command-line, local, project và user — để xác định quy tắc nào đang từ chối hành động và xác nhận xem nên sửa đổi quy tắc đó hay tiếp tục giữ việc từ chối.\n\nKiểm tra các quy tắc quyền đang có hiệu lực ở mọi scope giúp tìm đúng quy tắc từ chối và biết đó là chính sách có chủ ý hay cấu hình sai. Chỉ sau khi xác định nguồn và yêu cầu thực tế mới sửa quy tắc phù hợp hoặc giữ nguyên lệnh cấm.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Bảo kỹ sư thử lại nguyên văn hành động bị từ chối nhiều lần cho đến khi thông báo từ chối không còn xuất hiện, mà không kiểm tra các quy tắc quyền đang có hiệu lực để xác định việc từ chối có phải là cố ý hay không.**: Lặp lại cùng hành động không thay đổi quy tắc quyền đang cưỡng chế nên không giải thích hay sửa nguyên nhân từ chối.\n- **Vô hiệu hóa hoàn toàn hệ thống quyền trên tất cả các scope để loại bỏ việc từ chối, xóa bỏ mọi kiểm soát theo mẫu tool (tool-pattern) và quy tắc từ chối (deny-rule) thay vì xác định và sửa đổi đúng quy tắc cụ thể.**: Tắt toàn bộ hệ thống quyền loại bỏ cả kiểm soát hợp lệ ở các thao tác khác thay vì sửa sai lệch cụ thể.\n- **Cấp cho kỹ sư quyền truy cập Bash không giới hạn để vượt qua quy tắc cụ thể gây ra việc từ chối, xóa bỏ mọi ràng buộc theo mẫu tool (tool-pattern) thay vì chỉ sửa đổi quy tắc trong**: Bash không hạn chế mở rộng quyền quá nhu cầu. Nội dung lựa chọn bị cắt ở cuối, nhưng phần còn thấy đã mô tả cách vượt kiểm soát thay vì chẩn đoán.\n\n**Cần xem lại:** Lựa chọn cấp Bash không hạn chế bị cắt ở cuối. Khóa nguồn vẫn được giữ; cần khôi phục đầy đủ nguyên văn trước khi xuất bản.\n\n**Tham khảo:**\n\n- [Configure permissions](https://code.claude.com/docs/en/permissions)\n- [Settings files and precedence](https://code.claude.com/docs/en/settings)"}, {"n": 7, "set": 1, "i": 7, "multi": true, "answer": ["D", "E"], "en": {"stem": "A managed agent deployment for claims triage has grown from 6 tools to 34 tools over 18 months as product\nteams added capabilities.\n\nTriage accuracy has declined from 91 percent to 78 percent, and average tool- selection\nlatency has increased by 2.3 seconds.\n\nA junior engineer has proposed adding a tool-router agent in front of the\ncurrent agent to filter the tool list per request.\n\nWhich two findings should you present to justify capability decomposition before adding the router? (Select two.)\nEach correct answer presents part of the solution.", "opts": [["A", "Tool descriptions overlap across multiple claim categories within the agent's tool set."], ["B", "Several tools have not been invoked across the most recent 90 days of traffic."], ["C", "The router pattern is well documented across publicly available agent literature."], ["D", "The proposed router introduces an additional model call on every incoming request."], ["E", "The 34 tools serve four distinct claim-workflow domains within the triage scope."]]}, "vi": {"stem": "Một hệ thống agent được quản lý (managed agent) dùng để phân loại hồ sơ bồi thường (claims triage) đã tăng từ **6 tool** lên **34 tool** trong **18 tháng** do các nhóm sản phẩm bổ sung thêm năng lực. Độ chính xác phân loại đã giảm từ **91 phần trăm** xuống **78 phần trăm**, và độ trễ chọn tool trung bình đã tăng thêm **2.3 giây**. Một kỹ sư junior đề xuất thêm một agent định tuyến tool (tool-router) đặt trước agent hiện tại để lọc danh sách tool cho từng yêu cầu.\n\nHai phát hiện nào bạn nên trình bày để biện minh cho việc phân rã năng lực (capability decomposition) trước khi thêm router? (Chọn hai.)\nMỗi đáp án đúng là một phần của giải pháp.", "opts": [["A", "Mô tả của các tool chồng chéo nhau giữa nhiều loại hồ sơ bồi thường trong bộ tool của agent."], ["B", "Một số tool không hề được gọi trong suốt 90 ngày lưu lượng gần nhất."], ["C", "Mẫu router đã được ghi nhận đầy đủ trong các tài liệu công khai về agent."], ["D", "Router được đề xuất sẽ thêm một lượt gọi model cho mỗi yêu cầu đến."], ["E", "34 tool phục vụ bốn miền quy trình bồi thường riêng biệt trong phạm vi phân loại."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Router được đề xuất sẽ thêm một lượt gọi model cho mỗi yêu cầu đến.; 34 tool phục vụ bốn miền quy trình bồi thường riêng biệt trong phạm vi phân loại.\n\nMột router dùng mô hình thêm một lượt suy luận cho mỗi yêu cầu nên có thể làm độ trễ vốn đã tăng nặng hơn. Việc 34 công cụ chia thành bốn miền nghiệp vụ tạo ranh giới để cân nhắc tách năng lực, giúp mỗi tác nhân chỉ phải chọn trong tập liên quan. Khóa nguồn chọn hai nhận định này; mô tả công cụ chồng lấn cũng đáng điều tra nên cặp đáp án chưa hoàn toàn duy nhất.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Mô tả của các tool chồng chéo nhau giữa nhiều loại hồ sơ bồi thường trong bộ tool của agent.**: Mô tả công cụ chồng lấn có thể thực sự gây chọn nhầm và ủng hộ việc làm rõ hoặc tách năng lực; khóa bỏ qua bằng chứng hợp lý này nên cần biên tập câu hỏi.\n- **Một số tool không hề được gọi trong suốt 90 ngày lưu lượng gần nhất.**: Công cụ không dùng 90 ngày gợi ý cắt bớt hoặc khảo sát nhu cầu, nhưng không tự chứng minh cần chia thành các miền năng lực.\n- **Mẫu router đã được ghi nhận đầy đủ trong các tài liệu công khai về agent.**: Router có tài liệu phổ biến không chứng minh phù hợp ngân sách độ trễ hay cấu trúc công cụ của hệ thống này.\n\n**Cần xem lại:** Giữ khóa nguồn; mô tả tool chồng lấn cũng là bằng chứng hợp lý cần phân tích. Câu hỏi chưa khiến cặp được chọn là duy nhất một cách chặt chẽ.\n\n**Tham khảo:**\n\n- [Building effective agents](https://www.anthropic.com/research/building-effective-agents)"}, {"n": 8, "set": 1, "i": 8, "multi": false, "answer": ["C"], "en": {"stem": "A technical team is debating whether to implement a new capability for generating regulatory filings from internal\ndata as a Claude Skill or as an MCP server.\n\nThe capability requires a fixed authoring procedure with embedded\nexamples, does not need to call live external systems, and must be portable across three Claude deployments:\nclaude.ai, an internal API integration, and Claude Code.\n\nWhich factor most strongly favors implementing the capability as a Skill?", "opts": [["A", "The capability needs to query a live database for the most recent regulatory filings."], ["B", "The capability requires direct authentication against the corporate identity provider."], ["C", "The capability is procedural knowledge with no live external-system calls required."], ["D", "The capability must also be callable from a developer's command-line interface."]]}, "vi": {"stem": "Một nhóm kỹ thuật đang tranh luận nên triển khai một năng lực mới — tạo hồ sơ nộp cơ quan quản lý (regulatory filings) từ dữ liệu nội bộ — dưới dạng Claude Skill hay MCP server. Năng lực này cần một quy trình soạn thảo cố định có kèm ví dụ, không cần gọi các hệ thống bên ngoài đang hoạt động (live), và phải dùng được trên ba môi trường triển khai Claude: claude.ai, một tích hợp API nội bộ và Claude Code.\n\nYếu tố nào ủng hộ mạnh nhất việc triển khai năng lực này dưới dạng Skill?", "opts": [["A", "Năng lực cần truy vấn một cơ sở dữ liệu live để lấy các hồ sơ nộp cơ quan quản lý mới nhất."], ["B", "Năng lực yêu cầu xác thực trực tiếp với nhà cung cấp danh tính (identity provider) của công ty."], ["C", "Năng lực là kiến thức mang tính quy trình, không cần gọi hệ thống bên ngoài nào đang hoạt động."], ["D", "Năng lực cũng phải gọi được từ giao diện dòng lệnh (command-line interface) của lập trình viên."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Năng lực là kiến thức mang tính quy trình, không cần gọi hệ thống bên ngoài nào đang hoạt động.\n\nSkill đóng gói quy trình soạn thảo, ví dụ và kiến thức chuyên môn để Claude áp dụng khi cần. Vì nhiệm vụ không cần kết nối hệ thống bên ngoài theo thời gian thực, phần cần tái sử dụng là cách làm; MCP thích hợp hơn khi phải cung cấp công cụ hoặc dữ liệu bên ngoài. Skill có trên các sản phẩm nêu trong đề nhưng cần triển khai đúng từng môi trường, không tự đồng bộ.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Năng lực cần truy vấn một cơ sở dữ liệu live để lấy các hồ sơ nộp cơ quan quản lý mới nhất.**: Truy vấn cơ sở dữ liệu trực tiếp đòi hỏi đường kết nối và công cụ; đó là lý do xem xét MCP chứ không phải lợi thế riêng của tài liệu quy trình.\n- **Năng lực yêu cầu xác thực trực tiếp với nhà cung cấp danh tính (identity provider) của công ty.**: Xác thực với nhà cung cấp danh tính là trách nhiệm tích hợp và quyền truy cập, không phải dấu hiệu quy trình nên là Skill.\n- **Năng lực cũng phải gọi được từ giao diện dòng lệnh (command-line interface) của lập trình viên.**: Có thể gọi từ dòng lệnh không phân biệt hai cách: Claude Code có thể dùng cả Skills lẫn MCP.\n\n**Tham khảo:**\n\n- [Agent Skills](https://platform.claude.com/docs/en/agents-and-tools/agent-skills/overview)\n- [Connect Claude Code to tools via MCP](https://code.claude.com/docs/en/mcp)"}, {"n": 9, "set": 1, "i": 9, "multi": true, "answer": ["D", "E"], "en": {"stem": "A Claude architect is auditing configuration scope assignments.\n\nWhich two statements correctly identify an appropriate use of user-scope configuration versus other scopes?\n(Select two.)", "opts": [["A", "Defining MCP server endpoints shared by all contributors to a specific repository."], ["B", "Storing API authentication keys so they are not committed to version control."], ["C", "Enforcing a company-wide policy that disables a feature for all engineers."], ["D", "Persisting personal editor theme preferences that follow an engineer across projects."], ["E", "Saving a preferred Claude response language that applies to all repositories the engineer uses."]]}, "vi": {"stem": "Một kiến trúc sư Claude đang rà soát việc gán scope cấu hình.\n\nHai phát biểu nào xác định đúng một cách dùng phù hợp của cấu hình user scope so với các scope khác?\n(Chọn hai.)", "opts": [["A", "Định nghĩa các endpoint của MCP server được dùng chung bởi mọi người đóng góp cho một repository cụ thể."], ["B", "Lưu trữ các khóa xác thực API để chúng không bị commit vào hệ thống quản lý phiên bản."], ["C", "Thực thi một chính sách toàn công ty vô hiệu hóa một tính năng đối với mọi kỹ sư."], ["D", "Lưu giữ các tùy chọn giao diện (theme) trình soạn thảo cá nhân, đi theo kỹ sư qua mọi project."], ["E", "Lưu ngôn ngữ phản hồi ưa thích của Claude, áp dụng cho mọi repository mà kỹ sư sử dụng."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Lưu giữ các tùy chọn giao diện (theme) trình soạn thảo cá nhân, đi theo kỹ sư qua mọi project.; Lưu ngôn ngữ phản hồi ưa thích của Claude, áp dụng cho mọi repository mà kỹ sư sử dụng.\n\nSở thích giao diện cá nhân và ngôn ngữ trả lời dùng trên mọi repository phù hợp phạm vi người dùng: chúng đi theo một kỹ sư thay vì trở thành quy tắc chung của dự án. Tuy nhiên, ngôn ngữ có thể được đặt bằng chỉ dẫn cá nhân, không nhất thiết là khóa JSON; không nên suy ra mọi ví dụ đều cùng cơ chế lưu.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Định nghĩa các endpoint của MCP server được dùng chung bởi mọi người đóng góp cho một repository cụ thể.**: Endpoint MCP dùng chung cho một repository phù hợp project scope để cả nhóm nhận cùng cấu hình qua quản lý phiên bản.\n- **Lưu trữ các khóa xác thực API để chúng không bị commit vào hệ thống quản lý phiên bản.**: Giữ API key ngoài Git là thực hành hợp lý và có thể dùng nơi lưu riêng người dùng; đây không phải đáp án sai tuyệt đối. Câu hỏi thiếu điều kiện để loại phương án này.\n- **Thực thi một chính sách toàn công ty vô hiệu hóa một tính năng đối với mọi kỹ sư.**: Chính sách bắt buộc trên toàn công ty cần managed scope; user scope chỉ áp dụng sở thích của một người và không cưỡng chế toàn tổ chức.\n\n**Cần xem lại:** Giữ khóa nguồn. Lựa chọn lưu API key ngoài version control cũng có thể đúng tùy cơ chế xác thực; ngôn ngữ trả lời không nhất thiết là setting JSON. Cần biên tập để có đúng hai đáp án.\n\n**Tham khảo:**\n\n- [Settings files and precedence](https://code.claude.com/docs/en/settings)\n- [Connect Claude Code to tools via MCP](https://code.claude.com/docs/en/mcp)"}, {"n": 10, "set": 1, "i": 10, "multi": true, "answer": ["B", "C"], "en": {"stem": "A research summarization assistant has been deployed for six months.\n\nA user has flagged that a generated\nsummary contained a fabricated citation.\n\nThe product team has asked whether the incident requires architectural\naction or whether it is an isolated case.\n\nWhich two Diligence-competency actions should you take? (Select two.)\nEach correct answer presents part of the solution.", "opts": [["A", "Disable the assistant immediately for all current users without any prior diagnostic analysis."], ["B", "Review whether citation-grounding controls exist anywhere in the current generation pipeline."], ["C", "Sample recent summaries to estimate the fabrication frequency across the population."], ["D", "Treat the incident as an anecdotal isolated case and take no further investigative action."], ["E", "Communicate to users that the assistant does not fabricate output as a matter of design."]]}, "vi": {"stem": "Một trợ lý tóm tắt nghiên cứu đã được triển khai được sáu tháng. Một người dùng báo rằng một bản tóm tắt do trợ lý tạo ra chứa một trích dẫn bịa đặt. Nhóm sản phẩm hỏi liệu sự cố này cần hành động ở mức kiến trúc hay chỉ là một trường hợp đơn lẻ.\n\nBạn nên thực hiện hai hành động nào thuộc năng lực Diligence (Cẩn trọng)? (Chọn hai.)\nMỗi đáp án đúng là một phần của giải pháp.", "opts": [["A", "Vô hiệu hóa trợ lý ngay lập tức đối với mọi người dùng hiện tại mà không có bất kỳ phân tích chẩn đoán nào trước đó."], ["B", "Rà soát xem có cơ chế kiểm soát neo trích dẫn vào nguồn (citation-grounding) nào tồn tại ở bất kỳ đâu trong pipeline sinh nội dung hiện tại hay không."], ["C", "Lấy mẫu các bản tóm tắt gần đây để ước tính tần suất bịa đặt trên toàn bộ tập dữ liệu."], ["D", "Coi sự cố là một trường hợp đơn lẻ mang tính giai thoại và không tiến hành điều tra thêm."], ["E", "Thông báo với người dùng rằng theo thiết kế, trợ lý không bịa đặt nội dung đầu ra."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Rà soát xem có cơ chế kiểm soát neo trích dẫn vào nguồn (citation-grounding) nào tồn tại ở bất kỳ đâu trong pipeline sinh nội dung hiện tại hay không.; Lấy mẫu các bản tóm tắt gần đây để ước tính tần suất bịa đặt trên toàn bộ tập dữ liệu.\n\nKiểm tra pipeline có ràng buộc trích dẫn và đối chiếu nguồn hay không giúp tìm lỗ hổng có thể sinh dẫn chứng giả. Lấy mẫu các bản tóm tắt gần đây cho biết lỗi xuất hiện rộng tới đâu, từ đó quyết định mức độ can thiệp dựa trên bằng chứng thay vì một báo cáo đơn lẻ.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Vô hiệu hóa trợ lý ngay lập tức đối với mọi người dùng hiện tại mà không có bất kỳ phân tích chẩn đoán nào trước đó.**: Dừng toàn bộ ngay có thể cần khi tác hại nghiêm trọng, nhưng đề chưa cho thấy mức độ đó; nó không thay thế chẩn đoán và đo phạm vi lỗi.\n- **Coi sự cố là một trường hợp đơn lẻ mang tính giai thoại và không tiến hành điều tra thêm.**: Một phản ánh là tín hiệu cần kiểm tra, không phải bằng chứng lỗi chỉ xảy ra duy nhất một lần.\n- **Thông báo với người dùng rằng theo thiết kế, trợ lý không bịa đặt nội dung đầu ra.**: Tuyên bố hệ thống không bịa trái với sự cố đã thấy và ngăn người dùng hiểu giới hạn thực tế.\n\n**Tham khảo:**\n\n- [Reduce hallucinations](https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations)\n- [Define success criteria and build evaluations](https://platform.claude.com/docs/en/test-and-evaluate/develop-tests)"}, {"n": 11, "set": 1, "i": 11, "multi": false, "answer": ["C"], "en": {"stem": "A customer support team has proposed delegating customer refund decisions to a Claude-driven workflow with no\nhuman review for refunds under 50 USD.\n\nThe team's reasoning is that small refunds are low-risk and human review\nwould erase the efficiency gain.\n\nWhich Delegation-competency principle should quide your response?", "opts": [["A", "Delegation should be avoided entirely wherever financial transactions occur in the workflow."], ["B", "Delegation should always include human review on every decision the workflow produces."], ["C", "Delegation scope should reflect the type of risk involved, not the transaction size alone."], ["D", "Delegation scope should be set primarily by maximizing efficiency gains across the workflow."]]}, "vi": {"stem": "Một nhóm hỗ trợ khách hàng đề xuất giao các quyết định hoàn tiền cho khách hàng cho một quy trình (workflow) do Claude điều khiển, không có con người rà soát đối với các khoản hoàn tiền dưới 50 USD. Lập luận của nhóm là các khoản hoàn tiền nhỏ có rủi ro thấp và việc con người rà soát sẽ xóa bỏ lợi ích về hiệu suất.\n\nNguyên tắc nào thuộc năng lực Delegation (Ủy thác) nên định hướng phản hồi của bạn?", "opts": [["A", "Nên tránh hoàn toàn việc ủy thác ở bất kỳ chỗ nào có giao dịch tài chính trong workflow."], ["B", "Việc ủy thác luôn phải bao gồm con người rà soát đối với mọi quyết định mà workflow tạo ra."], ["C", "Phạm vi ủy thác nên phản ánh loại rủi ro liên quan, chứ không chỉ dựa vào quy mô giao dịch."], ["D", "Phạm vi ủy thác nên được xác định chủ yếu bằng cách tối đa hóa lợi ích hiệu suất trên toàn workflow."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Phạm vi ủy thác nên phản ánh loại rủi ro liên quan, chứ không chỉ dựa vào quy mô giao dịch.\n\nPhạm vi giao quyền cần xét loại hậu quả: quyền hoàn tiền, khả năng gian lận, tác động cộng dồn và khả năng sửa sai. Mốc dưới 50 USD có thể là một điều kiện, nhưng một loạt hoàn tiền nhỏ sai đối tượng vẫn gây thiệt hại hoặc vi phạm chính sách; số tiền riêng lẻ chưa đủ quyết định có cần người duyệt.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Nên tránh hoàn toàn việc ủy thác ở bất kỳ chỗ nào có giao dịch tài chính trong workflow.**: Có giao dịch tài chính không tự cấm tự động hóa; có thể giao nhiệm vụ trong ranh giới rủi ro, quyền và kiểm soát đã xác định.\n- **Việc ủy thác luôn phải bao gồm con người rà soát đối với mọi quyết định mà workflow tạo ra.**: Duyệt mọi quyết định là một lựa chọn kiểm soát, không phải nguyên tắc bắt buộc cho mọi mức rủi ro và mọi loại thao tác.\n- **Phạm vi ủy thác nên được xác định chủ yếu bằng cách tối đa hóa lợi ích hiệu suất trên toàn workflow.**: Tối đa hiệu suất không cho biết hậu quả khi quyết định sai; bỏ qua rủi ro khiến phạm vi giao quyền thiếu cơ sở.\n\n**Tham khảo:**\n\n- [NIST AI Risk Management Framework](https://airc.nist.gov/airmf-resources/airmf/)"}, {"n": 12, "set": 1, "i": 12, "multi": false, "answer": ["D"], "en": {"stem": "You must present an architectural recommendation to deploy a Claude-based contract review assistant to a\nsteering committee that includes the CFO, the general counsel, and the CIO.\n\nEach stakeholder cares about\ndifferent aspects of the decision.\n\nHow should you structure the recommendation document?", "opts": [["A", "Lead with detailed cost projections across the full multi-year horizon before the rationale section."], ["B", "Lead with the technical architecture diagram and the full component list before any other section."], ["C", "Present the same dense narrative throughout with no stakeholder differentiation in any section."], ["D", "Lead with the architectural decision, then address each stakeholder's primary concerns directly."]]}, "vi": {"stem": "Bạn phải trình bày một khuyến nghị kiến trúc về việc triển khai một trợ lý rà soát hợp đồng dựa trên Claude trước một ủy ban chỉ đạo gồm CFO, tổng cố vấn pháp lý (general counsel) và CIO. Mỗi bên liên quan quan tâm đến những khía cạnh khác nhau của quyết định.\n\nBạn nên cấu trúc tài liệu khuyến nghị như thế nào?", "opts": [["A", "Mở đầu bằng dự báo chi phí chi tiết cho toàn bộ giai đoạn nhiều năm, trước phần lý giải."], ["B", "Mở đầu bằng sơ đồ kiến trúc kỹ thuật và danh sách đầy đủ các thành phần, trước mọi phần khác."], ["C", "Trình bày cùng một văn bản dày đặc xuyên suốt, không phân biệt theo từng bên liên quan ở bất kỳ phần nào."], ["D", "Mở đầu bằng quyết định kiến trúc, sau đó giải quyết trực tiếp các mối quan tâm chính của từng bên liên quan."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Mở đầu bằng quyết định kiến trúc, sau đó giải quyết trực tiếp các mối quan tâm chính của từng bên liên quan.\n\nNêu quyết định kiến trúc trước giúp ủy ban biết chính xác điều cần phê duyệt. Sau đó trình bày chi phí cho CFO, rủi ro pháp lý và trách nhiệm cho tổng cố vấn, cùng tích hợp và vận hành cho CIO để mỗi người đánh giá cùng quyết định bằng tiêu chí phù hợp.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Mở đầu bằng dự báo chi phí chi tiết cho toàn bộ giai đoạn nhiều năm, trước phần lý giải.**: Dự báo chi phí hữu ích cho CFO nhưng đặt toàn bộ chi tiết nhiều năm trước quyết định khiến các thành viên khác chưa thấy mục đích của số liệu.\n- **Mở đầu bằng sơ đồ kiến trúc kỹ thuật và danh sách đầy đủ các thành phần, trước mọi phần khác.**: Sơ đồ thành phần hỗ trợ đánh giá kỹ thuật của CIO nhưng chưa giải thích đề xuất và tác động tài chính, pháp lý cho toàn ủy ban.\n- **Trình bày cùng một văn bản dày đặc xuyên suốt, không phân biệt theo từng bên liên quan ở bất kỳ phần nào.**: Một văn bản dày đặc không phân biệt nhu cầu khiến từng người phải tự tìm thông tin quyết định của mình.\n\n**Tham khảo:**\n\n- [Diátaxis: How-to guides](https://diataxis.fr/how-to-guides/)"}, {"n": 13, "set": 1, "i": 13, "multi": false, "answer": ["C"], "en": {"stem": "You are investigating an MCP server that fails on first launch but succeeds on subsequent runs. System permission\ndialogs appeared during the first launch.\n\nWhich response is most appropriate?", "opts": [["A", "Treat the first-run failure as a permanent fault, replace the MCP server, and do not verify whether subsequent runs succeed."], ["B", "Reinstall the operating system to clear all permission state without first confirming whether the one- time permission grant caused the failure."], ["C", "Recognize the first-run permission grant as the cause, document the expected behavior in onboarding guidance, and confirm that subsequent runs succeed."], ["D", "Disable operating-system permission dialogs entirely, accept the resulting security implications, and proceed without confirming whether the failure recurs."]]}, "vi": {"stem": "Bạn đang điều tra một MCP server bị lỗi ở lần khởi chạy đầu tiên nhưng chạy thành công ở các lần sau. Các hộp thoại cấp quyền của hệ thống đã xuất hiện trong lần khởi chạy đầu tiên.\n\nCách phản hồi nào phù hợp nhất?", "opts": [["A", "Coi lỗi ở lần chạy đầu là lỗi vĩnh viễn, thay thế MCP server và không kiểm tra xem các lần chạy sau có thành công không."], ["B", "Cài đặt lại hệ điều hành để xóa toàn bộ trạng thái quyền mà không xác nhận trước liệu việc cấp quyền một lần có phải là nguyên nhân gây lỗi hay không."], ["C", "Nhận diện việc cấp quyền ở lần chạy đầu là nguyên nhân, ghi lại hành vi dự kiến này trong hướng dẫn onboarding, và xác nhận rằng các lần chạy sau đều thành công."], ["D", "Vô hiệu hóa hoàn toàn các hộp thoại cấp quyền của hệ điều hành, chấp nhận các hệ quả bảo mật đi kèm, và tiếp tục mà không xác nhận xem lỗi có tái diễn hay không."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Nhận diện việc cấp quyền ở lần chạy đầu là nguyên nhân, ghi lại hành vi dự kiến này trong hướng dẫn onboarding, và xác nhận rằng các lần chạy sau đều thành công.\n\nHộp thoại quyền ở lần chạy đầu gợi ý bước cấp quyền ban đầu có liên quan. Hướng xử lý trong khóa nguồn là xác minh các lần chạy sau thành công rồi ghi quy trình onboarding để người mới biết cần cấp quyền. Tuy nhiên, chỉ thấy hộp thoại chưa đủ kết luận nguyên nhân; cần đối chiếu log và tái hiện trước khi khẳng định.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Coi lỗi ở lần chạy đầu là lỗi vĩnh viễn, thay thế MCP server và không kiểm tra xem các lần chạy sau có thành công không.**: Thay MCP server ngay bỏ qua bằng chứng lỗi không tái diễn và chưa kiểm tra quá trình cấp quyền lần đầu.\n- **Cài đặt lại hệ điều hành để xóa toàn bộ trạng thái quyền mà không xác nhận trước liệu việc cấp quyền một lần có phải là nguyên nhân gây lỗi hay không.**: Cài lại hệ điều hành thay đổi quá nhiều trạng thái cho một lỗi khởi tạo có thể xác minh bằng log và lần chạy tiếp theo.\n- **Vô hiệu hóa hoàn toàn các hộp thoại cấp quyền của hệ điều hành, chấp nhận các hệ quả bảo mật đi kèm, và tiếp tục mà không xác nhận xem lỗi có tái diễn hay không.**: Tắt hộp thoại quyền loại bỏ một kiểm soát hệ điều hành nhưng vẫn chưa chứng minh lỗi đã được xử lý hoặc nguyên nhân là gì.\n\n**Cần xem lại:** Khóa nguồn được giữ; chỉ thấy hộp thoại quyền là tương quan, chưa đủ chứng minh nguyên nhân như cách đáp án khẳng định.\n\n**Tham khảo:**\n\n- [Google SRE: Effective Troubleshooting](https://sre.google/sre-book/effective-troubleshooting/)\n- [Connect Claude Code to tools via MCP](https://code.claude.com/docs/en/mcp)"}, {"n": 14, "set": 1, "i": 14, "multi": true, "answer": ["C", "D"], "en": {"stem": "You are producing an architecture guide for a new deployment and must complete the planning steps before\ndrafting each section.\n\nWhich two steps must be completed BEFORE drafting each section of the guide? (Select two.) Each correct\nanswer presents part of the solution.", "opts": [["A", "Translate the guide into the supported regional languages for the candidate population."], ["B", "Establish the document under version control with a defined review cadence and approver list."], ["C", "Identify the audience and the questions the guide must answer for that audience."], ["D", "Outline the guide sections covering the overview, components, contracts, flows, runbooks, and limitations."], ["E", "Validate the guide with the implementation team and incorporate corrections."]]}, "vi": {"stem": "Bạn đang soạn một hướng dẫn kiến trúc cho một lần triển khai mới và phải hoàn tất các bước lập kế hoạch trước khi soạn thảo từng phần.\n\nHai bước nào phải được hoàn tất TRƯỚC KHI soạn thảo từng phần của hướng dẫn? (Chọn hai.) Mỗi đáp án đúng là một phần của giải pháp.", "opts": [["A", "Dịch hướng dẫn sang các ngôn ngữ khu vực được hỗ trợ cho nhóm người đọc dự kiến."], ["B", "Đưa tài liệu vào hệ thống quản lý phiên bản với lịch rà soát xác định và danh sách người phê duyệt."], ["C", "Xác định đối tượng người đọc và những câu hỏi mà hướng dẫn phải trả lời cho đối tượng đó."], ["D", "Lập dàn ý các phần của hướng dẫn, bao gồm tổng quan, thành phần, hợp đồng giao tiếp (contracts), luồng xử lý (flows), runbook và các giới hạn."], ["E", "Kiểm định hướng dẫn với nhóm triển khai và đưa các chỉnh sửa vào."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Xác định đối tượng người đọc và những câu hỏi mà hướng dẫn phải trả lời cho đối tượng đó.; Lập dàn ý các phần của hướng dẫn, bao gồm tổng quan, thành phần, hợp đồng giao tiếp (contracts), luồng xử lý (flows), runbook và các giới hạn.\n\nXác định độc giả và câu hỏi họ cần trả lời tạo tiêu chí chọn thông tin. Lập dàn ý tổng quan, thành phần, hợp đồng giao tiếp, luồng, runbook và giới hạn giúp phân bổ nội dung nhất quán trước khi viết chi tiết. Đó là hai bước lập kế hoạch được hỏi; chúng không phủ nhận giá trị của quản lý phiên bản.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Dịch hướng dẫn sang các ngôn ngữ khu vực được hỗ trợ cho nhóm người đọc dự kiến.**: Dịch ngôn ngữ cần nội dung đủ ổn định để dịch; nó không quyết định mỗi phần phải giải đáp điều gì.\n- **Đưa tài liệu vào hệ thống quản lý phiên bản với lịch rà soát xác định và danh sách người phê duyệt.**: Quản lý phiên bản, lịch duyệt và người phê duyệt là việc quản trị hữu ích có thể bắt đầu sớm, nhưng không thay thế xác định độc giả và cấu trúc nội dung.\n- **Kiểm định hướng dẫn với nhóm triển khai và đưa các chỉnh sửa vào.**: Xác thực với đội triển khai cần ít nhất một bản nháp để góp ý, nên không thể là điều kiện hoàn tất trước khi soạn nội dung đó.\n\n**Tham khảo:**\n\n- [Diátaxis: How-to guides](https://diataxis.fr/how-to-guides/)"}, {"n": 15, "set": 1, "i": 15, "multi": false, "answer": ["A"], "en": {"stem": "You are responding to an adversarial input pattern in which users include text claiming admin authority and\ninstructing the model to bypass safety restrictions.\n\nWhich combination of controls most effectively mitigates this attack pattern?", "opts": [["A", "Prompt-level instructions that treat user content as untrusted data, runtime classifiers that detect override attempts, scoped tool permissions that cannot be elevated by user content, and audit logging of attempts."], ["B", "Granting users any privilege level they assert in their message content, on the assumption that cooperative behavior requires honoring self-declared authority without independent verification."], ["C", "Trusting that the model will intrinsically recognize and reject all bypass attempts without prompt-level instructions, runtime classifiers, scoped permissions, or audit logging."], ["D", "Removing all safety restrictions and guardrails to eliminate the attack surface that bypass attempts target, accepting that this makes the assistant unrestricted for all inputs."]]}, "vi": {"stem": "Bạn đang ứng phó với một mẫu đầu vào mang tính tấn công (adversarial) trong đó người dùng chèn đoạn văn bản tự xưng có quyền quản trị viên và yêu cầu model vượt qua các hạn chế an toàn.\n\nTổ hợp biện pháp kiểm soát nào giảm thiểu hiệu quả nhất mẫu tấn công này?", "opts": [["A", "Hướng dẫn ở cấp prompt coi nội dung người dùng là dữ liệu không đáng tin cậy, bộ phân loại runtime phát hiện các nỗ lực ghi đè, quyền tool có phạm vi giới hạn mà nội dung người dùng không thể nâng cấp, và ghi log kiểm toán (audit logging) các nỗ lực đó."], ["B", "Cấp cho người dùng bất kỳ mức đặc quyền nào họ tự khẳng định trong nội dung tin nhắn, với giả định rằng hành vi hợp tác đòi hỏi tôn trọng thẩm quyền tự tuyên bố mà không cần xác minh độc lập."], ["C", "Tin rằng model sẽ tự nhận ra và từ chối mọi nỗ lực vượt rào mà không cần hướng dẫn ở cấp prompt, bộ phân loại runtime, quyền có phạm vi giới hạn hay ghi log kiểm toán."], ["D", "Gỡ bỏ mọi hạn chế an toàn và guardrail để loại bỏ bề mặt tấn công mà các nỗ lực vượt rào nhắm tới, chấp nhận rằng điều này khiến trợ lý không bị giới hạn đối với mọi đầu vào."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Hướng dẫn ở cấp prompt coi nội dung người dùng là dữ liệu không đáng tin cậy, bộ phân loại runtime phát hiện các nỗ lực ghi đè, quyền tool có phạm vi giới hạn mà nội dung người dùng không thể nâng cấp, và ghi log kiểm toán (audit logging) các nỗ lực đó.\n\nThông điệp tự xưng quản trị viên vẫn là dữ liệu người dùng, không phải bằng chứng quyền. Chỉ dẫn phân biệt độ tin cậy, bộ phát hiện nỗ lực vượt rào, quyền công cụ được cưỡng chế bên ngoài hội thoại và nhật ký kiểm tra tạo các lớp phòng vệ: nhận diện yêu cầu xấu, hạn chế hành động và hỗ trợ điều tra.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Cấp cho người dùng bất kỳ mức đặc quyền nào họ tự khẳng định trong nội dung tin nhắn, với giả định rằng hành vi hợp tác đòi hỏi tôn trọng thẩm quyền tự tuyên bố mà không cần xác minh độc lập.**: Cấp quyền theo lời tự khai biến chính nội dung tấn công thành cơ chế nâng quyền, bỏ qua xác thực độc lập.\n- **Tin rằng model sẽ tự nhận ra và từ chối mọi nỗ lực vượt rào mà không cần hướng dẫn ở cấp prompt, bộ phân loại runtime, quyền có phạm vi giới hạn hay ghi log kiểm toán.**: Khả năng chống tấn công của mô hình không bảo đảm nhận ra mọi cách diễn đạt; thiếu kiểm soát ngoài mô hình khiến một lần sai có thể thành hành động thật.\n- **Gỡ bỏ mọi hạn chế an toàn và guardrail để loại bỏ bề mặt tấn công mà các nỗ lực vượt rào nhắm tới, chấp nhận rằng điều này khiến trợ lý không bị giới hạn đối với mọi đầu vào.**: Gỡ hạn chế cho phép luôn hành vi mà cuộc tấn công muốn đạt tới, nên không giảm hậu quả của vượt rào.\n\n**Tham khảo:**\n\n- [Mitigate jailbreaks and prompt injections](https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/mitigate-jailbreaks)\n- [Configure permissions](https://code.claude.com/docs/en/permissions)"}, {"n": 16, "set": 1, "i": 16, "multi": false, "answer": ["B"], "en": {"stem": "You are a solution architect designing a Claude-based assistant with access to 60 internal tools across multiple\nbusiness domains.\n\nLoading every tool definition on every request increases token usage and time to first response.\n\nWhich design pattern best addresses this issue without sacrificing capability breadth?", "opts": [["A", "Increase the maximum context length and load all 60 tool definitions on every request, accepting the higher token cost and latency as necessary for full capability."], ["B", "Apply progressive tool discovery so a curated initial subset is exposed and additional tools are loaded on demand based on the task."], ["C", "Hard-code a fixed set of five tools per request to reduce token usage, regardless of whether those tools are relevant to the current task."], ["D", "Use a separate model call to summarize all 60 tool definitions before each user turn."]]}, "vi": {"stem": "Bạn là kiến trúc sư giải pháp đang thiết kế một trợ lý dựa trên Claude có quyền truy cập 60 tool nội bộ thuộc nhiều miền nghiệp vụ. Việc nạp mọi định nghĩa tool trong mỗi yêu cầu làm tăng mức sử dụng token và thời gian đến phản hồi đầu tiên.\n\nMẫu thiết kế nào giải quyết tốt nhất vấn đề này mà không hy sinh độ rộng năng lực?", "opts": [["A", "Tăng độ dài context tối đa và nạp cả 60 định nghĩa tool trong mỗi yêu cầu, chấp nhận chi phí token và latency cao hơn như cái giá cần thiết cho đầy đủ năng lực."], ["B", "Áp dụng cơ chế khám phá tool dần dần (progressive tool discovery): chỉ cung cấp một tập con ban đầu đã được chọn lọc, còn các tool khác được nạp theo nhu cầu dựa trên tác vụ."], ["C", "Cố định cứng một bộ năm tool cho mỗi yêu cầu để giảm mức sử dụng token, bất kể các tool đó có liên quan đến tác vụ hiện tại hay không."], ["D", "Dùng một lượt gọi model riêng để tóm tắt cả 60 định nghĩa tool trước mỗi lượt của người dùng."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Áp dụng cơ chế khám phá tool dần dần (progressive tool discovery): chỉ cung cấp một tập con ban đầu đã được chọn lọc, còn các tool khác được nạp theo nhu cầu dựa trên tác vụ.\n\nKhám phá công cụ theo nhu cầu giữ tập ban đầu gọn và bổ sung công cụ khi nhiệm vụ cần, nên vẫn tiếp cận đủ 60 khả năng mà không đưa mọi định nghĩa vào ngữ cảnh mô hình ngay từ đầu. Với tool search của API, định nghĩa có thể vẫn được gửi trong request để máy chủ tìm kiếm; phần tiết kiệm là ngữ cảnh được nạp cho mô hình.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Tăng độ dài context tối đa và nạp cả 60 định nghĩa tool trong mỗi yêu cầu, chấp nhận chi phí token và latency cao hơn như cái giá cần thiết cho đầy đủ năng lực.**: Tăng giới hạn ngữ cảnh chỉ tăng sức chứa; nó không loại bỏ token và thời gian xử lý của 60 định nghĩa luôn được nạp.\n- **Cố định cứng một bộ năm tool cho mỗi yêu cầu để giảm mức sử dụng token, bất kể các tool đó có liên quan đến tác vụ hiện tại hay không.**: Năm công cụ cố định có thể thiếu đúng công cụ cần cho yêu cầu mới, làm mất bề rộng năng lực mà đề yêu cầu giữ.\n- **Dùng một lượt gọi model riêng để tóm tắt cả 60 định nghĩa tool trước mỗi lượt của người dùng.**: Tóm tắt mọi định nghĩa ở mỗi lượt thêm một lần gọi mô hình và có thể làm mất chi tiết tham số cần để gọi đúng.\n\n**Tham khảo:**\n\n- [Tool search tool](https://platform.claude.com/docs/en/agents-and-tools/tool-use/tool-search-tool)"}, {"n": 17, "set": 1, "i": 17, "multi": false, "answer": ["C"], "en": {"stem": "You are presenting an architectural decision to a mixed audience that includes an executive sponsor and the\nengineering leads who will implement the decision.\n\nWhich presentation strategy best serves both audiences?", "opts": [["A", "Open with a deep dive into low-level implementation details targeted at engineering leads, and stop there without addressing the business outcomes or trade-offs the executive sponsor needs."], ["B", "Skip the rationale, alternatives, and trade-off discussion entirely and simply announce the chosen decision, leaving both audiences without the context needed to implement or validate it."], ["C", "Lead with the decision, the business outcomes it serves, and the trade-offs accepted; follow with the technical rationale, alternatives, and implementation implications for the engineering audience."], ["D", "Present a single undifferentiated narrative that addresses technical and business concerns with equal weight throughout, treating both audiences as requiring the same depth on every section."]]}, "vi": {"stem": "Bạn đang trình bày một quyết định kiến trúc trước một nhóm người nghe hỗn hợp, gồm một nhà tài trợ cấp điều hành (executive sponsor) và các trưởng nhóm kỹ thuật sẽ triển khai quyết định đó.\n\nChiến lược trình bày nào phục vụ tốt nhất cả hai nhóm người nghe?", "opts": [["A", "Mở đầu bằng việc đi sâu vào chi tiết triển khai cấp thấp dành cho các trưởng nhóm kỹ thuật, và dừng ở đó mà không đề cập đến kết quả kinh doanh hay các đánh đổi mà nhà tài trợ điều hành cần."], ["B", "Bỏ qua hoàn toàn phần lý giải, các phương án thay thế và thảo luận đánh đổi, chỉ đơn giản công bố quyết định đã chọn, khiến cả hai nhóm người nghe thiếu bối cảnh cần thiết để triển khai hoặc kiểm chứng quyết định."], ["C", "Mở đầu bằng quyết định, các kết quả kinh doanh mà quyết định phục vụ và các đánh đổi đã chấp nhận; tiếp theo là lý giải kỹ thuật, các phương án thay thế và tác động triển khai dành cho nhóm kỹ thuật."], ["D", "Trình bày một mạch nội dung duy nhất không phân biệt, đề cập các mối quan tâm kỹ thuật và kinh doanh với trọng số ngang nhau xuyên suốt, coi cả hai nhóm người nghe đều cần cùng độ sâu ở mọi phần."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Mở đầu bằng quyết định, các kết quả kinh doanh mà quyết định phục vụ và các đánh đổi đã chấp nhận; tiếp theo là lý giải kỹ thuật, các phương án thay thế và tác động triển khai dành cho nhóm kỹ thuật.\n\nMở bằng quyết định, kết quả kinh doanh và đánh đổi giúp người bảo trợ hiểu giá trị và trách nhiệm chấp nhận rủi ro. Phần tiếp theo giải thích lý do kỹ thuật, phương án thay thế và tác động triển khai để kỹ sư có đủ thông tin thực hiện mà vẫn dùng chung một mạch lập luận.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Mở đầu bằng việc đi sâu vào chi tiết triển khai cấp thấp dành cho các trưởng nhóm kỹ thuật, và dừng ở đó mà không đề cập đến kết quả kinh doanh hay các đánh đổi mà nhà tài trợ điều hành cần.**: Chỉ đào sâu triển khai phục vụ kỹ sư nhưng bỏ thiếu kết quả và đánh đổi mà người bảo trợ cần phê duyệt.\n- **Bỏ qua hoàn toàn phần lý giải, các phương án thay thế và thảo luận đánh đổi, chỉ đơn giản công bố quyết định đã chọn, khiến cả hai nhóm người nghe thiếu bối cảnh cần thiết để triển khai hoặc kiểm chứng quyết định.**: Chỉ thông báo lựa chọn khiến cả hai nhóm không biết vì sao các phương án khác bị loại hoặc điều kiện nào làm quyết định thay đổi.\n- **Trình bày một mạch nội dung duy nhất không phân biệt, đề cập các mối quan tâm kỹ thuật và kinh doanh với trọng số ngang nhau xuyên suốt, coi cả hai nhóm người nghe đều cần cùng độ sâu ở mọi phần.**: Cùng một mức chi tiết ở mọi đoạn buộc người điều hành đọc sâu quá nhu cầu và dễ làm kỹ sư thiếu phần triển khai tập trung.\n\n**Tham khảo:**\n\n- [Diátaxis: How-to guides](https://diataxis.fr/how-to-guides/)"}, {"n": 18, "set": 1, "i": 18, "multi": true, "answer": ["A", "E"], "en": {"stem": "You are designing a test strategy for a Claude-based pipeline that handles sensitive financial data. hich two test\ntypes should be prioritized to cover both safety under attack and cross-component correctness?\n(Select two.)", "opts": [["A", "Integration tests that verify end-to-end pipeline behavior across all components."], ["B", "Smoke tests that verify core paths after each deployment."], ["C", "Unit tests targeting only individual prompt-template rendering logic."], ["D", "Regression tests against a stable reference set of previously known-good outputs."], ["E", "Adversarial tests using prompt-injection and malformed-input cases."]]}, "vi": {"stem": "Bạn đang thiết kế chiến lược kiểm thử cho một pipeline dựa trên Claude xử lý dữ liệu tài chính nhạy cảm.\n\nHai loại kiểm thử nào nên được ưu tiên để bao quát cả độ an toàn khi bị tấn công lẫn tính đúng đắn giữa các thành phần?\n(Chọn hai.)", "opts": [["A", "Kiểm thử tích hợp (integration test) xác minh hành vi đầu-cuối (end-to-end) của pipeline trên tất cả các thành phần."], ["B", "Kiểm thử khói (smoke test) xác minh các luồng cốt lõi sau mỗi lần triển khai."], ["C", "Kiểm thử đơn vị (unit test) chỉ nhắm vào logic render của từng prompt template riêng lẻ."], ["D", "Kiểm thử hồi quy (regression test) so với một tập tham chiếu ổn định gồm các đầu ra đã biết là đúng trước đây."], ["E", "Kiểm thử đối kháng (adversarial test) sử dụng các trường hợp prompt injection và đầu vào sai định dạng."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Kiểm thử tích hợp (integration test) xác minh hành vi đầu-cuối (end-to-end) của pipeline trên tất cả các thành phần.; Kiểm thử đối kháng (adversarial test) sử dụng các trường hợp prompt injection và đầu vào sai định dạng.\n\nIntegration test kiểm tra các thành phần trao đổi dữ liệu và phối hợp đúng trong luồng tài chính hoàn chỉnh. Adversarial test đưa prompt injection và dữ liệu sai dạng vào pipeline để kiểm tra phản ứng khi bị tấn công. Cặp này trực tiếp bao phủ hai mục tiêu được nêu: đúng liên thành phần và an toàn dưới đầu vào xấu.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Kiểm thử khói (smoke test) xác minh các luồng cốt lõi sau mỗi lần triển khai.**: Smoke test phát hiện lỗi lớn trên đường chính sau triển khai, nhưng độ phủ nông không thay cho kiểm tra phối hợp và tình huống tấn công.\n- **Kiểm thử đơn vị (unit test) chỉ nhắm vào logic render của từng prompt template riêng lẻ.**: Unit test chỉ kiểm tra dựng prompt không quan sát lỗi ở truy xuất, gọi mô hình, kiểm quyền hoặc xử lý đầu ra khi phối hợp.\n- **Kiểm thử hồi quy (regression test) so với một tập tham chiếu ổn định gồm các đầu ra đã biết là đúng trước đây.**: Regression test hữu ích để giữ hành vi đã biết; một tập kết quả tốt cũ chưa chắc có tình huống tấn công hay xác minh mọi ranh giới thành phần.\n\n**Tham khảo:**\n\n- [Define success criteria and build evaluations](https://platform.claude.com/docs/en/test-and-evaluate/develop-tests)"}, {"n": 19, "set": 1, "i": 19, "multi": true, "answer": ["C", "E"], "en": {"stem": "You are running a risk assessment on a planned Claude-based deployment and must complete the inventory steps\nbefore assessing threats against assets.\n\nWhich two steps must be completed BEFORE assessing threats against assets to estimate likelihood and impact?\n(Select two.) Each correct answer presents part of the solution.", "opts": [["A", "Recommend mitigations and residual-risk acceptance for the risks that remain after analysis."], ["B", "Recommend mitigations and residual-risk acceptance for risks that remain."], ["C", "Enumerate the threat actors and attack vectors relevant to the deployment."], ["D", "Document the assessment outcome with risks, mitigations, residual risk, and acceptance owners."], ["E", "Identify the assets that the deployment touches, along with the sensitivity of each asset."]]}, "vi": {"stem": "Bạn đang thực hiện đánh giá rủi ro cho một lần triển khai dựa trên Claude đã được lên kế hoạch và phải hoàn tất các bước kiểm kê trước khi đánh giá các mối đe dọa đối với tài sản.\n\nHai bước nào phải được hoàn tất TRƯỚC KHI đánh giá các mối đe dọa đối với tài sản để ước tính khả năng xảy ra và mức độ tác động?\n(Chọn hai.) Mỗi đáp án đúng là một phần của giải pháp.", "opts": [["A", "Đề xuất các biện pháp giảm thiểu và việc chấp nhận rủi ro tồn dư cho những rủi ro còn lại sau khi phân tích."], ["B", "Đề xuất các biện pháp giảm thiểu và việc chấp nhận rủi ro tồn dư cho những rủi ro còn lại."], ["C", "Liệt kê các tác nhân đe dọa (threat actor) và vectơ tấn công (attack vector) liên quan đến lần triển khai."], ["D", "Ghi lại kết quả đánh giá gồm các rủi ro, biện pháp giảm thiểu, rủi ro tồn dư và người chịu trách nhiệm chấp nhận rủi ro."], ["E", "Xác định các tài sản mà lần triển khai có liên quan, cùng với mức độ nhạy cảm của từng tài sản."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Liệt kê các tác nhân đe dọa (threat actor) và vectơ tấn công (attack vector) liên quan đến lần triển khai.; Xác định các tài sản mà lần triển khai có liên quan, cùng với mức độ nhạy cảm của từng tài sản.\n\nCần biết tài sản và độ nhạy để xác định cái gì có thể bị hại, đồng thời liệt kê tác nhân và đường tấn công để xác định hại xảy ra bằng cách nào. Khi đã có hai danh mục này mới ghép mối đe dọa với tài sản và ước lượng khả năng, tác động một cách có căn cứ.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Đề xuất các biện pháp giảm thiểu và việc chấp nhận rủi ro tồn dư cho những rủi ro còn lại sau khi phân tích.**: Đề xuất giảm thiểu và chấp nhận rủi ro còn lại cần biết rủi ro nào đáng xử lý, nên thuộc sau bước phân tích được hỏi.\n- **Đề xuất các biện pháp giảm thiểu và việc chấp nhận rủi ro tồn dư cho những rủi ro còn lại.**: Khuyến nghị giảm thiểu và chấp nhận phần rủi ro còn lại cũng là đầu ra sau đánh giá, không cung cấp danh mục ban đầu để đánh giá.\n- **Ghi lại kết quả đánh giá gồm các rủi ro, biện pháp giảm thiểu, rủi ro tồn dư và người chịu trách nhiệm chấp nhận rủi ro.**: Hồ sơ kết quả và người nhận rủi ro cần dựa trên kết quả phân tích; lập chúng không thay cho nhận diện tài sản và đường tấn công.\n\n**Tham khảo:**\n\n- [NIST AI RMF Core](https://airc.nist.gov/airmf-resources/airmf/5-sec-core/)"}, {"n": 20, "set": 1, "i": 20, "multi": true, "answer": ["C", "D"], "en": {"stem": "A senior architect is managing stakeholder expectations for a Claude-based reporting assistant midway through\ndevelopment.\n\nStakeholders have escalating concerns about response latency.\n\nWhich two actions most directly address stakeholder expectation alignment in this situation? (Select two.)", "opts": [["A", "Replace the current Claude model with a third-party model that may offer lower latency without evaluation."], ["B", "Pause all development and reallocate engineering resources entirely to latency optimization."], ["C", "Present measured p50 and p95 latency baselines against the agreed SLA thresholds so stakeholders have accurate data."], ["D", "Revise the SLA definition collaboratively with stakeholders if current targets are not achievable given production constraints."], ["E", "Communicate that latency concerns are a known LLM limitation and outside the architecture team's control."]]}, "vi": {"stem": "Một kiến trúc sư cấp cao đang quản lý kỳ vọng của các bên liên quan đối với một trợ lý báo cáo dựa trên Claude khi quá trình phát triển đang ở giữa chừng. Các bên liên quan ngày càng lo ngại về độ trễ phản hồi (latency).\n\nHai hành động nào giải quyết trực tiếp nhất việc thống nhất kỳ vọng của các bên liên quan trong tình huống này? (Chọn hai.)", "opts": [["A", "Thay model Claude hiện tại bằng một model của bên thứ ba có thể cho latency thấp hơn mà không cần đánh giá."], ["B", "Tạm dừng toàn bộ việc phát triển và dồn toàn bộ nguồn lực kỹ thuật sang tối ưu latency."], ["C", "Trình bày các mốc latency p50 và p
