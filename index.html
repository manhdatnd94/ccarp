g một message trước khi nó được gửi tới Claude**: Token counting đo dung lượng message, không chỉ vị trí câu nguồn.\n- **Files API, tải lên và quản lý tài liệu để chúng không cần được gửi lại cùng mọi yêu cầu**: Files API quản lý upload và tham chiếu file, không tự tạo citation chính xác.\n\n**Cần xem lại:** Citations là đáp án capability tổng quát; Search results cũng có thể thỏa yêu cầu trong RAG. Đề cần nói rõ tài liệu citable trực tiếp hay retrieved search-result blocks để phân biệt chắc chắn.\n\n**Tham khảo:**\n\n- [Citations](https://platform.claude.com/docs/en/build-with-claude/citations)\n- [Search results](https://platform.claude.com/docs/en/build-with-claude/search-results)"}, {"n": 159, "set": 4, "i": 33, "multi": false, "answer": ["A"], "en": {"stem": "A customer support tooling vendor still runs Claude Haiku 3.5 in a legacy component and receives Anthropic's notice that the model is retired outside of Bedrock and Google Cloud.\n\nTheir engineering stakeholders want to know how this affects their committed timeline.\n\nWhat is the accurate expectation to set?", "opts": [["A", "Direct API and other non-Bedrock/Vertex-hosted traffic on Haiku 3.5 must migrate to a supported model before retirement, while deployments specifically on Bedrock or Google Cloud can keep running it under those platforms' own timelines"], ["B", "The retirement notice only affects new customers who sign up after the announcement date, so the vendor's existing production traffic is permanently exempt regardless of hosting platform"], ["C", "Retirement notices apply uniformly across every hosting platform including Bedrock and Google Cloud, so all deployments of Haiku 3.5 everywhere must migrate by the same date"], ["D", "Model retirement only restricts access to the Console UI for prompting Haiku 3.5, while direct Messages API traffic on any platform continues indefinitely unaffected"]]}, "vi": {"stem": "Một nhà cung cấp công cụ hỗ trợ khách hàng vẫn đang chạy Claude Haiku 3.5 trong một thành phần cũ (legacy) và nhận được thông báo từ Anthropic rằng model này đã ngừng hoạt động (retired) bên ngoài Bedrock và Google Cloud.\n\nCác bên liên quan phía kỹ thuật của họ muốn biết điều này ảnh hưởng thế nào đến tiến độ đã cam kết.\n\nKỳ vọng chính xác cần thiết lập là gì?", "opts": [["A", "Lưu lượng gọi API trực tiếp và các lưu lượng khác không được host trên Bedrock/Vertex dùng Haiku 3.5 phải chuyển sang một model được hỗ trợ trước thời điểm ngừng hoạt động, trong khi các triển khai cụ thể trên Bedrock hoặc Google Cloud có thể tiếp tục chạy model này theo lịch trình riêng của các nền tảng đó"], ["B", "Thông báo ngừng hoạt động chỉ ảnh hưởng đến khách hàng mới đăng ký sau ngày công bố, nên lưu lượng production hiện có của nhà cung cấp được miễn trừ vĩnh viễn bất kể nền tảng host"], ["C", "Thông báo ngừng hoạt động áp dụng đồng loạt trên mọi nền tảng host, kể cả Bedrock và Google Cloud, nên mọi triển khai Haiku 3.5 ở mọi nơi đều phải chuyển đổi trước cùng một ngày"], ["D", "Việc ngừng hoạt động model chỉ hạn chế truy cập giao diện Console để prompt Haiku 3.5, trong khi lưu lượng Messages API trực tiếp trên mọi nền tảng vẫn tiếp tục vô thời hạn mà không bị ảnh hưởng"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Lưu lượng gọi API trực tiếp và các lưu lượng khác không được host trên Bedrock/Vertex dùng Haiku 3.5 phải chuyển sang một model được hỗ trợ trước thời điểm ngừng hoạt động, trong khi các triển khai cụ thể trên Bedrock hoặc Google Cloud có thể tiếp tục chạy model này theo lịch trình riêng của các nền tảng đó\n\nRetirement yêu cầu traffic thuộc nền tảng áp dụng chuyển sang model được hỗ trợ trước hạn; khách hàng cũ không được miễn vĩnh viễn. Với Haiku 3.5, cần phân biệt Claude API với Bedrock và các dạng Google Cloud theo lịch từng nhà cung cấp. Cụm Google Cloud trong lựa chọn quá rộng để cam kết mọi deployment tiếp tục chạy.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Thông báo ngừng hoạt động chỉ ảnh hưởng đến khách hàng mới đăng ký sau ngày công bố, nên lưu lượng production hiện có của nhà cung cấp được miễn trừ vĩnh viễn bất kể nền tảng host**: Khách hàng đang dùng vẫn chịu lifecycle model, không có miễn trừ vĩnh viễn vì đã production.\n- **Thông báo ngừng hoạt động áp dụng đồng loạt trên mọi nền tảng host, kể cả Bedrock và Google Cloud, nên mọi triển khai Haiku 3.5 ở mọi nơi đều phải chuyển đổi trước cùng một ngày**: Các nền tảng có lịch phục vụ riêng; không được áp một ngày duy nhất mà chưa kiểm tra.\n- **Việc ngừng hoạt động model chỉ hạn chế truy cập giao diện Console để prompt Haiku 3.5, trong khi lưu lượng Messages API trực tiếp trên mọi nền tảng vẫn tiếp tục vô thời hạn mà không bị ảnh hưởng**: Retirement có thể dừng Messages API cho model, không chỉ ẩn Console UI.\n\n**Cần xem lại:** Lựa chọn nguồn nói Google Cloud quá rộng. Docs hiện phân biệt Google-managed và Anthropic-managed trên Google Cloud; kiểm tra nền tảng, model ID và ngày ngừng trước khi dùng câu.\n\n**Tham khảo:**\n\n- [Model deprecations](https://platform.claude.com/docs/en/about-claude/model-deprecations)"}, {"n": 160, "set": 4, "i": 34, "multi": false, "answer": ["A"], "en": {"stem": "Two months after a customer support assistant goes live, the operations team notices their monthly Claude spend has grown faster than ticket volume and wants to identify which workspace and model combination is driving the increase.\n\nWhich monitoring approach addresses this?", "opts": [["A", "Query the Usage and Cost Admin API grouped by workspace and model to reconcile spend against token consumption"], ["B", "Re-run the original evaluation set from the design phase to check whether output quality has regressed"], ["C", "Increase the agent's allowed_tools scope so it can investigate its own billing records directly"], ["D", "Ask the support team to manually count tickets handled per day and compare that figure to the invoice total"]]}, "vi": {"stem": "Hai tháng sau khi một trợ lý hỗ trợ khách hàng đi vào vận hành, nhóm vận hành nhận thấy chi phí Claude hằng tháng tăng nhanh hơn khối lượng ticket và muốn xác định tổ hợp workspace và model nào đang gây ra mức tăng này.\n\nCách giám sát nào giải quyết được vấn đề này?", "opts": [["A", "Truy vấn Usage and Cost Admin API, nhóm theo workspace và model, để đối chiếu chi phí với lượng token tiêu thụ"], ["B", "Chạy lại tập đánh giá ban đầu từ giai đoạn thiết kế để kiểm tra xem chất lượng đầu ra có bị suy giảm hay không"], ["C", "Mở rộng phạm vi allowed_tools của agent để nó có thể tự điều tra trực tiếp hồ sơ thanh toán của chính mình"], ["D", "Yêu cầu nhóm hỗ trợ đếm thủ công số ticket được xử lý mỗi ngày và so sánh con số đó với tổng hóa đơn"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Truy vấn Usage and Cost Admin API, nhóm theo workspace và model, để đối chiếu chi phí với lượng token tiêu thụ\n\nUsage and Cost Admin API cho phép đối chiếu lượng token và chi phí theo workspace/model qua thời gian. Usage có thể group theo model và workspace; cost dùng workspace và description chứa trường model. So số liệu cùng kỳ và phân trang đầy đủ để tìm nhánh tăng chi tiêu.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Chạy lại tập đánh giá ban đầu từ giai đoạn thiết kế để kiểm tra xem chất lượng đầu ra có bị suy giảm hay không**: Chạy lại eval kiểm tra chất lượng, không phân bổ spend theo workspace và model.\n- **Mở rộng phạm vi allowed_tools của agent để nó có thể tự điều tra trực tiếp hồ sơ thanh toán của chính mình**: Nới tool agent không cần thiết để vận hành báo cáo billing và tăng quyền ngoài phạm vi.\n- **Yêu cầu nhóm hỗ trợ đếm thủ công số ticket được xử lý mỗi ngày và so sánh con số đó với tổng hóa đơn**: Đếm ticket chỉ cho mẫu số workload, không tách token hoặc model gây tăng chi phí.\n\n**Tham khảo:**\n\n- [Usage and Cost API](https://platform.claude.com/docs/en/manage-claude/usage-cost-api)"}, {"n": 161, "set": 4, "i": 35, "multi": false, "answer": ["A"], "en": {"stem": "A team is documenting the caching architecture for a service where the same large system prompt and tool definitions are sent with nearly every request.\n\nThe implementation guidance needs to explain how to cut repeated processing cost and latency for that static content.\n\nWhat should the guidance recommend?", "opts": [["A", "Mark the reusable system prompt and tool definitions as cached blocks so repeated requests reuse the prefix instead of reprocessing it."], ["B", "Increase the context window to 1M tokens so the large system prompt fits entirely without ever needing to be truncated across requests."], ["C", "Move the system prompt into the Files API so it uploads once and Claude re-reads it fresh from storage on every single request."], ["D", "Enable batch processing so every request carrying the large system prompt is queued and billed at half price automatically."]]}, "vi": {"stem": "Một nhóm đang viết tài liệu về kiến trúc caching cho một dịch vụ, trong đó cùng một system prompt lớn và các định nghĩa tool được gửi kèm gần như mọi yêu cầu.\n\nHướng dẫn triển khai cần giải thích cách cắt giảm chi phí xử lý lặp lại và độ trễ cho phần nội dung tĩnh đó.\n\nHướng dẫn nên khuyến nghị điều gì?", "opts": [["A", "Đánh dấu system prompt và các định nghĩa tool có thể tái sử dụng là các block được cache để các yêu cầu lặp lại tái sử dụng tiền tố (prefix) thay vì xử lý lại nó."], ["B", "Tăng context window lên 1M token để system prompt lớn vừa trọn vẹn mà không bao giờ cần bị cắt bớt qua các yêu cầu."], ["C", "Chuyển system prompt vào Files API để nó được tải lên một lần và Claude đọc lại nó từ kho lưu trữ ở mỗi yêu cầu."], ["D", "Bật batch processing để mọi yêu cầu mang system prompt lớn được đưa vào hàng đợi và tự động tính phí ở mức một nửa giá."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Đánh dấu system prompt và các định nghĩa tool có thể tái sử dụng là các block được cache để các yêu cầu lặp lại tái sử dụng tiền tố (prefix) thay vì xử lý lại nó.\n\nĐặt cache breakpoint cho prefix gồm tool definitions và system prompt ổn định để các request sau có thể đọc cache. Cache hit giảm tính toán lặp của phần giống nhau; hiệu quả còn phụ thuộc prefix khớp, thời hạn và điều kiện cache của model.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Tăng context window lên 1M token để system prompt lớn vừa trọn vẹn mà không bao giờ cần bị cắt bớt qua các yêu cầu.**: Context window lớn chỉ cho chứa nhiều token, không làm xử lý prefix miễn phí.\n- **Chuyển system prompt vào Files API để nó được tải lên một lần và Claude đọc lại nó từ kho lưu trữ ở mỗi yêu cầu.**: Files API tránh upload lặp, không đồng nghĩa tái sử dụng tính toán system prompt.\n- **Bật batch processing để mọi yêu cầu mang system prompt lớn được đưa vào hàng đợi và tự động tính phí ở mức một nửa giá.**: Batch có discount khi dùng endpoint batch, không tự cache và không tự áp cho mọi request thường.\n\n**Tham khảo:**\n\n- [Prompt caching](https://platform.claude.com/docs/en/build-with-claude/prompt-caching)"}, {"n": 162, "set": 4, "i": 36, "multi": false, "answer": ["A"], "en": {"stem": "Your coding-agent product is exceeding its latency budget on Claude Opus 4.8.\n\nBefore proposing a switch to a smaller model, a colleague suggests first tuning the effort parameter.\n\nHow should you frame this trade-off to the team?", "opts": [["A", "Adjusting effort trades intelligence for latency and cost within the same model; lowering it from the default may recover budget without the accuracy loss that comes from switching to a different, less capable model."], ["B", "The effort parameter governs only tool-call count per turn, not the model's raw inference latency, so the team should focus on switching to a smaller model that fits the latency budget for the coding-agent product."], ["C", "Effort on Claude Opus 4.8 can only be increased, never decreased, which prevents the team from lowering latency through this parameter; therefore, the migration to a model family that offers a tunable effort floor is the correct path to meet the latency budget."], ["D", "Effort tuning is only available via the Claude API, not in Claude Code, so the coding-agent product cannot lower latency this way; the team should switch to a model family with native effort controls in Claude Code."]]}, "vi": {"stem": "Sản phẩm coding agent của bạn đang vượt ngân sách độ trễ (latency budget) trên Claude Opus 4.8.\n\nTrước khi đề xuất chuyển sang một model nhỏ hơn, một đồng nghiệp gợi ý trước tiên hãy tinh chỉnh tham số effort.\n\nBạn nên trình bày sự đánh đổi này với nhóm như thế nào?", "opts": [["A", "Điều chỉnh effort là đánh đổi mức độ thông minh lấy độ trễ và chi phí trong cùng một model; hạ nó xuống dưới mức mặc định có thể lấy lại ngân sách mà không bị mất độ chính xác như khi chuyển sang một model khác kém năng lực hơn."], ["B", "Tham số effort chỉ điều chỉnh số lệnh gọi tool mỗi lượt, không phải độ trễ suy luận thô của model, nên nhóm nên tập trung vào việc chuyển sang một model nhỏ hơn phù hợp với ngân sách độ trễ của sản phẩm coding agent."], ["C", "Effort trên Claude Opus 4.8 chỉ có thể tăng, không bao giờ giảm, điều này khiến nhóm không thể giảm độ trễ thông qua tham số này; do đó, chuyển sang một dòng model (model family) có mức effort tối thiểu điều chỉnh được là con đường đúng để đáp ứng ngân sách độ trễ."], ["D", "Tinh chỉnh effort chỉ khả dụng qua Claude API, không có trong Claude Code, nên sản phẩm coding agent không thể giảm độ trễ theo cách này; nhóm nên chuyển sang một dòng model có sẵn khả năng điều khiển effort gốc trong Claude Code."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Điều chỉnh effort là đánh đổi mức độ thông minh lấy độ trễ và chi phí trong cùng một model; hạ nó xuống dưới mức mặc định có thể lấy lại ngân sách mà không bị mất độ chính xác như khi chuyển sang một model khác kém năng lực hơn.\n\nTuning effort giữ cùng model nhưng thay lượng tài nguyên nó dành cho suy luận, từ đó có thể giảm latency và cost trước khi đổi model. Với Opus 4.8 có thể hạ effort; phải benchmark chất lượng tác vụ coding vì hạ effort vẫn có đánh đổi năng lực, không có bảo đảm giữ nguyên accuracy.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Tham số effort chỉ điều chỉnh số lệnh gọi tool mỗi lượt, không phải độ trễ suy luận thô của model, nên nhóm nên tập trung vào việc chuyển sang một model nhỏ hơn phù hợp với ngân sách độ trễ của sản phẩm coding agent.**: Effort ảnh hưởng suy luận và token, không chỉ giới hạn số tool call.\n- **Effort trên Claude Opus 4.8 chỉ có thể tăng, không bao giờ giảm, điều này khiến nhóm không thể giảm độ trễ thông qua tham số này; do đó, chuyển sang một dòng model (model family) có mức effort tối thiểu điều chỉnh được là con đường đúng để đáp ứng ngân sách độ trễ.**: Effort có thể giảm; không chỉ được tăng lên.\n- **Tinh chỉnh effort chỉ khả dụng qua Claude API, không có trong Claude Code, nên sản phẩm coding agent không thể giảm độ trễ theo cách này; nhóm nên chuyển sang một dòng model có sẵn khả năng điều khiển effort gốc trong Claude Code.**: Claude Code cũng có điều khiển effort trên model hỗ trợ; API-only là khẳng định sai.\n\n**Tham khảo:**\n\n- [Effort](https://platform.claude.com/docs/en/build-with-claude/effort)\n- [Model configuration](https://code.claude.com/docs/en/model-config)"}, {"n": 163, "set": 4, "i": 37, "multi": false, "answer": ["A"], "en": {"stem": "A solutions architect is designing the initial rollout of Claude Code for a mid-size company with no existing device management.\n\nThe company has developers on unmanaged laptops, wants centralized visibility into token spend, and needs org-wide policy to reach both local sessions and Claude Code on the web.\n\nWhich set of decisions correctly matches each requirement to the right mechanism? (Select 3)", "opts": [["A", "Choose Claude for Teams or Enterprise as the API provider so Claude Code and claude.ai share one per-seat subscription with no infrastructure to run"], ["B", "Use server-managed settings delivered from the claude.ai admin console, since it reaches both local and web sessions without requiring MDM"], ["C", "Use the usage dashboard at claude.ai/analytics/claude-code for centralized spend visibility, available on Claude for Teams and Enterprise plans"], ["D", "Deploy a plist-based managed-settings policy through macOS MDM as the primary policy channel, since it is the strongest enforcement mechanism available"], ["E", "Rely exclusively on project-level .claude/settings.json files committed to each repository to establish organization-wide policy"], ["F", "Configure Amazon Bedrock as the API provider so the company can use server-managed settings for centralized policy delivery"]]}, "vi": {"stem": "Một kiến trúc sư giải pháp đang thiết kế đợt triển khai ban đầu của Claude Code cho một công ty quy mô vừa chưa có hệ thống quản lý thiết bị (device management) nào.\n\nCông ty có các developer dùng laptop không được quản lý, muốn có khả năng quan sát tập trung về chi phí token, và cần chính sách toàn tổ chức áp dụng cho cả các phiên cục bộ lẫn Claude Code on the web.\n\nTập quyết định nào ghép đúng từng yêu cầu với cơ chế phù hợp? (Chọn ba.)", "opts": [["A", "Chọn Claude for Teams hoặc Enterprise làm API provider để Claude Code và claude.ai dùng chung một gói thuê bao theo từng người dùng (per-seat), không cần vận hành hạ tầng"], ["B", "Dùng server-managed settings được phân phối từ admin console của claude.ai, vì cơ chế này áp dụng cho cả phiên cục bộ lẫn phiên web mà không cần MDM"], ["C", "Dùng usage dashboard tại claude.ai/analytics/claude-code để quan sát tập trung chi phí, khả dụng trên các gói Claude for Teams và Enterprise"], ["D", "Triển khai chính sách managed-settings dựa trên plist qua macOS MDM làm kênh chính sách chính, vì đây là cơ chế cưỡng chế mạnh nhất hiện có"], ["E", "Chỉ dựa vào các file .claude/settings.json cấp project được commit vào từng repository để thiết lập chính sách toàn tổ chức"], ["F", "Cấu hình Amazon Bedrock làm API provider để công ty có thể dùng server-managed settings cho việc phân phối chính sách tập trung"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Chọn Claude for Teams hoặc Enterprise làm API provider để Claude Code và claude.ai dùng chung một gói thuê bao theo từng người dùng (per-seat), không cần vận hành hạ tầng\n\nTeams/Enterprise cho phép nhóm dùng Claude Code qua tài khoản tổ chức mà không phải tự vận hành hạ tầng cung cấp model. Server-managed settings là kênh phù hợp cho laptop không MDM và cloud sessions, nhưng phụ thuộc account, quyền quản trị và hỗ trợ nền tảng. Đề yêu cầu ba nhưng chỉ khóa một; analytics cũng cần phân biệt hoạt động với token/spend thực tế.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Dùng server-managed settings được phân phối từ admin console của claude.ai, vì cơ chế này áp dụng cho cả phiên cục bộ lẫn phiên web mà không cần MDM**: Server-managed settings phù hợp yêu cầu local và web khi đủ điều kiện, nên là đáp án hợp lệ cần duyệt bổ sung.\n- **Dùng usage dashboard tại claude.ai/analytics/claude-code để quan sát tập trung chi phí, khả dụng trên các gói Claude for Teams và Enterprise**: Analytics có thể cho usage tập trung, nhưng không được giả định mọi plan/credential đều có token và spend đầy đủ; cần duyệt wording và số đáp án.\n- **Triển khai chính sách managed-settings dựa trên plist qua macOS MDM làm kênh chính sách chính, vì đây là cơ chế cưỡng chế mạnh nhất hiện có**: MDM chưa có trong tổ chức và policy trên endpoint không tự tới cloud session.\n- **Chỉ dựa vào các file .claude/settings.json cấp project được commit vào từng repository để thiết lập chính sách toàn tổ chức**: File project chia sẻ mặc định theo repo, không thay chính sách tổ chức bắt buộc trên mọi session.\n- **Cấu hình Amazon Bedrock làm API provider để công ty có thể dùng server-managed settings cho việc phân phối chính sách tập trung**: Bedrock không phải cơ chế cấp điều kiện server-managed settings qua tài khoản claude.ai.\n\n**Cần xem lại:** Đề yêu cầu ba nhưng khóa chỉ chọn Teams/Enterprise. Server-managed settings phù hợp có điều kiện; analytics dashboard không tự bảo đảm số liệu token/cost đầy đủ. Cần sửa wording và duyệt số lượng đáp án theo credential/platform hiện tại; giữ nguyên khóa nguồn.\n\n**Tham khảo:**\n\n- [Server-managed settings](https://code.claude.com/docs/en/server-managed-settings)\n- [Track team usage with analytics](https://code.claude.com/docs/en/analytics)", "review": {"verdict": "missing", "key": ["A", "B", "C"], "conf": "trung bình", "note": "Đề 'Select 3' nhưng khóa chỉ có A. B đúng: server-managed settings dành cho tổ chức không có MDM và docs khuyên dùng cho cloud sessions vì endpoint-managed settings không tới được. C là lựa chọn thứ ba hợp lý (dashboard claude.ai/analytics/claude-code cho Teams/Enterprise), dù docs cho thấy dashboard này chủ yếu là usage metrics, spend chi tiết lấy qua spend report/OTel. D/E/F sai (không có MDM, project settings không phải policy tổ chức, Bedrock bỏ qua server-managed settings).", "src": ["https://code.claude.com/docs/en/server-managed-settings", "https://code.claude.com/docs/en/analytics"]}}, {"n": 164, "set": 4, "i": 38, "multi": false, "answer": ["A"], "en": {"stem": "A platform team is wiring Claude Code into a locked-down CI pipeline where no human is available to approve prompts, and only a pre-approved set of tools defined in permission rules should ever run.\n\nWhich permission mode fits this pipeline?", "opts": [["A", "dontAsk mode, which auto-denies anything not covered by an explicit allow rule"], ["B", "acceptEdits mode, which auto-approves file edits and common filesystem commands"], ["C", "plan mode, which restricts Claude to reads and a proposed plan with no execution"], ["D", "auto mode, which relies on a classifier to approve most actions in real time"]]}, "vi": {"stem": "Một nhóm nền tảng đang tích hợp Claude Code vào một pipeline CI bị khóa chặt (locked-down), nơi không có ai để phê duyệt các yêu cầu xác nhận (prompt), và chỉ một tập tool đã được phê duyệt trước, định nghĩa trong các permission rule, mới được phép chạy.\n\nPermission mode nào phù hợp với pipeline này?", "opts": [["A", "Chế độ dontAsk, tự động từ chối mọi thứ không nằm trong một allow rule tường minh"], ["B", "Chế độ acceptEdits, tự động phê duyệt các thao tác sửa file và các lệnh filesystem thông dụng"], ["C", "Chế độ plan, giới hạn Claude ở thao tác đọc và đề xuất kế hoạch, không thực thi"], ["D", "Chế độ auto, dựa vào một bộ phân loại (classifier) để phê duyệt hầu hết hành động theo thời gian thực"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Chế độ dontAsk, tự động từ chối mọi thứ không nằm trong một allow rule tường minh\n\ndontAsk tự từ chối hành động vốn cần hỏi quyền khi không được cho phép, nên phù hợp nhất cho CI không có người trả lời. Tuy nhiên “chỉ explicit allow mới chạy” là mô tả quá tuyệt đối: hành động vốn không cần approval và một số cơ chế phê duyệt khác vẫn có thể chạy. Allowlist tuyệt đối cần chính sách công cụ/sandbox riêng.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Chế độ acceptEdits, tự động phê duyệt các thao tác sửa file và các lệnh filesystem thông dụng**: acceptEdits cho qua sửa file theo mode, không giới hạn mọi hành động vào allowlist đã duyệt.\n- **Chế độ plan, giới hạn Claude ở thao tác đọc và đề xuất kế hoạch, không thực thi**: plan không phù hợp pipeline cần thực thi các tool đã được phép.\n- **Chế độ auto, dựa vào một bộ phân loại (classifier) để phê duyệt hầu hết hành động theo thời gian thực**: auto dùng classifier để xét hành động, không giữ ranh giới chỉ các quy tắc cho phép tĩnh.\n\n**Cần xem lại:** Mô tả chỉ tool có allow rule mới chạy là quá chặt so với docs hiện tại: reads và hành động không cần approval vẫn chạy; mods còn có thể approve. Kiểm tra policy/sandbox riêng nếu cần allowlist tuyệt đối.\n\n**Tham khảo:**\n\n- [Configure permissions](https://code.claude.com/docs/en/permissions)"}, {"n": 165, "set": 4, "i": 39, "multi": false, "answer": ["B"], "en": {"stem": "During a long debugging session, Claude Code raises \"Autocompact is thrashing: the context refilled to the limit...\" immediately after automatic compaction completes, and it stops retrying.\n\nThe team was asking Claude to read an entire 40,000-line production log file to find the root cause of an outage.\n\nWhat is the most effective way to recover and continue the investigation?", "opts": [["A", "Raise CLAUDE_CODE_MAX_RETRIES so Claude Code keeps retrying compaction until the log file finishes loading successfully."], ["B", "Ask Claude to read the log file in smaller chunks, such as a specific line range, or delegate the analysis to a subagent instead."], ["C", "Set DISABLE_AUTO_COMPACT so Claude Code stops summarizing history and keeps the entire log output available for reference."], ["D", "Run /clear to discard the conversation, then paste only the final error line from the log file into a fresh session."]]}, "vi": {"stem": "Trong một phiên debug dài, Claude Code báo lỗi \"Autocompact is thrashing: the context refilled to the limit...\" ngay sau khi quá trình compaction tự động hoàn tất, và ngừng thử lại.\n\nNhóm đang yêu cầu Claude đọc toàn bộ một file log production dài 40,000 dòng để tìm nguyên nhân gốc của một sự cố ngừng dịch vụ (outage).\n\nCách hiệu quả nhất để khôi phục và tiếp tục điều tra là gì?", "opts": [["A", "Tăng CLAUDE_CODE_MAX_RETRIES để Claude Code tiếp tục thử lại compaction cho đến khi file log được nạp xong thành công."], ["B", "Yêu cầu Claude đọc file log theo từng phần nhỏ hơn, chẳng hạn một khoảng dòng cụ thể, hoặc thay vào đó ủy quyền việc phân tích cho một subagent."], ["C", "Đặt DISABLE_AUTO_COMPACT để Claude Code ngừng tóm tắt lịch sử và giữ toàn bộ đầu ra log để tham chiếu."], ["D", "Chạy /clear để bỏ cuộc hội thoại, rồi chỉ dán dòng lỗi cuối cùng từ file log vào một phiên mới."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Yêu cầu Claude đọc file log theo từng phần nhỏ hơn, chẳng hạn một khoảng dòng cụ thể, hoặc thay vào đó ủy quyền việc phân tích cho một subagent.\n\nĐọc log theo khoảng dòng hoặc lọc phần liên quan giới hạn lượng dữ liệu mỗi lần vào context. Subagent có thể xử lý phần riêng rồi trả kết luận ngắn. Cả hai sửa nguyên nhân refilling ngay sau compact: một kết quả tool quá lớn lại lấp đầy context.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Tăng CLAUDE_CODE_MAX_RETRIES để Claude Code tiếp tục thử lại compaction cho đến khi file log được nạp xong thành công.**: Tăng retry không giảm kích thước log và không sửa vòng compact rồi đầy lại.\n- **Đặt DISABLE_AUTO_COMPACT để Claude Code ngừng tóm tắt lịch sử và giữ toàn bộ đầu ra log để tham chiếu.**: Tắt compact không tăng context window; giữ toàn bộ log vẫn gặp giới hạn.\n- **Chạy /clear để bỏ cuộc hội thoại, rồi chỉ dán dòng lỗi cuối cùng từ file log vào một phiên mới.**: Clear có thể tạo chỗ, nhưng chỉ giữ dòng cuối làm mất chuỗi sự kiện cần điều tra nguyên nhân.\n\n**Tham khảo:**\n\n- [Connect Claude Code to tools via MCP](https://code.claude.com/docs/en/mcp)\n- [Troubleshooting](https://code.claude.com/docs/en/troubleshooting)"}, {"n": 166, "set": 4, "i": 40, "multi": false, "answer": ["A"], "en": {"stem": "A team's project relies on an internal MCP server for ticket lookups.\n\nRunning /mcp shows the server status as connected, but Claude reports it has no tools available from that server and cannot look up tickets.\n\nWhat is the correct next step to diagnose the failure?", "opts": [["A", "Select Reconnect for the server from /mcp, and if the tool count stays at zero, run claude --debug mcp to see the server's stderr output."], ["B", "Edit .mcp.json to change the server's command from a relative path to an absolute path, since a relative path always prevents any tools from loading."], ["C", "Approve the server from /mcp again, since project-scoped MCP servers silently stop returning tools after the one-time approval expires."], ["D", "Restart Claude Code with claude --safe-mode, since a server that reports zero tools while connected is always disabled under safe mode."]]}, "vi": {"st // ---------- tiny markdown renderer ----------
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function inline(s) {
  return s.split(/(`[^`]+`)/).map((p, i) => i % 2 ? "<code>" + p.slice(1, -1) + "</code>" :
    p.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
     .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[^*\w])\*(?!\s)([^*]+?)\*(?!\w)/g, "$1<i>$2</i>")).join("");
}
function md(src) {
  const lines = esc(src || "").split("\n"), out = [];
  let para = [], list = null, m;
  const flushP = () => { if (para.length) out.push("<p>" + para.map(inline).join("<br>") + "</p>"); para = []; };
  const flushL = () => {
    if (list) out.push("<" + list.tag + (list.start > 1 ? ' start="' + list.start + '"' : "") + ">" +
      list.items.map(it => "<li>" + it.map(inline).join("<br>") + "</li>").join("") + "</" + list.tag + ">");
    list = null;
  };
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (l.trim().startsWith("```")) {
      flushP(); flushL();
      const buf = [];
      while (++i < lines.length && !lines[i].trim().startsWith("```")) buf.push(lines[i]);
      out.push("<pre><code>" + buf.join("\n") + "</code></pre>");
    } else if (!l.trim()) { flushP(); flushL(); }
    else if ((m = l.match(/^#{1,6}\s+(.*)/))) { flushP(); flushL(); out.push("<h4>" + inline(m[1]) + "</h4>"); }
    else if ((m = l.match(/^\s*[-*]\s+(.*)/)) || (m = l.match(/^\s*(\d+)\.\s+(.*)/))) {
      const tag = m.length > 2 ? "ol" : "ul";
      flushP();
      if (!list || list.tag !== tag) { flushL(); list = { tag, start: tag === "ol" ? +m[1] : 1, items: [] }; }
      list.items.push([m[m.length - 1]]);
    } else if (list) list.items[list.items.length - 1].push(l);
    else para.push(l);
  }
  flushP(); flushL();
  return out.join("");
}

// find highlight ranges in one text string
function hlFind(text, lang, isStem, atStart) {
  const out = [];
  for (const r of HLR) {
    if (!!r.stem !== isStem) continue;
    if (r.start && !atStart) continue;
    const re = lang === "en" ? r.reEn : r.reVi; re.lastIndex = 0;
    let m;
    while ((m = re.exec(text))) {
      const s = m.index + m[1].length, e = s + m[2].length;
      if (e > s) out.push({ s: s, e: e, r: r });
      if (re.lastIndex === m.index) re.lastIndex++;

  }
  out.sort((a, b) => a.s - b.s || (b.e - b.s) - (a.e - a.s));
  const res = []; let end = -1;
  for (const x of out) if (x.s >= end) { res.push(x); end = x.e; }
  return res;
}

function hlNode(root, lang, isStem, correct) {
  const hits = [];

  const nodes = []; let n;
  while ((n = walker.nextNode())) {
    let p = n.parentNode, skip = false;
    while (p && p !== root) { if (/^(CODE|PRE|A|MARK)$/.test(p.nodeName)) { skip = true; break; } p = p.parentNode; }
    if (!skip && n.nodeValue.trim()) nodes.push(n);

  nodes.forEach((node, idx) => {

    if (!ranges.length) return;
    const frag = document.createDocumentFragment(); let pos = 0;
    ranges.forEach(x => {
      if (x.s > pos) frag.appendChild(document.createTextNode(text.slice(pos, x.s)));
      let cls = x.r.cls, title = x.r.name;
      if (correct && (cls === "warn" || cls === "trap")) { cls = "protect"; title = x.r.name + " — xuất hiện ở đáp án đúng: ràng buộc mang tính bảo vệ"; }

  const states = L.map(i => cellState(Q[i])), c = k => states.filter(x => x === k).length;
  const nbm = L.filter(i => isBm(Q[i].n)).length;
  $("stats").innerHTML = '<div class="ok">Đúng<b>' + c("ok") + '</b></div><div class="bad">Sai<b>' + c("bad") +
    "</b></div><div>Đã xem đáp án<b>" + c("rev") + "</b></div><div>Chưa làm<b>" + c("") + "</b></div>";
  const mf = S.mapFilter || "all";
  $("mapf").innerHTML = [["all", "Tất cả", L.length], ["bad", "Sai", c("bad")], ["ok", "Đúng", c("ok")], ["todo", "Chưa làm", c("")], ["bm", "★", nbm]]
    .map(([k, t, n]) => '<button data-mf="' + k + '" class="' + (k === mf ? "on" : "") + '">' + t + " (" + n + ")</button>").join("");
  $("grid").innerHTML = L.map((i, j) => {
    const s = states[j];
    if (mf === "bm" ? !isBm(Q[i].n) : (mf !== "all" && s !== (mf === "todo" ? "" : mf))) return "";
    return '<button class="cell ' + s + (i === S.pos ? " cur" : "") + (Q[i].review ? " warn" : "") + (isBm(Q[i].n) ? " bm" : "") +
      '" data-i="' + i + '" title="Câu ' + Q[i].n + (isBm(Q[i].n) ? " (đã bookmark)" : "") + '">' + Q[i].n + "</button>";
  }).join("") || '<span class="small">Không có câu nào.</span>';
  if (mq("(min-width:1001px)")) { const cur = document.querySelector(".cell.cur"); if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: "nearest" }); }
}

function pick(l) {
  const q = Q[S.pos], s = st(q);
  if (s.checked || s.revealed) return;
  if (ans(q).length > 1) s.sel = s.sel.includes(l) ? s.sel.filter(x => x !== l) : [...s.sel, l].sort();
  else s.sel = [l];
  render();
}
function go(d) {
  const L = list(), k = L.indexOf(S.pos) + d;
  if (k >= 0 && k < L.length) { S.pos = L[k]; bmSticky = null; render(); scrollTo(0, 0); }
}

document.addEventListener("click", e => {
  const o = e.target.closest(".opt");
  if (o) return pick(o.dataset.l);
  const cell = e.target.closest(".cell");
  if (cell) { S.pos = +cell.dataset.i; bmSticky = null; render(); scrollTo(0, 0); return; }
  const bb = e.target.closest("[data-bm]");
  if (bb) {
    if (bb.dataset.bm === "exit") openBm(false);
    else if (bb.dataset.bm === "clear") {
      if (bb.dataset.armed) { S.bm = []; bmSticky = null; toast("Đã xóa hết bookmark"); openBm(false); }
      else { bb.dataset.armed = "1"; bb.textContent = "Bấm lần nữa để xóa hết"; bb.style.borderColor = "var(--bad)"; }
    }
    return;
  }
  const f = e.target.closest("[data-mf]");
  if (f) { S.mapFilter = f.dataset.mf; render(); }
});
document.addEventListener("keydown", e => {
  const t = e.target;
  const is = sel => !!(t && t.matches && t.matches(sel));
  if (is("input,select")) return;
  if (e.key === "ArrowLeft") go(-1);
  else if (e.key === "ArrowRight") go(1);
  else if ((e.key === "b" || e.key === "B") && !e.metaKey && !e.ctrlKey && !e.altKey) toggleBm();
  else if ((e.key === "Enter" || e.key === " ") && is(".opt")) { e.preventDefault(); pick(t.dataset.l); }
  else if ((e.key === "Enter" || e.key === " ") && !is("a, header button, aside button, summary")) {
    // Enter / Space: grade the current answer, or move on once it has been graded/revealed
    e.preventDefault();
    const s = st(Q[S.pos]);
    if (s.checked || s.revealed) go(1);
    else if (s.sel.length) $("check").click();
  }
});
$("prev").onclick = () => go(-1);
$("next").onclick = $("next2").onclick = () => go(1);
$("filter").onchange = e => {
  const v = +e.target.value;
  if (v === BM_MODE) return openBm(true);
  bmSticky = null; S.filter = v; S.pos = list()[0]; render();
};
$("bmk").onclick = toggleBm;
$("bmopen").onclick = () => openBm(S.filter !== BM_MODE);
$("jump").onchange = e => {
  const L = list(), k = Math.min(Math.max(1, parseInt(e.target.value) || 1), L.length);
  S.pos = L[k - 1]; bmSticky = null; render();
};
$("check").onclick = () => {
  const q = Q[S.pos], s = st(q);
  if (!s.sel.length) return;
  s.checked = true; s.correct = sameSet(s.sel, ans(q)); render();
};
$("useReview").onchange = e => { S.useReview = e.target.checked; render(); };
$("reveal").onclick = () => { st(Q[S.pos]).revealed = true; render(); };
$("redo").onclick = () => { delete S.q[Q[S.pos].n]; render(); };
let resetArm = null;
$("reset").onclick = () => {
  const b = $("reset");
  if (!resetArm) {
    b.textContent = "Bấm lần nữa để xóa"; b.style.borderColor = "var(--bad)";
    resetArm = setTimeout(() => { resetArm = null; b.textContent = "Xóa tiến độ"; b.style.borderColor = ""; }, 3000);
    return;
  }
  clearTimeout(resetArm); resetArm = null; b.textContent = "Xóa tiến độ"; b.style.borderColor = "";
  S = Object.assign(fresh(), { useReview: S.useReview, showVi: S.showVi, timer: S.timer, bm: S.bm }); bmSticky = null; render(); scrollTo(0, 0);
};
$("showVi").onchange = e => { S.showVi = e.target.checked; render(); };

// ---------- timer: count-up stopwatch or 90-minute countdown (like the real exam) ----------
const T = () => S.timer;
const elapsed = () => T().acc + (T().start ? Date.now() - T().start : 0);
const fmt = ms => { const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60;
  return (h ? h + ":" : "") + String(m).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };
function tick() {
  const t = T(), e = elapsed(), limit = t.mode === "up" ? 0 : +t.mode * 60000;
  if (limit && e >= limit && t.start) {  // countdown finished
    t.acc = limit; t.start = null;
    if (!t.alerted) { t.alerted = true; save(); try { navigator.vibrate && navigator.vibrate(300); } catch (e) {} }
  }
  const shown = limit ? Math.max(0, limit - elapsed()) : elapsed();
  $("clock").textContent = fmt(shown);
  $("clock").classList.toggle("over", !!limit && shown === 0);
  $("tstart").textContent = t.start ? "⏸" : "▶";
  $("tmode").value = t.mode;
  const done = doneCount() - (t.base || 0);  // questions finished since the clock was reset
  $("pace").textContent = (limit && shown === 0) ? "⏰ Hết giờ!" : done > 0 && elapsed() > 0 ? "TB " + Math.round(elapsed() / done / 1000) + "s/câu" : "";
}
const doneCount = () => Object.values(S.q).filter(x => x.checked || x.revealed).length;
const newTimer = mode => ({ mode, acc: 0, start: null, alerted: false, base: doneCount() });
$("tstart").onclick = () => {
  const t = T();
  if (t.start) { t.acc += Date.now() - t.start; t.start = null; }
  else if (!(t.mode !== "up" && t.acc >= +t.mode * 60000)) t.start = Date.now();
  save(); tick();
};
$("treset").onclick = () => { S.timer = newTimer(T().mode); save(); tick(); };
$("tmode").onchange = e => { S.timer = newTimer(e.target.value); save(); tick(); };
setInterval(tick, 500);
tick();
if (mq("(max-width:1000px)")) $("mapbox").open = false;  // collapsed by default on narrow screens
render();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
