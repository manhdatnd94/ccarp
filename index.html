 đức ở những đầu ra vượt quá một ngưỡng độ tin cậy (confidence) của model đã xác định."], ["E", "Xác nhận rằng các mục tiêu về latency và thông lượng (throughput) được đáp ứng trên các nhóm người dùng được hỗ trợ."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Xác minh rằng đầu ra không dựa vào những khái quát hóa về con người mà dữ liệu nền tảng không hỗ trợ.; Xác nhận rằng các quyết định có tác động lớn vẫn giữ trách nhiệm giải trình của con người thay vì quy trách nhiệm cho model.\n\nKiểm tra khái quát hóa thiếu bằng chứng giúp phát hiện định kiến có thể ảnh hưởng con người. Giữ người chịu trách nhiệm với quyết định tác động lớn bảo đảm có chủ thể giải trình, xem xét khiếu nại và sửa quyết định; không thể đẩy trách nhiệm sang mô hình. Hai mục tập trung trực tiếp vào tác động đạo đức của đầu ra và quyền quyết định.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Xác nhận rằng các điều khoản cấp phép của nhà cung cấp cho phép việc sử dụng model trong production theo kế hoạch.**: Giấy phép production là kiểm tra pháp lý và mua sắm cần thiết, nhưng riêng quyền sử dụng sản phẩm chưa đánh giá tính công bằng hay trách nhiệm đối với người bị tác động.\n- **Chỉ giới hạn việc rà soát đạo đức ở những đầu ra vượt quá một ngưỡng độ tin cậy (confidence) của model đã xác định.**: Chỉ xem đầu ra có confidence cao bỏ sót tác hại ở đầu ra không chắc chắn; confidence không quyết định mức cần rà soát đạo đức.\n- **Xác nhận rằng các mục tiêu về latency và thông lượng (throughput) được đáp ứng trên các nhóm người dùng được hỗ trợ.**: Latency và throughput đo hiệu năng; chúng hữu ích cho chất lượng dịch vụ nhưng không trực tiếp kiểm tra định kiến và trách nhiệm quyết định trong đề.\n\n**Tham khảo:**\n\n- [NIST AI Risks and Trustworthiness](https://airc.nist.gov/airmf-resources/airmf/3-sec-characteristics/)"}, {"n": 45, "set": 1, "i": 45, "multi": true, "answer": ["B", "D"], "en": {"stem": "A Claude architect at a health services organization is defining evaluation metrics for a clinical-summary pipeline.\n\nThe pipeline must remain within a per-query cost ceiling and must never surface patient data to unauthorized\nroles.\n\nWhich two metrics directly address these requirements? (Select two.)", "opts": [["A", "BLEU score computed against a human-annotated reference summary set"], ["B", "Role-based access-control enforcement rate measured on a red-team dataset"], ["C", "Throughput measured as successful requests processed per minute"], ["D", "Per-query token cost measured against the defined cost ceiling"], ["E", "Response latency at the 95th percentile across a one-week sample window"]]}, "vi": {"stem": "Một kiến trúc sư Claude tại một tổ chức dịch vụ y tế đang xác định các metric đánh giá cho một pipeline tóm tắt lâm sàng. Pipeline phải nằm trong mức trần chi phí cho mỗi truy vấn và tuyệt đối không được để lộ dữ liệu bệnh nhân cho các vai trò không được ủy quyền.\n\nHai metric nào giải quyết trực tiếp các yêu cầu này? (Chọn hai.)", "opts": [["A", "Điểm BLEU tính trên một tập tóm tắt tham chiếu do con người chú thích"], ["B", "Tỷ lệ thực thi kiểm soát truy cập dựa trên vai trò, đo trên một bộ dữ liệu red-team"], ["C", "Thông lượng, đo bằng số yêu cầu được xử lý thành công mỗi phút"], ["D", "Chi phí token mỗi truy vấn, đo so với mức trần chi phí đã xác định"], ["E", "Độ trễ phản hồi ở phân vị thứ 95 trong một khoảng mẫu kéo dài một tuần"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Tỷ lệ thực thi kiểm soát truy cập dựa trên vai trò, đo trên một bộ dữ liệu red-team; Chi phí token mỗi truy vấn, đo so với mức trần chi phí đã xác định\n\nTỷ lệ cưỡng chế RBAC trên dữ liệu red-team đo việc các vai trò không được phép có bị chặn khi cố lấy hồ sơ hay không. Chi phí token từng truy vấn đối chiếu trần đo đúng ràng buộc tiền trên mỗi yêu cầu. Hai metric nối trực tiếp với bảo mật truy cập và ngân sách; tỷ lệ đạt cao trên tập thử vẫn không chứng minh “không bao giờ” rò rỉ trong mọi tình huống.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Điểm BLEU tính trên một tập tóm tắt tham chiếu do con người chú thích**: BLEU đo tương đồng với bản tóm tắt tham chiếu, không đo quyền người nhận hoặc tiền token đã chi.\n- **Thông lượng, đo bằng số yêu cầu được xử lý thành công mỗi phút**: Throughput cho biết xử lý được bao nhiêu yêu cầu mỗi phút; hệ thống có thể nhanh nhưng vượt ngân sách hoặc cấp dữ liệu sai quyền.\n- **Độ trễ phản hồi ở phân vị thứ 95 trong một khoảng mẫu kéo dài một tuần**: p95 latency cho biết tốc độ phần đuôi phân bố, không trực tiếp xác minh truy cập hợp lệ hay trần chi phí từng truy vấn.\n\n**Tham khảo:**\n\n- [HHS: Summary of the HIPAA Security Rule](https://www.hhs.gov/hipaa/for-professionals/security/laws-regulations/index.html)\n- [Define success criteria and build evaluations](https://platform.claude.com/docs/en/test-and-evaluate/develop-tests)"}, {"n": 46, "set": 1, "i": 46, "multi": true, "answer": ["A", "E"], "en": {"stem": "The compliance team has authored a regulatory disclosure procedure that must be applied identically across\ncustomer service, sales, and onboarding workflows.\n\nThe procedure changes when regulators issue updates,\ncurrently four to six times per year.\n\nYou are designing how the procedure will be packaged for use by Claude\nacross all three workflows.\n\nWhich two design decisions should you include? (Select two.)\nEach correct answer presents part of the solution.", "opts": [["A", "Package the procedure as a Claude Skill owned directly by the compliance team."], ["B", "Embed the procedure text into each workflow's system prompt at integration time."], ["C", "Store the procedure in a shared retrieval corpus accessed by all three workflows."], ["D", "Have each workflow team rewrite the procedure for its own context."], ["E", "Reference the same Claude Skill from all three workflow integrations."]]}, "vi": {"stem": "Nhóm tuân thủ (compliance) đã soạn một quy trình công bố thông tin theo quy định, quy trình này phải được áp dụng giống hệt nhau trong các workflow dịch vụ khách hàng, bán hàng và onboarding. Quy trình thay đổi mỗi khi cơ quan quản lý ban hành cập nhật, hiện là bốn đến sáu lần mỗi năm. Bạn đang thiết kế cách đóng gói quy trình này để Claude sử dụng trên cả ba workflow.\n\nBạn nên đưa vào hai quyết định thiết kế nào? (Chọn hai.)\nMỗi đáp án đúng là một phần của giải pháp.", "opts": [["A", "Đóng gói quy trình dưới dạng một Claude Skill do chính nhóm compliance sở hữu."], ["B", "Nhúng văn bản quy trình vào system prompt của từng workflow tại thời điểm tích hợp."], ["C", "Lưu quy trình trong một kho dữ liệu truy xuất (retrieval corpus) dùng chung mà cả ba workflow đều truy cập."], ["D", "Để nhóm phụ trách mỗi workflow tự viết lại quy trình cho bối cảnh của riêng mình."], ["E", "Tham chiếu cùng một Claude Skill từ cả ba tích hợp workflow."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Đóng gói quy trình dưới dạng một Claude Skill do chính nhóm compliance sở hữu.; Tham chiếu cùng một Claude Skill từ cả ba tích hợp workflow.\n\nMột Skill do compliance sở hữu tập trung quy trình và trách nhiệm cập nhật ở đúng nhóm chuyên môn. Cho cả ba workflow tham chiếu cùng nội dung hoặc phiên bản đã phê duyệt giảm nguy cơ ba bản sao lệch nhau sau mỗi lần đổi quy định. Vẫn cần quản lý phân phối phiên bản và kiểm thử; dùng chung Skill không tự bảo đảm mô hình áp dụng mọi bước giống hệt.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Nhúng văn bản quy trình vào system prompt của từng workflow tại thời điểm tích hợp.**: Nhúng một bản quy trình vào từng system prompt tạo ba điểm phải sửa, dễ để sót workflow khi quy định đổi nhiều lần mỗi năm.\n- **Lưu quy trình trong một kho dữ liệu truy xuất (retrieval corpus) dùng chung mà cả ba workflow đều truy cập.**: Kho retrieval chung có thể cung cấp nội dung quy trình và là thiết kế khả thi, nhưng truy xuất tài liệu không tự đóng gói bước thực hiện, ví dụ và cách áp dụng nhất quán như Skill.\n- **Để nhóm phụ trách mỗi workflow tự viết lại quy trình cho bối cảnh của riêng mình.**: Để mỗi nhóm viết lại làm tăng khác biệt diễn giải dù quy trình bắt buộc phải thống nhất; compliance mất một nguồn nội dung chuẩn.\n\n**Tham khảo:**\n\n- [Agent Skills](https://platform.claude.com/docs/en/agents-and-tools/agent-skills/overview)"}, {"n": 47, "set": 1, "i": 47, "multi": false, "answer": ["A"], "en": {"stem": "You are defining when to introduce a project subagent versus relying on Claude Code's general capabilities.\n\nWhich scenario most directly justifies a dedicated subagent?", "opts": [["A", "The team has a recurring specialized task, such as database schema review, that requires a focused system prompt, narrow tool permissions, and a specific model selection across many sessions."], ["B", "The team has a one-time ad hoc question that will not recur and does not require a focused system prompt, narrow tool permissions, or dedicated model selection."], ["C", "The team has no recurring specialized tasks and uses Claude Code only for isolated general-purpose work that does not justify a dedicated system prompt or tool scope."], ["D", "The team wants every Claude Code interaction to use the same generic system prompt with no task- specific specialization, narrow tool permissions, or dedicated model selection."]]}, "vi": {"stem": "Bạn đang xác định khi nào nên đưa vào một subagent cấp project thay vì dựa vào các năng lực chung của Claude Code.\n\nTình huống nào biện minh trực tiếp nhất cho một subagent chuyên biệt?", "opts": [["A", "Nhóm có một tác vụ chuyên biệt lặp lại, chẳng hạn như rà soát database schema, đòi hỏi một system prompt tập trung, quyền tool hẹp và một lựa chọn model cụ thể qua nhiều phiên."], ["B", "Nhóm có một câu hỏi phát sinh một lần, sẽ không lặp lại và không đòi hỏi system prompt tập trung, quyền tool hẹp hay lựa chọn model chuyên biệt."], ["C", "Nhóm không có tác vụ chuyên biệt lặp lại nào và chỉ dùng Claude Code cho các công việc đa dụng riêng lẻ, không đủ để biện minh cho một system prompt hay phạm vi tool chuyên biệt."], ["D", "Nhóm muốn mọi tương tác với Claude Code đều dùng cùng một system prompt chung chung, không có chuyên biệt hóa theo tác vụ, quyền tool hẹp hay lựa chọn model chuyên biệt."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Nhóm có một tác vụ chuyên biệt lặp lại, chẳng hạn như rà soát database schema, đòi hỏi một system prompt tập trung, quyền tool hẹp và một lựa chọn model cụ thể qua nhiều phiên.\n\nRà soát schema cơ sở dữ liệu lặp lại qua nhiều phiên cần một vai trò chuyên môn có prompt, công cụ và model riêng. Subagent đóng gói đúng các lựa chọn đó để tái sử dụng trong project, đồng thời tách ngữ cảnh của nhiệm vụ chuyên biệt khỏi công việc chung.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Nhóm có một câu hỏi phát sinh một lần, sẽ không lặp lại và không đòi hỏi system prompt tập trung, quyền tool hẹp hay lựa chọn model chuyên biệt.**: Một câu hỏi một lần không cần prompt hoặc quyền riêng chưa tạo lợi ích rõ ràng để duy trì cấu hình subagent chuyên dụng.\n- **Nhóm không có tác vụ chuyên biệt lặp lại nào và chỉ dùng Claude Code cho các công việc đa dụng riêng lẻ, không đủ để biện minh cho một system prompt hay phạm vi tool chuyên biệt.**: Không có nhiệm vụ chuyên biệt lặp lại thì thiếu nhu cầu tái sử dụng vai trò mà subagent giải quyết.\n- **Nhóm muốn mọi tương tác với Claude Code đều dùng cùng một system prompt chung chung, không có chuyên biệt hóa theo tác vụ, quyền tool hẹp hay lựa chọn model chuyên biệt.**: Muốn mọi tương tác dùng cùng prompt tổng quát đi ngược lý do tách vai trò chuyên môn và quyền công cụ của subagent.\n\n**Tham khảo:**\n\n- [Create custom subagents](https://code.claude.com/docs/en/sub-agents)"}, {"n": 48, "set": 1, "i": 48, "multi": false, "answer": ["B"], "en": {"stem": "You are evaluating an evaluation set used to score a Claude-based hiring-support tool.\n\nThe set is drawn from one\ngeographic region and one tenure band.\n\nWhich response is most appropriate?", "opts": [["A", "Discard all quantitative evaluation and replace it with qualitative impressions collected from a small, convenience-selected group that may not represent the tool's full user population."], ["B", "Expand the evaluation set to cover the geographic regions and tenure bands the tool will serve, and rescore the system on the expanded set before broader release."], ["C", "Reduce the evaluation set further to a single demographic subgroup to simplify score interpretation, narrowing coverage rather than expanding it to match the intended user population."], ["D", "Continue using the narrow evaluation set drawn from one region and one tenure band because the existing benchmark scores are already high on that subset."]]}, "vi": {"stem": "Bạn đang đánh giá một tập đánh giá (evaluation set) được dùng để chấm điểm một công cụ hỗ trợ tuyển dụng dựa trên Claude. Tập này được lấy từ một khu vực địa lý và một nhóm thâm niên duy nhất.\n\nCách phản hồi nào phù hợp nhất?", "opts": [["A", "Loại bỏ toàn bộ đánh giá định lượng và thay bằng các ấn tượng định tính thu thập từ một nhóm nhỏ được chọn theo sự thuận tiện, có thể không đại diện cho toàn bộ tập người dùng của công cụ."], ["B", "Mở rộng tập đánh giá để bao quát các khu vực địa lý và nhóm thâm niên mà công cụ sẽ phục vụ, và chấm điểm lại hệ thống trên tập đã mở rộng trước khi phát hành rộng hơn."], ["C", "Thu hẹp tập đánh giá hơn nữa xuống chỉ một nhóm nhân khẩu học để đơn giản hóa việc diễn giải điểm số, làm hẹp độ bao phủ thay vì mở rộng để khớp với tập người dùng dự kiến."], ["D", "Tiếp tục dùng tập đánh giá hẹp lấy từ một khu vực và một nhóm thâm niên vì điểm benchmark hiện tại trên tập con đó đã cao."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Mở rộng tập đánh giá để bao quát các khu vực địa lý và nhóm thâm niên mà công cụ sẽ phục vụ, và chấm điểm lại hệ thống trên tập đã mở rộng trước khi phát hành rộng hơn.\n\nTập đánh giá phải bao phủ vùng địa lý và nhóm thâm niên mà công cụ tuyển dụng sẽ phục vụ để phát hiện sai khác ngoài nhóm hiện tại. Chấm lại trước khi mở rộng giúp kiểm tra liệu chất lượng có chuyển sang dân số mục tiêu hay điểm cao chỉ phản ánh một lát dữ liệu hẹp.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Loại bỏ toàn bộ đánh giá định lượng và thay bằng các ấn tượng định tính thu thập từ một nhóm nhỏ được chọn theo sự thuận tiện, có thể không đại diện cho toàn bộ tập người dùng của công cụ.**: Ý kiến định tính từ một nhóm tiện chọn có thể bổ sung bối cảnh nhưng thay toàn bộ đo định lượng vẫn không sửa tính đại diện và mất khả năng so sánh.\n- **Thu hẹp tập đánh giá hơn nữa xuống chỉ một nhóm nhân khẩu học để đơn giản hóa việc diễn giải điểm số, làm hẹp độ bao phủ thay vì mở rộng để khớp với tập người dùng dự kiến.**: Thu hẹp thêm vào một nhóm nhân khẩu làm tăng vùng chưa được kiểm tra thay vì bao phủ người dùng dự kiến.\n- **Tiếp tục dùng tập đánh giá hẹp lấy từ một khu vực và một nhóm thâm niên vì điểm benchmark hiện tại trên tập con đó đã cao.**: Điểm cao trên một vùng và một nhóm thâm niên chỉ chứng minh kết quả của lát đó; chưa có cơ sở suy rộng ra nhóm chưa thử.\n\n**Tham khảo:**\n\n- [NIST AI Risks and Trustworthiness](https://airc.nist.gov/airmf-resources/airmf/3-sec-characteristics/)\n- [NIST AI RMF Core](https://airc.nist.gov/airmf-resources/airmf/5-sec-core/)"}, {"n": 49, "set": 1, "i": 49, "multi": false, "answer": ["A"], "en": {"stem": "During an architectural review, the security team identifies a risk that adversarial content injected into retrieved\ndocuments could manipulate the model's behavior.\n\nWhich mitigation most directly addresses this threat?", "opts": [["A", "Treat all retrieved content as untrusted input and apply input classifiers with output validation."], ["B", "Require citations for each claim and constrain responses to source-supported content."], ["C", "Restrict outbound tool calls to an approved destination allow-list."], ["D", "Score outputs against a stable adversarial evaluation set on each model-version change."]]}, "vi": {"stem": "Trong một buổi rà soát kiến trúc, nhóm bảo mật xác định rủi ro nội dung đối kháng được chèn vào các tài liệu truy xuất có thể thao túng hành vi của model.\n\nBiện pháp giảm thiểu nào giải quyết trực tiếp nhất mối đe dọa này?", "opts": [["A", "Coi mọi nội dung truy xuất là đầu vào không đáng tin cậy và áp dụng bộ phân loại đầu vào kết hợp với xác thực đầu ra."], ["B", "Yêu cầu trích dẫn cho mỗi khẳng định và giới hạn phản hồi trong nội dung được nguồn hỗ trợ."], ["C", "Giới hạn các lệnh gọi tool ra bên ngoài trong một danh sách đích được phê duyệt (allow-list)."], ["D", "Chấm điểm đầu ra trên một tập đánh giá đối kháng ổn định mỗi khi thay đổi phiên bản model."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Coi mọi nội dung truy xuất là đầu vào không đáng tin cậy và áp dụng bộ phân loại đầu vào kết hợp với xác thực đầu ra.\n\nCoi tài liệu truy xuất là dữ liệu không đáng tin ngăn nó được mặc nhiên xem như lệnh điều khiển. Classifier đầu vào có thể nhận diện chỉ dẫn cài cắm; kiểm tra đầu ra bổ sung một điểm chặn nếu mô hình vẫn làm theo. Đây là xử lý trực tiếp đường prompt injection qua tài liệu, dù không phải bảo đảm phát hiện mọi cuộc tấn công.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Yêu cầu trích dẫn cho mỗi khẳng định và giới hạn phản hồi trong nội dung được nguồn hỗ trợ.**: Trích dẫn và giới hạn theo nguồn giúp grounding, nhưng nguồn độc hại vẫn có thể chứa lệnh thao túng; trích dẫn không phân biệt dữ liệu với quyền ra lệnh.\n- **Giới hạn các lệnh gọi tool ra bên ngoài trong một danh sách đích được phê duyệt (allow-list).**: Allow-list đích ra ngoài giảm một đường exfiltration nhưng injection cũng có thể sửa câu trả lời hoặc thao tác nội bộ, nên biện pháp này hẹp hơn mối đe dọa.\n- **Chấm điểm đầu ra trên một tập đánh giá đối kháng ổn định mỗi khi thay đổi phiên bản model.**: Adversarial evaluation phát hiện hồi quy qua phiên bản nhưng không phải kiểm soát khi tài liệu độc hại cụ thể đi qua pipeline sản xuất.\n\n**Tham khảo:**\n\n- [Mitigate jailbreaks and prompt injections](https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/mitigate-jailbreaks)"}, {"n": 50, "set": 1, "i": 50, "multi": false, "answer": ["C"], "en": {"stem": "You are responding to a stakeholder request that adds significant scope to a deployment already in flight.\n\nWhich response best aligns expectations while respecting the stakeholder's underlying need?", "opts": [["A", "Hide the scope-addition request from the broader delivery team to avoid a difficult conversation, allowing the change to proceed without team awareness of its timeline implications."], ["B", "Decline the request outright without acknowledging the stakeholder's underlying need or offering alternatives such as deferral, descoping, or timeline extension."], ["C", "Acknowledge the request, describe the scope and timeline implications transparently, and propose options- defer it, descope something else, or extend the timeline-for the stakeholder to choose."], ["D", "Accept the additional scope into the current release without describing the timeline or descoping implications, allowing the delivery plan to absorb unacknowledged changes until they surface as delays."]]}, "vi": {"stem": "Bạn đang phản hồi một yêu cầu của bên liên quan làm tăng đáng kể phạm vi của một hệ thống đang trong quá trình triển khai.\n\nCách phản hồi nào thống nhất kỳ vọng tốt nhất trong khi vẫn tôn trọng nhu cầu thực sự của bên liên quan?", "opts": [["A", "Che giấu yêu cầu bổ sung phạm vi khỏi nhóm triển khai rộng hơn để tránh một cuộc trao đổi khó khăn, để thay đổi diễn ra mà nhóm không biết về tác động của nó tới tiến độ."], ["B", "Từ chối thẳng yêu cầu mà không ghi nhận nhu cầu thực sự của bên liên quan hay đưa ra các phương án thay thế như hoãn lại, cắt giảm phạm vi hoặc gia hạn tiến độ."], ["C", "Ghi nhận yêu cầu, mô tả minh bạch các tác động tới phạm vi và tiến độ, và đề xuất các phương án — hoãn lại, cắt giảm một hạng mục khác, hoặc gia hạn tiến độ — để bên liên quan lựa chọn."], ["D", "Chấp nhận phạm vi bổ sung vào bản phát hành hiện tại mà không mô tả các tác động về tiến độ hay cắt giảm phạm vi, để kế hoạch triển khai hấp thụ các thay đổi không được ghi nhận cho đến khi chúng lộ ra dưới dạng chậm trễ."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Ghi nhận yêu cầu, mô tả minh bạch các tác động tới phạm vi và tiến độ, và đề xuất các phương án — hoãn lại, cắt giảm một hạng mục khác, hoặc gia hạn tiến độ — để bên liên quan lựa chọn.\n\nThừa nhận nhu cầu rồi nêu rõ tác động phạm vi và thời hạn cho phép stakeholder lựa chọn có thông tin: hoãn yêu cầu, bỏ bớt phần khác hoặc dời mốc. Cách này giữ mục tiêu kinh doanh trong cuộc trao đổi và biến đánh đổi nguồn lực thành quyết định minh bạch cho đội triển khai.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Che giấu yêu cầu bổ sung phạm vi khỏi nhóm triển khai rộng hơn để tránh một cuộc trao đổi khó khăn, để thay đổi diễn ra mà nhóm không biết về tác động của nó tới tiến độ.**: Giấu yêu cầu khiến đội không thể điều chỉnh kế hoạch hay báo phụ thuộc, nên sai lệch kỳ vọng chỉ xuất hiện khi đã trễ.\n- **Từ chối thẳng yêu cầu mà không ghi nhận nhu cầu thực sự của bên liên quan hay đưa ra các phương án thay thế như hoãn lại, cắt giảm phạm vi hoặc gia hạn tiến độ.**: Từ chối ngay không tìm hiểu nhu cầu hoặc đề xuất đánh đổi có thể bỏ cơ hội đáp ứng bằng lịch hay phạm vi khác.\n- **Chấp nhận phạm vi bổ sung vào bản phát hành hiện tại mà không mô tả các tác động về tiến độ hay cắt giảm phạm vi, để kế hoạch triển khai hấp thụ các thay đổi không được ghi nhận cho đến khi chúng lộ ra dưới dạng chậm trễ.**: Nhận thêm mà không nêu chi phí thời gian tạo cam kết ngầm không có nguồn lực tương ứng và che rủi ro giao hàng.\n\n**Tham khảo:**\n\n- [NIST AI RMF Core](https://airc.nist.gov/airmf-resources/airmf/5-sec-core/)"}, {"n": 51, "set": 1, "i": 51, "multi": true, "answer": ["A", "B"], "en": {"stem": "The compliance team at a firm has approved a Claude Skill that generates client-facing investment summaries.\n\nThe Skill includes the firm's required disclaimers and prohibited-language list.\n\nA product manager has asked\nwhether additional guardrails are needed at the application layer or whether the Skill alone is sufficient.\n\nWhich two guardrail responsibilities should remain at the application layer rather than the Skill? (Select two.) Each\ncorrect answer presents part of the solution.", "opts": [["A", "Log every generated summary to the firm's compliance audit trail for retention."], ["B", "Verify the requesting user is authorized to generate investment summaries at all."], ["C", "Format output sections according to the firm's standardized house style guidelines."], ["D", "Apply the disclaimer template that the compliance team has standardized firm-wide."], ["E", "Apply the prohibited-language list that the compliance team maintains and updates."]]}, "vi": {"stem": "Nhóm compliance tại một công ty đã phê duyệt một Claude Skill tạo các bản tóm tắt đầu tư gửi khách hàng. Skill này bao gồm các tuyên bố miễn trừ trách nhiệm (disclaimer) bắt buộc của công ty và danh sách ngôn từ bị cấm. Một product manager hỏi liệu có cần thêm guardrail ở tầng ứng dụng hay chỉ riêng Skill là đủ.\n\nHai trách nhiệm guardrail nào nên giữ ở tầng ứng dụng thay vì trong Skill? (Chọn hai.) Mỗi đáp án đúng là một phần của giải pháp.", "opts": [["A", "Ghi log mọi bản tóm tắt được tạo vào nhật ký kiểm toán tuân thủ (compliance audit trail) của công ty để lưu giữ."], ["B", "Xác minh người dùng gửi yêu cầu có được phép tạo bản tóm tắt đầu tư hay không."], ["C", "Định dạng các phần của đầu ra theo hướng dẫn văn phong chuẩn hóa của công ty."], ["D", "Áp dụng mẫu disclaimer mà nhóm compliance đã chuẩn hóa trên toàn công ty."], ["E", "Áp dụng danh sách ngôn từ bị cấm do nhóm compliance duy trì và cập nhật."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Ghi log mọi bản tóm tắt được tạo vào nhật ký kiểm toán tuân thủ (compliance audit trail) của công ty để lưu giữ.; Xác minh người dùng gửi yêu cầu có được phép tạo bản tóm tắt đầu tư hay không.\n\nXác minh người yêu cầu có quyền tạo bản tóm tắt phải dựa trên danh tính và chính sách ứng dụng, không dựa vào việc mô hình nhớ chỉ dẫn. Ghi mọi bản sinh vào audit trail cũng phải được hệ thống cưỡng chế để giữ chứng cứ ngay cả khi Skill chạy sai. Skill có thể chứa quy tắc văn phong và nội dung; kiểm tra nội dung bị cấm ở runtime vẫn cần nếu đó là nghĩa vụ bắt buộc.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Định dạng các phần của đầu ra theo hướng dẫn văn phong chuẩn hóa của công ty.**: Định dạng theo house style là hướng dẫn soạn thảo có thể đóng gói trong Skill; nó không đòi quyền truy cập hay lưu audit bắt buộc của ứng dụng.\n- **Áp dụng mẫu disclaimer mà nhóm compliance đã chuẩn hóa trên toàn công ty.**: Mẫu disclaimer chuẩn có thể là tài nguyên của Skill để tái sử dụng, nhưng ứng dụng vẫn có thể kiểm tra disclaimer đã thực sự xuất hiện trước khi công bố.\n- **Áp dụng danh sách ngôn từ bị cấm do nhóm compliance duy trì và cập nhật.**: Danh sách từ ngữ cấm có thể được compliance duy trì trong Skill, nên khóa không chọn nó làm trách nhiệm tách biệt. Tuy nhiên, mang danh sách không đồng nghĩa cưỡng chế: ứng dụng vẫn cần chặn nội dung vi phạm nếu yêu cầu là bắt buộc.\n\n**Cần xem lại:** Cách viết “rather than the Skill” dễ khiến hiểu rằng runtime không cần kiểm tra prohibited language. Khóa nguồn được giữ, nhưng cần phân biệt nội dung danh sách với trách nhiệm cưỡng chế cấm ở ứng dụng.\n\n**Tham khảo:**\n\n- [Agent Skills](https://platform.claude.com/docs/en/agents-and-tools/agent-skills/overview)\n- [Configure permissions](https://code.claude.com/docs/en/permissions)"}, {"n": 52, "set": 1, "i": 52, "multi": false, "answer": ["B"], "en": {"stem": "You are defining an SLA for a Claude-based assistant.\n\nWhich SLA definition is most operationally meaningful?", "opts": [["A", "A target tied to a stakeholder sentiment measure such as \"the team feels satisfied, \" which cannot be measured objectively or used to trigger a documented breach response."], ["B", "A measurable target with a defined metric, threshold, evaluation window, and consequence for breach- for example, \"p95 per-request latency under 800 ms over a 28-day window. \""], ["C", "A qualitative commitment such as \"the system will be fast and reliable, \" which names no metric, threshold, or evaluation window."], ["D", "A target without a defined metric, threshold, evaluation window, or breach consequence."]]}, "vi": {"stem": "Bạn đang định nghĩa một SLA cho một trợ lý dựa trên Claude.\n\nĐịnh nghĩa SLA nào có ý nghĩa vận hành nhất?", "opts": [["A", "Một mục tiêu gắn với thước đo cảm nhận của bên liên quan, chẳng hạn \"nhóm cảm thấy hài lòng\", vốn không thể đo lường khách quan hay dùng để kích hoạt một quy trình phản ứng vi phạm đã được ghi nhận."], ["B", "Một mục tiêu đo lường được với metric, ngưỡng, khoảng thời gian đánh giá và hệ quả khi vi phạm được xác định rõ — ví dụ: \"latency p95 cho mỗi yêu cầu dưới 800 ms trong khoảng 28 ngày.\""], ["C", "Một cam kết định tính như \"hệ thống sẽ nhanh và đáng tin cậy\", không nêu metric, ngưỡng hay khoảng thời gian đánh giá nào."], ["D", "Một mục tiêu không có metric, ngưỡng, khoảng thời gian đánh giá hay hệ quả khi vi phạm được xác định."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Một mục tiêu đo lường được với metric, ngưỡng, khoảng thời gian đánh giá và hệ quả khi vi phạm được xác định rõ — ví dụ: \"latency p95 cho mỗi yêu cầu dưới 800 ms trong khoảng 28 ngày.\"\n\nMột SLA dùng được phải xác định đo gì, ngưỡng nào, trong cửa sổ nào và hệ quả khi vi phạm. Mục tiêu p95 dưới 800 ms trong 28 ngày có thể kiểm tra bằng dữ liệu; để thành SLA đầy đủ, cam kết còn phải nêu hệ quả vi phạm, không chỉ chép ví dụ độ trễ.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Một mục tiêu gắn với thước đo cảm nhận của bên liên quan, chẳng hạn \"nhóm cảm thấy hài lòng\", vốn không thể đo lường khách quan hay dùng để kích hoạt một quy trình phản ứng vi phạm đã được ghi nhận.**: Cảm nhận hài lòng có thể khảo sát bằng phương pháp riêng, nhưng câu “team cảm thấy hài lòng” như viết ở đây chưa có metric, ngưỡng và phản ứng vi phạm xác định.\n- **Một cam kết định tính như \"hệ thống sẽ nhanh và đáng tin cậy\", không nêu metric, ngưỡng hay khoảng thời gian đánh giá nào.**: “Nhanh và đáng tin” không cho biết bao nhiêu mili giây, tỷ lệ nào hay khoảng thời gian nào được chấp nhận để quyết định đạt.\n- **Một mục tiêu không có metric, ngưỡng, khoảng thời gian đánh giá hay hệ quả khi vi phạm được xác định.**: Không có metric, ngưỡng, cửa sổ và hệ quả thì không thể đo vi phạm một cách lặp lại hoặc kích hoạt trách nhiệm đã thỏa thuận.\n\n**Tham khảo:**\n\n- [Google SRE: Service Level Objectives](https://sre.google/sre-book/service-level-objectives/)"}, {"n": 53, "set": 1, "i": 53, "multi": false, "answer": ["C"], "en": {"stem": "You are transitioning a Claude-based deployment from design into implementation.\n\nWhich handoff package most directly supports a clean transition?", "opts": [["A", "The most recent set of design presentation slides without component-level diagrams, interface contracts, an evaluation framework with a reference set, runbooks, or a known-limitations register."], ["B", "A verbal walkthrough conducted on the day of handoff with no written architecture overview, ADRS, omponent contracts, evaluation framework, runbooks, playbook, or known limitations."], ["C", "Architecture overview, ADRs, component contracts, evaluation framework with reference set, runbooks, on- call playbook, and known limitations."], ["D", "Source code alone with no integrating architecture overview, ADRs, component contracts, evaluation amework, runbooks, on-call playbook, or known-limitations register to support the delivery team."]]}, "vi": {"stem": "Bạn đang chuyển một hệ thống dựa trên Claude từ giai đoạn thiết kế sang giai đoạn triển khai (implementation).\n\nGói bàn giao nào hỗ trợ trực tiếp nhất cho một quá trình chuyển giao suôn sẻ?", "opts": [["A", "Bộ slide trình bày thiết kế gần nhất, không có sơ đồ cấp thành phần, hợp đồng giao tiếp (interface contract), khung đánh giá kèm tập tham chiếu, runbook hay sổ đăng ký các giới hạn đã biết."], ["B", "Một buổi hướng dẫn bằng lời vào ngày bàn giao, không có bản tổng quan kiến trúc, ADR, hợp đồng giao tiếp của thành phần, khung đánh giá, runbook, playbook hay danh sách các giới hạn đã biết dưới dạng văn bản."], ["C", "Bản tổng quan kiến trúc, ADR, hợp đồng giao tiếp của thành phần, khung đánh giá kèm tập tham chiếu, runbook, playbook trực on-call và các giới hạn đã biết."], ["D", "Chỉ mã nguồn, không có bản tổng quan kiến trúc tích hợp, ADR, hợp đồng giao tiếp của thành phần, khung đánh giá, runbook, playbook trực on-call hay sổ đăng ký các giới hạn đã biết để hỗ trợ nhóm triển khai."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Bản tổng quan kiến trúc, ADR, hợp đồng giao tiếp của thành phần, khung đánh giá kèm tập tham chiếu, runbook, playbook trực on-call và các giới hạn đã biết.\n\nGói bàn giao đầy đủ nối quyết định với thực thi: tổng quan và ADR giải thích cấu trúc, lý do chọn; hợp đồng thành phần xác định giao tiếp; khung đánh giá và reference set xác định cách chứng minh đúng. Runbook, playbook trực và giới hạn đã biết giúp đội tiếp nhận vận hành và xử lý sự cố mà không phải suy đoán các giả định bị thiếu.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Bộ slide trình bày thiết kế gần nhất, không có sơ đồ cấp thành phần, hợp đồng giao tiếp (interface contract), khung đánh giá kèm tập tham chiếu, runbook hay sổ đăng ký các giới hạn đã biết.**: Slides có thể truyền đạt tổng quan nhưng thiếu hợp đồng, tiêu chí đánh giá và cách vận hành được nêu trong lựa chọn, nên chưa đủ cho đội triển khai.\n- **Một buổi hướng dẫn bằng lời vào ngày bàn giao, không có bản tổng quan kiến trúc, ADR, hợp đồng giao tiếp của thành phần, khung đánh giá, runbook, playbook hay danh sách các giới hạn đã biết dưới dạng văn bản.**: Trao đổi miệng không để lại nguồn tra cứu ổn định về quyết định, giao tiếp và giới hạn, nên người vắng mặt hoặc nhận ca sau phải dựa trí nhớ người khác.\n- **Chỉ mã nguồn, không có bản tổng quan kiến trúc tích hợp, ADR, hợp đồng giao tiếp của thành phần, khung đánh giá, runbook, playbook trực on-call hay sổ đăng ký các giới hạn đã biết để hỗ trợ nhóm triển khai.**: Code cho biết hệ thống thực thi ra sao nhưng không thay thế lý do thiết kế, tiêu chí chấp nhận và quy trình xử lý sự cố bị thiếu.\n\n**Tham khảo:**\n\n- [Google SRE: On-Call](https://sre.google/workbook/on-call/)\n- [NIST AI RMF Core](https://airc.nist.gov/airmf-resources/airmf/5-sec-core/)"}, {"n": 54, "set": 1, "i": 54, "multi": true, "answer": ["C", "E"], "en": {"stem": "A security team is evaluating two proposed controls.\n\nControl A adds an outbound tool allow-list with destination\nrestrictions and per-call review.\n\nControl B scores responses against a stable adversarial evaluation set after each\nmodel-version change.\n\nWhich two risk categories are correctly matched to these controls? (Select two.)", "opts": [["A", "Control A - prompt injection from adversarial content in retrieved data"], ["B", "Control A - silent quality drift after a model-version upgrade"], ["C", "Control A - data exfiltration via outbound tool calls"], ["D", "Control B - data exfiltration via outbound tool calls"], ["E", "Control B - silent quality drift after a model-version upgrade"]]}, "vi": {"stem": "Một nhóm bảo mật đang đánh giá hai biện pháp kiểm soát được đề xuất. Biện pháp A bổ sung một danh sách cho phép (allow-list) cho các tool gọi ra ngoài, kèm giới hạn đích đến và rà soát từng lệnh gọi. Biện pháp B chấm điểm phản hồi trên một tập đánh giá đối kháng ổn định sau mỗi lần thay đổi phiên bản model.\n\nHai nhóm rủi ro nào được ghép đúng với các biện pháp kiểm soát này? (Chọn hai.)", "opts": [["A", "Biện pháp A - prompt injection từ nội dung đối kháng trong dữ liệu truy xuất"], ["B", "Biện pháp A - chất lượng suy giảm âm thầm (silent quality drift) sau khi nâng cấp phiên bản model"], ["C", "Biện pháp A - rò rỉ dữ liệu (data exfiltration) qua các lệnh gọi tool ra bên ngoài"], ["D", "Biện pháp B - rò rỉ dữ liệu (data exfiltration) qua các lệnh gọi tool ra bên ngoài"], ["E", "Biện pháp B - chất lượng suy giảm âm thầm (silent quality drift) sau khi nâng cấp phiên bản model"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Biện pháp A - rò rỉ dữ liệu (data exfiltration) qua các lệnh gọi tool ra bên ngoài; Biện pháp B - chất lượng suy giảm âm thầm (silent quality drift) sau khi nâng cấp phiên bản model\n\nDanh sách công cụ ra ngoài, giới hạn đích và duyệt từng lần gọi chặn đường chuyển dữ liệu tới nơi không được phép. Chấm cùng bộ kiểm thử đối kháng sau mỗi lần đổi model giúp phát hiện chất lượng an toàn suy giảm qua các phiên bản; đây là hai rủi ro được ghép trực tiếp trong đề.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Biện pháp A - prompt injection từ nội dung đối kháng trong dữ liệu truy xuất**: Ghép kiểm soát công cụ với prompt injection chỉ đúng một phần: nó có thể hạn chế hậu quả của nội dung độc hại nhưng không trực tiếp phân biệt chỉ dẫn cấy vào dữ liệu truy xuất.\n- **Biện pháp A - chất lượng suy giảm âm thầm (silent quality drift) sau khi nâng cấp phiên bản model**: Giới hạn đích gọi công cụ không đo chất lượng câu trả lời giữa hai phiên bản model.\n- **Biện pháp B - rò rỉ dữ liệu (data exfiltration) qua các lệnh gọi tool ra bên ngoài**: Bộ kiểm thử có thể phát hiện hành vi rò rỉ trong mẫu thử, nhưng không thực thi quyền truy cập đích cho các lần gọi đang chạy.\n\n**Tham khảo:**\n\n- [Mitigate jailbreaks and prompt injections](https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/mitigate-jailbreaks)\n- [Define success criteria and build evaluations](https://platform.claude.com/docs/en/test-and-evaluate/develop-tests)"}, {"n": 55, "set": 1, "i": 55, "multi": false, "answer": ["D"], "en": {"stem": "A Claude Architect is reviewing a post-deployment performance report for an Al-assisted legal-document\nsummarization system.\n\nThe report includes these observations:\n\n- Average summarization time decreased from 47 minutes to 6 minutes per document.\n- Associates spend less time on summaries, but overall billable output has not measurably changed.\n- Infrastructure costs increased by 22% because redundant retry logic generated additional API calls.\n- Some summaries require attorney correction, adding an average of 8 minutes of review per document.\n\nWhich analysis correctly attributes each observation to the appropriate business-value pillar?", "opts": [["A", "Observations 1 and 2 both indicate efficiency gains; Observation 3 is a solution-cost issue; Observation 4 is a performance-SLA issue."], ["B", "Observation 1 is a transformation outcome; Observation 2 is an efficiency gain; Observation 3 is a performance-SLA degradation; Observation 4 is a solution-cost issue."], ["C", "Observations 1 and 4 together indicate a net performance-SLA improvement; Observation 2 is a transformation gap; Observation 3 is a productivity drain from over-engineering."], ["D", "Observation 1 indicates an efficiency gain; Observation 2 shows that productivity has not yet been realized;Observation 3 is a solution-cost issue; Observation 4 is an efficiency loss that partially offsets Observation 1."]]}, "vi": {"stem": "Một Claude Architect đang rà soát báo cáo hiệu năng sau triển khai của một hệ thống tóm tắt tài liệu pháp lý có sự hỗ trợ của AI. Báo cáo gồm các quan sát sau:\n\n- Thời gian tóm tắt trung bình giảm từ 47 phút xuống 6 phút cho mỗi tài liệu.\n- Các luật sư cộng sự (associate) dành ít thời gian hơn cho việc tóm tắt, nhưng tổng sản lượng tính phí (billable output) chưa thay đổi một cách đo lường được.\n- Chi phí hạ tầng tăng 22% vì logic thử lại (retry) dư thừa đã tạo ra thêm các lệnh gọi API.\n- Một số bản tóm tắt cần luật sư chỉnh sửa, làm tăng thêm trung bình 8 phút rà soát cho mỗi tài liệu.\n\nPhân tích nào quy đúng mỗi quan sát vào trụ cột giá trị kinh doanh phù hợp?", "opts": [["A", "Quan sát 1 và 2 đều cho thấy lợi ích về hiệu suất (efficiency); Quan sát 3 là vấn đề chi phí giải pháp (solution cost); Quan sát 4 là vấn đề SLA hiệu năng (performance SLA)."], ["B", "Quan sát 1 là một kết quả chuyển đổi (transformation); Quan sát 2 là lợi ích về hiệu suất; Quan sát 3 là sự suy giảm SLA hiệu năng; Quan sát 4 là vấn đề chi phí giải pháp."], ["C", "Quan sát 1 và 4 cùng nhau cho thấy SLA hiệu năng được cải thiện ròng; Quan sát 2 là một khoảng trống về chuyển đổi; Quan sát 3 là sự hao hụt năng suất (productivity) do thiết kế quá mức (over-engineering)."], ["D", "Quan sát 1 cho thấy lợi ích về hiệu suất; Quan sát 2 cho thấy năng suất (productivity) chưa được hiện thực hóa; Quan sát 3 là vấn đề chi phí giải pháp; Quan sát 4 là sự sụt giảm hiệu suất bù trừ một phần cho Quan sát 1."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Quan sát 1 cho thấy lợi ích về hiệu suất; Quan sát 2 cho thấy năng suất (productivity) chưa được hiện thực hóa; Quan sát 3 là vấn đề chi phí giải pháp; Quan sát 4 là sự sụt giảm hiệu suất bù trừ một phần cho Quan sát 1.\n\nGiảm thời gian từ 47 xuống 6 phút là hiệu quả xử lý; chưa tăng đầu ra tính phí nghĩa là lợi ích năng suất chưa được chứng minh. Chi phí hạ tầng tăng 22% thuộc chi phí giải pháp, còn 8 phút sửa bài là lao động bổ sung làm giảm một phần thời gian tiết kiệm; không có ngưỡng SLA nào được nêu.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Quan sát 1 và 2 đều cho thấy lợi ích về hiệu suất (efficiency); Quan sát 3 là vấn đề chi phí giải pháp (solution cost); Quan sát 4 là vấn đề SLA hiệu năng (performance SLA).**: Cách phân tích này bỏ qua việc đầu ra tính phí chưa tăng và gán thời gian sửa bài thành vi phạm SLA khi đề chưa cho mục tiêu SLA.\n- **Quan sát 1 là một kết quả chuyển đổi (transformation); Quan sát 2 là lợi ích về hiệu suất; Quan sát 3 là sự suy giảm SLA hiệu năng; Quan sát 4 là vấn đề chi phí giải pháp.**: Xử lý nhanh hơn chưa chứng minh chuyển đổi cách kinh doanh; tăng tiền API là chi phí, không tự chứng minh SLA suy giảm.\n- **Quan sát 1 và 4 cùng nhau cho thấy SLA hiệu năng được cải thiện ròng; Quan sát 2 là một khoảng trống về chuyển đổi; Quan sát 3 là sự hao hụt năng suất (productivity) do thiết kế quá mức (over-engineering).**: Gộp thời gian xử lý với sửa bài có thể đo thời gian tổng, nhưng chưa có SLA để kết luận; chi phí gọi thừa vẫn phải được ghi nhận là chi phí giải pháp.\n\n**Tham khảo:**\n\n- [AI RMF Core](https://airc.nist.gov/airmf-resources/airmf/5-sec-core/)"}, {"n": 56, "set": 1, "i": 56, "multi": false, "answer": ["D"], "en": {"stem": "A Claude Architect is reviewing a post-deployment performance report for an Al-assisted legal-document summarization system. The report includes these observations:\n\n- Average summarization time decreased from 47 minutes to 6 minutes per document.\n- Associates spend less time on summaries, but overall billable output has not measurably changed.\n- Infrastructure costs increased by 22% because redundant retry logic generated additional API calls.\n- Some summaries require attorney correction, adding an average of 8 minutes of review per document.\n\nWhich analysis correctly attributes each observation to the appropriate business-value pillar?", "opts": [["A", "Observations 1 and 2 both indicate efficiency gains; Observation 3 is a solution-cost issue; Observation 4 is a performance-SLA issue."], ["B", "Observation 1 is a transformation outcome; Observation 2 is an efficiency gain; Observation 3 is a performance-SLA degradation; Observation 4 is a solution-cost issue."], ["C", "Observations 1 and 4 together indicate a net performance-SLA improvement; Observation 2 is a transformation gap; Observation 3 is a productivity drain from over-engineering."], ["D", "Observation 1 indicates an efficiency gain; Observation 2 shows that productivity has not yet been realized;Observation 3 is a solution-cost issue; Observation 4 is an efficiency loss that partially offsets Observation 1."]]}, "vi": {"stem": "Một Claude Architect đang rà soát báo cáo hiệu năng sau triển khai của một hệ thống tóm tắt tài liệu pháp lý có sự hỗ trợ của AI. Báo cáo gồm các quan sát sau:\n\n- Thời gian tóm tắt trung bình giảm từ 47 phút xuống 6 phút cho mỗi tài liệu.\n- Các luật sư cộng sự (associate) dành ít thời gian hơn cho việc tóm tắt, nhưng tổng sản lượng tính phí (billable output) chưa thay đổi một cách đo lường được.\n- Chi phí hạ tầng tăng 22% vì logic thử lại (retry) dư thừa đã tạo ra thêm các lệnh gọi API.\n- Một số bản tóm tắt cần luật sư chỉnh sửa, làm tăng thêm trung bình 8 phút rà soát cho mỗi tài liệu.\n\nPhân tích nào quy đúng mỗi quan sát vào trụ cột giá trị kinh doanh phù hợp?", "opts": [["A", "Quan sát 1 và 2 đều cho thấy lợi ích về hiệu suất (efficiency); Quan sát 3 là vấn đề chi phí giải pháp (solution cost); Quan sát 4 là vấn đề SLA hiệu năng (performance SLA)."], ["B", "Quan sát 1 là một kết quả chuyển đổi (transformation); Quan sát 2 là lợi ích về hiệu suất; Quan sát 3 là sự suy giảm SLA hiệu năng; Quan sát 4 là vấn đề chi phí giải pháp."], ["C", "Quan sát 1 và 4 cùng nhau cho thấy SLA hiệu năng được cải thiện ròng; Quan sát 2 là một khoảng trống về chuyển đổi; Quan sát 3 là sự hao hụt năng suất (productivity) do thiết kế quá mức (over-engineering)."], ["D", "Quan sát 1 cho thấy lợi ích về hiệu suất; Quan sát 2 cho thấy năng suất (productivity) chưa được hiện thực hóa; Quan sát 3 là vấn đề chi phí giải pháp; Quan sát 4 là sự sụt giảm hiệu suất bù trừ một phần cho Quan sát 1."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Quan sát 1 cho thấy lợi ích về hiệu suất; Quan sát 2 cho thấy năng suất (productivity) chưa được hiện thực hóa; Quan sát 3 là vấn đề chi phí giải pháp; Quan sát 4 là sự sụt giảm hiệu suất bù trừ một phần cho Quan sát 1.\n\nPhải phân biệt thời gian task với output kinh doanh: 6 phút sinh cộng 8 phút review vẫn giảm so 47, nhưng chưa chứng minh tăng billable output; retry thuộc chi phí giải pháp.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Quan sát 1 và 2 đều cho thấy lợi ích về hiệu suất (efficiency); Quan sát 3 là vấn đề chi phí giải pháp (solution cost); Quan sát 4 là vấn đề SLA hiệu năng (performance SLA).**: Gọi correction time là SLA không có ngưỡng cam kết hỗ trợ.\n- **Quan sát 1 là một kết quả chuyển đổi (transformation); Quan sát 2 là lợi ích về hiệu suất; Quan sát 3 là sự suy giảm SLA hiệu năng; Quan sát 4 là vấn đề chi phí giải pháp.**: Không có bằng chứng thay đổi mô hình công việc để gọi transformation.\n- **Quan sát 1 và 4 cùng nhau cho thấy SLA hiệu năng được cải thiện ròng; Quan sát 2 là một khoảng trống về chuyển đổi; Quan sát 3 là sự hao hụt năng suất (productivity) do thiết kế quá mức (over-engineering).**: Billable output chưa tăng không tự là transformation gap hay vấn đề SLA.\n\n**Tham khảo:**\n\n- [Microsoft — Architecture decision records](https://learn.microsoft.com/en-us/azure/well-architected/architect-role/architecture-decision-record)"}, {"n": 57, "set": 1, "i": 57, "multi": true, "answer": ["B", "C"], "en": {"stem": "You are listing characteristics of robust guardrail design for an enterprise deployment.\n\nWhich two characteristics belong on the list? (Select two.)\nEach correct answer presents a complete solution.", "opts": [["A", "Centralized log retention for guardrail violations with quarterly review by the security team."], ["B", "Per-role tool allow-lists enforced at the orchestration layer before any tool call executes."], ["C", "Adversarial-input coverage in the evaluation set with regression tracking on guardrail performance."], ["D", "User feedback channels that route reported guardrail failures into the product backlog for triage."], ["E", "Periodic refresh of the system prompt wording to keep refusal language current and clear."]]}, "vi": {"stem": "Bạn đang liệt kê các đặc điểm của một thiết kế guardrail vững chắc cho một hệ thống triển khai cấp doanh nghiệp.\n\nHai đặc điểm nào thuộc danh sách này? (Chọn hai.)\nMỗi đáp án đúng là một giải pháp hoàn chỉnh.", "opts": [["A", "Lưu giữ tập trung log về các vi phạm guardrail, được nhóm bảo mật rà soát hằng quý."], ["B", "Danh sách tool cho phép (allow-list) theo từng vai trò, được thực thi ở tầng điều phối trước khi bất kỳ lệnh gọi tool nào được thực thi."], ["C", "Tập đánh giá có bao phủ các đầu vào đối kháng, kèm theo dõi hồi quy về hiệu quả của guardrail."], ["D", "Các kênh phản hồi của người dùng chuyển các lỗi guardrail được báo cáo vào product backlog để phân loại xử lý."], ["E", "Định kỳ làm mới câu chữ của system prompt để giữ cho ngôn từ từ chối luôn cập nhật và rõ ràng."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Danh sách tool cho phép (allow-list) theo từng vai trò, được thực thi ở tầng điều phối trước khi bất kỳ lệnh gọi tool nào được thực thi.; Tập đánh giá có bao phủ các đầu vào đối kháng, kèm theo dõi hồi quy về hiệu quả của guardrail.\n\nThực thi allow-list theo vai trò trước khi chạy công cụ ngăn hành động vượt quyền ngay tại điểm thực thi. Bộ đánh giá có đầu vào đối kháng và theo dõi hồi quy kiểm tra được guardrail có tiếp tục hoạt động khi hệ thống đổi hay không.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Lưu giữ tập trung log về các vi phạm guardrail, được nhóm bảo mật rà soát hằng quý.**: Lưu log và duyệt hàng quý hữu ích cho kiểm toán, nhưng chỉ phát hiện sau sự kiện và không thay thế chặn hành động trước khi chạy.\n- **Các kênh phản hồi của người dùng chuyển các lỗi guardrail được báo cáo vào product backlog để phân loại xử lý.**: Phản hồi người dùng là nguồn cải tiến hợp lệ, nhưng đưa vào backlog không tự tạo kiểm soát bắt buộc hay bằng chứng kiểm thử chủ động.\n- **Định kỳ làm mới câu chữ của system prompt để giữ cho ngôn từ từ chối luôn cập nhật và rõ ràng.**: Làm rõ lời từ chối có ích, nhưng chỉ đổi câu chữ định kỳ không kiểm tra khả năng chống đầu vào đối kháng hoặc giới hạn công cụ.\n\n**Tham khảo:**\n\n- [Mitigate jailbreaks and prompt injections](https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/mitigate-jailbreaks)"}, {"n": 58, "set": 1, "i": 58, "multi": true, "answer": ["A", "D"], "en": {"stem": "A Claude architect is leading the discovery phase for a new Al-powered customer service solution.\n\nWhich two activities are characteristic of structured discovery and requirement gathering for a Claude-based\ndeployment? (Select two.)", "opts": [["A", "Facilitating stakeholder workshops to surface latency, accuracy, and compliance constraints before scoping begins. collected."], ["B", "Selecting the Claude model tier based on the architect's prior project experience before stakeholder input is"], ["C", "Generating an initial prototype and iterating based on user reaction rather than written requirements."], ["D", "Documenting explicit success criteria and failure thresholds that will gate production deployment."], ["E", "Deferring constraint documentation until the integration design phase to avoid scope creep."]]}, "vi": {"stem": "Một kiến trúc sư Claude đang dẫn dắt giai đoạn khám phá (discovery) cho một giải pháp dịch vụ khách hàng mới chạy bằng AI.\n\nHai hoạt động nào là đặc trưng của quá trình khám phá và thu thập yêu cầu có cấu trúc cho một hệ thống triển khai dựa trên Claude? (Chọn hai.)", "opts": [["A", "Tổ chức các buổi workshop với các bên liên quan để làm rõ các ràng buộc về latency, độ chính xác và tuân thủ trước khi bắt đầu xác định phạm vi."], ["B", "Chọn hạng model Claude dựa trên kinh nghiệm dự án trước đây của kiến trúc sư trước khi thu thập ý kiến của các bên liên quan."], ["C", "Tạo một prototype ban đầu và lặp cải tiến dựa trên phản ứng của người dùng thay vì các yêu cầu bằng văn bản."], ["D", "Ghi lại các tiêu chí thành công rõ ràng và các ngưỡng thất bại sẽ đóng vai trò cổng kiểm soát cho việc triển khai lên production."], ["E", "Trì hoãn việc ghi lại các ràng buộc cho đến giai đoạn thiết kế tích hợp để tránh phình phạm vi (scope creep)."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Tổ chức các buổi workshop với các bên liên quan để làm rõ các ràng buộc về latency, độ chính xác và tuân thủ trước khi bắt đầu xác định phạm vi.; Ghi lại các tiêu chí thành công rõ ràng và các ngưỡng thất bại sẽ đóng vai trò cổng kiểm soát cho việc triển khai lên production.\n\nWorkshop giúp xác định giới hạn độ trễ, độ chính xác và tuân thủ trước khi chốt phạm vi. Tiêu chí thành công cùng ngưỡng thất bại biến các mong muốn đó thành điều kiện có thể kiểm tra trước triển khai; phần câu bị hỏng trong lựa chọn cần được biên tập lại.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Chọn hạng model Claude dựa trên kinh nghiệm dự án trước đây của kiến trúc sư trước khi thu thập ý kiến của các bên liên quan.**: Chọn hạng model trước khi nghe yêu cầu dễ tối ưu theo kinh nghiệm cũ thay vì giới hạn thực tế của dự án.\n- **Tạo một prototype ban đầu và lặp cải tiến dựa trên phản ứng của người dùng thay vì các yêu cầu bằng văn bản.**: Prototype có thể giúp khám phá, nhưng thay yêu cầu đã ghi nhận bằng phản ứng người dùng khiến phạm vi và tiêu chí chấp nhận không rõ.\n- **Trì hoãn việc ghi lại các ràng buộc cho đến giai đoạn thiết kế tích hợp để tránh phình phạm vi (scope creep).**: Để đến thiết kế tích hợp mới ghi giới hạn có thể buộc phải làm lại kiến trúc hoặc phạm vi đã chốt.\n\n**Cần xem lại:** Văn bản lựa chọn workshop và lựa chọn chọn model bị đảo hoặc thiếu cụm cuối trong nguồn (“collected.” / “input is”). Ý chính vẫn xác định được; nên sửa lỗi biên tập sau khi đối chiếu PDF.\n\n**Tham khảo:**\n\n- [Define success criteria and build evaluations](https://platform.claude.com/docs/en/test-and-evaluate/develop-tests)"}, {"n": 59, "set": 1, "i": 59, "multi": false, "answer": ["B"], "en": {"stem": "You are identifying inefficiency in a Claude Code workflow where each engineer manually re-explains the project's\nconventions and architecture in every session.\n\nWhich adjustment most directly removes this inefficiency?", "opts": [["A", "Forbid the use of Claude Code on the project entirely to avoid the session-initialization overhead, accepting that the team loses all Al-assisted development productivity for this codebase."], ["B", "Capture the project's conventions and architecture in a project-scoped CLAUDE.md (or equivalent persistent project-context file) committed to the repository, so each session loads it automatically."], ["C", "Tell each engineer to retype the project conventions and architecture context more quickly at the start of eachsession, reducing time lost without eliminating the repeated manual effort."], ["D", "Remove all documented project conventions and architectural standards so engineers have nothing to re- explain at session start, accepting the loss of consistency and shared coding standards."]]}, "vi": {"stem": "Bạn đang xác định sự kém hiệu quả trong một workflow Claude Code, nơi mỗi kỹ sư phải giải thích lại thủ công các quy ước và kiến trúc của project trong mọi phiên.\n\nĐiều chỉnh nào loại bỏ trực tiếp nhất sự kém hiệu quả này?", "opts": [["A", "Cấm hoàn toàn việc dùng Claude Code trong project để tránh chi phí khởi tạo phiên, chấp nhận rằng nhóm mất toàn bộ năng suất phát triển có AI hỗ trợ cho codebase này."], ["B", "Ghi lại các quy ước và kiến trúc của project trong một tệp CLAUDE.md cấp project (hoặc một tệp ngữ cảnh project lưu bền tương đương) được commit vào repository, để mỗi phiên tự động nạp tệp đó."], ["C", "Bảo mỗi kỹ sư gõ lại ngữ cảnh về quy ước và kiến trúc của project nhanh hơn vào đầu mỗi phiên, giảm thời gian lãng phí nhưng không loại bỏ công sức thủ công lặp lại."], ["D", "Xóa bỏ mọi quy ước project và tiêu chuẩn kiến trúc đã ghi lại để kỹ sư không phải giải thích lại gì khi bắt đầu phiên, chấp nhận mất đi sự nhất quán và các tiêu chuẩn viết mã chung."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Ghi lại các quy ước và kiến trúc của project trong một tệp CLAUDE.md cấp project (hoặc một tệp ngữ cảnh project lưu bền tương đương) được commit vào repository, để mỗi phiên tự động nạp tệp đó.\n\nĐưa quy ước và kiến trúc chung vào CLAUDE.md ở cấp dự án, quản lý cùng repository, tạo nguồn chỉ dẫn được nạp cho các phiên làm việc. Nhờ vậy kỹ sư cập nhật một tài liệu chung thay vì kể lại cùng thông tin mỗi lần.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Cấm hoàn toàn việc dùng Claude Code trong project để tránh chi phí khởi tạo phiên, chấp nhận rằng nhóm mất toàn bộ năng suất phát triển có AI hỗ trợ cho codebase này.**: Cấm Claude Code loại bỏ cả công cụ hỗ trợ chứ không giải quyết cách cung cấp ngữ cảnh lặp lại.\n- **Bảo mỗi kỹ sư gõ lại ngữ cảnh về quy ước và kiến trúc của project nhanh hơn vào đầu mỗi phiên, giảm thời gian lãng phí nhưng không loại bỏ công sức thủ công lặp lại.**: Gõ nhanh hơn vẫn đòi hỏi mỗi người nhập lại và dễ tạo các phiên bản quy ước khác nhau.\n- **Xóa bỏ mọi quy ước project và tiêu chuẩn kiến trúc đã ghi lại để kỹ sư không phải giải thích lại gì khi bắt đầu phiên, chấp nhận mất đi sự nhất quán và các tiêu chuẩn viết mã chung.**: Xóa chuẩn chung làm mất tính nhất quán của dự án; vấn đề là cách nạp chuẩn, không phải sự tồn tại của chuẩn.\n\n**Tham khảo:**\n\n- [How Claude remembers your project](https://code.claude.com/docs/en/memory)"}, {"n": 60, "set": 1, "i": 60, "multi": false, "answer": ["C"], "en": {"stem": "You are integrating Al-assisted tooling into the team's documentation workflow.\n\nThe team wants generated\ndocumentation that stays grounded in the actual code.\n\nWhich integration approach best fits this requirement?", "opts": [["A", "Generate documentation from the model's training-data recall without reading any of the actual repository code, cepting that the output will not reflect the current implementation."], ["B", "Have the subagents publish generated documentation directly to the public-facing site without passing through the team's normal review workflow or any human approval step."], ["C", "Configure subagents that read the relevant code files via filesystem and code-search tools, generate the documentation, and emit changes through the team's normal review workflow."], ["D", "Disable all filesystem and code-search tools so the subagents cannot read any repository code, accepting that cumentation generation will be entirely disconnected from the actual implementation."]]}, "vi": {"stem": "Bạn đang tích hợp công cụ có AI hỗ trợ vào quy trình viết tài liệu của nhóm. Nhóm muốn tài liệu được tạo ra luôn bám sát (grounded) vào mã nguồn thực tế.\n\nCách tích hợp nào phù hợp nhất với yêu cầu này?", "opts": [["A", "Tạo tài liệu từ những gì model nhớ được trong dữ liệu huấn luyện mà không đọc bất kỳ mã nguồn thực tế nào của repository, chấp nhận rằng đầu ra sẽ không phản ánh phần triển khai hiện tại."], ["B", "Để các subagent xuất bản tài liệu được tạo trực tiếp lên trang công khai mà không đi qua quy trình rà soát thông thường của nhóm hay bất kỳ bước phê duyệt nào của con người."], ["C", "Cấu hình các subagent đọc các tệp mã liên quan thông qua các tool truy cập hệ thống tệp (filesystem) và tìm kiếm mã (code-search), tạo tài liệu, và đưa ra các thay đổi thông qua quy trình rà soát thông thường của nhóm."], ["D", "Vô hiệu hóa mọi tool filesystem và code-search để các subagent không thể đọc bất kỳ mã nào trong repository, chấp nhận rằng việc tạo tài liệu sẽ hoàn toàn tách rời khỏi phần triển khai thực tế."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Cấu hình các subagent đọc các tệp mã liên quan thông qua các tool truy cập hệ thống tệp (filesystem) và tìm kiếm mã (code-search), tạo tài liệu, và đưa ra các thay đổi thông qua quy trình rà soát thông thường của nhóm.\n\nSubagent cần đọc các tệp và tìm kiếm mã liên quan để tài liệu phản ánh triển khai hiện tại. Đưa thay đổi qua quy trình review của nhóm bổ sung bước kiểm tra các diễn giải sai trước khi người dùng dựa vào tài liệu.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Tạo tài liệu từ những gì model nhớ được trong dữ liệu huấn luyện mà không đọc bất kỳ mã nguồn thực tế nào của repository, chấp nhận rằng đầu ra sẽ không phản ánh phần triển khai hiện tại.**: Trí nhớ huấn luyện không cho biết các thay đổi riêng trong repository đang dùng nên không đủ làm nguồn cho tài liệu triển khai.\n- **Để các subagent xuất bản tài liệu được tạo trực tiếp lên trang công khai mà không đi qua quy trình rà soát thông thường của nhóm hay bất kỳ bước phê duyệt nào của con người.**: Đăng thẳng bỏ qua review khiến lỗi đọc mã hoặc mô tả sai được công bố trước khi nhóm kiểm tra.\n- **Vô hiệu hóa mọi tool filesystem và code-search để các subagent không thể đọc bất kỳ mã nào trong repository, chấp nhận rằng việc tạo tài liệu sẽ hoàn toàn tách rời khỏi phần triển khai thực tế.**: Tắt truy cập tệp và tìm kiếm loại bỏ chính bằng chứng mà subagent cần để mô tả mã hiện tại.\n\n**Tham khảo:**\n\n- [Building effective agents](https://www.anthropic.com/research/building-effective-agents)"}, {"n": 61, "set": 2, "i": 1, "multi": true, "answer": ["D", "E"], "en": {"stem": "A security audit uncovers two issues:\n\n(1) all end users share a single API key,\n\nand (2) tool calls are executed without\nlogging the initiating user.\n\nWhich two mitigations directly address these specific findings? (Select two.)", "opts": [["A", "Validate structured outputs against a schema before downstream actions are executed."], ["B", "Enforce RBAC at the retrieval layer before content enters the model context."], ["C", "Move credentials out of the prompt context and resolve them from a server-side secret store."], ["D", "Add actor attribution to tool-call logs so each call records the initiating user identity."], ["E", "Replace the shared API key with per-user Auth tokens carrying scope-restricted permissions."]]}, "vi": {"stem": "Một cuộc kiểm toán bảo mật phát hiện hai vấn đề:\n\n(1) tất cả người dùng cuối dùng chung một API key duy nhất,\n\nvà (2) các lệnh gọi tool được thực thi mà không ghi log người dùng đã khởi tạo lệnh gọi.\n\nHai biện pháp giảm thiểu nào giải quyết trực tiếp các phát hiện cụ thể này? (Chọn hai.)", "opts": [["A", "Xác thực các đầu ra có cấu trúc theo một schema trước khi thực thi các hành động downstream."], ["B", "Thực thi RBAC ở tầng truy xuất trước khi nội dung đi vào context của model."], ["C", "Đưa thông tin xác thực (credential) ra khỏi context của prompt và lấy chúng từ một kho bí mật (secret store) phía server."], ["D", "Bổ sung thông tin quy danh tác nhân (actor attribution) vào log lệnh gọi tool để mỗi lệnh gọi ghi lại danh tính người dùng đã khởi tạo."], ["E", "Thay API key dùng chung bằng các token xác thực (Auth token) theo từng người dùng, mang các quyền bị giới hạn theo phạm vi (scope)."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Bổ sung thông tin quy danh tác nhân (actor attribution) vào log lệnh gọi tool để mỗi lệnh gọi ghi lại danh tính người dùng đã khởi tạo.; Thay API key dùng chung bằng các token xác thực (Auth token) theo từng người dùng, mang các quyền bị giới hạn theo phạm vi (scope).\n\nToken OAuth riêng có phạm vi quyền giới hạn thay khóa dùng chung để yêu cầu có danh tính và quyền rõ ràng. Log công cụ phải ghi người khởi tạo để truy vết ai yêu cầu hành động; cả hai thay đổi xử lý trực tiếp hai phát hiện kiểm toán.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Xác thực các đầu ra có cấu trúc theo một schema trước khi thực thi các hành động downstream.**: Kiểm tra schema xử lý hình dạng dữ liệu, không tách danh tính người dùng hay bổ sung người khởi tạo vào log.\n- **Thực thi RBAC ở tầng truy xuất trước khi nội dung đi vào context của model.**: RBAC tại truy xuất bảo vệ tài liệu nhưng không thay khóa API dùng chung hoặc ghi danh tính cho mọi hành động công cụ.\n- **Đưa thông tin xác thực (credential) ra khỏi context của prompt và lấy chúng từ một kho bí mật (secret store) phía server.**: Secret store là thực hành đúng để giữ bí mật, nhưng một khóa chung vẫn là khóa chung nếu chỉ chuyển nơi lưu.\n\n**Tham khảo:**\n\n- [Security](https://code.claude.com/docs/en/security)"}, {"n": 62, "set": 2, "i": 2, "multi": false, "answer": ["D"], "en": {"stem": "You are assessing a Claude-based system whose dominant risk is silent quality drift on safety-relevant outputs\nafter a model-version upgrade.\n\nWhich assessment activity most directly addresses this risk?", "opts": [["A", "Disable adversarial evaluation entirely during model-version upgrade cycles to reduce evaluation cost, accepting that safety drift will go undetected until it appears in production."], ["B", "Rotate adversarial inputs randomly so no two upgrades are scored on the same set."], ["C", "Skip evaluation on each model-version upgrade and rely on user-submitted complaints to surface safety drift after the upgraded model has already served production traffic."], ["D", "Maintain an adversarial evaluation set with version-attributed scoring so each upgrade is measured against the same set before promotion."]]}, "vi": {"stem": "Bạn đang đánh giá một hệ thống dựa trên Claude có rủi ro chủ đạo là chất lượng suy giảm âm thầm (silent quality drift) ở các đầu ra liên quan đến an toàn sau khi nâng cấp phiên bản model.\nHoạt động đánh giá nào giải quyết trực tiếp nhất rủi ro này?", "opts": [["A", "Vô hiệu hóa hoàn toàn việc đánh giá đối kháng trong các chu kỳ nâng cấp phiên bản model để giảm chi phí đánh giá, chấp nhận rằng sự suy giảm về an toàn sẽ không bị phát hiện cho đến khi xuất hiện trong production."], ["B", "Xoay vòng ngẫu nhiên các đầu vào đối kháng để không có hai lần nâng cấp nào được chấm điểm trên cùng một tập."], ["C", "Bỏ qua việc đánh giá ở mỗi lần nâng cấp phiên bản model và dựa vào khiếu nại của người dùng để phát hiện sự suy giảm về an toàn sau khi model đã nâng cấp phục vụ lưu lượng production."], ["D", "Duy trì một tập đánh giá đối kháng với cơ chế chấm điểm gắn theo phiên bản, để mỗi lần nâng cấp được đo trên cùng một tập trước khi đưa lên (promotion)."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Duy trì một tập đánh giá đối kháng với cơ chế chấm điểm gắn theo phiên bản, để mỗi lần nâng cấp được đo trên cùng một tập trước khi đưa lên (promotion).\n\nGiữ một bộ đánh giá đối kháng làm mốc và gắn điểm với phiên bản model cho phép so sánh trước khi nâng cấp. Nhờ chạy trước khi cho phiên bản mới phục vụ, suy giảm chất lượng an toàn có thể chặn phát hành thay vì chỉ được biết qua sự cố.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Vô hiệu hóa hoàn toàn việc đánh giá đối kháng trong các chu kỳ nâng cấp phiên bản model để giảm chi phí đánh giá, chấp nhận rằng sự suy giảm về an toàn sẽ không bị phát hiện cho đến khi xuất hiện trong production.**: Tắt đánh giá đúng lúc đổi model bỏ mất cơ chế phát hiện rủi ro mà đề yêu cầu kiểm soát.\n- **Xoay vòng ngẫu nhiên các đầu vào đối kháng để không có hai lần nâng cấp nào được chấm điểm trên cùng một tập.**: Đổi toàn bộ mẫu ngẫu nhiên qua mỗi lần nâng cấp làm điểm số lẫn ảnh hưởng của bộ câu hỏi với ảnh hưởng của model; có thể bổ sung ca mới nhưng cần giữ mốc chung.\n- **Bỏ qua việc đánh giá ở mỗi lần nâng cấp phiên bản model và dựa vào khiếu nại của người dùng để phát hiện sự suy giảm về an toàn sau khi model đã nâng cấp phục vụ lưu lượng production.**: Đợi khiếu nại là phát hiện sau khi người dùng đã nhận đầu ra có vấn đề, không phải kiểm tra trước phát hành.\n\n**Tham khảo:**\n\n- [Define success criteria and build evaluations](https://platform.claude.com/docs/en/test-and-evaluate/develop-tests)"}, {"n": 63, "set": 2, "i": 3, "multi": false, "answer": ["B"], "en": {"stem": "You are a platform architect designing an internal Claude-based assistant that serves both finance analysts and\nexternal auditors.\n\nEach population must access only documents permitted by its role.\n\nWhere should role-based access control be enforced in the pipeline?", "opts": [["A", "Inside the system prompt as a natural-language instruction for Claude to ignore unauthorized documents."], ["B", "At the retrieval layer, before any role-restricted content reaches the prompt-construction step or the model."], ["C", "Nowhere in the pipeline; rely on the model's general refusal behavior to reject unauthorized document access without any enforced access control."], ["D", "After the response is generated, by post-filtering content that should not have been retrieved."]]}, "vi": {"stem": "Bạn là kiến trúc sư nền tảng đang thiết kế một trợ lý nội bộ dựa trên Claude phục vụ cả chuyên viên phân tích tài chính lẫn kiểm toán viên bên ngoài. Mỗi nhóm người dùng chỉ được truy cập những tài liệu mà vai trò của mình cho phép.\n\nKiểm soát truy cập dựa trên vai trò (role-based access control) nên được thực thi ở đâu trong pipeline?", "opts": [["A", "Bên trong system prompt, dưới dạng một chỉ dẫn bằng ngôn ngữ tự nhiên yêu cầu Claude bỏ qua các tài liệu không được phép."], ["B", "Ở tầng truy xuất, trước khi bất kỳ nội dung bị giới hạn theo vai trò nào đến được bước xây dựng prompt hoặc đến model."], ["C", "Không ở đâu trong pipeline; dựa vào hành vi từ chối chung của model để bác bỏ việc truy cập tài liệu trái phép mà không có cơ chế kiểm soát truy cập được thực thi nào."], ["D", "Sau khi phản hồi được tạo, bằng cách lọc hậu kỳ những nội dung lẽ ra không được truy xuất."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Ở tầng truy xuất, trước khi bất kỳ nội dung bị giới hạn theo vai trò nào đến được bước xây dựng prompt hoặc đến model.\n\nRBAC phải lọc tại tầng truy xuất trước khi xây prompt để tài liệu tài chính hoặc kiểm toán ngoài quyền không đi vào ngữ cảnh model. Quyền truy cập cần do mã ứng dụng thực thi theo danh tính đã xác thực.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Bên trong system prompt, dưới dạng một chỉ dẫn bằng ngôn ngữ tự nhiên yêu cầu Claude bỏ qua các tài liệu không được phép.**: Chỉ dẫn trong system prompt không phải ranh giới phân quyền: tài liệu trái phép đã được chuyển tới model trước khi nó được yêu cầu bỏ qua.\n- **Không ở đâu trong pipeline; dựa vào hành vi từ chối chung của model để bác bỏ việc truy cập tài liệu trái phép mà không có cơ chế kiểm soát truy cập được thực thi nào.**: Hành vi từ chối chung không biết hoặc thực thi đầy đủ quyền tài liệu riêng của từng vai trò.\n- **Sau khi phản hồi được tạo, bằng cách lọc hậu kỳ những nội dung lẽ ra không được truy xuất.**: Lọc sau sinh có thể hỗ trợ phòng vệ nhưng quá muộn để ngăn model, log hoặc trace tiếp xúc dữ liệu trái phép.\n\n**Tham khảo:**\n\n- [Security](https://code.claude.com/docs/en/security)\n- [Mitigate jailbreaks and prompt injections](https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/mitigate-jailbreaks)"}, {"n": 64, "set": 2, "i": 4, "multi": true, "answer": ["A", "C"], "en": {"stem": "You are running a controlled experiment to compare two prompts and must complete the design steps before\nexecuting the experiment.\n\nWhich two steps must be completed BEFORE running the experiment with random assignment? (Select two.)\nEach correct answer presents part of the solution.", "opts": [["A", "Determine the minimum detectable effect size and the sample size needed for power."], ["B", "Decide whether to promote, reject, or iterate the candidate based on the analysis."], ["C", "Define the hypothesis and the primary success metric for the comparison."], ["D", "Analyze the results against the predefined success metric and significance threshold."], ["E", "Document the recommendation, the trade-offs accepted, and the alternatives considered."]]}, "vi": {"stem": "Bạn đang thực hiện một thí nghiệm có kiểm soát để so sánh hai prompt và phải hoàn tất các bước thiết kế trước khi tiến hành thí nghiệm.\n\nHai bước nào phải được hoàn tất TRƯỚC KHI chạy thí nghiệm với phân nhóm ngẫu nhiên (random assignment)? (Chọn hai.)\nMỗi đáp án đúng là một phần của giải pháp.", "opts": [["A", "Xác định kích thước hiệu ứng tối thiểu có thể phát hiện (minimum detectable effect size) và cỡ mẫu cần thiết để đạt độ mạnh thống kê (power)."], ["B", "Quyết định đưa lên, loại bỏ hay tiếp tục lặp cải tiến phương án ứng viên dựa trên kết quả phân tích."], ["C", "Xác định giả thuyết và metric thành công chính cho phép so sánh."], ["D", "Phân tích kết quả dựa trên metric thành công và ngưỡng ý nghĩa thống kê đã xác định trước."], ["E", "Ghi lại khuyến nghị, các đánh đổi đã chấp nhận và các phương án thay thế đã cân nhắc."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Xác định kích thước hiệu ứng tối thiểu có thể phát hiện (minimum detectable effect size) và cỡ mẫu cần thiết để đạt độ mạnh thống kê (power).; Xác định giả thuyết và metric thành công chính cho phép so sánh.\n\nTrước thử nghiệm cần chốt giả thuyết và chỉ số chính để biết hiệu quả nào đang được đo. Sau đó xác định mức cải thiện nhỏ nhất cần phát hiện và cỡ mẫu đủ lực thống kê; nếu thiếu hai phần này, kết quả ngẫu nhiên khó dẫn tới quyết định đáng tin cậy.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Quyết định đưa lên, loại bỏ hay tiếp tục lặp cải tiến phương án ứng viên dựa trên kết quả phân tích.**: Quyết định triển khai, loại bỏ hay sửa ứng viên cần dựa trên kết quả, nên không thể hoàn tất trước khi chạy.\n- **Phân tích kết quả dựa trên metric thành công và ngưỡng ý nghĩa thống kê đã xác định trước.**: Phân tích cần đầu ra thí nghiệm; chỉ metric và ngưỡng được định nghĩa trước.\n- **Ghi lại khuyến nghị, các đánh đổi đã chấp nhận và các phương án thay thế đã cân nhắc.**: Bản khuyến nghị và đánh đổi cuối cùng là kết quả tổng hợp sau phân tích, không phải hai bước xác định phép thử được hỏi.\n\n**Tham khảo:**\n\n- [Define success criteria and build evaluations](https://platform.claude.com/docs/en/test-and-evaluate/develop-tests)"}, {"n": 65, "set": 2, "i": 5, "multi": false, "answer": ["C"], "en": {"stem": "You are reviewing a customer-support agent's configuration.\n\nEach candidate tool falls into one of four categories:\n\n(1) required to complete defined tasks,\n\n(2) frequently used and reduces hand-offs,\n\n3) occasionally useful for unrelated work,\n\n(4) speculative future utility.\n\nWhich categories should typically remain in the agent configuration?", "opts": [["A", "Only category 3, because occasionally useful tools for unrelated work provide broader coverage and should take priority over tools required for the agent's defined tasks."], ["B", "Only category 4, because speculative future-utility tools provide the most flexibility and should be configured even when no defined task currently requires them."], ["C", "Categories 1 and 2 only, because they map to defined tasks and the agent's regular hand-offs."], ["D", "All four categories, because broader tool access is categorically better for agent performance regardless of whether the tools map to defined tasks or regular hand-offs."]]}, "vi": {"stem": "Bạn đang rà soát cấu hình của một agent hỗ trợ khách hàng. Mỗi tool ứng viên thuộc một trong bốn nhóm:\n\n(1) bắt buộc để hoàn thành các tác vụ đã định nghĩa,\n\n(2) được dùng thường xuyên và giúp giảm số lần chuyển giao (hand-off),\n\n(3) đôi khi hữu ích cho các công việc không liên quan,\n\n(4) có thể hữu ích trong tương lai theo phỏng đoán.\n\nNhững nhóm nào thường nên được giữ lại trong cấu hình của agent?", "opts": [["A", "Chỉ nhóm 3, vì các tool đôi khi hữu ích cho công việc không liên quan mang lại độ bao phủ rộng hơn và nên được ưu tiên hơn các tool bắt buộc cho các tác vụ đã định nghĩa của agent."], ["B", "Chỉ nhóm 4, vì các tool có thể hữu ích trong tương lai theo phỏng đoán mang lại sự linh hoạt nhất và nên được cấu hình ngay cả khi hiện chưa có tác vụ đã định nghĩa nào cần đến chúng."], ["C", "Chỉ nhóm 1 và 2, vì chúng gắn với các tác vụ đã định nghĩa và các lần chuyển giao thường xuyên của agent."], ["D", "Cả bốn nhóm, vì quyền truy cập tool rộng hơn luôn tốt hơn cho hiệu năng của agent, bất kể các tool đó có gắn với tác vụ đã định nghĩa hay các lần chuyển giao thường xuyên hay không."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Chỉ nhóm 1 và 2, vì chúng gắn với các tác vụ đã định nghĩa và các lần chuyển giao thường xuyên của agent.\n\nGiữ công cụ cần để hoàn thành nhiệm vụ và công cụ thường dùng làm giảm chuyển việc cho người khác. Hai nhóm này có giá trị đã xác định, trong khi công cụ ngoài phạm vi hoặc chỉ có ích giả định làm tăng bề mặt quyền và lựa chọn mà chưa có nhu cầu chứng minh.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Chỉ nhóm 3, vì các tool đôi khi hữu ích cho công việc không liên quan mang lại độ bao phủ rộng hơn và nên được ưu tiên hơn các tool bắt buộc cho các tác vụ đã định nghĩa của agent.**: Công cụ thỉnh thoảng dùng cho việc ngoài phạm vi không thể thay công cụ bắt buộc cho nhiệm vụ chính.\n- **Chỉ nhóm 4, vì các tool có thể hữu ích trong tương lai theo phỏng đoán mang lại sự linh hoạt nhất và nên được cấu hình ngay cả khi hiện chưa có tác vụ đã định nghĩa nào cần đến chúng.**: Tiện ích tương lai chưa được chứng minh không đủ lý do để loại các công cụ đang cần và cấp quyền sớm.\n- **Cả bốn nhóm, vì quyền truy cập tool rộng hơn luôn tốt hơn cho hiệu năng của agent, bất kể các tool đó có gắn với tác vụ đã định nghĩa hay các lần chuyển giao thường xuyên hay không.**: Thêm mọi công cụ không luôn tăng hiệu quả: chức năng chồng chéo và quyền thừa có thể làm lựa chọn khó hơn.\n\n**Tham khảo:**\n\n- [Building effective agents](https://www.anthropic.com/research/building-effective-agents)"}, {"n": 66, "set": 2, "i": 6, "multi": false, "answer": ["A"], "en": {"stem": "You are comparing patterns for a batch document-classification job that follows fixed steps: extract metadata,\nclassify, summarize, and persist.\n\nWhich pattern is the best fit and why?", "opts": [["A", "A workflow pattern, because the steps are well-defined and predictable per-request token cost is preferred over flexibility."], ["B", "An agentic pattern, because agents are categorically more accurate than workflows and therefore always preferable regardless of step predictability."], ["C", "An agentic pattern, because the open-ended planning capability of agents produces more consistent structured outputs than a fixed workflow graph on classification tasks."], ["D", "A workflow pattern, because agentic patterns do not support tool invocations and therefore cannot execute the persist step that writes results to the downstream store."]]}, "vi": {"stem": "Bạn đang so sánh các mẫu (pattern) cho một tác vụ phân loại tài liệu theo lô (batch) tuân theo các bước cố định: trích xuất metadata, phân loại, tóm tắt và lưu trữ (persist).\n\nMẫu nào phù hợp nhất và vì sao?", "opts": [["A", "Mẫu workflow, vì các bước được định nghĩa rõ và chi phí token có thể dự đoán cho mỗi yêu cầu được ưu tiên hơn sự linh hoạt."], ["B", "Mẫu agentic, vì agent luôn chính xác hơn workflow và do đó luôn được ưu tiên bất kể các bước có dự đoán được hay không."], ["C", "Mẫu agentic, vì khả năng lập kế hoạch mở của agent tạo ra đầu ra có cấu trúc nhất quán hơn so với một đồ thị workflow cố định trong các tác vụ phân loại."], ["D", "Mẫu workflow, vì các mẫu agentic không hỗ trợ gọi tool và do đó không thể thực thi bước persist ghi kết quả vào kho lưu trữ downstream."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Mẫu workflow, vì các bước được định nghĩa rõ và chi phí token có thể dự đoán cho mỗi yêu cầu được ưu tiên hơn sự linh hoạt.\n\nWorkflow cố định phù hợp chuỗi trích metadata, phân loại, tóm tắt rồi lưu vì thứ tự và điều kiện đã biết. Điều phối bằng mã giúp dự tính số lần gọi và kiểm soát chi phí tốt hơn vòng lặp lập kế hoạch mở; điều đó không có nghĩa chi phí token luôn hằng số.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Mẫu agentic, vì agent luôn chính xác hơn workflow và do đó luôn được ưu tiên bất kể các bước có dự đoán được hay không.**: Agent không mặc nhiên chính xác hơn; thêm quyền tự lập kế hoạch cho chuỗi đã biết có thể tăng số lần gọi mà không thêm giá trị.\n- **Mẫu agentic, vì khả năng lập kế hoạch mở của agent tạo ra đầu ra có cấu trúc nhất quán hơn so với một đồ thị workflow cố định trong các tác vụ phân loại.**: Lập kế hoạch mở không tự bảo đảm cấu trúc đầu ra; schema và kiểm tra ở ranh giới mới xử lý yêu cầu này.\n- **Mẫu workflow, vì các mẫu agentic không hỗ trợ gọi tool và do đó không thể thực thi bước persist ghi kết quả vào kho lưu trữ downstream.**: Workflow là lựa chọn đúng nhưng lý do sai: agent vẫn có thể gọi công cụ và lưu dữ liệu.\n\n**Tham khảo:**\n\n- [Building effective agents](https://www.anthropic.com/research/building-effective-agents)"}, {"n": 67, "set": 2, "i": 7, "multi": false, "answer": ["C"], "en": {"stem": "You are selecting a pattern for a compliance Q&A assistant that must answer policy questions with citations to the\nauthoritative internal source set.\n\nLatency, cost, and audit predictability are prioritized.\n\nWhich pattern is the best fit?", "opts": [["A", "multi-agent orchestration with a planner, researcher, and writer agent for every query"], ["B", "a static prompt with the entire policy corpus concatenated into every request"], ["C", "augmented LLM with retrieval-augmented generation over the indexed authoritative corpus and citation rendering on each answer"], ["D", "a pure agent loop with open web-browsing tools to surface the most current policy information, without constraining retrieval to the authoritative internal corpus"]]}, "vi": {"stem": "Bạn đang chọn mẫu cho một trợ lý hỏi đáp (Q&A) về tuân thủ, trợ lý này phải trả lời các câu hỏi về chính sách kèm trích dẫn tới tập nguồn nội bộ có thẩm quyền. Latency, chi phí và khả năng dự đoán phục vụ kiểm toán được ưu tiên.\n\nMẫu nào phù hợp nhất?", "opts": [["A", "điều phối đa agent (multi-agent orchestration) với một agent lập kế hoạch (planner), một agent nghiên cứu (researcher) và một agent viết (writer) cho mọi truy vấn"], ["B", "một prompt tĩnh với toàn bộ kho tài liệu chính sách được ghép nối vào mọi yêu cầu"], ["C", "LLM tăng cường (augmented LLM) với retrieval-augmented generation (RAG) trên kho tài liệu có thẩm quyền đã được lập chỉ mục và hiển thị trích dẫn trong mỗi câu trả lời"], ["D", "một vòng lặp agent thuần túy với các tool duyệt web mở để tìm thông tin chính sách mới nhất, không giới hạn việc truy xuất trong kho tài l
