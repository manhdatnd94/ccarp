 nào đã bị vi phạm?", "opts": [["A", "Cấu hình project scope luôn phải ghi đè cấu hình user scope."], ["B", "Các định nghĩa MCP server phải nằm trong biến môi trường để tránh xung đột scope."], ["C", "Thông tin xác thực (credential) phải được lấy vào lúc chạy (runtime) từ một kho bí mật (secret store) và không bao giờ được lưu trong các tệp nằm dưới quản lý phiên bản."], ["D", "Cấu hình được quản lý (managed) phải được áp dụng trước khi cấu hình project scope được đọc."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Thông tin xác thực (credential) phải được lấy vào lúc chạy (runtime) từ một kho bí mật (secret store) và không bao giờ được lưu trong các tệp nằm dưới quản lý phiên bản.\n\nCredential phải được lấy lúc chạy từ cơ chế quản lý secret, không ghi giá trị khóa vào tệp theo dõi bằng Git. settings.json cấp dự án là nơi chia sẻ cấu hình, nên đưa khóa vào đó làm bí mật đi cùng lịch sử repository; thay đổi precedence không giải quyết rò rỉ này.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Cấu hình project scope luôn phải ghi đè cấu hình user scope.**: Thứ tự ưu tiên cấu hình quyết định giá trị nào có hiệu lực, không quyết định liệu khóa đã bị công khai trong Git hay chưa.\n- **Các định nghĩa MCP server phải nằm trong biến môi trường để tránh xung đột scope.**: MCP server có thể được định nghĩa trong tệp cấu hình; điều cần tách là giá trị secret, không phải bắt mọi định nghĩa nằm trong biến môi trường.\n- **Cấu hình được quản lý (managed) phải được áp dụng trước khi cấu hình project scope được đọc.**: Đọc managed config trước không làm biến mất credential đã commit và không phải nguyên tắc lưu bí mật bị vi phạm ở đây.\n\n**Tham khảo:**\n\n- [Settings files and precedence](https://code.claude.com/docs/en/settings)\n- [Security](https://code.claude.com/docs/en/security)"}, {"n": 92, "set": 2, "i": 32, "multi": true, "answer": ["C", "D"], "en": {"stem": "An engineering organization is adopting Claude Code across 200 developers.\n\nA team lead has proposed that AI-\ngenerated pull requests bypass the standard code review process for changes under 50 lines, on the grounds that\nsmall changes are low-risk and review capacity is constrained.\n\nWhich two Diligence-competency objections should you raise? (Choose two.)\nEach correct answer presents part of the solution.", "opts": [["A", "Code review capacity should be expanded to handle every code change submitted across the team."], ["B", "The 50-line threshold should be raised to 200 lines instead to capture more changes overall."], ["C", "Line count is a poor proxy for the actual risk a code change introduces into the system."], ["D", "Removing review removes the verification mechanism that AI-generated output requires across the workflow."], ["E", "AI-generated pull requests should be rejected as a default policy across the engineering organization."]]}, "vi": {"stem": "Một tổ chức kỹ thuật đang áp dụng Claude Code cho 200 lập trình viên. Một trưởng nhóm đề xuất cho phép các pull request do AI tạo bỏ qua quy trình code review tiêu chuẩn đối với các thay đổi dưới 50 dòng, với lý do các thay đổi nhỏ có rủi ro thấp và năng lực review đang bị hạn chế.\n\nBạn nên nêu ra hai ý kiến phản đối nào thuộc năng lực Diligence (Cẩn trọng)? (Chọn hai.)\nMỗi đáp án đúng là một phần của giải pháp.", "opts": [["A", "Năng lực code review nên được mở rộng để xử lý mọi thay đổi mã được gửi lên trong toàn nhóm."], ["B", "Nên nâng ngưỡng 50 dòng lên 200 dòng để bao quát được nhiều thay đổi hơn."], ["C", "Số dòng mã là một thước đo thay thế kém cho rủi ro thực tế mà một thay đổi mã đưa vào hệ thống."], ["D", "Loại bỏ bước review đồng nghĩa với loại bỏ cơ chế kiểm chứng mà đầu ra do AI tạo cần có trong toàn bộ workflow."], ["E", "Các pull request do AI tạo nên bị từ chối như một chính sách mặc định trên toàn tổ chức kỹ thuật."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Số dòng mã là một thước đo thay thế kém cho rủi ro thực tế mà một thay đổi mã đưa vào hệ thống.; Loại bỏ bước review đồng nghĩa với loại bỏ cơ chế kiểm chứng mà đầu ra do AI tạo cần có trong toàn bộ workflow.\n\nSố dòng không đo đúng rủi ro: một thay đổi nhỏ vẫn có thể mở quyền, làm sai kiểm tra dữ liệu hoặc ảnh hưởng thanh toán. Bỏ review cho PR do AI tạo loại cơ chế kiểm chứng ở đúng chỗ cần xác minh; nên phân loại theo tác động và bằng chứng kiểm tra thay vì coi dưới 50 dòng mặc nhiên an toàn.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Năng lực code review nên được mở rộng để xử lý mọi thay đổi mã được gửi lên trong toàn nhóm.**: Tăng năng lực review có thể giúp giải quyết nguồn lực, nhưng không trực tiếp chỉ ra lỗi logic của ngưỡng số dòng hoặc việc bỏ xác minh.\n- **Nên nâng ngưỡng 50 dòng lên 200 dòng để bao quát được nhiều thay đổi hơn.**: Nâng ngưỡng lên 200 dòng giữ nguyên giả định sai rằng kích thước diff quyết định mức an toàn.\n- **Các pull request do AI tạo nên bị từ chối như một chính sách mặc định trên toàn tổ chức kỹ thuật.**: Từ chối mọi PR do AI tạo là quy tắc quá rộng; vấn đề nêu ra là thiếu review theo rủi ro, không phải mọi đầu ra AI đều không dùng được.\n\n**Tham khảo:**\n\n- [Security](https://code.claude.com/docs/en/security)\n- [AI RMF Core](https://airc.nist.gov/airmf-resources/airmf/5-sec-core/)"}, {"n": 93, "set": 2, "i": 33, "multi": true, "answer": ["B", "C"], "en": {"stem": "You are evaluating a Claude-based deployment for adherence to a specific regulation.\n\nWhich two steps must be completed BEFORE mapping deployment data flows to specific regulatory clauses?\n(Choose two.)\nEach correct answer presents part of the solution.", "opts": [["A", "Compare the in-place controls against the regulatory requirements to identify any compliance gaps."], ["B", "Inventory the vendor-provided compliance tooling and confirm which compliance affordances are in place."], ["C", "Identify the applicability of the regulation based on data types, jurisdiction, and audience"], ["D", "Document the identified gaps along with recommended remediations and residual risk for sign-off"], ["E", "Schedule the remediation work with the engineering team based on the prioritized gap findings."]]}, "vi": {"stem": "Bạn đang đánh giá mức độ tuân thủ của một hệ thống triển khai dựa trên Claude đối với một quy định cụ thể.\n\nHai bước nào phải được hoàn tất TRƯỚC KHI ánh xạ các luồng dữ liệu của hệ thống tới các điều khoản quy định cụ thể?\n(Chọn hai.)\nMỗi đáp án đúng là một phần của giải pháp.", "opts": [["A", "So sánh các biện pháp kiểm soát hiện có với các yêu cầu của quy định để xác định mọi khoảng trống tuân thủ."], ["B", "Kiểm kê các công cụ tuân thủ do nhà cung cấp cung cấp và xác nhận những tính năng hỗ trợ tuân thủ nào đang có."], ["C", "Xác định khả năng áp dụng của quy định dựa trên loại dữ liệu, khu vực pháp lý và đối tượng người dùng."], ["D", "Ghi lại các khoảng trống đã xác định cùng với các biện pháp khắc phục được đề xuất và rủi ro tồn dư để ký duyệt."], ["E", "Lên lịch công việc khắc phục với nhóm kỹ thuật dựa trên các phát hiện về khoảng trống đã được sắp xếp ưu tiên."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Kiểm kê các công cụ tuân thủ do nhà cung cấp cung cấp và xác nhận những tính năng hỗ trợ tuân thủ nào đang có.; Xác định khả năng áp dụng của quy định dựa trên loại dữ liệu, khu vực pháp lý và đối tượng người dùng.\n\nTheo khóa nguồn, trước hết xác định quy định có áp dụng theo dữ liệu, khu vực và đối tượng, đồng thời kiểm kê các affordance tuân thủ của nhà cung cấp. Việc xác định phạm vi áp dụng là điều kiện rõ ràng để map clause; kiểm kê công cụ giúp hiểu kiểm soát hiện có nhưng không phải tiền đề bắt buộc theo thứ tự chung, vì có thể làm song song với map luồng dữ liệu.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **So sánh các biện pháp kiểm soát hiện có với các yêu cầu của quy định để xác định mọi khoảng trống tuân thủ.**: So kiểm soát với yêu cầu để tìm gap cần hiểu điều khoản và phạm vi trước; đây là phân tích sau mapping, không phải hai đầu vào được khóa chọn.\n- **Ghi lại các khoảng trống đã xác định cùng với các biện pháp khắc phục được đề xuất và rủi ro tồn dư để ký duyệt.**: Ghi gap và rủi ro còn lại cần gap analysis đã có, nên chưa thể hoàn tất ở thời điểm trước mapping.\n- **Lên lịch công việc khắc phục với nhóm kỹ thuật dựa trên các phát hiện về khoảng trống đã được sắp xếp ưu tiên.**: Xếp lịch khắc phục dựa trên gap đã ưu tiên thuộc phần xử lý sau đánh giá, không phải bước tiền đề để biết điều khoản nào áp dụng.\n\n**Cần xem lại:** Giữ khóa nguồn. Không có quy định chung rằng kiểm kê công cụ nhà cung cấp luôn phải hoàn tất trước khi map data flow vào clause; cần làm rõ dependency mà đề muốn áp đặt.\n\n**Tham khảo:**\n\n- [AI RMF Core](https://airc.nist.gov/airmf-resources/airmf/5-sec-core/)"}, {"n": 94, "set": 2, "i": 34, "multi": true, "answer": ["B", "D"], "en": {"stem": "You are reviewing an integration specification for security gaps.\n\nWhich two findings constitute valid security gaps in the specification? (Choose two.)\nEach correct answer presents a complete solution.", "opts": [["A", "Tool inputs and outputs are encrypted in transit using transport layer security between services."], ["B", "Service credentials are placed in the prompt context where they can leak into logs and traces."], ["C", "Tool calls execute server-side under a least-privilege service principal scoped to the requested action."], ["D", "Role-based access control (RBAC) is enforced only at the response-rendering layer after the model accesses restricted data."], ["E", "Per-user OAuth tokens are exchanged with scope-restricted permissions and refreshed within the active session."]]}, "vi": {"stem": "Bạn đang rà soát một bản đặc tả tích hợp để tìm các khoảng trống bảo mật.\n\nHai phát hiện nào là những khoảng trống bảo mật hợp lệ trong bản đặc tả? (Chọn hai.)\nMỗi đáp án đúng là một giải pháp hoàn chỉnh.", "opts": [["A", "Đầu vào và đầu ra của tool được mã hóa khi truyền bằng giao thức bảo mật tầng truyền tải (TLS) giữa các dịch vụ."], ["B", "Thông tin xác thực của dịch vụ được đặt trong context của prompt, nơi chúng có thể bị rò rỉ vào log và trace."], ["C", "Các lệnh gọi tool được thực thi phía server dưới một service principal có đặc quyền tối thiểu, giới hạn trong phạm vi hành động được yêu cầu."], ["D", "Kiểm soát truy cập dựa trên vai trò (RBAC) chỉ được thực thi ở tầng hiển thị phản hồi, sau khi model đã truy cập dữ liệu bị hạn chế."], ["E", "Các token OAuth theo từng người dùng được trao đổi với các quyền giới hạn theo phạm vi và được làm mới trong phiên đang hoạt động."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Thông tin xác thực của dịch vụ được đặt trong context của prompt, nơi chúng có thể bị rò rỉ vào log và trace.; Kiểm soát truy cập dựa trên vai trò (RBAC) chỉ được thực thi ở tầng hiển thị phản hồi, sau khi model đã truy cập dữ liệu bị hạn chế.\n\nĐặt credential trong ngữ cảnh prompt cho model và hệ thống log cơ hội tiếp xúc bí mật không cần thiết. Chỉ áp dụng RBAC lúc render cũng quá muộn vì model đã được truy cập dữ liệu hạn chế; secret cần giải quyết phía server và quyền tài liệu cần lọc trước model.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Đầu vào và đầu ra của tool được mã hóa khi truyền bằng giao thức bảo mật tầng truyền tải (TLS) giữa các dịch vụ.**: TLS bảo vệ dữ liệu đang truyền giữa dịch vụ; đây là kiểm soát có ích, không phải lỗ hổng được mô tả.\n- **Các lệnh gọi tool được thực thi phía server dưới một service principal có đặc quyền tối thiểu, giới hạn trong phạm vi hành động được yêu cầu.**: Service principal phía server với quyền tối thiểu thu hẹp quyền công cụ; cần thực thi đúng nhưng mô tả này tự nó không chỉ ra lỗ hổng.\n- **Các token OAuth theo từng người dùng được trao đổi với các quyền giới hạn theo phạm vi và được làm mới trong phiên đang hoạt động.**: Token OAuth theo người dùng với scope giới hạn hỗ trợ quyền và truy vết theo actor; refresh phiên không tự làm cơ chế này thành lỗ hổng.\n\n**Tham khảo:**\n\n- [Security](https://code.claude.com/docs/en/security)"}, {"n": 95, "set": 2, "i": 35, "multi": false, "answer": ["A"], "en": {"stem": "You are defining escalation criteria for ambiguous cases in an automated workflow.\n\nWhich set of criteria best supports consistent escalation?", "opts": [["A", "confidence threshold below a defined level, presence of high-impact decision categories, ambiguity flags raised by content classifiers, and the user’s explicit request for review"], ["B", "escalation at the discretion of whoever is available when the teams on-call engineer has spare capacity, with no defined threshold, category, or ambiguity criterion to trigger it"], ["C", "escalation only after an affected customer has already contacted the support channel to complain, by which point the automated workflow has already completed without human review"], ["D", "no escalation criteria at all; the model itself decides on each turn whether to escalate, without explicit confidence thresholds, impact categories, or classifier-based ambiguity flags"]]}, "vi": {"stem": "Bạn đang xác định các tiêu chí leo thang (escalation) cho các trường hợp mơ hồ trong một workflow tự động.\n\nBộ tiêu chí nào hỗ trợ tốt nhất việc leo thang một cách nhất quán?", "opts": [["A", "ngưỡng độ tin cậy thấp hơn một mức đã xác định, sự hiện diện của các nhóm quyết định có tác động lớn, các cờ mơ hồ do bộ phân loại nội dung đưa ra, và yêu cầu rà soát rõ ràng từ người dùng"], ["B", "leo thang tùy theo quyết định của bất kỳ ai đang rảnh khi kỹ sư trực on-call của nhóm còn dư năng lực, không có ngưỡng, nhóm quyết định hay tiêu chí mơ hồ nào được xác định để kích hoạt"], ["C", "chỉ leo thang sau khi khách hàng bị ảnh hưởng đã liên hệ kênh hỗ trợ để khiếu nại, khi đó workflow tự động đã hoàn tất mà không có con người rà soát"], ["D", "không có tiêu chí leo thang nào cả; chính model tự quyết định ở mỗi lượt có leo thang hay không, không có ngưỡng độ tin cậy, nhóm tác động hay cờ mơ hồ dựa trên bộ phân loại rõ ràng"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** ngưỡng độ tin cậy thấp hơn một mức đã xác định, sự hiện diện của các nhóm quyết định có tác động lớn, các cờ mơ hồ do bộ phân loại nội dung đưa ra, và yêu cầu rà soát rõ ràng từ người dùng\n\nNgưỡng confidence, loại quyết định tác động cao, cờ mơ hồ và yêu cầu duyệt từ người dùng tạo các trigger rõ ràng có thể triển khai và kiểm toán. Confidence cần được đo hoặc hiệu chuẩn phù hợp, nhưng kết hợp nhiều tín hiệu giúp tránh để các trường hợp mơ hồ tùy vào người trực có rảnh hay không.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **leo thang tùy theo quyết định của bất kỳ ai đang rảnh khi kỹ sư trực on-call của nhóm còn dư năng lực, không có ngưỡng, nhóm quyết định hay tiêu chí mơ hồ nào được xác định để kích hoạt**: Tùy thời gian rảnh của người trực không tạo ngưỡng nhất quán và có thể bỏ qua ca nguy hiểm khi nhóm bận.\n- **chỉ leo thang sau khi khách hàng bị ảnh hưởng đã liên hệ kênh hỗ trợ để khiếu nại, khi đó workflow tự động đã hoàn tất mà không có con người rà soát**: Đợi khách hàng khiếu nại chuyển escalation sang sau tác động, bỏ cơ hội dừng hành động từ đầu.\n- **không có tiêu chí leo thang nào cả; chính model tự quyết định ở mỗi lượt có leo thang hay không, không có ngưỡng độ tin cậy, nhóm tác động hay cờ mơ hồ dựa trên bộ phân loại rõ ràng**: Để model tự quyết không tiêu chí khiến hành vi không có chuẩn kiểm tra; có thể dùng model phát tín hiệu nhưng cần policy rõ ràng bên ngoài.\n\n**Tham khảo:**\n\n- [AI RMF Core](https://airc.nist.gov/airmf-resources/airmf/5-sec-core/)"}, {"n": 96, "set": 2, "i": 36, "multi": false, "answer": ["C"], "en": {"stem": "A Claude architect observes that after a recent model-version upgrade, grounded responses began including claims not supported by the retrieved source documents.\n\nWhich mitigation is most directly targeted at this failure mode?", "opts": [["A", "replacing the shared API key with per-user OAuth tokens to restrict data access"], ["B", "scoring each new model version against a stable adversarial evaluation set"], ["C", "constraining responses to source-supported content combined with required citations and a verification step"], ["D", "treating retrieved data as untrusted and applying input classifiers at ingestion time"]]}, "vi": {"stem": "Một kiến trúc sư Claude nhận thấy rằng sau một lần nâng cấp phiên bản model gần đây, các phản hồi có neo nguồn (grounded) bắt đầu chứa các khẳng định không được tài liệu nguồn truy xuất hỗ trợ.\n\nBiện pháp giảm thiểu nào nhắm trực tiếp nhất vào chế độ lỗi này?", "opts": [["A", "thay API key dùng chung bằng các token OAuth theo từng người dùng để hạn chế quyền truy cập dữ liệu"], ["B", "chấm điểm mỗi phiên bản model mới trên một tập đánh giá đối kháng ổn định"], ["C", "giới hạn phản hồi trong nội dung được nguồn hỗ trợ, kết hợp với yêu cầu trích dẫn và một bước xác minh"], ["D", "coi dữ liệu truy xuất là không đáng tin cậy và áp dụng bộ phân loại đầu vào tại thời điểm nạp dữ liệu (ingestion)"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** giới hạn phản hồi trong nội dung được nguồn hỗ trợ, kết hợp với yêu cầu trích dẫn và một bước xác minh\n\nSource-only, citation và verify đối chiếu claim với tài liệu sửa trực tiếp grounded answer có chi tiết không hỗ trợ sau upgrade.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **thay API key dùng chung bằng các token OAuth theo từng người dùng để hạn chế quyền truy cập dữ liệu**: OAuth thay access, không correctness của claim.\n- **chấm điểm mỗi phiên bản model mới trên một tập đánh giá đối kháng ổn định**: Eval phát hiện drift nhưng chưa ngăn từng claim sai.\n- **coi dữ liệu truy xuất là không đáng tin cậy và áp dụng bộ phân loại đầu vào tại thời điểm nạp dữ liệu (ingestion)**: Input classifier nhắm instruction injection, không mọi hallucination.\n\n**Tham khảo:**\n\n- [Claude — Reduce hallucinations](https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations)"}, {"n": 97, "set": 2, "i": 37, "multi": false, "answer": ["C"], "en": {"stem": "You are preparing a HIPAA-eligible deployment for a healthcare customer.\n\nWhich configuration supports HIPAA compliance using Anthropic-offered tools?", "opts": [["A", "disabling all audit logging so that no PHI is recorded in any log store, on the assumption that the absence of logs satisfies HIPAA requirements without a signed BAA"], ["B", "an ad-hoc personal Claude account used by individual clinicians for PHI-related tasks, with no Business Associate Agreement, no Zero Data Retention, and no audit logging configured"], ["C", "Claude Enterprise with a signed Business Associate Agreement, Zero Data Retention enabled, and audit logging configured for compliance tracking"], ["D", "Claude Free with no contractual addendum, since consumer products meet HIPAA requirements out of the box"]]}, "vi": {"stem": "Bạn đang chuẩn bị một hệ thống triển khai đủ điều kiện HIPAA cho một khách hàng ngành y tế.\n\nCấu hình nào hỗ trợ tuân thủ HIPAA bằng các công cụ do Anthropic cung cấp?", "opts": [["A", "vô hiệu hóa mọi hoạt động ghi log kiểm toán để không có PHI nào được ghi vào bất kỳ kho log nào, với giả định rằng việc không có log đã đáp ứng yêu cầu HIPAA mà không cần BAA đã ký"], ["B", "một tài khoản Claude cá nhân tùy tiện được từng bác sĩ lâm sàng dùng cho các tác vụ liên quan đến PHI, không có Business Associate Agreement, không có Zero Data Retention và không cấu hình ghi log kiểm toán"], ["C", "Claude Enterprise với Business Associate Agreement (BAA) đã ký, bật Zero Data Retention và cấu hình ghi log kiểm toán để theo dõi tuân thủ"], ["D", "Claude Free không có phụ lục hợp đồng nào, vì các sản phẩm dành cho người tiêu dùng đáp ứng yêu cầu HIPAA ngay từ đầu"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Claude Enterprise với Business Associate Agreement (BAA) đã ký, bật Zero Data Retention và cấu hình ghi log kiểm toán để theo dõi tuân thủ\n\nKhóa nguồn chọn gói Enterprise có BAA, cấu hình dữ liệu và audit log vì các phương án còn lại xử lý PHI mà không có nền tảng hợp đồng và kiểm soát thích hợp. Tuy nhiên tổ hợp được viết không đủ chính xác để coi là công thức tuân thủ: hiện phải bật HIPAA-ready Enterprise và dùng tính năng nằm trong BAA; BAA có thể được chấp nhận trong luồng cấu hình, còn ZDR và cấu hình HIPAA riêng của Claude Code/Cowork có điều kiện sản phẩm. Cần đối chiếu Implementation Guide áp dụng, không suy ra mọi Enterprise có ZDR đều đã tuân thủ.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **vô hiệu hóa mọi hoạt động ghi log kiểm toán để không có PHI nào được ghi vào bất kỳ kho log nào, với giả định rằng việc không có log đã đáp ứng yêu cầu HIPAA mà không cần BAA đã ký**: Tắt toàn bộ audit logging không thay BAA và làm mất bằng chứng vận hành; cần bảo vệ log nhạy cảm theo thiết kế thay vì coi không có log là đủ tuân thủ.\n- **một tài khoản Claude cá nhân tùy tiện được từng bác sĩ lâm sàng dùng cho các tác vụ liên quan đến PHI, không có Business Associate Agreement, không có Zero Data Retention và không cấu hình ghi log kiểm toán**: Tài khoản cá nhân không có BAA và cấu hình HIPAA phù hợp không phải nền tảng được nêu cho xử lý PHI của tổ chức.\n- **Claude Free không có phụ lục hợp đồng nào, vì các sản phẩm dành cho người tiêu dùng đáp ứng yêu cầu HIPAA ngay từ đầu**: Claude Free không có HIPAA-ready Enterprise enablement và BAA chỉ vì sản phẩm được cung cấp cho người tiêu dùng.\n\n**Cần xem lại:** Cần sửa độ chính xác sản phẩm của lựa chọn theo BAA hiện hành: HIPAA-ready Enterprise yêu cầu cấu hình riêng; ZDR cho Claude Code và API không được gộp thành một tính năng chung. Giữ khóa nguồn để người biên tập quyết định.\n\n**Tham khảo:**\n\n- [HIPAA-ready Enterprise plans](https://support.claude.com/en/articles/13296973-hipaa-ready-enterprise-plans)"}, {"n": 98, "set": 2, "i": 38, "multi": false, "answer": ["D"], "en": {"stem": "You are defining transparency practices for a customer-facing assistant whose responses are materially shaped by\nAI.\n\nWhich transparency practice most directly supports responsible deployment?", "opts": [["A", "Disclose AI involvement only to internal staff and operators while withholding that information from the end users whose interactions are materially shaped by the AI system."], ["B", "Refuse to answer any user question about how the responses were produced or whether AI was involved, treating the AI’s role as confidential operational information."], ["C", "Misrepresent the AI’s role in producing responses in order to make the assistant feel more trustworthy or more human, undermining informed user consent and organizational transparency."], ["D", "Disclose AI involvement to end users in line with the organization’s transparency policy and provide a documented path to reach a human when needed."]]}, "vi": {"stem": "Bạn đang xác định các thực hành minh bạch cho một trợ lý phục vụ khách hàng có phản hồi được định hình đáng kể bởi AI.\n\nThực hành minh bạch nào hỗ trợ trực tiếp nhất cho việc triển khai có trách nhiệm?", "opts": [["A", "Chỉ công bố sự tham gia của AI cho nhân viên nội bộ và người vận hành, đồng thời giữ kín thông tin đó với người dùng cuối, những người có tương tác được hệ thống AI định hình đáng kể."], ["B", "Từ chối trả lời mọi câu hỏi của người dùng về cách các phản hồi được tạo ra hoặc liệu AI có tham gia hay không, coi vai trò của AI là thông tin vận hành bí mật."], ["C", "Trình bày sai lệch vai trò của AI trong việc tạo phản hồi nhằm khiến trợ lý có vẻ đáng tin cậy hơn hoặc giống con người hơn, làm suy yếu sự đồng thuận có hiểu biết của người dùng và tính minh bạch của tổ chức."], ["D", "Công bố sự tham gia của AI cho người dùng cuối theo chính sách minh bạch của tổ chức và cung cấp một lộ trình được ghi nhận rõ ràng để liên hệ với con người khi cần."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Công bố sự tham gia của AI cho người dùng cuối theo chính sách minh bạch của tổ chức và cung cấp một lộ trình được ghi nhận rõ ràng để liên hệ với con người khi cần.\n\nThông báo cho người dùng cuối rằng AI có vai trò đáng kể giúp họ hiểu nguồn gốc và giới hạn của tương tác. Có đường dẫn được ghi rõ để gặp người thật cho phép xin hỗ trợ hoặc phản đối khi cần; cách diễn đạt nên phù hợp chính sách minh bạch của tổ chức.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Chỉ công bố sự tham gia của AI cho nhân viên nội bộ và người vận hành, đồng thời giữ kín thông tin đó với người dùng cuối, những người có tương tác được hệ thống AI định hình đáng kể.**: Chỉ nói với nhân viên nội bộ không cung cấp thông tin cho chính người dùng chịu tác động của câu trả lời AI.\n- **Từ chối trả lời mọi câu hỏi của người dùng về cách các phản hồi được tạo ra hoặc liệu AI có tham gia hay không, coi vai trò của AI là thông tin vận hành bí mật.**: Từ chối mọi câu hỏi về AI cản khả năng hiểu và đánh giá tương tác của người dùng.\n- **Trình bày sai lệch vai trò của AI trong việc tạo phản hồi nhằm khiến trợ lý có vẻ đáng tin cậy hơn hoặc giống con người hơn, làm suy yếu sự đồng thuận có hiểu biết của người dùng và tính minh bạch của tổ chức.**: Mô tả sai vai trò AI tạo lòng tin dựa trên thông tin sai, trái với mục tiêu minh bạch.\n\n**Tham khảo:**\n\n- [AI RMF Core](https://airc.nist.gov/airmf-resources/airmf/5-sec-core/)"}, {"n": 99, "set": 2, "i": 39, "multi": false, "answer": ["B"], "en": {"stem": "You are supporting an EU-based deployment with GDPR obligations.\n\nWhich combination of measures best supports the deployment’s GDPR posture?", "opts": [["A", "disabling all data-retention configuration, redaction controls, and data-subject-rights handling to simplify day-to-day operations, accepting the resulting GDPR compliance exposure"], ["B", "enterprise-tier deployment with a signed Data Processing Addendum, defined data-retention configuration, redaction of personal data not needed for the task, and documented data-subject-rights handling"], ["C", "pasting full EU personal data into every prompt to “give Claude complete context” without considering purpose limitation, data minimization, or the organization’s Data Processing Addendum obligations"], ["D", "using a personal Claude account tier for processing EU personal data at scale, with no signed Data Processing Addendum and no documented data-subject-rights handling procedure"]]}, "vi": {"stem": "Bạn đang hỗ trợ một hệ thống triển khai tại EU có các nghĩa vụ theo GDPR.\n\nTổ hợp biện pháp nào hỗ trợ tốt nhất tư thế tuân thủ GDPR của hệ thống?", "opts": [["A", "vô hiệu hóa mọi cấu hình lưu giữ dữ liệu, biện pháp kiểm soát che giấu dữ liệu và việc xử lý quyền của chủ thể dữ liệu để đơn giản hóa vận hành hằng ngày, chấp nhận rủi ro tuân thủ GDPR phát sinh"], ["B", "triển khai ở hạng doanh nghiệp (enterprise) với Data Processing Addendum (DPA) đã ký, cấu hình lưu giữ dữ liệu được xác định, che giấu dữ liệu cá nhân không cần cho tác vụ và quy trình xử lý quyền của chủ thể dữ liệu được ghi nhận rõ ràng"], ["C", "dán toàn bộ dữ liệu cá nhân của EU vào mọi prompt để \"cung cấp cho Claude ngữ cảnh đầy đủ\" mà không cân nhắc nguyên tắc giới hạn mục đích, tối thiểu hóa dữ liệu hay các nghĩa vụ theo Data Processing Addendum của tổ chức"], ["D", "dùng một hạng tài khoản Claude cá nhân để xử lý dữ liệu cá nhân của EU ở quy mô lớn, không có Data Processing Addendum đã ký và không có quy trình xử lý quyền của chủ thể dữ liệu được ghi nhận"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** triển khai ở hạng doanh nghiệp (enterprise) với Data Processing Addendum (DPA) đã ký, cấu hình lưu giữ dữ liệu được xác định, che giấu dữ liệu cá nhân không cần cho tác vụ và quy trình xử lý quyền của chủ thể dữ liệu được ghi nhận rõ ràng\n\nDPA áp dụng, thời hạn lưu rõ ràng, tối thiểu hóa dữ liệu qua redaction và quy trình quyền của chủ thể dữ liệu cùng hỗ trợ trách nhiệm xử lý. Khóa chọn tổ hợp Enterprise này so với các phương án bỏ kiểm soát, nhưng GDPR không chỉ dành cho Enterprise và Anthropic hiện tích hợp DPA vào Commercial Terms; không phải lúc nào cũng có hợp đồng cần ký riêng. Căn cứ pháp lý và nghĩa vụ cụ thể vẫn phụ thuộc triển khai.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **vô hiệu hóa mọi cấu hình lưu giữ dữ liệu, biện pháp kiểm soát che giấu dữ liệu và việc xử lý quyền của chủ thể dữ liệu để đơn giản hóa vận hành hằng ngày, chấp nhận rủi ro tuân thủ GDPR phát sinh**: Bỏ retention, redaction và xử lý quyền dữ liệu loại các cơ chế giới hạn lưu trữ, tối thiểu hóa và đáp ứng yêu cầu cá nhân.\n- **dán toàn bộ dữ liệu cá nhân của EU vào mọi prompt để \"cung cấp cho Claude ngữ cảnh đầy đủ\" mà không cân nhắc nguyên tắc giới hạn mục đích, tối thiểu hóa dữ liệu hay các nghĩa vụ theo Data Processing Addendum của tổ chức**: Đưa toàn dữ liệu cá nhân vào mọi prompt không xét nhu cầu là trái mục tiêu tối thiểu hóa và tạo phơi lộ không cần thiết.\n- **dùng một hạng tài khoản Claude cá nhân để xử lý dữ liệu cá nhân của EU ở quy mô lớn, không có Data Processing Addendum đã ký và không có quy trình xử lý quyền của chủ thể dữ liệu được ghi nhận**: Tài khoản cá nhân không có thỏa thuận xử lý áp dụng và quy trình quyền chủ thể để lại khoảng trống quản trị; điểm yếu là thiếu cơ chế, không chỉ tên hạng tài khoản.\n\n**Cần xem lại:** Giữ khóa nguồn nhưng tránh dạy rằng chỉ enterprise-tier mới hỗ trợ GDPR hoặc DPA luôn phải ký riêng; cần xác định căn cứ pháp lý và điều khoản áp dụng cho sản phẩm cụ thể.\n\n**Tham khảo:**\n\n- [Data Processing Addendum](https://www.anthropic.com/legal/data-processing-addendum)\n- [How do I view and sign your Data Processing Addendum?](https://privacy.claude.com/en/articles/7996862-how-do-i-view-and-sign-your-data-processing-addendum-dpa)"}, {"n": 100, "set": 2, "i": 40, "multi": true, "answer": ["D", "E"], "en": {"stem": "You are designing a human-in-the-loop validation workflow for a new Claude-based deployment and must\ncomplete the design steps before piloting the workflow.\n\nWhich two steps must be completed BEFORE piloting the workflow with a representative subset of traffic?\n(Choose two.)\nEach correct answer presents part of the solution.", "opts": [["A", "Onboard the reviewer pool with role-specific training on the check criteria and escalation procedures."], ["B", "Iterate the workflow design based on observed pilot findings before broader rollout to production."], ["C", "Document the workflow with check criteria, escalation paths, and service-level agreements (SLAs) for each step."], ["D", "Define the sampling strategy and the escalation criteria at each oversight point in the pipeline."], ["E", "Identify the decision points in the pipeline that require human oversight by impact and reversibility."]]}, "vi": {"stem": "Bạn đang thiết kế một workflow xác thực có con người tham gia (human-in-the-loop) cho một hệ thống triển khai mới dựa trên Claude và phải hoàn tất các bước thiết kế trước khi chạy thí điểm workflow.\n\nHai bước nào phải được hoàn tất TRƯỚC KHI chạy thí điểm workflow với một tập con lưu lượng mang tính đại diện?\n(Chọn hai.)\nMỗi đáp án đúng là một phần của giải pháp.", "opts": [["A", "Đưa nhóm người rà soát vào làm việc (onboard) với đào tạo theo vai trò về tiêu chí kiểm tra và quy trình leo thang."], ["B", "Lặp cải tiến thiết kế workflow dựa trên các phát hiện quan sát được từ đợt thí điểm trước khi triển khai rộng hơn lên production."], ["C", "Ghi lại tài liệu về workflow với tiêu chí kiểm tra, lộ trình leo thang và thỏa thuận mức dịch vụ (SLA) cho từng bước."], ["D", "Xác định chiến lược lấy mẫu và tiêu chí leo thang tại mỗi điểm giám sát trong pipeline."], ["E", "Xác định các điểm quyết định trong pipeline cần sự giám sát của con người, dựa trên mức độ tác động và khả năng đảo ngược."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Xác định chiến lược lấy mẫu và tiêu chí leo thang tại mỗi điểm giám sát trong pipeline.; Xác định các điểm quyết định trong pipeline cần sự giám sát của con người, dựa trên mức độ tác động và khả năng đảo ngược.\n\nHai quyết định nền tảng mà khóa nguồn chọn là xác định điểm cần người giám sát theo tác động/khả năng đảo ngược và thiết kế lấy mẫu, escalation tại từng điểm. Chúng xác định ai phải xem loại đầu ra nào trước khi pilot. Tuy nhiên câu hỏi “phải hoàn tất trước pilot” quá rộng: tài liệu tiêu chí và đào tạo reviewer cũng có thể là điều kiện sẵn sàng bắt buộc, nên giữ cờ cần duyệt.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Đưa nhóm người rà soát vào làm việc (onboard) với đào tạo theo vai trò về tiêu chí kiểm tra và quy trình leo thang.**: Đào tạo reviewer theo tiêu chí và escalation là hoạt động hợp lệ, thường cần trước pilot có người tham gia; khóa chỉ ưu tiên hai quyết định thiết kế nền tảng, không chứng minh đào tạo là bước sau pilot.\n- **Lặp cải tiến thiết kế workflow dựa trên các phát hiện quan sát được từ đợt thí điểm trước khi triển khai rộng hơn lên production.**: Sửa theo phát hiện pilot cần đã có dữ liệu pilot, nên không thể hoàn tất trước pilot đầu tiên.\n- **Ghi lại tài liệu về workflow với tiêu chí kiểm tra, lộ trình leo thang và thỏa thuận mức dịch vụ (SLA) cho từng bước.**: Tài liệu check criteria, escalation và SLA cũng có thể cần trước pilot để reviewer làm nhất quán; đây là phương án hợp lý bị khóa giới hạn hai lựa chọn bỏ qua.\n\n**Cần xem lại:** Câu hỏi Choose two nhưng onboarding reviewer và documentation cũng có thể bắt buộc trước pilot. Cần giới hạn thành hai quyết định thiết kế nền tảng để khóa nguồn không loại bỏ sai các yêu cầu vận hành.\n\n**Tham khảo:**\n\n- [AI RMF Core](https://airc.nist.gov/airmf-resources/airmf/5-sec-core/)"}, {"n": 101, "set": 2, "i": 41, "multi": true, "answer": ["C", "E"], "en": {"stem": "An architect at Trenova Systems, Inc. is reviewing two draft communication packages for the same architectural\ndecision.\n\nPackage 1 contains a threat model, residual-risk register, and control-mapping table.\n\nPackage 2 contains\na list of capabilities delivered and feature-level roadmap dependencies.\n\nWhich two audiences are correctly matched to these packages? (Choose two.)", "opts": [["A", "Package 2 --> executive sponsor"], ["B", "Package 1 --> engineering implementation team"], ["C", "Package 2 --> product manager owning the roadmap"], ["D", "Package 2 --> security and compliance reviewer"], ["E", "Package 1 --> security and compliance reviewer"]]}, "vi": {"stem": "Một kiến trúc sư tại Trenova Systems, Inc. đang rà soát hai gói truyền thông dự thảo cho cùng một quyết định kiến trúc. Gói 1 gồm mô hình mối đe dọa (threat model), sổ đăng ký rủi ro tồn dư và bảng ánh xạ biện pháp kiểm soát. Gói 2 gồm danh sách các năng lực đã bàn giao và các phụ thuộc lộ trình (roadmap) ở cấp tính năng.\nHai đối tượng nào được ghép đúng với các gói này? (Chọn hai.)", "opts": [["A", "Gói 2 --> nhà tài trợ cấp điều hành (executive sponsor)"], ["B", "Gói 1 --> nhóm kỹ thuật triển khai"], ["C", "Gói 2 --> product manager phụ trách lộ trình"], ["D", "Gói 2 --> người rà soát bảo mật và tuân thủ"], ["E", "Gói 1 --> người rà soát bảo mật và tuân thủ"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Gói 2 --> product manager phụ trách lộ trình; Gói 1 --> người rà soát bảo mật và tuân thủ\n\nThreat model, residual-risk register và bảng map kiểm soát phục vụ security/compliance reviewer đánh giá nguy cơ và độ bao phủ kiểm soát. Danh sách năng lực và phụ thuộc roadmap theo tính năng phù hợp product manager quyết định thứ tự giao hàng; đây là hai audience khớp trực tiếp nhất, dù tài liệu có thể được chia sẻ rộng hơn.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Gói 2 --> nhà tài trợ cấp điều hành (executive sponsor)**: Executive sponsor có thể quan tâm năng lực, nhưng package theo phụ thuộc từng tính năng trực tiếp phục vụ người quản lý roadmap hơn bản tổng hợp giá trị và quyết định đầu tư.\n- **Gói 1 --> nhóm kỹ thuật triển khai**: Kỹ sư có thể dùng threat model, nhưng một bộ chủ yếu rủi ro và mapping kiểm soát không thay hợp đồng giao diện, luồng thực thi và cấu hình cần để xây.\n- **Gói 2 --> người rà soát bảo mật và tuân thủ**: Danh sách feature và roadmap không cung cấp phân tích đe dọa hay bằng chứng kiểm soát mà người duyệt tuân thủ cần.\n\n**Tham khảo:**\n\n- [AI RMF Core](https://airc.nist.gov/airmf-resources/airmf/5-sec-core/)\n- [Architectural decision record process](https://docs.aws.amazon.com/prescriptive-guidance/latest/architectural-decision-records/adr-process.html)"}, {"n": 102, "set": 2, "i": 42, "multi": false, "answer": ["D"], "en": {"stem": "You are reviewing a peer’s draft ADR.\n\nThe ADR states the decision and the technical detail but does not state the\nalternatives considered or the trade-offs accepted.\n\nWhich response is most appropriate?", "opts": [["A", "Delete the ADR entirely and rely on the engineering team’s collective memory to reconstruct the decision context, alternatives, and trade-offs during future audits or onboarding."], ["B", "Approve the ADR as written on the grounds that the decision itself is documented, accepting that reviewers and future maintainers will lack the context to evaluate or revisit it."], ["C", "Replace the ADR with a different decision unrelated to the one drafted."], ["D", "Ask the author to add the alternatives considered and the trade-offs accepted before publishing the ADR."]]}, "vi": {"stem": "Bạn đang rà soát bản nháp ADR của một đồng nghiệp. ADR nêu quyết định và chi tiết kỹ thuật nhưng không nêu các phương án thay thế đã cân nhắc hay các đánh đổi đã chấp nhận.\n\nCách phản hồi nào phù hợp nhất?", "opts": [["A", "Xóa hoàn toàn ADR và dựa vào trí nhớ tập thể của nhóm kỹ thuật để tái dựng bối cảnh quyết định, các phương án thay thế và các đánh đổi trong các đợt kiểm toán hoặc onboarding sau này."], ["B", "Phê duyệt ADR như đã viết với lý do bản thân quyết định đã được ghi lại, chấp nhận rằng người rà soát và những người bảo trì sau này sẽ thiếu bối cảnh để đánh giá hoặc xem xét lại quyết định."], ["C", "Thay ADR bằng một quyết định khác không liên quan đến quyết định đã được soạn thảo."], ["D", "Yêu cầu tác giả bổ sung các phương án thay thế đã cân nhắc và các đánh đổi đã chấp nhận trước khi công bố ADR."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Yêu cầu tác giả bổ sung các phương án thay thế đã cân nhắc và các đánh đổi đã chấp nhận trước khi công bố ADR.\n\nYêu cầu bổ sung các lựa chọn đã cân nhắc và đánh đổi được chấp nhận giúp ADR giải thích vì sao quyết định phù hợp với ràng buộc khi đó. Người bảo trì sau này có thể xem điều kiện nào đã đổi trước khi quyết định lại, thay vì chỉ thấy chi tiết kỹ thuật của giải pháp được chọn.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Xóa hoàn toàn ADR và dựa vào trí nhớ tập thể của nhóm kỹ thuật để tái dựng bối cảnh quyết định, các phương án thay thế và các đánh đổi trong các đợt kiểm toán hoặc onboarding sau này.**: Xóa ADR làm mất cả quyết định đã ghi và phụ thuộc trí nhớ của người có thể không còn ở dự án.\n- **Phê duyệt ADR như đã viết với lý do bản thân quyết định đã được ghi lại, chấp nhận rằng người rà soát và những người bảo trì sau này sẽ thiếu bối cảnh để đánh giá hoặc xem xét lại quyết định.**: Chỉ phê duyệt quyết định hiện tại để lại thiếu lý do và hệ quả, khiến người sau khó đánh giá hoặc điều chỉnh.\n- **Thay ADR bằng một quyết định khác không liên quan đến quyết định đã được soạn thảo.**: Đổi sang quyết định không liên quan không sửa tài liệu thiếu và còn thay phạm vi mà không có lý do từ bài toán.\n\n**Tham khảo:**\n\n- [Architectural decision record process](https://docs.aws.amazon.com/prescriptive-guidance/latest/architectural-decision-records/adr-process.html)"}, {"n": 103, "set": 2, "i": 43, "multi": true, "answer": ["A", "C"], "en": {"stem": "You are running a discovery engagement for a new Claude-based capability and must complete the requirements-\ngathering steps before validating with stakeholders.\n\nWhich two steps must be completed BEFORE validating the captured requirements with stakeholders? (Choose\ntwo.)\nEach correct answer presents part of the solution.", "opts": [["A", "Capture the business goals, success criteria, and the in-scope user population for the engagement."], ["B", "Produce architecture decision records that capture the rationale for major design choices."], ["C", "Identify the non-functional constraints covering latency, cost, audit, data sensitivity, and regulatory needs."], ["D", "Schedule the rollout milestones and dependencies with engineering and product partners."], ["E", "Document the consolidated requirements with traceability to the source stakeholder for each item."]]}, "vi": {"stem": "Bạn đang thực hiện một đợt khám phá (discovery) cho một năng lực mới dựa trên Claude và phải hoàn tất các bước thu thập yêu cầu trước khi xác nhận với các bên liên quan.\n\nHai bước nào phải được hoàn tất TRƯỚC KHI xác nhận các yêu cầu đã thu thập với các bên liên quan? (Chọn hai.)\nMỗi đáp án đúng là một phần của giải pháp.", "opts": [["A", "Ghi nhận các mục tiêu kinh doanh, tiêu chí thành công và nhóm người dùng nằm trong phạm vi của đợt triển khai."], ["B", "Soạn các bản ghi quyết định kiến trúc (ADR) ghi lại lý do cho các lựa chọn thiết kế quan trọng."], ["C", "Xác định các ràng buộc phi chức năng bao gồm latency, chi phí, kiểm toán, độ nhạy cảm của dữ liệu và các yêu cầu pháp lý."], ["D", "Lên lịch các mốc triển khai và các phụ thuộc với các đối tác kỹ thuật và sản phẩm."], ["E", "Ghi lại các yêu cầu đã hợp nhất, kèm khả năng truy vết tới bên liên quan là nguồn gốc của từng mục."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Ghi nhận các mục tiêu kinh doanh, tiêu chí thành công và nhóm người dùng nằm trong phạm vi của đợt triển khai.; Xác định các ràng buộc phi chức năng bao gồm latency, chi phí, kiểm toán, độ nhạy cảm của dữ liệu và các yêu cầu pháp lý.\n\nMục tiêu kinh doanh, tiêu chí thành công và nhóm người dùng xác định kết quả và phạm vi cần xác nhận. Các giới hạn latency, chi phí, audit, dữ liệu và quy định xác định điều kiện giải pháp phải đáp ứng. Khóa nguồn chọn hai nhóm nội dung này, nhưng tài liệu hợp nhất có traceability cũng có thể cần trước validation; không nên diễn giải rằng việc ghi yêu cầu chỉ làm sau khi xác nhận.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Soạn các bản ghi quyết định kiến trúc (ADR) ghi lại lý do cho các lựa chọn thiết kế quan trọng.**: ADR ghi lựa chọn thiết kế dựa trên yêu cầu; chốt lý do kiến trúc không phải công việc thu thập yêu cầu cốt lõi trước xác nhận.\n- **Lên lịch các mốc triển khai và các phụ thuộc với các đối tác kỹ thuật và sản phẩm.**: Mốc rollout và phụ thuộc là kế hoạch giao hàng cần dựa vào phạm vi đã hiểu, không thay việc thu thập mục tiêu và ràng buộc.\n- **Ghi lại các yêu cầu đã hợp nhất, kèm khả năng truy vết tới bên liên quan là nguồn gốc của từng mục.**: Hợp nhất yêu cầu và chỉ ra stakeholder nguồn là thực hành đúng, có thể phải có trước validation. Vì thế đây là phương án hợp lý ngoài khóa, làm câu hỏi choose-two cần sửa.\n\n**Cần xem lại:** Giữ khóa nguồn. Documentation có traceability cũng là bước có thể phải hoàn tất trước validation; nên hỏi hai nhóm nội dung cần thu thập để tránh nhiều hơn hai đáp án hợp lý.\n\n**Tham khảo:**\n\n- [Define success criteria and build evaluations](https://platform.claude.com/docs/en/test-and-evaluate/develop-tests)\n- [Architectural decision record process](https://docs.aws.amazon.com/prescriptive-guidance/latest/architectural-decision-records/adr-process.html)"}, {"n": 104, "set": 2, "i": 44, "multi": false, "answer": ["B"], "en": {"stem": "You are defining an SLA for a Claude-based assistant.\n\nWhich SLA definition is most operationally meaningful?", "opts": [["A", "a target that names the metric and threshold but omits the evaluation window and breach consequence, leaving compliance periods and remediation triggers undefined"], ["B", "a measurable target with a defined metric, threshold, evaluation window, and consequence for breach (for example, “p95 per-request latency under 800 ms over a 28-day window”)"], ["C", "a qualitative commitment such as “the system will be fast and reliable” , which names no metric, no threshold, and no evaluation window"], ["D", "a target tied to a stakeholder sentiment measure such as “the team feels satisfied” , which cannot be measured objectively or used to trigger a documented breach response"]]}, "vi": {"stem": "Bạn đang định nghĩa một SLA cho một trợ lý dựa trên Claude.\n\nĐịnh nghĩa SLA nào có ý nghĩa vận hành nhất?", "opts": [["A", "một mục tiêu nêu tên metric và ngưỡng nhưng bỏ qua khoảng thời gian đánh giá và hệ quả khi vi phạm, khiến các kỳ đánh giá tuân thủ và các điều kiện kích hoạt khắc phục không được xác định"], ["B", "một mục tiêu đo lường được với metric, ngưỡng, khoảng thời gian đánh giá và hệ quả khi vi phạm được xác định rõ (ví dụ: “latency p95 cho mỗi yêu cầu dưới 800 ms trong khoảng 28 ngày”)"], ["C", "một cam kết định tính như “hệ thống sẽ nhanh và đáng tin cậy”, không nêu metric, ngưỡng hay khoảng thời gian đánh giá nào"], ["D", "một mục tiêu gắn với thước đo cảm nhận của bên liên quan như “nhóm cảm thấy hài lòng”, vốn không thể đo lường khách quan hay dùng để kích hoạt một quy trình phản ứng vi phạm đã được ghi nhận"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** một mục tiêu đo lường được với metric, ngưỡng, khoảng thời gian đánh giá và hệ quả khi vi phạm được xác định rõ (ví dụ: “latency p95 cho mỗi yêu cầu dưới 800 ms trong khoảng 28 ngày”)\n\nSLA có metric/threshold/window/breach condition mới kiểm tra được; p95 800ms trong 28 ngày là phần target phải kèm hậu quả vi phạm đã thống nhất.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **một mục tiêu nêu tên metric và ngưỡng nhưng bỏ qua khoảng thời gian đánh giá và hệ quả khi vi phạm, khiến các kỳ đánh giá tuân thủ và các điều kiện kích hoạt khắc phục không được xác định**: Thiếu window và consequence không rõ kỳ đo và hành động khi sai.\n- **một cam kết định tính như “hệ thống sẽ nhanh và đáng tin cậy”, không nêu metric, ngưỡng hay khoảng thời gian đánh giá nào**: “Fast and reliable” không có chỉ số định lượng.\n- **một mục tiêu gắn với thước đo cảm nhận của bên liên quan như “nhóm cảm thấy hài lòng”, vốn không thể đo lường khách quan hay dùng để kích hoạt một quy trình phản ứng vi phạm đã được ghi nhận**: Cảm giác satisfaction chưa có thước đo khách quan.\n\n**Tham khảo:**\n\n- [Google SRE — Implementing SLOs](https://sre.google/workbook/implementing-slos/)"}, {"n": 105, "set": 2, "i": 45, "multi": false, "answer": ["C"], "en": {"stem": "You are selecting the documentation set that should accompany a Claude-based deployment at handoff.\n\nWhich set is most complete?", "opts": [["A", "a verbal handover walkthrough conducted on the day of transition, with no written architecture overview, ADRs, runbooks, playbook, or known limitations captured for future reference"], ["B", "code comments scattered across individual source files with no integrating architecture overview, no ADRs, no runbooks, and no on-call playbook to orient operators or new team members"], ["C", "architecture overview, ADRs, component-level diagrams, runbooks for common operations, on-call playbook, and a list of known limitations"], ["D", "a single one-page architecture diagram with no ADRs, no runbooks, no on-call playbook, and no list of known limitations to support operators or future maintainers"]]}, "vi": {"stem": "Bạn đang chọn bộ tài liệu đi kèm một hệ thống triển khai dựa trên Claude khi bàn giao.\n\nBộ tài liệu nào đầy đủ nhất?", "opts": [["A", "một buổi hướng dẫn bàn giao bằng lời vào ngày chuyển giao, không có bản tổng quan kiến trúc, ADR, runbook, playbook hay các giới hạn đã biết được ghi lại bằng văn bản để tham khảo sau này"], ["B", "các chú thích mã (code comment) rải rác trong từng tệp nguồn, không có bản tổng quan kiến trúc tích hợp, không có ADR, không có runbook và không có playbook trực on-call để định hướng cho người vận hành hay thành viên mới"], ["C", "bản tổng quan kiến trúc, ADR, sơ đồ cấp thành phần, runbook cho các thao tác vận hành thường gặp, playbook trực on-call và danh sách các giới hạn đã biết"], ["D", "một sơ đồ kiến trúc duy nhất dài một trang, không có ADR, không có runbook, không có playbook trực on-call và không có danh sách các giới hạn đã biết để hỗ trợ người vận hành hay những người bảo trì sau này"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** bản tổng quan kiến trúc, ADR, sơ đồ cấp thành phần, runbook cho các thao tác vận hành thường gặp, playbook trực on-call và danh sách các giới hạn đã biết\n\nBộ gồm tổng quan kiến trúc, ADR, sơ đồ thành phần, runbook, playbook on-call và giới hạn đã biết bao phủ cách hệ thống tổ chức, vì sao được chọn, cách vận hành và khi nào cần can thiệp. Sự kết hợp này giúp nhóm nhận bàn giao có tài liệu bền vững cho cả bảo trì lẫn sự cố.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **một buổi hướng dẫn bàn giao bằng lời vào ngày chuyển giao, không có bản tổng quan kiến trúc, ADR, runbook, playbook hay các giới hạn đã biết được ghi lại bằng văn bản để tham khảo sau này**: Walkthrough bằng lời có thể bổ trợ nhưng không lưu cách vận hành hoặc giới hạn để người vắng mặt và ca trực tương lai tra cứu.\n- **các chú thích mã (code comment) rải rác trong từng tệp nguồn, không có bản tổng quan kiến trúc tích hợp, không có ADR, không có runbook và không có playbook trực on-call để định hướng cho người vận hành hay thành viên mới**: Comment mã giải thích cục bộ, không kết nối bức tranh hệ thống, lý do quyết định và hành động xử lý sự cố.\n- **một sơ đồ kiến trúc duy nhất dài một trang, không có ADR, không có runbook, không có playbook trực on-call và không có danh sách các giới hạn đã biết để hỗ trợ người vận hành hay những người bảo trì sau này**: Một sơ đồ một trang cho biết hình dạng hệ thống nhưng thiếu hướng dẫn thao tác, hệ quả quyết định và giới hạn cần khi vận hành.\n\n**Tham khảo:**\n\n- [Architectural decision record process](https://docs.aws.amazon.com/prescriptive-guidance/latest/architectural-decision-records/adr-process.html)\n- [AI RMF Core](https://airc.nist.gov/airmf-resources/airmf/5-sec-core/)"}, {"n": 106, "set": 2, "i": 46, "multi": false, "answer": ["B"], "en": {"stem": "A Claude Architect is reviewing a post-deployment performance report for an AI-assisted legal document summarization system.\n\nThe report includes the following observations:\n\n(1) Average summarization time has decreased from 47 minutes to 6 minutes per document.\n\n(2) Associates report spending less time on summaries but no measurable change in overall billable output.\n\n(3) Infrastructure costs have increased 22% due to higher API call volume from a redundant retry logic implementation.\n\n(4) The system occasionally generates summaries requiring attorney correction, adding an average of 8 minutes of review time per document.\n\nWhich analysis correctly attributes each observation to the appropriate business value pillar?", "opts": [["A", "Observation 1 indicates a transformation outcome; Observation 2 indicates an efficiency gain; Observation 3 indicates a performance SLA degradation; Observation 4 indicates a solution cost issue."], ["B", "Observation 1 indicates an efficiency gain; Observation 2 indicates that productivity has not yet been realized; Observation 3 indicates a solution cost issue; Observation 4 indicates an efficiency loss that partially offsets the gain from Observation 1."], ["C", "Observations 1 and 4 together indicate a net performance SLA improvement; Observation 2 indicates a transformation gap; Observation 3 indicates a productivity drain from over-engineering."], ["D", "Observations 1 and 2 both indicate efficiency gains; Observation 3 indicates a solution cost issue; Observation 4 indicates a performance SLA issue."]]}, "vi": {"stem": "Một Claude Architect đang rà soát báo cáo hiệu năng sau triển khai của một hệ thống tóm tắt tài liệu pháp lý có sự hỗ trợ của AI. Báo cáo gồm các quan sát sau:\n\n(1) Thời gian tóm tắt trung bình đã giảm từ 47 phút xuống 6 phút cho mỗi tài liệu.\n\n(2) Các luật sư cộng sự (associate) cho biết họ dành ít thời gian hơn cho việc tóm tắt nhưng tổng sản lượng tính phí (billable output) không có thay đổi đo lường được.\n\n(3) Chi phí hạ tầng đã tăng 22% do lưu lượng lệnh gọi API cao hơn xuất phát từ một cài đặt logic thử lại (retry) dư thừa.\n\n(4) Hệ thống thỉnh thoảng tạo ra các bản tóm tắt cần luật sư chỉnh sửa, làm tăng thêm trung bình 8 phút rà soát cho mỗi tài liệu.\n\nPhân tích nào quy đúng mỗi quan sát vào trụ cột giá trị kinh doanh phù hợp?", "opts": [["A", "Quan sát 1 cho thấy một kết quả chuyển đổi (transformation); Quan sát 2 cho thấy lợi ích về hiệu suất (efficiency); Quan sát 3 cho thấy sự suy giảm SLA hiệu năng (performance SLA); Quan sát 4 cho thấy vấn đề chi phí giải pháp (solution cost)."], ["B", "Quan sát 1 cho thấy lợi ích về hiệu suất; Quan sát 2 cho thấy năng suất (productivity) chưa được hiện thực hóa; Quan sát 3 cho thấy vấn đề chi phí giải pháp; Quan sát 4 cho thấy sự sụt giảm hiệu suất bù trừ một phần cho lợi ích từ Quan sát 1."], ["C", "Quan sát 1 và 4 cùng nhau cho thấy SLA hiệu năng được cải thiện ròng; Quan sát 2 cho thấy một khoảng trống về chuyển đổi; Quan sát 3 cho thấy sự hao hụt năng suất do thiết kế quá mức (over-engineering)."], ["D", "Quan sát 1 và 2 đều cho thấy lợi ích về hiệu suất; Quan sát 3 cho thấy vấn đề chi phí giải pháp; Quan sát 4 cho thấy vấn đề SLA hiệu năng."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Quan sát 1 cho thấy lợi ích về hiệu suất; Quan sát 2 cho thấy năng suất (productivity) chưa được hiện thực hóa; Quan sát 3 cho thấy vấn đề chi phí giải pháp; Quan sát 4 cho thấy sự sụt giảm hiệu suất bù trừ một phần cho lợi ích từ Quan sát 1.\n\n47→6 phút giảm effort; 8 phút sửa bù lại một phần tiết kiệm, billable output chưa tăng nên chưa có productivity gain đo được; API tăng là solution cost.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Quan sát 1 cho thấy một kết quả chuyển đổi (transformation); Quan sát 2 cho thấy lợi ích về hiệu suất (efficiency); Quan sát 3 cho thấy sự suy giảm SLA hiệu năng (performance SLA); Quan sát 4 cho thấy vấn đề chi phí giải pháp (solution cost).**: Tiết kiệm thời gian không tự là transformation; API cost không phải SLA.\n- **Quan sát 1 và 4 cùng nhau cho thấy SLA hiệu năng được cải thiện ròng; Quan sát 2 cho thấy một khoảng trống về chuyển đổi; Quan sát 3 cho thấy sự hao hụt năng suất do thiết kế quá mức (over-engineering).**: Không có threshold SLA nào để gán net SLA improvement.\n- **Quan sát 1 và 2 đều cho thấy lợi ích về hiệu suất; Quan sát 3 cho thấy vấn đề chi phí giải pháp; Quan sát 4 cho thấy vấn đề SLA hiệu năng.**: Correction effort không tự là performance-SLA breach.\n\n**Tham khảo:**\n\n- [Microsoft — Architecture decision records](https://learn.microsoft.com/en-us/azure/well-architected/architect-role/architecture-decision-record)"}, {"n": 107, "set": 2, "i": 47, "multi": true, "answer": ["B", "E"], "en": {"stem": "You are building a feedback-and-alignment routine for a multi-stakeholder deployment.\n\nWhich two practices belong in the routine? (Choose two.)\nEach correct answer presents a complete solution.", "opts": [["A", "Record each session and distribute the recording to stakeholders who could not attend live."], ["B", "Set a regular cadence for revisiting expectations and assumptions as conditions evolve over time."], ["C", "Escalate any disagreement among stakeholders to the executive sponsor for binding resolution."], ["D", "Rotate facilitation among the participating stakeholder groups to share ownership of the routine."], ["E", "Reconcile divergent stakeholder positions explicitly rather than papering over them in the moment."]]}, "vi": {"stem": "Bạn đang xây dựng một quy trình định kỳ thu thập phản hồi và thống nhất kỳ vọng cho một hệ thống triển khai có nhiều bên liên quan.\n\nHai thực hành nào thuộc quy trình này? (Chọn hai.)\nMỗi đáp án đúng là một giải pháp hoàn chỉnh.", "opts": [["A", "Ghi hình mỗi buổi họp và gửi bản ghi cho các bên liên quan không thể tham dự trực tiếp."], ["B", "Thiết lập nhịp định kỳ để xem xét lại các kỳ vọng và giả định khi điều kiện thay đổi theo thời gian."], ["C", "Chuyển mọi bất đồng giữa các bên liên quan lên nhà tài trợ cấp điều hành để có quyết định ràng buộc."], ["D", "Luân phiên vai trò điều phối giữa các nhóm bên liên quan tham gia để cùng chia sẻ quyền sở hữu quy trình."], ["E", "Hòa giải các quan điểm khác biệt giữa các bên liên quan một cách rõ ràng thay vì che lấp chúng cho qua chuyện."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Thiết lập nhịp định kỳ để xem xét lại các kỳ vọng và giả định khi điều kiện thay đổi theo thời gian.; Hòa giải các quan điểm khác biệt giữa các bên liên quan một cách rõ ràng thay vì che lấp chúng cho qua chuyện.\n\nLịch xem lại kỳ vọng và giả định tạo cơ hội điều chỉnh khi điều kiện đổi. Giải quyết rõ các quan điểm khác nhau giúp nhóm ghi nhận thỏa thuận và đánh đổi thật sự, thay vì mang mâu thuẫn chưa xử lý sang thiết kế hoặc triển khai.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Ghi hình mỗi buổi họp và gửi bản ghi cho các bên liên quan không thể tham dự trực tiếp.**: Ghi hình và gửi lại hỗ trợ người vắng mặt nhưng không tự kiểm tra giả định hoặc giải quyết bất đồng.\n- **Chuyển mọi bất đồng giữa các bên liên quan lên nhà tài trợ cấp điều hành để có quyết định ràng buộc.**: Đẩy mọi bất đồng lên sponsor làm mất cơ hội giải quyết ở cấp phù hợp; escalation nên dành cho xung đột vượt quyền hoặc bế tắc đã xác định.\n- **Luân phiên vai trò điều phối giữa các nhóm bên liên quan tham gia để cùng chia sẻ quyền sở hữu quy trình.**: Luân phiên điều phối có thể tăng sở hữu chung, nhưng không bảo đảm các kỳ vọng thay đổi được xét lại hay mâu thuẫn được tháo gỡ.\n\n**Tham khảo:**\n\n- [AI RMF Core](https://airc.nist.gov/airmf-resources/airmf/5-sec-core/)"}, {"n": 108, "set": 2, "i": 48, "multi": false, "answer": ["D"], "en": {"stem": "You are choosing the level of detail for an implementation guide.\n\nThe audience is a delivery team that will build the\ndeployment.\n\nWhich guidance composition best serves them?", "opts": [["A", "component responsibilities and interface contracts only, without sequence diagrams of the dominant flows, configuration parameters with defaults, or runbooks to guide operational tasks"], ["B", "an architecture overview and sequence diagrams for the dominant flows, without interface contracts, configuration parameter tables, or operational runbooks for the delivery team to follow"], ["C", "an architecture overview and a list of known limitations, without component-level diagrams, interface contracts, configuration parameters, or operational runbooks to support implementation"], ["D", "component responsibilities, contracts between components, sequence diagrams of the dominant flows, configuration parameters with defaults, and operational runbooks"]]}, "vi": {"stem": "Bạn đang chọn mức độ chi tiết cho một hướng dẫn triển khai. Đối tượng người đọc là một nhóm triển khai (delivery team) sẽ xây dựng hệ thống.\n\nThành phần hướng dẫn nào phục vụ họ tốt nhất?", "opts": [["A", "chỉ trách nhiệm của các thành phần và hợp đồng giao tiếp (interface contract), không có sơ đồ tuần tự (sequence diagram) cho các luồng chủ đạo, tham số cấu hình kèm giá trị mặc định hay runbook để hướng dẫn các tác vụ vận hành"], ["B", "bản tổng quan kiến trúc và sơ đồ tuần tự cho các luồng chủ đạo, không có hợp đồng giao tiếp, bảng tham số cấu hình hay runbook vận hành để nhóm triển khai làm theo"], ["C", "bản tổng quan kiến trúc và danh sách các giới hạn đã biết, không có sơ đồ cấp thành phần, hợp đồng giao tiếp, tham số cấu hình hay runbook vận hành để hỗ trợ việc triển khai"], ["D", "trách nhiệm của các thành phần, hợp đồng giao tiếp giữa các thành phần, sơ đồ tuần tự cho các luồng chủ đạo, tham số cấu hình kèm giá trị mặc định và runbook vận hành"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** trách nhiệm của các thành phần, hợp đồng giao tiếp giữa các thành phần, sơ đồ tuần tự cho các luồng chủ đạo, tham số cấu hình kèm giá trị mặc định và runbook vận hành\n\nĐội triển khai cần biết trách nhiệm từng thành phần, contract giao tiếp, thứ tự tương tác, tham số cùng mặc định và thao tác vận hành. Bộ đầy đủ nối ý định kiến trúc với các chi tiết có thể xây, cấu hình và hỗ trợ thực tế.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **chỉ trách nhiệm của các thành phần và hợp đồng giao tiếp (interface contract), không có sơ đồ tuần tự (sequence diagram) cho các luồng chủ đạo, tham số cấu hình kèm giá trị mặc định hay runbook để hướng dẫn các tác vụ vận hành**: Trách nhiệm và contract thiếu trình tự luồng, cấu hình mặc định và runbook nên đội vẫn phải đoán cách ráp và vận hành.\n- **bản tổng quan kiến trúc và sơ đồ tuần tự cho các luồng chủ đạo, không có hợp đồng giao tiếp, bảng tham số cấu hình hay runbook vận hành để nhóm triển khai làm theo**: Tổng quan và sequence diagram chỉ ra luồng nhưng thiếu contract chính xác, tham số và quy trình vận hành cần để hiện thực.\n- **bản tổng quan kiến trúc và danh sách các giới hạn đã biết, không có sơ đồ cấp thành phần, hợp đồng giao tiếp, tham số cấu hình hay runbook vận hành để hỗ trợ việc triển khai**: Tổng quan và giới hạn giúp định hướng nhưng thiếu chi tiết thành phần, giao diện, cấu hình và thao tác để đội xây hệ thống.\n\n**Tham khảo:**\n\n- [Architectural decision record process](https://docs.aws.amazon.com/prescriptive-guidance/latest/architectural-decision-records/adr-process.html)"}, {"n": 109, "set": 2, "i": 49, "multi": false, "answer": ["B"], "en": {"stem": "You are running a discovery session with a business sponsor who asks for “an AI system to fix our customer\nescalations”\n.\n\nWhich approach best yields actionable requirements?", "opts": [["A", "Defer the discovery session indefinitely on the grounds that the sponsor must fully specify the system before the architect can ask any clarifying or scoping questions."], ["B", "Decompose the request by asking targeted questions about who escalates, what triggers escalation, what good resolution looks like, and which constraints (latency, cost, audit, data sensitivity) apply."], ["C", "Accept the sponsor’s original phrasing as a complete and final requirement and proceed directly to design without asking targeted questions to surface actors, triggers, or constraints."], ["D", "Assume the requirement matches the architect’s previous engagement in a different industry and proceed with that context, without validating actors, triggers, or constraints for this sponsor."]]}, "vi": {"stem": "Bạn đang tổ chức một buổi khám phá (discovery) với một nhà tài trợ nghiệp vụ, người yêu cầu “một hệ thống AI để khắc phục các vụ leo thang khiếu nại của khách hàng”.\n\nCách tiếp cận nào mang lại các yêu cầu có thể hành động được tốt nhất?", "opts": [["A", "Hoãn buổi khám phá vô thời hạn với lý do nhà tài trợ phải đặc tả đầy đủ hệ thống trước khi kiến trúc sư có thể đặt bất kỳ câu hỏi làm rõ hay xác định phạm vi nào."], ["B", "Phân rã yêu cầu bằng cách đặt các câu hỏi có trọng tâm về việc ai leo thang, điều gì kích hoạt leo thang, một cách giải quyết tốt trông như thế nào, và những ràng buộc nào (latency, chi phí, kiểm toán, độ nhạy cảm của dữ liệu) được áp dụng."], ["C", "Chấp nhận cách diễn đạt ban đầu của nhà tài trợ như một yêu cầu hoàn chỉnh và cuối cùng, rồi chuyển thẳng sang thiết kế mà không đặt các câu hỏi có trọng tâm để làm rõ các tác nhân, điều kiện kích hoạt hay ràng buộc."], ["D", "Giả định rằng yêu cầu giống với dự án trước đây của kiến trúc sư trong một ngành khác và tiếp tục với bối cảnh đó, mà không xác nhận các tác nhân, điều kiện kích hoạt hay ràng buộc đối với nhà tài trợ này."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Phân rã yêu cầu bằng cách đặt các câu hỏi có trọng tâm về việc ai leo thang, điều gì kích hoạt leo thang, một cách giải quyết tốt trông như thế nào, và những ràng buộc nào (latency, chi phí, kiểm toán, độ nhạy cảm của dữ liệu) được áp dụng.\n\nTách yêu cầu “sửa escalations” thành người tham gia, trigger, kết quả tốt và ràng buộc tạo yêu cầu có thể thiết kế và kiểm thử. Các câu hỏi latency, chi phí, audit và độ nhạy dữ liệu giúp giới hạn giải pháp trước khi chọn kỹ thuật.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Hoãn buổi khám phá vô thời hạn với lý do nhà tài trợ phải đặc tả đầy đủ hệ thống trước khi kiến trúc sư có thể đặt bất kỳ câu hỏi làm rõ hay xác định phạm vi nào.**: Hoãn vô hạn đòi sponsor tự làm toàn bộ discovery, trong khi vai trò của architect là giúp làm rõ đề bài.\n- **Chấp nhận cách diễn đạt ban đầu của nhà tài trợ như một yêu cầu hoàn chỉnh và cuối cùng, rồi chuyển thẳng sang thiết kế mà không đặt các câu hỏi có trọng tâm để làm rõ các tác nhân, điều kiện kích hoạt hay ràng buộc.**: Chấp nhận câu chung là yêu cầu cuối cùng bỏ trống tác nhân, trigger và tiêu chí thành công để đánh giá thiết kế.\n- **Giả định rằng yêu cầu giống với dự án trước đây của kiến trúc sư trong một ngành khác và tiếp tục với bối cảnh đó, mà không xác nhận các tác nhân, điều kiện kích hoạt hay ràng buộc đối với nhà tài trợ này.**: Mượn nguyên bối cảnh ngành khác có thể nhập sai quy trình hoặc giới hạn dữ liệu chưa được sponsor xác nhận.\n\n**Tham khảo:**\n\n- [Define success criteria and build evaluations](https://platform.claude.com/docs/en/test-and-evaluate/develop-tests)\n- [AI RMF Core](https://airc.nist.gov/airmf-resources/airmf/5-sec-core/)"}, {"n": 110, "set": 2, "i": 50, "multi": false, "answer": ["B"], "en": {"stem": "A business sponsor has requested an AI solution to “improve customer experience”\n.\n\nThe sponsor cannot articulate\nwhich customer journey is failing, which metric reflects the failure, or which decisions the AI should support.\n\nThe\nsponsor is asking you to begin design work next week.\n\nWhich delegation-competency action should you take first?", "opts": [["A", "Recommend that the sponsor revise the request and resubmit it later for evaluation."], ["B", "Facilitate a structured discovery to define the failing decision and the target metric."], ["C", "Propose a fixed scope that you commit to by default based on your own assumptions."], ["D", "Begin prototyping a generic assistant against the broad request before the next deadline."]]}, "vi": {"stem": "Một nhà tài trợ nghiệp vụ yêu cầu một giải pháp AI để “cải thiện trải nghiệm khách hàng”. Nhà tài trợ không thể nêu rõ hành trình khách hàng nào đang có vấn đề, metric nào phản ánh vấn đề đó, hay AI nên hỗ trợ những quyết định nào. Nhà tài trợ đang yêu cầu bạn bắt đầu công việc thiết kế vào tuần tới.\n\nBạn nên thực hiện hành động nào thuộc năng lực Delegation (Ủy thác) trước tiên?", "opts": [["A", "Đề nghị nhà tài trợ chỉnh sửa yêu cầu và gửi lại sau để được đánh giá."], ["B", "Điều phối một đợt khám phá có cấu trúc để xác định quyết định đang có vấn đề và metric mục tiêu."], ["C", "Đề xuất một phạm vi cố định mà bạn mặc định cam kết dựa trên các giả định của riêng mình."], ["D", "Bắt đầu làm prototype một trợ lý chung chung dựa trên yêu cầu rộng trước hạn chót tiếp theo."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Điều phối một đợt khám phá có cấu trúc để xác định quyết định đang có vấn đề và metric mục tiêu.\n\nFacilitate discovery để xác định quyết định hoặc hành trình đang thất bại và metric mục tiêu trước khi thiết kế. Làm rõ kết quả mong muốn giúp quyết định phần nào nên giao cho AI và tiêu chí nào chứng minh cải thiện, thay vì coi “customer experience” là phạm vi đủ rõ.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Đề nghị nhà tài trợ chỉnh sửa yêu cầu và gửi lại sau để được đánh giá.**: Yêu cầu sponsor nộp lại có thể trì hoãn mà không giúp họ tìm phần thiếu; workshop chủ động giải quyết khoảng trống đã biết.\n- **Đề xuất một phạm vi cố định mà bạn mặc định cam kết dựa trên các giả định của riêng mình.**: Cam kết scope theo giả định riêng có thể xây đúng giải pháp cho sai vấn đề và tạo kỳ vọng chưa được đồng thuận.\n- **Bắt đầu làm prototype một trợ lý chung chung dựa trên yêu cầu rộng trước hạn chót tiếp theo.**: Prototype assistant chung trước khi biết quyết định mục tiêu tạo hiện vật nhưng chưa có tiêu chuẩn để biết nó cải thiện trải nghiệm nào.\n\n**Tham khảo:**\n\n- [Define success criteria and build evaluations](https://platform.claude.com/docs/en/test-and-evaluate/develop-tests)"}, {"n": 111, "set": 2, "i": 51, "multi": true, "answer": ["A", "B"], "en": {"stem": "You are compiling continuity practices that span the deployment lifecycle.\n\nWhich two practices belong on the list? (Choose two.)\nEach correct answer presents a complete solution.", "opts": [["A", "Carry the evaluation framework and reference set forward across iterations rather than rebuilding each time."], ["B", "Capture lessons learned at the end of each phase and surface them as inputs to the next phase."], ["C", "Maintain a stakeholder register and notify the listed parties at every phase transition event."], ["D", "Lock decisions made in early phases to prevent revisiting them as later phases begin."], ["E", "Archive every phase deliverable in long-term storage to preserve a record of what was produced."]]}, "vi": {"stem": "Bạn đang tổng hợp các thực hành bảo đảm tính liên tục xuyên suốt vòng đời triển khai.\n\nHai thực hành nào thuộc danh sách này? (Chọn hai.)\nMỗi đáp án đúng là một giải pháp hoàn chỉnh.", "opts": [["A", "Mang khung đánh giá và tập tham chiếu chuyển tiếp qua các vòng lặp thay vì xây dựng lại mỗi lần."], ["B", "Ghi nhận bài học kinh nghiệm ở cuối mỗi giai đoạn và đưa chúng thành đầu vào cho giai đoạn tiếp theo."], ["C", "Duy trì một sổ đăng ký các bên liên quan và thông báo cho các bên trong danh sách ở mọi sự kiện chuyển giai đoạn."], ["D", "Khóa các quyết định đưa ra ở các giai đoạn đầu để ngăn việc xem xét lại chúng khi các giai đoạn sau bắt đầu."], ["E", "Lưu trữ mọi sản phẩm bàn giao của từng giai đoạn vào kho lưu trữ dài hạn để giữ lại hồ sơ về những gì đã được tạo ra."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Mang khung đánh giá và tập tham chiếu chuyển tiếp qua các vòng lặp thay vì xây dựng lại mỗi lần.; Ghi nhận bài học kinh nghiệm ở cuối mỗi giai đoạn và đưa chúng thành đầu vào cho giai đoạn tiếp theo.\n\nMang framework và reference set đánh giá qua các vòng giữ mốc so sánh, đồng thời bổ sung trường hợp mới khi cần. Chuyển bài học của từng giai đoạn thành đầu vào giai đoạn sau giúp kinh nghiệm thực tế thay đổi quyết định tiếp theo; đây là tính liên tục chủ động chứ không chỉ lưu hồ sơ.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Duy trì một sổ đăng ký các bên liên quan và thông báo cho các bên trong danh sách ở mọi sự kiện chuyển giai đoạn.**: Stakeholder register và thông báo chuyển giai đoạn là thực hành quản trị hợp lệ nhưng không tự mang bằng chứng đánh giá hoặc bài học sang quyết định tiếp theo.\n- **Khóa các quyết định đưa ra ở các giai đoạn đầu để ngăn việc xem xét lại chúng khi các giai đoạn sau bắt đầu.**: Khóa cứng quyết định đầu kỳ chặn thích nghi với bằng chứng và yêu cầu mới, trái mục tiêu học qua vòng đời.\n- **Lưu trữ mọi sản phẩm bàn giao của từng giai đoạn vào kho lưu trữ dài hạn để giữ lại hồ sơ về những gì đã được tạo ra.**: Lưu trữ deliverable giữ lịch sử nhưng không bảo đảm chúng được dùng lại để kiểm tra hồi quy hoặc cải tiến giai đoạn sau.\n\n**Tham khảo:**\n\n- [Define success criteria and build evaluations](https://platform.claude.com/docs/en/test-and-evaluate/develop-tests)\n- [AI RMF Core](https://airc.nist.gov/airmf-resources/airmf/5-sec-core/)"}, {"n": 112, "set": 2, "i": 52, "multi": true, "answer": ["B", "C"], "en": {"stem": "You are listing characteristics of strong architectural-decision communication.\n\nWhich two characteristics belong on the list? (Choose two.)\nEach correct answer presents a complete solution.", "opts": [["A", "omission of rejected alternatives to keep the decision document focused and concise for readers"], ["B", "ownership and review cadence for revisiting the decision when conditions or assumptions change"], ["C", "alternatives considered along with the criteria that were used to evaluate each alternative"], ["D", "distribution to a standing review forum with mandatory attendance from senior engineering leaders"], ["E", "use of a consistent template across the team to standardize the visual presentation of decisions"]]}, "vi": {"stem": "Bạn đang liệt kê các đặc điểm của việc truyền đạt quyết định kiến trúc một cách hiệu quả.\n\nHai đặc điểm nào thuộc danh sách này? (Chọn hai.)\nMỗi đáp án đúng là một giải pháp hoàn chỉnh.", "opts": [["A", "lược bỏ các phương án thay thế đã bị loại để giữ cho tài liệu quyết định tập trung và súc tích đối với người đọc"], ["B", "người chịu trách nhiệm và nhịp rà soát để xem xét lại quyết định khi điều kiện hoặc giả định thay đổi"], ["C", "các phương án thay thế đã cân nhắc cùng với các tiêu chí đã được dùng để đánh giá từng phương án"], ["D", "phân phối tới một diễn đàn rà soát thường trực với sự tham dự bắt buộc của các lãnh đạo kỹ thuật cấp cao"], ["E", "sử dụng một mẫu (template) nhất quán trong toàn nhóm để chuẩn hóa cách trình bày trực quan các quyết định"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** người chịu trách nhiệm và nhịp rà soát để xem xét lại quyết định khi điều kiện hoặc giả định thay đổi; các phương án thay thế đã cân nhắc cùng với các tiêu chí đã được dùng để đánh giá từng phương án\n\nGhi rõ người chịu trách nhiệm và thời điểm xem lại giúp quyết định không trở thành giả định vĩnh viễn. Lưu các phương án cùng tiêu chí đánh giá giúp người đến sau hiểu vì sao lựa chọn phù hợp với bối cảnh lúc đó.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **lược bỏ các phương án thay thế đã bị loại để giữ cho tài liệu quyết định tập trung và súc tích đối với người đọc**: Bỏ các phương án bị loại làm mất dấu vết đánh đổi.\n- **phân phối tới một diễn đàn rà soát thường trực với sự tham dự bắt buộc của các lãnh đạo kỹ thuật cấp cao**: Họp bắt buộc với lãnh đạo không tự tạo ra lý do có thể kiểm tra.\n- **sử dụng một mẫu (template) nhất quán trong toàn nhóm để chuẩn hóa cách trình bày trực quan các quyết định**: Mẫu chung giúp dễ đọc nhưng hình thức thống nhất chưa giải thích quyết định hay thời điểm xem lại.\n\n**Tham khảo:**\n\n- [Architectural decision record process](https://docs.aws.amazon.com/prescriptive-guidance/latest/architectural-decision-records/adr-process.html)"}, {"n": 113, "set": 2, "i": 53, "multi": true, "answer": ["B", "E"], "en": {"stem": "An architect is reviewing a set of architecture documentation packages before handing off a Claude-based\npipeline to an implementation team.\n\nWhich two characteristics indicate that a documentation package is sufficient to support implementation without\nongoing architect involvement? (Choose two.)", "opts": [["A", "The document includes the architect's contact information for questions arising during implementation."], ["B", "The document specifies integration contracts, configuration schemas, and expected input/output shapes for each component."], ["C", "The document provides a high-level narrative description of the business problem without component-level detail."], ["D", "The document lists all Claude models that were evaluated but does not specify which was selected or why."], ["E", "The document includes a decision log that records the rationale for key architectural choices and the alternatives rejected."]]}, "vi": {"stem": "Một kiến trúc sư đang rà soát một bộ các gói tài liệu kiến trúc trước khi bàn giao một pipeline dựa trên Claude cho nhóm triển khai.\n\nHai đặc điểm nào cho thấy một gói tài liệu đủ để hỗ trợ việc triển khai mà không cần kiến trúc sư tham gia liên tục? (Chọn hai.)", "opts": [["A", "Tài liệu bao gồm thông tin liên hệ của kiến trúc sư để giải đáp các câu hỏi phát sinh trong quá trình triển khai."], ["B", "Tài liệu đặc tả các hợp đồng tích hợp (integration contract), schema cấu hình và hình dạng đầu vào/đầu ra mong đợi cho từng thành phần."], ["C", "Tài liệu cung cấp một mô tả tường thuật cấp cao về bài toán kinh doanh mà không có chi tiết cấp thành phần."], ["D", "Tài liệu liệt kê mọi model Claude đã được đánh giá nhưng không nêu model nào đã được chọn hay lý do."], ["E", "Tài liệu bao gồm một nhật ký quyết định (decision log) ghi lại lý do cho các lựa chọn kiến trúc quan trọng và các phương án đã bị loại."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Tài liệu đặc tả các hợp đồng tích hợp (integration contract), schema cấu hình và hình dạng đầu vào/đầu ra mong đợi cho từng thành phần.; Tài liệu bao gồm một nhật ký quyết định (decision log) ghi lại lý do cho các lựa chọn kiến trúc quan trọng và các phương án đã bị loại.\n\nHợp đồng tích hợp, schema cấu hình và dạng dữ liệu vào/ra cho nhóm biết phải xây gì và nối các thành phần thế nào. Nhật ký quyết định giải thích lý do và phương án bị loại để nhóm xử lý tình huống mới mà không phải hỏi lại kiến trúc sư.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Tài liệu bao gồm thông tin liên hệ của kiến trúc sư để giải đáp các câu hỏi phát sinh trong quá trình triển khai.**: Thông tin liên hệ chỉ chuyển sự phụ thuộc sang việc hỏi người viết.\n- **Tài liệu cung cấp một mô tả tường thuật cấp cao về bài toán kinh doanh mà không có chi tiết cấp thành phần.**: Mô tả nghiệp vụ cấp cao thiếu chi tiết để triển khai từng thành phần.\n- **Tài liệu liệt kê mọi model Claude đã được đánh giá nhưng không nêu model nào đã được chọn hay lý do.**: Danh sách model đã thử không cho biết model cần triển khai hoặc lý do chọn.\n\n**Tham khảo:**\n\n- [Architectural decision record process](https://docs.aws.amazon.com/prescriptive-guidance/latest/architectural-decision-records/adr-process.html)"}, {"n": 114, "set": 2, "i": 54, "multi": false, "answer": ["C"], "en": {"stem": "A healthcare organization is evaluating two Claude-powered AI architectures for a clinical documentation\nassistant.\n\nArchitecture X produces higher output quality scores but costs $0.18 per documentation session and\naverages 4.2 seconds per response.\n\nArchitecture Y scores slightly lower on quality metrics but costs $0.09 per\nsession and averages 2.1 seconds per response.\n\nThe stated SLA requires responses under 3 seconds, and the\nannual volume is projected at 2 million documentation sessions.\n\nWhich evaluation approach correctly applies business value pillar analysis to this decision?", "opts": [["A", "Select Architecture Y based solely on the 50% cost reduction, since solution cost is the most important value pillar in healthcare budget-constrained environments."], ["B", "Select Architecture X because the higher quality scores justify the cost premium, and any SLA gap can be addressed through infrastructure optimization after deployment."], ["C", "Eliminate Architecture X on SLA grounds, then evaluate Architecture Y against the efficiency and solution cost pillars by calculating annual cost difference and assessing whether the quality delta materially impacts clinical workflow productivity."], ["D", "Recommend a hybrid approach using Architecture X for complex cases and Architecture Y for routine cases, without additional analysis, since this preserves quality where it matters most."]]}, "vi": {"stem": "Một tổ chức y tế đang đánh giá hai kiến trúc AI chạy bằng Claude cho một trợ lý tài liệu lâm sàng.\n\n- Kiến trúc X đạt điểm chất lượng đầu ra cao hơn nhưng tốn $0.18 cho mỗi phiên lập tài liệu và trung bình 4.2 giây cho mỗi phản hồi.\n- Kiến trúc Y đạt điểm thấp hơn một chút trên các metric chất lượng nhưng tốn $0.09 cho mỗi phiên và trung bình 2.1 giây cho mỗi phản hồi.\n\nSLA đã nêu yêu cầu phản hồi dưới 3 giây, và khối lượng hằng năm được dự báo là 2 triệu phiên lập tài liệu.\n\nCách đánh giá nào áp dụng đúng phân tích theo trụ cột giá trị kinh doanh cho quyết định này?", "opts": [["A", "Chọn Kiến trúc Y chỉ dựa trên mức giảm chi phí 50%, vì chi phí giải pháp là trụ cột giá trị quan trọng nhất trong môi trường y tế bị giới hạn ngân sách."], ["B", "Chọn Kiến trúc X vì điểm chất lượng cao hơn biện minh cho chi phí cao hơn, và mọi khoảng hụt SLA có thể được xử lý thông qua tối ưu hạ tầng sau khi triển khai."], ["C", "Loại Kiến trúc X vì không đáp ứng SLA, sau đó đánh giá Kiến trúc Y theo các trụ cột hiệu suất (efficiency) và chi phí giải pháp (solution cost)
