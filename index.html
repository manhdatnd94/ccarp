bằng cách tính chênh lệch chi phí hằng năm và đánh giá xem mức chênh lệch chất lượng có ảnh hưởng đáng kể tới năng suất của quy trình lâm sàng hay không."], ["D", "Đề xuất một cách tiếp cận lai, dùng Kiến trúc X cho các ca phức tạp và Kiến trúc Y cho các ca thông thường, mà không cần phân tích thêm, vì cách này giữ được chất lượng ở nơi quan trọng nhất."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Loại Kiến trúc X vì không đáp ứng SLA, sau đó đánh giá Kiến trúc Y theo các trụ cột hiệu suất (efficiency) và chi phí giải pháp (solution cost) bằng cách tính chênh lệch chi phí hằng năm và đánh giá xem mức chênh lệch chất lượng có ảnh hưởng đáng kể tới năng suất của quy trình lâm sàng hay không.\n\nTheo cách so sánh giản lược của đề, kiến trúc có 4,2 giây không đạt ngưỡng 3 giây; kiến trúc 2,1 giây là ứng viên để đánh giá tiếp. Chi phí năm lần lượt là 360.000 USD và 180.000 USD, chênh 180.000 USD. Vẫn phải đo tác động của chất lượng thấp hơn lên công việc. Trung bình không chứng minh toàn bộ yêu cầu SLA.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Chọn Kiến trúc Y chỉ dựa trên mức giảm chi phí 50%, vì chi phí giải pháp là trụ cột giá trị quan trọng nhất trong môi trường y tế bị giới hạn ngân sách.**: Chỉ xét tiết kiệm bỏ qua yêu cầu chất lượng và hiệu quả công việc.\n- **Chọn Kiến trúc X vì điểm chất lượng cao hơn biện minh cho chi phí cao hơn, và mọi khoảng hụt SLA có thể được xử lý thông qua tối ưu hạ tầng sau khi triển khai.**: Chất lượng cao hơn không xóa yêu cầu phản hồi; tối ưu sau triển khai mới chỉ là giả định.\n- **Đề xuất một cách tiếp cận lai, dùng Kiến trúc X cho các ca phức tạp và Kiến trúc Y cho các ca thông thường, mà không cần phân tích thêm, vì cách này giữ được chất lượng ở nơi quan trọng nhất.**: Phân tuyến hybrid cần bằng chứng về chất lượng, độ trễ và chi phí từng nhánh.\n\n**Cần xem lại:** Đề đưa latency trung bình nhưng SLA không nêu percentile/cửa sổ. Giữ khóa nguồn; production cần đo đúng metric SLA và đánh giá chất lượng/y tế trước khi chấp nhận.\n\n**Tham khảo:**\n\n- [Define success and build evaluations](https://platform.claude.com/docs/en/test-and-evaluate/develop-tests)"}, {"n": 115, "set": 2, "i": 55, "multi": false, "answer": ["D"], "en": {"stem": "You are documenting an architectural decision to support future audit and onboarding.\n\nWhich artifact is the strongest fit?", "opts": [["A", "a slide deck in a presentation folder with no accompanying written rationale"], ["B", "a code comment in a single file that contains an opinion of one engineer"], ["C", "a short verbal note shared during a hallway conversation with no written record"], ["D", "an Architecture Decision Record that states the context, the decision, the alternatives considered, the consequences, and the date and authors"]]}, "vi": {"stem": "Bạn đang ghi lại tài liệu cho một quyết định kiến trúc để hỗ trợ việc kiểm toán và onboarding trong tương lai.\n\nArtifact nào phù hợp nhất?", "opts": [["A", "một bộ slide trong thư mục trình bày, không kèm phần lý giải bằng văn bản nào"], ["B", "một chú thích mã (code comment) trong một tệp duy nhất, chứa ý kiến của một kỹ sư"], ["C", "một ghi chú ngắn bằng lời được chia sẻ trong một cuộc trò chuyện ngoài hành lang, không có bản ghi bằng văn bản"], ["D", "một Architecture Decision Record (ADR) nêu rõ bối cảnh, quyết định, các phương án thay thế đã cân nhắc, các hệ quả, cùng ngày tháng và tác giả"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** một Architecture Decision Record (ADR) nêu rõ bối cảnh, quyết định, các phương án thay thế đã cân nhắc, các hệ quả, cùng ngày tháng và tác giả\n\nArchitecture Decision Record lưu bối cảnh, lựa chọn, phương án, hệ quả, ngày và tác giả thành hồ sơ bền vững. Người kiểm toán và người mới có thể tìm lại cả quyết định lẫn lý do mà không phụ thuộc trí nhớ của nhóm.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **một bộ slide trong thư mục trình bày, không kèm phần lý giải bằng văn bản nào**: Slide thiếu lý do viết lại không đủ để tái dựng đánh đổi.\n- **một chú thích mã (code comment) trong một tệp duy nhất, chứa ý kiến của một kỹ sư**: Ý kiến trong một file quá hẹp và không ghi đầy đủ bối cảnh quyết định.\n- **một ghi chú ngắn bằng lời được chia sẻ trong một cuộc trò chuyện ngoài hành lang, không có bản ghi bằng văn bản**: Trao đổi miệng không có bản ghi không thể tra cứu hoặc kiểm toán sau này.\n\n**Tham khảo:**\n\n- [Architectural decision record process](https://docs.aws.amazon.com/prescriptive-guidance/latest/architectural-decision-records/adr-process.html)"}, {"n": 116, "set": 2, "i": 56, "multi": true, "answer": ["B", "C"], "en": {"stem": "The engineering lead at Trenova Systems, Inc. is evaluating two proposals for improving developer workflows\nusing Claude-assisted tooling Proposal A adds Claude Code to the IDE for inline code generation and review.\n\nProposal B routes all code-generation requests through a shared Slack bot with no IDE integration.\n\nWhich two observations most accurately evaluate these proposals against workflow-improvement objectives?\n(Choose two.)", "opts": [["A", "Proposal B is superior because centralizing requests in Slack creates an auditable log of all code-generation activity."], ["B", "Proposal B introduces workflow friction by requiring developers to leave the IDE, which undermines the productivity objective."], ["C", "Proposal A reduces context-switching by surfacing AI assistance at the point of development without requiring a separate tool."], ["D", "Proposal B improves workflow velocity because Slack notifications create an asynchronous review queue."], ["E", "Both proposals are equivalent because the underlying model capabilities are identical regardless of integration point."]]}, "vi": {"stem": "Trưởng nhóm kỹ thuật tại Trenova Systems, Inc. đang đánh giá hai đề xuất cải thiện workflow của lập trình viên bằng công cụ có Claude hỗ trợ. Đề xuất A bổ sung Claude Code vào IDE để sinh mã và review mã ngay tại chỗ (inline). Đề xuất B định tuyến mọi yêu cầu sinh mã qua một Slack bot dùng chung, không tích hợp IDE.\n\nHai nhận định nào đánh giá chính xác nhất các đề xuất này so với các mục tiêu cải thiện workflow?\n(Chọn hai.)", "opts": [["A", "Đề xuất B vượt trội hơn vì việc tập trung các yêu cầu trong Slack tạo ra một log có thể kiểm toán cho mọi hoạt động sinh mã."], ["B", "Đề xuất B gây cản trở workflow do buộc lập trình viên phải rời khỏi IDE, làm suy yếu mục tiêu năng suất."], ["C", "Đề xuất A giảm việc chuyển đổi ngữ cảnh (context-switching) bằng cách cung cấp hỗ trợ của AI ngay tại nơi phát triển mà không cần một công cụ riêng."], ["D", "Đề xuất B cải thiện tốc độ workflow vì các thông báo Slack tạo ra một hàng đợi review bất đồng bộ."], ["E", "Cả hai đề xuất là tương đương vì năng lực của model bên dưới là như nhau bất kể điểm tích hợp."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Đề xuất B gây cản trở workflow do buộc lập trình viên phải rời khỏi IDE, làm suy yếu mục tiêu năng suất.; Đề xuất A giảm việc chuyển đổi ngữ cảnh (context-switching) bằng cách cung cấp hỗ trợ của AI ngay tại nơi phát triển mà không cần một công cụ riêng.\n\nTrợ giúp ngay trong IDE giữ mã và thao tác review tại nơi lập trình viên đang làm việc. Bot Slack buộc họ chuyển công cụ và mang ngữ cảnh qua lại; đó là chi phí thao tác dù model phía sau giống nhau.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Đề xuất B vượt trội hơn vì việc tập trung các yêu cầu trong Slack tạo ra một log có thể kiểm toán cho mọi hoạt động sinh mã.**: Log tập trung có ích cho audit nhưng không chứng minh năng suất tốt hơn.\n- **Đề xuất B cải thiện tốc độ workflow vì các thông báo Slack tạo ra một hàng đợi review bất đồng bộ.**: Hàng đợi thông báo có thể hữu ích, nhưng không chứng minh tốc độ khi thao tác vẫn phải rời IDE.\n- **Cả hai đề xuất là tương đương vì năng lực của model bên dưới là như nhau bất kể điểm tích hợp.**: Cùng model không có nghĩa chi phí chuyển ngữ cảnh và tích hợp giống nhau.\n\n**Tham khảo:**\n\n- [Use Claude Code in VS Code](https://code.claude.com/docs/en/vs-code)"}, {"n": 117, "set": 2, "i": 57, "multi": true, "answer": ["D", "E"], "en": {"stem": "You are integrating Claude Code into a team workflow and must complete the design and configuration steps\nbefore piloting the integrated workflow.\n\nWhich two steps must be completed BEFORE piloting the integrated workflow with a small group? (Choose two.)\nEach correct answer presents part of the solution.", "opts": [["A", "Iterate the integrated workflow based on pilot findings before broader rollout to the team."], ["B", "Document the integrated workflow with hand-off criteria, permission boundaries, and on-call runbooks."], ["C", "Negotiate the workflow change with affected teams and obtain formal sign-off from each manager."], ["D", "Identify the workflow steps where AI-assisted tooling adds value and where human authority must remain."], ["E", "Configure the project-scope Model Context Protocol (MCP) servers, permissions, subagents, and persistent project context."]]}, "vi": {"stem": "Bạn đang tích hợp Claude Code vào workflow của nhóm và phải hoàn tất các bước thiết kế và cấu hình trước khi chạy thí điểm workflow đã tích hợp.\n\nHai bước nào phải được hoàn tất TRƯỚC KHI chạy thí điểm workflow đã tích hợp với một nhóm nhỏ? (Chọn hai.)\nMỗi đáp án đúng là một phần của giải pháp.", "opts": [["A", "Lặp cải tiến workflow đã tích hợp dựa trên các phát hiện từ đợt thí điểm trước khi triển khai rộng hơn cho nhóm."], ["B", "Ghi lại tài liệu về workflow đã tích hợp với tiêu chí chuyển giao (hand-off), ranh giới quyền và runbook trực on-call."], ["C", "Thương lượng thay đổi workflow với các nhóm bị ảnh hưởng và có được sự ký duyệt chính thức từ từng quản lý."], ["D", "Xác định các bước trong workflow mà công cụ có AI hỗ trợ tạo thêm giá trị và các bước mà quyền quyết định của con người phải được giữ lại."], ["E", "Cấu hình các máy chủ Model Context Protocol (MCP), quyền, subagent và ngữ cảnh project lưu bền ở project scope."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Xác định các bước trong workflow mà công cụ có AI hỗ trợ tạo thêm giá trị và các bước mà quyền quyết định của con người phải được giữ lại.; Cấu hình các máy chủ Model Context Protocol (MCP), quyền, subagent và ngữ cảnh project lưu bền ở project scope.\n\nTrước khi thử nghiệm, nhóm cần xác định bước nào giao AI và bước nào giữ quyền quyết định của con người, rồi cấu hình MCP, permissions, subagents và ngữ cảnh dự án để hiện thực hóa thiết kế. Đây là hai hoạt động thiết kế/cấu hình mà khóa muốn nhấn mạnh; tài liệu và phê duyệt phù hợp vẫn có thể cần trước pilot.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Lặp cải tiến workflow đã tích hợp dựa trên các phát hiện từ đợt thí điểm trước khi triển khai rộng hơn cho nhóm.**: Cải tiến từ kết quả pilot chỉ thực hiện sau khi đã có kết quả.\n- **Ghi lại tài liệu về workflow đã tích hợp với tiêu chí chuyển giao (hand-off), ranh giới quyền và runbook trực on-call.**: Tài liệu bàn giao và ranh giới quyền là hữu ích, có thể cần trước pilot; khóa bỏ qua lựa chọn hợp lệ này nên câu hỏi cần làm rõ.\n- **Thương lượng thay đổi workflow với các nhóm bị ảnh hưởng và có được sự ký duyệt chính thức từ từng quản lý.**: Phê duyệt có thể cần theo quản trị của tổ chức, nhưng chữ ký mọi quản lý không phải điều kiện kỹ thuật phổ quát.\n\n**Cần xem lại:** Giữ khóa nguồn. Cách hỏi BEFORE piloting khiến documentation và một số phê duyệt cũng có thể đúng; nên nêu rõ đang hỏi hai hoạt động thiết kế/cấu hình trọng tâm.\n\n**Tham khảo:**\n\n- [Settings files and precedence](https://code.claude.com/docs/en/settings)"}, {"n": 118, "set": 2, "i": 58, "multi": true, "answer": ["C", "D"], "en": {"stem": "You are resolving a Claude Code operational issue reported by the team and must complete the diagnostic steps\nbefore applying a targeted fix.\n\nWhich two steps must be completed BEFORE applying the targeted fix? (Choose two.)\nEach correct answer presents part of the solution.", "opts": [["A", "Open a permanent change request in the change-management system to formalize the upcoming fix."], ["B", "Document the root cause and the fix in the team runbook for future occurrences."], ["C", "Form a hypothesis about the most likely root cause given the symptom, configuration, and recent changes."], ["D", "Reproduce the issue with a minimal reproduction case to confirm the symptom and isolate variables."], ["E", "Notify the affected users that a fix has been deployed and the operational issue is resolved."]]}, "vi": {"stem": "Bạn đang xử lý một sự cố vận hành Claude Code do nhóm báo cáo và phải hoàn tất các bước chẩn đoán trước khi áp dụng một bản sửa lỗi có mục tiêu.\n\nHai bước nào phải được hoàn tất TRƯỚC KHI áp dụng bản sửa lỗi có mục tiêu? (Chọn hai.)\nMỗi đáp án đúng là một phần của giải pháp.", "opts": [["A", "Mở một yêu cầu thay đổi (change request) thường trực trong hệ thống quản lý thay đổi để chính thức hóa bản sửa lỗi sắp tới."], ["B", "Ghi lại nguyên nhân gốc và bản sửa lỗi vào runbook của nhóm cho các lần xảy ra sau."], ["C", "Đưa ra giả thuyết về nguyên nhân gốc có khả năng nhất dựa trên triệu chứng, cấu hình và các thay đổi gần đây."], ["D", "Tái hiện sự cố bằng một trường hợp tái hiện tối giản để xác nhận triệu chứng và cô lập các biến."], ["E", "Thông báo cho người dùng bị ảnh hưởng rằng bản sửa lỗi đã được triển khai và sự cố vận hành đã được giải quyết."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Đưa ra giả thuyết về nguyên nhân gốc có khả năng nhất dựa trên triệu chứng, cấu hình và các thay đổi gần đây.; Tái hiện sự cố bằng một trường hợp tái hiện tối giản để xác nhận triệu chứng và cô lập các biến.\n\nGiả thuyết dựa trên triệu chứng, cấu hình và thay đổi gần đây định hướng điều cần kiểm tra. Tái hiện tối thiểu loại bỏ biến nhiễu và xác nhận lỗi, nhờ đó bản sửa nhắm vào nguyên nhân thay vì phỏng đoán.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Mở một yêu cầu thay đổi (change request) thường trực trong hệ thống quản lý thay đổi để chính thức hóa bản sửa lỗi sắp tới.**: Change request có thể là thủ tục bắt buộc nhưng không xác định nguyên nhân.\n- **Ghi lại nguyên nhân gốc và bản sửa lỗi vào runbook của nhóm cho các lần xảy ra sau.**: Runbook cần kết luận đã được kiểm chứng; chưa thể ghi bản sửa là đúng trước chẩn đoán.\n- **Thông báo cho người dùng bị ảnh hưởng rằng bản sửa lỗi đã được triển khai và sự cố vận hành đã được giải quyết.**: Thông báo đã giải quyết phải chờ triển khai và kiểm tra thành công.\n\n**Tham khảo:**\n\n- [Connect Claude Code to tools via MCP](https://code.claude.com/docs/en/mcp)"}, {"n": 119, "set": 2, "i": 59, "multi": true, "answer": ["A", "B"], "en": {"stem": "A Claude architect is configuring a shared Claude Code environment for a twelve-person development team.\n\nWhich two configuration decisions most directly establish a consistent, secure team environment? (Choose two.)", "opts": [["A", "applying managed configuration to enforce non-overridable security and compliance policies across all team members"], ["B", "committing shared MCP server definitions and tool permissions in project-scope configuration files alongside the repository"], ["C", "instructing each engineer to configure their preferred Claude model in personal user-scope settings"], ["D", "storing the team’s shared API key in the project-scope settings.json so all engineers use the same credential"], ["E", "setting editor theme and display preferences at the project scope so they are uniform across workstations"]]}, "vi": {"stem": "Một kiến trúc sư Claude đang cấu hình một môi trường Claude Code dùng chung cho một nhóm phát triển mười hai người.\n\nHai quyết định cấu hình nào thiết lập trực tiếp nhất một môi trường nhóm nhất quán và an toàn? (Chọn hai.)", "opts": [["A", "áp dụng cấu hình được quản lý (managed configuration) để thực thi các chính sách bảo mật và tuân thủ không thể ghi đè đối với mọi thành viên trong nhóm"], ["B", "commit các định nghĩa MCP server và quyền tool dùng chung trong các tệp cấu hình project scope cùng với repository"], ["C", "hướng dẫn mỗi kỹ sư cấu hình model Claude ưa thích của mình trong thiết lập user scope cá nhân"], ["D", "lưu API key dùng chung của nhóm trong settings.json ở project scope để mọi kỹ sư dùng cùng một thông tin xác thực"], ["E", "đặt giao diện (theme) trình soạn thảo và các tùy chọn hiển thị ở project scope để chúng đồng nhất trên mọi máy trạm"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** áp dụng cấu hình được quản lý (managed configuration) để thực thi các chính sách bảo mật và tuân thủ không thể ghi đè đối với mọi thành viên trong nhóm; commit các định nghĩa MCP server và quyền tool dùng chung trong các tệp cấu hình project scope cùng với repository\n\nManaged settings đặt chính sách bảo mật ở tầng ưu tiên tổ chức. Cấu hình project được commit chia sẻ bộ MCP và permissions cho cùng repository. Hai tầng bổ sung nhau: mặc định chung cho nhóm và giới hạn do quản trị viên áp đặt.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **hướng dẫn mỗi kỹ sư cấu hình model Claude ưa thích của mình trong thiết lập user scope cá nhân**: Tùy chọn model cá nhân không thiết lập chính sách bảo mật chung.\n- **lưu API key dùng chung của nhóm trong settings.json ở project scope để mọi kỹ sư dùng cùng một thông tin xác thực**: Commit API key làm lộ bí mật và khó thu hồi quyền riêng từng người.\n- **đặt giao diện (theme) trình soạn thảo và các tùy chọn hiển thị ở project scope để chúng đồng nhất trên mọi máy trạm**: Theme editor chỉ ảnh hưởng trình bày, không kiểm soát quyền công cụ.\n\n**Tham khảo:**\n\n- [Settings files and precedence](https://code.claude.com/docs/en/settings)"}, {"n": 120, "set": 2, "i": 60, "multi": false, "answer": ["D"], "en": {"stem": "You are configuring Claude Code for a team that needs every engineer to share the same MCP server set,\npermission rules, and project context across the engineering monorepo.\n\nWhich configuration scope best supports this requirement?", "opts": [["A", "user scope configured individually on each engineer’s machine, with no shared configuration committed to the repository and no guarantee of consistency across the team"], ["B", "user scope with the MCP server definitions and permission rules placed in each engineer’s ~/.claude/settings.json and synchronized manually via a shared setup script outside version control"], ["C", "local scope configured only on the lead architect’s machine, with no configuration present on other engineers’ machines and no mechanism to distribute MCP servers or permission rules"], ["D", "project scope, with the configuration committed to the repository so every engineer working in the project picks up the same MCP servers, permissions, and context"]]}, "vi": {"stem": "Bạn đang cấu hình Claude Code cho một nhóm cần mọi kỹ sư dùng chung cùng một bộ MCP server, quy tắc quyền và ngữ cảnh project trên toàn bộ monorepo kỹ thuật.\n\nScope cấu hình nào hỗ trợ tốt nhất yêu cầu này?", "opts": [["A", "user scope được cấu hình riêng trên máy của từng kỹ sư, không có cấu hình dùng chung nào được commit vào repository và không có bảo đảm về tính nhất quán trong nhóm"], ["B", "user scope với các định nghĩa MCP server và quy tắc quyền được đặt trong ~/.claude/settings.json của từng kỹ sư và được đồng bộ thủ công thông qua một script thiết lập dùng chung nằm ngoài hệ thống quản lý phiên bản"], ["C", "local scope chỉ được cấu hình trên máy của kiến trúc sư trưởng, không có cấu hình nào trên máy của các kỹ sư khác và không có cơ chế phân phối MCP server hay quy tắc quyền"], ["D", "project scope, với cấu hình được commit vào repository để mọi kỹ sư làm việc trong project đều nhận được cùng các MCP server, quyền và ngữ cảnh"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** project scope, với cấu hình được commit vào repository để mọi kỹ sư làm việc trong project đều nhận được cùng các MCP server, quyền và ngữ cảnh\n\nProject scope đưa cấu hình đi cùng monorepo: MCP trong .mcp.json, permissions trong .claude/settings.json và hướng dẫn dự án trong CLAUDE.md. Version control giúp nhóm cùng nhận thay đổi đã review; không có nghĩa mọi loại dữ liệu đều nằm trong một file.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **user scope được cấu hình riêng trên máy của từng kỹ sư, không có cấu hình dùng chung nào được commit vào repository và không có bảo đảm về tính nhất quán trong nhóm**: Cấu hình user độc lập không đảm bảo đồng nhất theo repository.\n- **user scope với các định nghĩa MCP server và quy tắc quyền được đặt trong ~/.claude/settings.json của từng kỹ sư và được đồng bộ thủ công thông qua một script thiết lập dùng chung nằm ngoài hệ thống quản lý phiên bản**: Đồng bộ tay ngoài version control dễ lệch phiên bản và không gắn thay đổi với mã.\n- **local scope chỉ được cấu hình trên máy của kiến trúc sư trưởng, không có cấu hình nào trên máy của các kỹ sư khác và không có cơ chế phân phối MCP server hay quy tắc quyền**: Cấu hình local của người trưởng nhóm không phân phối sang máy đồng nghiệp.\n\n**Tham khảo:**\n\n- [Settings files and precedence](https://code.claude.com/docs/en/settings)"}, {"n": 121, "set": 3, "i": 1, "multi": false, "answer": ["A"], "en": {"stem": "A Claude needs to ensure that a security-hardening flag cannot be disabled by any individual engineer after it is\nset.\n\nWhich configuration scope correctly enforces this requirement?", "opts": [["A", "managed configuration applied centrally and marked as non-overridable"], ["B", "environment variable defined in the CI/CD pipeline only"], ["C", "project scope (.claude/settings.json) committed to the repository"], ["D", "user scope (~/.claude/settings.json) on each engineer’s machine"]]}, "vi": {"stem": "Một kiến trúc sư Claude cần bảo đảm rằng một cờ tăng cường bảo mật (security-hardening flag) không thể bị bất kỳ kỹ sư nào vô hiệu hóa sau khi đã được thiết lập.\n\nScope cấu hình nào thực thi đúng yêu cầu này?", "opts": [["A", "cấu hình được quản lý (managed configuration) áp dụng tập trung và được đánh dấu là không thể ghi đè"], ["B", "biến môi trường chỉ được định nghĩa trong pipeline CI/CD"], ["C", "project scope (.claude/settings.json) được commit vào repository"], ["D", "user scope (~/.claude/settings.json) trên máy của từng kỹ sư"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** cấu hình được quản lý (managed configuration) áp dụng tập trung và được đánh dấu là không thể ghi đè\n\nManaged configuration là tầng phù hợp để quản trị viên áp đặt tùy chọn hardening được hỗ trợ; cấu hình cá nhân hoặc project không thể hạ chính sách đó. Cần dùng đúng setting có ngữ nghĩa cưỡng chế, không xem mọi giá trị mặc định là khóa bảo mật.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **biến môi trường chỉ được định nghĩa trong pipeline CI/CD**: Biến trong CI chỉ tác động môi trường CI, không bao phủ phiên local của mọi kỹ sư.\n- **project scope (.claude/settings.json) được commit vào repository**: File project là cấu hình nhóm có thể chỉnh sửa, không phải chính sách tổ chức cao nhất.\n- **user scope (~/.claude/settings.json) trên máy của từng kỹ sư**: File user do từng kỹ sư kiểm soát nên không đáp ứng cấm tự tắt.\n\n**Tham khảo:**\n\n- [Settings files and precedence](https://code.claude.com/docs/en/settings)"}, {"n": 122, "set": 3, "i": 2, "multi": false, "answer": ["A"], "en": {"stem": "You are supporting a team whose Claude Code sessions consistently load 60 or more MCP tools from many\nservers, exhausting context budget before the session begins.\n\nWhich adjustment most directly addresses this issue without removing capability?", "opts": [["A", "Enable Tool Search so tool definitions are deferred and discovered on demand rather than loaded into context upfront."], ["B", "Add additional MCP servers to give the team more capability, which increases rather than reduces the number of tool definitions loaded into the session’s context budget."], ["C", "Increase the prompt’s verbosity with additional instructions and context, which consumes more of the context budget rather than reducing the tool-definition overhead causing the issue."], ["D", "Disable every MCP server in the configuration to free up context budget, accepting that the team loses all tool access and cannot perform any MCP-dependent task in the session."]]}, "vi": {"stem": "Bạn đang hỗ trợ một nhóm có các phiên Claude Code luôn nạp từ 60 MCP tool trở lên từ nhiều server, làm cạn ngân sách context ngay trước khi phiên bắt đầu.\nĐiều chỉnh nào giải quyết trực tiếp nhất vấn đề này mà không loại bỏ năng lực?", "opts": [["A", "Bật Tool Search để các định nghĩa tool được trì hoãn và được khám phá theo nhu cầu thay vì nạp sẵn vào context ngay từ đầu."], ["B", "Thêm các MCP server khác để mang lại cho nhóm nhiều năng lực hơn, điều này làm tăng chứ không giảm số lượng định nghĩa tool được nạp vào ngân sách context của phiên."], ["C", "Tăng độ dài dòng của prompt với các chỉ dẫn và ngữ cảnh bổ sung, điều này tiêu tốn thêm ngân sách context thay vì giảm chi phí định nghĩa tool đang gây ra vấn đề."], ["D", "Vô hiệu hóa mọi MCP server trong cấu hình để giải phóng ngân sách context, chấp nhận rằng nhóm mất toàn bộ quyền truy cập tool và không thể thực hiện bất kỳ tác vụ nào phụ thuộc vào MCP trong phiên."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Bật Tool Search để các định nghĩa tool được trì hoãn và được khám phá theo nhu cầu thay vì nạp sẵn vào context ngay từ đầu.\n\nTool Search trì hoãn nạp định nghĩa MCP rồi tìm và mở tool khi cần. Điều này giảm chi phí ngữ cảnh ban đầu mà vẫn giữ khả năng truy cập công cụ; bản hiện hành có thể đã bật mặc định, nên cần kiểm tra cấu hình và model hỗ trợ.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Thêm các MCP server khác để mang lại cho nhóm nhiều năng lực hơn, điều này làm tăng chứ không giảm số lượng định nghĩa tool được nạp vào ngân sách context của phiên.**: Thêm server làm tăng số định nghĩa cần quản lý.\n- **Tăng độ dài dòng của prompt với các chỉ dẫn và ngữ cảnh bổ sung, điều này tiêu tốn thêm ngân sách context thay vì giảm chi phí định nghĩa tool đang gây ra vấn đề.**: Prompt dài hơn tiêu thụ thêm ngữ cảnh, không giảm metadata tool.\n- **Vô hiệu hóa mọi MCP server trong cấu hình để giải phóng ngân sách context, chấp nhận rằng nhóm mất toàn bộ quyền truy cập tool và không thể thực hiện bất kỳ tác vụ nào phụ thuộc vào MCP trong phiên.**: Tắt mọi MCP giảm token bằng cách mất chính khả năng đề yêu cầu giữ.\n\n**Tham khảo:**\n\n- [Connect Claude Code to tools via MCP](https://code.claude.com/docs/en/mcp)"}, {"n": 123, "set": 3, "i": 3, "multi": false, "answer": ["A"], "en": {"stem": "A team manager wants all engineers working on the same repository to share identical MCP server definitions\nwithout manual synchronization.\n\nWhich configuration approach satisfies this requirement?", "opts": [["A", "project-scope .claude/settings.json and .mcp.json files committed to the repository"], ["B", "managed configuration pushed to all endpoints by the administrator"], ["C", "environment variables set at the operating-system level on each workstation"], ["D", "each engineer maintains a personal ~/.claude/settings.json with the shared definitions"]]}, "vi": {"stem": "Một quản lý nhóm muốn mọi kỹ sư làm việc trên cùng một repository dùng chung các định nghĩa MCP server giống hệt nhau mà không cần đồng bộ thủ công.\n\nCách cấu hình nào đáp ứng yêu cầu này?", "opts": [["A", "các tệp .claude/settings.json và .mcp.json ở project scope được commit vào repository"], ["B", "cấu hình được quản lý (managed configuration) do quản trị viên đẩy xuống mọi máy trạm (endpoint)"], ["C", "các biến môi trường được đặt ở cấp hệ điều hành trên từng máy trạm"], ["D", "mỗi kỹ sư tự duy trì một tệp ~/.claude/settings.json cá nhân chứa các định nghĩa dùng chung"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** các tệp .claude/settings.json và .mcp.json ở project scope được commit vào repository\n\nCommit .mcp.json ở project scope cho định nghĩa server đi cùng repository; .claude/settings.json chia sẻ permissions liên quan. Đây là cách nhóm tự quản lý cấu hình chung theo mã, nhưng đề chưa loại trừ quản trị MCP tập trung cũng có thể đồng bộ định nghĩa.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **cấu hình được quản lý (managed configuration) do quản trị viên đẩy xuống mọi máy trạm (endpoint)**: Managed MCP cũng phân phối định nghĩa nhất quán; đây là phương án có thể đúng mà khóa không chọn.\n- **các biến môi trường được đặt ở cấp hệ điều hành trên từng máy trạm**: Biến môi trường từng máy không tự phân phối định nghĩa server có version chung.\n- **mỗi kỹ sư tự duy trì một tệp ~/.claude/settings.json cá nhân chứa các định nghĩa dùng chung**: Tự giữ file user đòi hỏi cơ chế đồng bộ riêng.\n\n**Cần xem lại:** Managed MCP cũng có thể đáp ứng identical definitions without manual synchronization. Để chỉ có một đáp án, cần thêm yêu cầu cấu hình đi cùng repo và do project quản lý; giữ nguyên khóa nguồn.\n\n**Tham khảo:**\n\n- [Connect Claude Code to tools via MCP](https://code.claude.com/docs/en/mcp)"}, {"n": 124, "set": 3, "i": 4, "multi": true, "answer": ["B", "C"], "en": {"stem": "A Claude-based research assistant begins producing responses that confidently contradict its retrieved source documents despite no change to the retrieval pipeline.\n\nWhich two diagnostic actions most directly identify the root cause of this behavior? (Choose two.)", "opts": [["A", "Switch the retrieval index to a denser embedding model to improve chunk relevance scores."], ["B", "Isolate whether the failure reproduces on the previous model version to test for model mismatch."], ["C", "Inspect system-prompt grounding instructions to determine whether citation constraints remain intact."], ["D", "Reduce the temperature setting to lower response variance across all query types."], ["E", "Increase the context window size to allow more retrieved chunks per query."]]}, "vi": {"stem": "Một trợ lý nghiên cứu dựa trên Claude bắt đầu tạo ra các phản hồi tự tin mâu thuẫn với chính các tài liệu nguồn mà nó truy xuất, dù pipeline truy xuất không hề thay đổi.\n\nHai hành động chẩn đoán nào xác định nguyên nhân gốc của hành vi này trực tiếp nhất? (Chọn hai.)", "opts": [["A", "Chuyển chỉ mục truy xuất sang một embedding model dày đặc hơn để cải thiện điểm liên quan của các chunk."], ["B", "Cô lập xem lỗi có tái hiện trên phiên bản model trước đó hay không để kiểm tra khả năng không tương thích model (model mismatch)."], ["C", "Kiểm tra các chỉ dẫn neo nguồn (grounding) trong system prompt để xác định các ràng buộc về trích dẫn có còn nguyên vẹn hay không."], ["D", "Giảm thiết lập temperature để hạ độ biến thiên của phản hồi trên mọi loại truy vấn."], ["E", "Tăng kích thước context window để cho phép nhiều chunk được truy xuất hơn trong mỗi truy vấn."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Cô lập xem lỗi có tái hiện trên phiên bản model trước đó hay không để kiểm tra khả năng không tương thích model (model mismatch).; Kiểm tra các chỉ dẫn neo nguồn (grounding) trong system prompt để xác định các ràng buộc về trích dẫn có còn nguyên vẹn hay không.\n\nChạy lại model trước kiểm tra version regression và đọc grounding prompt kiểm tra ràng buộc nguồn; đây là chẩn đoán mục tiêu khi retrieval không đổi.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Chuyển chỉ mục truy xuất sang một embedding model dày đặc hơn để cải thiện điểm liên quan của các chunk.**: Đổi embedding chưa chứng minh retrieval là nguyên nhân.\n- **Giảm thiết lập temperature để hạ độ biến thiên của phản hồi trên mọi loại truy vấn.**: Giảm temperature có thể thay variance nhưng không cô lập nguyên nhân.\n- **Tăng kích thước context window để cho phép nhiều chunk được truy xuất hơn trong mỗi truy vấn.**: Thêm context không tự sửa claim trái tài liệu.\n\n**Tham khảo:**\n\n- [Claude — Reduce hallucinations](https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations)\n- [Claude — Define success and build evaluations](https://platform.claude.com/docs/en/test-and-evaluate/develop-tests)"}, {"n": 125, "set": 3, "i": 5, "multi": false, "answer": ["D"], "en": {"stem": "You are supporting an engineer whose newly added MCP server does not appear in their Claude Code session.\n\nWhich diagnostic step should be tried first?", "opts": [["A", "Reinstall the developer’s operating system from scratch, discarding all local configuration and tool state before attempting any targeted diagnostic steps."], ["B", "Disable every MCP server in the configuration to isolate the issue, removing all tool access rather than confirming whether the new server is registered."], ["C", "Switch the team to a different Claude product family unrelated to the existing workflow, abandoning the current configuration rather than diagnosing the registration issue."], ["D", "Verify the MCP server is registered using the listing command, then reconnect the session if needed, since configuration changes typically require a restart to take effect."]]}, "vi": {"stem": "Bạn đang hỗ trợ một kỹ sư có MCP server mới thêm vào không xuất hiện trong phiên Claude Code của họ.\n\nBước chẩn đoán nào nên được thử trước tiên?", "opts": [["A", "Cài đặt lại hệ điều hành của lập trình viên từ đầu, loại bỏ toàn bộ cấu hình cục bộ và trạng thái tool trước khi thử bất kỳ bước chẩn đoán có mục tiêu nào."], ["B", "Vô hiệu hóa mọi MCP server trong cấu hình để cô lập vấn đề, loại bỏ toàn bộ quyền truy cập tool thay vì xác nhận xem server mới đã được đăng ký hay chưa."], ["C", "Chuyển nhóm sang một dòng sản phẩm Claude khác không liên quan đến workflow hiện có, từ bỏ cấu hình hiện tại thay vì chẩn đoán vấn đề đăng ký."], ["D", "Xác minh MCP server đã được đăng ký bằng lệnh liệt kê, sau đó kết nối lại phiên nếu cần, vì các thay đổi cấu hình thường cần khởi động lại mới có hiệu lực."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Xác minh MCP server đã được đăng ký bằng lệnh liệt kê, sau đó kết nối lại phiên nếu cần, vì các thay đổi cấu hình thường cần khởi động lại mới có hiệu lực.\n\nDùng claude mcp list để xác nhận server đã đăng ký và đúng scope trước. Sau đó kiểm tra /mcp và reconnect hoặc khởi động lại nếu cấu hình chưa được nhận; bằng chứng này giúp phân biệt lỗi đăng ký với lỗi kết nối.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Cài đặt lại hệ điều hành của lập trình viên từ đầu, loại bỏ toàn bộ cấu hình cục bộ và trạng thái tool trước khi thử bất kỳ bước chẩn đoán có mục tiêu nào.**: Cài lại hệ điều hành quá rộng và phá trạng thái trước khi kiểm tra cấu hình.\n- **Vô hiệu hóa mọi MCP server trong cấu hình để cô lập vấn đề, loại bỏ toàn bộ quyền truy cập tool thay vì xác nhận xem server mới đã được đăng ký hay chưa.**: Tắt mọi server không xác nhận server mới đã được đăng ký đúng.\n- **Chuyển nhóm sang một dòng sản phẩm Claude khác không liên quan đến workflow hiện có, từ bỏ cấu hình hiện tại thay vì chẩn đoán vấn đề đăng ký.**: Đổi họ sản phẩm bỏ qua nguyên nhân cấu hình đang cần chẩn đoán.\n\n**Tham khảo:**\n\n- [Connect Claude Code to tools via MCP](https://code.claude.com/docs/en/mcp)"}, {"n": 126, "set": 3, "i": 6, "multi": false, "answer": ["D"], "en": {"stem": "You are supporting an engineer whose newly added MCP server does not appear in their Claude Code session.\n\nWhich diagnostic step should be tried first?", "opts": [["A", "Reinstall the developer’s operating system from scratch, discarding all local configuration and tool state before attempting any targeted diagnostic steps."], ["B", "Disable every MCP server in the configuration to isolate the issue, removing all tool access rather than confirming whether the new server is registered."], ["C", "Switch the team to a different Claude product family unrelated to the existing workflow, abandoning the current configuration rather than diagnosing the registration issue."], ["D", "Verify the MCP server is registered using the listing command, then reconnect the session if needed, since configuration changes typically require a restart to take effect."]]}, "vi": {"stem": "Bạn đang hỗ trợ một kỹ sư có MCP server mới thêm vào không xuất hiện trong phiên Claude Code của họ.\n\nBước chẩn đoán nào nên được thử trước tiên?", "opts": [["A", "Cài đặt lại hệ điều hành của lập trình viên từ đầu, loại bỏ toàn bộ cấu hình cục bộ và trạng thái tool trước khi thử bất kỳ bước chẩn đoán có mục tiêu nào."], ["B", "Vô hiệu hóa mọi MCP server trong cấu hình để cô lập vấn đề, loại bỏ toàn bộ quyền truy cập tool thay vì xác nhận xem server mới đã được đăng ký hay chưa."], ["C", "Chuyển nhóm sang một dòng sản phẩm Claude khác không liên quan đến workflow hiện có, từ bỏ cấu hình hiện tại thay vì chẩn đoán vấn đề đăng ký."], ["D", "Xác minh MCP server đã được đăng ký bằng lệnh liệt kê, sau đó kết nối lại phiên nếu cần, vì các thay đổi cấu hình thường cần khởi động lại mới có hiệu lực."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Xác minh MCP server đã được đăng ký bằng lệnh liệt kê, sau đó kết nối lại phiên nếu cần, vì các thay đổi cấu hình thường cần khởi động lại mới có hiệu lực.\n\nListing và server status cho thấy MCP mới có trong cấu hình hiệu lực hay chưa; chỉ reconnect sau khi xác minh scope/config phù hợp.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Cài đặt lại hệ điều hành của lập trình viên từ đầu, loại bỏ toàn bộ cấu hình cục bộ và trạng thái tool trước khi thử bất kỳ bước chẩn đoán có mục tiêu nào.**: Reinstall OS không phải bước đầu cho một server chưa hiện.\n- **Vô hiệu hóa mọi MCP server trong cấu hình để cô lập vấn đề, loại bỏ toàn bộ quyền truy cập tool thay vì xác nhận xem server mới đã được đăng ký hay chưa.**: Disable mọi MCP không phân biệt server mới đăng ký sai ở đâu.\n- **Chuyển nhóm sang một dòng sản phẩm Claude khác không liên quan đến workflow hiện có, từ bỏ cấu hình hiện tại thay vì chẩn đoán vấn đề đăng ký.**: Chuyển product bỏ workflow mà chưa xác định nguyên nhân.\n\n**Tham khảo:**\n\n- [Claude Code — MCP](https://code.claude.com/docs/en/mcp)"}, {"n": 127, "set": 4, "i": 1, "multi": false, "answer": ["A"], "en": {"stem": "**HOTSPOT**\n\nYou are a solution architect evaluating candidate use cases for a Claude-based program.\n\nFor each scenario, select yes if Claude is appropriate as the primary solution at the architectural level Otherwise, select no.", "opts": [["A", "Yes | No | Yes | No | Yes (Drafting reports: Yes, Sub-50ms fraud scoring: No, Long-context contract review: Yes, Replacing vector index: No, Routing support tickets: Yes)"], ["B", "Yes | Yes | Yes | No | Yes (Drafting reports: Yes, Sub-50ms fraud scoring: Yes, Long-context contract review: Yes, Replacing vector index: No, Routing support tickets: Yes)"], ["C", "Yes | No | No | Yes | Yes (Drafting reports: Yes, Sub-50ms fraud scoring: No, Long-context contract review: No, Replacing vector index: Yes, Routing support tickets: Yes)"], ["D", "No | No | Yes | No | Yes (Drafting reports: No, Sub-50ms fraud scoring: No, Long-context contract review: Yes, Replacing vector index: No, Routing support tickets: Yes)"]]}, "vi": {"stem": "**HOTSPOT**\n\nBạn là kiến trúc sư giải pháp đang đánh giá các use case ứng viên cho một chương trình dựa trên Claude.\n\nVới mỗi kịch bản, chọn Có (Yes) nếu Claude phù hợp làm giải pháp chính ở cấp kiến trúc. Nếu không, chọn Không (No).", "opts": [["A", "Có | Không | Có | Không | Có (Soạn thảo báo cáo: Có, Chấm điểm gian lận (fraud scoring) dưới 50 ms: Không, Rà soát hợp đồng với ngữ cảnh dài (long-context): Có, Thay thế vector index: Không, Định tuyến ticket hỗ trợ: Có)"], ["B", "Có | Có | Có | Không | Có (Soạn thảo báo cáo: Có, Chấm điểm gian lận (fraud scoring) dưới 50 ms: Có, Rà soát hợp đồng với ngữ cảnh dài (long-context): Có, Thay thế vector index: Không, Định tuyến ticket hỗ trợ: Có)"], ["C", "Có | Không | Không | Có | Có (Soạn thảo báo cáo: Có, Chấm điểm gian lận (fraud scoring) dưới 50 ms: Không, Rà soát hợp đồng với ngữ cảnh dài (long-context): Không, Thay thế vector index: Có, Định tuyến ticket hỗ trợ: Có)"], ["D", "Không | Không | Có | Không | Có (Soạn thảo báo cáo: Không, Chấm điểm gian lận (fraud scoring) dưới 50 ms: Không, Rà soát hợp đồng với ngữ cảnh dài (long-context): Có, Thay thế vector index: Không, Định tuyến ticket hỗ trợ: Có)"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Có | Không | Có | Không | Có (Soạn thảo báo cáo: Có, Chấm điểm gian lận (fraud scoring) dưới 50 ms: Không, Rà soát hợp đồng với ngữ cảnh dài (long-context): Có, Thay thế vector index: Không, Định tuyến ticket hỗ trợ: Có)\n\nSoạn báo cáo để chuyên viên duyệt, trích điều khoản từ hợp đồng và phân loại ticket kèm lý do đều dùng khả năng xử lý ngôn ngữ. Chấm fraud dưới 50 ms cần đường xử lý chuyên dụng có độ trễ kiểm chứng; vector index vẫn chịu trách nhiệm lập chỉ mục và truy hồi kho lớn. Claude có thể phối hợp với các hệ đó nhưng không thay vai trò của chúng.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Có | Có | Có | Không | Có (Soạn thảo báo cáo: Có, Chấm điểm gian lận (fraud scoring) dưới 50 ms: Có, Rà soát hợp đồng với ngữ cảnh dài (long-context): Có, Thay thế vector index: Không, Định tuyến ticket hỗ trợ: Có)**: Cho phép Claude làm giải pháp chấm fraud chính bỏ qua ngân sách 50 ms chưa được chứng minh.\n- **Có | Không | Không | Có | Có (Soạn thảo báo cáo: Có, Chấm điểm gian lận (fraud scoring) dưới 50 ms: Không, Rà soát hợp đồng với ngữ cảnh dài (long-context): Không, Thay thế vector index: Có, Định tuyến ticket hỗ trợ: Có)**: Loại review hợp đồng bỏ phí khả năng ngôn ngữ; thay vector index nhầm suy luận với lập chỉ mục.\n- **Không | Không | Có | Không | Có (Soạn thảo báo cáo: Không, Chấm điểm gian lận (fraud scoring) dưới 50 ms: Không, Rà soát hợp đồng với ngữ cảnh dài (long-context): Có, Thay thế vector index: Không, Định tuyến ticket hỗ trợ: Có)**: Báo cáo nháp có người duyệt là nhiệm vụ tổng hợp ngôn ngữ phù hợp.\n\n**Tham khảo:**\n\n- [Building effective agents](https://www.anthropic.com/research/building-effective-agents)"}, {"n": 128, "set": 4, "i": 2, "multi": false, "answer": ["B"], "en": {"stem": "You are comparing two configurations for an internal compliance Q & A assistant.\n\nConfiguration X reduces top-k retrieval and uses a lighter model, lowering p95 latency by 38 percent while producing a measured 2 percent reduction in the accuracy benchmark.\n\nConfiguration Y retains the existing top-k retrieval setting and heavier model, with unchanged p95 latency and no measurable change in accuracy.\n\nThe deployment's stated priorities are accuracy first and latency second.\n\nWhich configuration is the better recommendation?", "opts": [["A", "Configuration X, because the 2 percent accuracy reduction falls within normal benchmark variance and is not a meaningful regression."], ["B", "Configuration Y, because the deployment's stated priority is accuracy first, and Configuration X produces a measured reduction in accuracy."], ["C", "Configuration X, because lower latency generally matters more than accuracy, regardless of the deployment's stated priorities."], ["D", "Configuration X, because a 38 percent latency improvement outweighs a 2 percent accuracy reduction as a general rule across compliance deployments."]]}, "vi": {"stem": "Bạn đang so sánh hai cấu hình cho một trợ lý hỏi đáp (Q&A) nội bộ về tuân thủ (compliance).\n\nCấu hình X giảm top-k retrieval và dùng một model nhẹ hơn, giúp giảm 38% độ trễ p95 nhưng làm độ chính xác trên benchmark giảm 2% (đo được).\n\nCấu hình Y giữ nguyên thiết lập top-k retrieval hiện tại và model nặng hơn, với độ trễ p95 không đổi và không có thay đổi đo được về độ chính xác.\n\nCác ưu tiên đã nêu của đợt triển khai là độ chính xác trước, độ trễ sau.\n\nCấu hình nào là khuyến nghị tốt hơn?", "opts": [["A", "Cấu hình X, vì mức giảm 2% độ chính xác nằm trong biên độ dao động thông thường của benchmark và không phải là một sự suy giảm (regression) đáng kể."], ["B", "Cấu hình Y, vì ưu tiên đã nêu của đợt triển khai là độ chính xác trước tiên, và Cấu hình X tạo ra mức giảm độ chính xác đo được."], ["C", "Cấu hình X, vì độ trễ thấp hơn nhìn chung quan trọng hơn độ chính xác, bất kể các ưu tiên đã nêu của đợt triển khai."], ["D", "Cấu hình X, vì mức cải thiện 38% về độ trễ có giá trị lớn hơn mức giảm 2% độ chính xác, như một quy tắc chung cho mọi đợt triển khai về compliance."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Cấu hình Y, vì ưu tiên đã nêu của đợt triển khai là độ chính xác trước tiên, và Cấu hình X tạo ra mức giảm độ chính xác đo được.\n\nGiữ cấu hình hiện tại bảo toàn độ chính xác, tiêu chí được ưu tiên trước. Mức giảm p95 38% chỉ là lợi ích sau đó; chưa có ngưỡng chấp nhận hoặc bằng chứng rằng giảm chính xác 2% là nhiễu để cho phép đánh đổi.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Cấu hình X, vì mức giảm 2% độ chính xác nằm trong biên độ dao động thông thường của benchmark và không phải là một sự suy giảm (regression) đáng kể.**: Không thể tự gọi mức giảm đã đo là biến thiên bình thường khi thiếu khoảng tin cậy hoặc thử lặp.\n- **Cấu hình X, vì độ trễ thấp hơn nhìn chung quan trọng hơn độ chính xác, bất kể các ưu tiên đã nêu của đợt triển khai.**: Ưu tiên độ trễ chung không thay thế ưu tiên chính xác mà triển khai đã nêu.\n- **Cấu hình X, vì mức cải thiện 38% về độ trễ có giá trị lớn hơn mức giảm 2% độ chính xác, như một quy tắc chung cho mọi đợt triển khai về compliance.**: Hai phần trăm của các metric khác nhau không có tỷ giá đánh đổi phổ quát.\n\n**Tham khảo:**\n\n- [Define success and build evaluations](https://platform.claude.com/docs/en/test-and-evaluate/develop-tests)"}, {"n": 129, "set": 4, "i": 3, "multi": false, "answer": ["D"], "en": {"stem": "A platform team operates a self-hosted multi-agent system on Kubernetes that orchestrates seven specialized agents for invoice processing.\n\nThe team spends approximately 40 percent of engineering capacity on infrastructure maintenance, message bus reliability, and agent state recovery.\n\nThe CFO has asked you to evaluate moving to managed agent infrastructure to reclaim engineering capacity.\n\nThe security officer requires that all customer financial data remain within an approved network boundary.\n\nWhich factor should most heavily influence your recommendation?", "opts": [["A", "Whether the current seven agents map cleanly to the patterns supported by managed agents."], ["B", "Whether managed agents reduce per-invoice token costs across the existing processing volume."], ["C", "Whether managed agents support the current bus topology used by the platform team."], ["D", "Whether managed agent data handling satisfies the network boundary required by security."]]}, "vi": {"stem": "Một nhóm nền tảng (platform team) vận hành một hệ thống multi-agent tự host (self-hosted) trên Kubernetes, điều phối bảy agent chuyên biệt cho việc xử lý hóa đơn.\n\nNhóm dành khoảng 40% năng lực kỹ thuật cho việc bảo trì hạ tầng, độ tin cậy của message bus và khôi phục trạng thái agent.\n\nGiám đốc tài chính (CFO) yêu cầu bạn đánh giá việc chuyển sang hạ tầng agent được quản lý (managed agent infrastructure) để thu hồi năng lực kỹ thuật.\n\nGiám đốc an ninh (security officer) yêu cầu toàn bộ dữ liệu tài chính của khách hàng phải nằm trong một ranh giới mạng (network boundary) đã được phê duyệt.\n\nYếu tố nào nên ảnh hưởng mạnh nhất đến khuyến nghị của bạn?", "opts": [["A", "Liệu bảy agent hiện tại có ánh xạ gọn gàng vào các mẫu (pattern) mà managed agents hỗ trợ hay không."], ["B", "Liệu managed agents có giảm chi phí token trên mỗi hóa đơn với khối lượng xử lý hiện tại hay không."], ["C", "Liệu managed agents có hỗ trợ topology bus hiện tại mà nhóm nền tảng đang sử dụng hay không."], ["D", "Liệu cách managed agents xử lý dữ liệu có đáp ứng ranh giới mạng mà bộ phận an ninh yêu cầu hay không."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Liệu cách managed agents xử lý dữ liệu có đáp ứng ranh giới mạng mà bộ phận an ninh yêu cầu hay không.\n\nRanh giới mạng được phê duyệt là điều kiện bắt buộc cho dữ liệu tài chính. Trước hết phải xác minh dịch vụ managed xử lý, lưu và truyền dữ liệu đúng ranh giới; chỉ các phương án đạt điều kiện đó mới được so chi phí và công sức vận hành.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Liệu bảy agent hiện tại có ánh xạ gọn gàng vào các mẫu (pattern) mà managed agents hỗ trợ hay không.**: Phù hợp mẫu agent quan trọng nhưng không bù được vi phạm ranh giới dữ liệu.\n- **Liệu managed agents có giảm chi phí token trên mỗi hóa đơn với khối lượng xử lý hiện tại hay không.**: Giá token thấp hơn không chứng minh dữ liệu được xử lý tại nơi cho phép.\n- **Liệu managed agents có hỗ trợ topology bus hiện tại mà nhóm nền tảng đang sử dụng hay không.**: Giữ bus topology là sở thích chuyển đổi, không mạnh hơn yêu cầu an ninh bắt buộc.\n\n**Tham khảo:**\n\n- [Choosing an agent environment](https://platform.claude.com/docs/en/managed-agents/choosing-an-environment)\n- [Security model](https://platform.claude.com/docs/en/managed-agents/self-hosted-sandboxes-security)"}, {"n": 130, "set": 4, "i": 4, "multi": false, "answer": ["B"], "en": {"stem": "A senior architect is preparing briefing materials on a new retrieval architecture.\n\nThe executive sponsor has requested a summary of the architectural decision.\n\nWhich framing is most appropriate for that audience?", "opts": [["A", "Technical alternatives evaluated, implementation implications, and component-level consequences."], ["B", "Business outcomes achieved, trade-offs accepted, and high-level risks acknowledged."], ["C", "Capabilities delivered, scope implications, and feature-level dependencies on the roadmap."], ["D", "Threat model, control mappings, residual-risk acceptance, and audit traceability."]]}, "vi": {"stem": "Một kiến trúc sư cấp cao đang chuẩn bị tài liệu báo cáo tóm tắt (briefing) về một kiến trúc truy xuất (retrieval) mới.\n\nNhà tài trợ cấp điều hành (executive sponsor) đã yêu cầu một bản tóm tắt về quyết định kiến trúc.\n\nCách trình bày nào phù hợp nhất với đối tượng này?", "opts": [["A", "Các phương án kỹ thuật đã được đánh giá, tác động đối với việc triển khai và hệ quả ở cấp thành phần."], ["B", "Các kết quả kinh doanh đạt được, các đánh đổi (trade-off) được chấp nhận và các rủi ro cấp cao được ghi nhận."], ["C", "Các năng lực được cung cấp, tác động đối với phạm vi và các phụ thuộc ở cấp tính năng trên lộ trình (roadmap)."], ["D", "Mô hình mối đe dọa (threat model), ánh xạ các biện pháp kiểm soát, việc chấp nhận rủi ro tồn dư và khả năng truy vết phục vụ kiểm toán."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Các kết quả kinh doanh đạt được, các đánh đổi (trade-off) được chấp nhận và các rủi ro cấp cao được ghi nhận.\n\nLãnh đạo bảo trợ cần hiểu kết quả kinh doanh, những đánh đổi đã chấp nhận và rủi ro còn lại để ra quyết định. Tóm tắt ở cấp này kết nối kiến trúc với giá trị và trách nhiệm, thay vì yêu cầu họ giải mã chi tiết triển khai.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Các phương án kỹ thuật đã được đánh giá, tác động đối với việc triển khai và hệ quả ở cấp thành phần.**: Chi tiết thành phần phù hợp hơn với nhóm triển khai kỹ thuật.\n- **Các năng lực được cung cấp, tác động đối với phạm vi và các phụ thuộc ở cấp tính năng trên lộ trình (roadmap).**: Phạm vi tính năng và roadmap phù hợp product planning nhưng chưa nêu kết quả kinh doanh và rủi ro quyết định.\n- **Mô hình mối đe dọa (threat model), ánh xạ các biện pháp kiểm soát, việc chấp nhận rủi ro tồn dư và khả năng truy vết phục vụ kiểm toán.**: Threat model và control mapping dành cho review an ninh chuyên sâu.\n\n**Tham khảo:**\n\n- [Architectural decision record process](https://docs.aws.amazon.com/prescriptive-guidance/latest/architectural-decision-records/adr-process.html)"}, {"n": 131, "set": 4, "i": 5, "multi": false, "answer": ["A"], "en": {"stem": "You are auditing a procurement-assistant agent whose defined responsibility is to draft purchase requests for review.\n\nFor each tool currently configured on the agent, select yes if the tool should remain after a least-privilege audit. Otherwise, select no if it should be removed.", "opts": [["A", "Yes | No | Yes | No | Yes (Catalog lookup: Yes, External inbox-send to vendor: No, Policy-document lookup: Yes, Production DB admin tool: No, Draft-write to review queue: Yes)"], ["B", "Yes | Yes | Yes | No | Yes (Catalog lookup: Yes, External inbox-send to vendor: Yes, Policy-document lookup: Yes, Production DB admin tool: No, Draft-write to review queue: Yes)"], ["C", "Yes | No | No | Yes | Yes (Catalog lookup: Yes, External inbox-send to vendor: No, Policy-document lookup: No, Production DB admin tool: Yes, Draft-write to review queue: Yes)"], ["D", "No | No | Yes | No | Yes (Catalog lookup: No, External inbox-send to vendor: No, Policy-document lookup: Yes, Production DB admin tool: No, Draft-write to review queue: Yes)"]]}, "vi": {"stem": "Bạn đang kiểm toán (audit) một agent trợ lý mua sắm (procurement) có trách nhiệm đã định nghĩa là soạn thảo các yêu cầu mua hàng để đưa đi rà soát.\n\nVới mỗi tool hiện đang được cấu hình trên agent, chọn Có (Yes) nếu tool nên được giữ lại sau một đợt kiểm toán theo nguyên tắc đặc quyền tối thiểu (least privilege). Nếu không, chọn Không (No) nếu tool nên bị loại bỏ.", "opts": [["A", "Có | Không | Có | Không | Có (Tra cứu danh mục (catalog): Có, Gửi email ra ngoài tới nhà cung cấp (external inbox-send): Không, Tra cứu tài liệu chính sách: Có, Tool quản trị DB production: Không, Ghi bản nháp vào hàng đợi rà soát: Có)"], ["B", "Có | Có | Có | Không | Có (Tra cứu danh mục (catalog): Có, Gửi email ra ngoài tới nhà cung cấp (external inbox-send): Có, Tra cứu tài liệu chính sách: Có, Tool quản trị DB production: Không, Ghi bản nháp vào hàng đợi rà soát: Có)"], ["C", "Có | Không | Không | Có | Có (Tra cứu danh mục (catalog): Có, Gửi email ra ngoài tới nhà cung cấp (external inbox-send): Không, Tra cứu tài liệu chính sách: Không, Tool quản trị DB production: Có, Ghi bản nháp vào hàng đợi rà soát: Có)"], ["D", "Không | Không | Có | Không | Có (Tra cứu danh mục (catalog): Không, Gửi email ra ngoài tới nhà cung cấp (external inbox-send): Không, Tra cứu tài liệu chính sách: Có, Tool quản trị DB production: Không, Ghi bản nháp vào hàng đợi rà soát: Có)"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Có | Không | Có | Không | Có (Tra cứu danh mục (catalog): Có, Gửi email ra ngoài tới nhà cung cấp (external inbox-send): Không, Tra cứu tài liệu chính sách: Có, Tool quản trị DB production: Không, Ghi bản nháp vào hàng đợi rà soát: Có)\n\nAgent chỉ soạn đề nghị mua để người duyệt: giữ tra catalog, đọc chính sách và lưu bản nháp vào hàng đợi. Gửi đơn trực tiếp cho nhà cung cấp vượt bước phê duyệt; quyền admin database production không cần cho việc soạn nháp.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Có | Có | Có | Không | Có (Tra cứu danh mục (catalog): Có, Gửi email ra ngoài tới nhà cung cấp (external inbox-send): Có, Tra cứu tài liệu chính sách: Có, Tool quản trị DB production: Không, Ghi bản nháp vào hàng đợi rà soát: Có)**: Giữ gửi đơn ra ngoài trao quyền thực thi mua hàng ngoài trách nhiệm soạn nháp.\n- **Có | Không | Không | Có | Có (Tra cứu danh mục (catalog): Có, Gửi email ra ngoài tới nhà cung cấp (external inbox-send): Không, Tra cứu tài liệu chính sách: Không, Tool quản trị DB production: Có, Ghi bản nháp vào hàng đợi rà soát: Có)**: Bỏ đọc chính sách mất kiểm tra quy tắc, còn giữ admin database trao quyền không cần thiết.\n- **Không | Không | Có | Không | Có (Tra cứu danh mục (catalog): Không, Gửi email ra ngoài tới nhà cung cấp (external inbox-send): Không, Tra cứu tài liệu chính sách: Có, Tool quản trị DB production: Không, Ghi bản nháp vào hàng đợi rà soát: Có)**: Bỏ catalog làm thiếu nguồn vendor và SKU cần để lập đề nghị.\n\n**Tham khảo:**\n\n- [Mitigate jailbreaks and prompt injections](https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/mitigate-jailbreaks)"}, {"n": 132, "set": 4, "i": 6, "multi": false, "answer": ["C"], "en": {"stem": "A software vendor wants to build a RAG assistant over its own internal support-ticket archive (not the public web) and needs the same quality of source attribution that citation-grounded answers provide, without sending queries to an external search index.\n\nWhich feature fits this requirement?", "opts": [["A", "Web search tool, because it augments Claude's knowledge with current information regardless of where the documents are hosted."], ["B", "Web fetch, because retrieving full page content from specified URLs works equally well for private ticket archives."], ["C", "Search results, because it provides citation-quality source attribution for custom knowledge bases outside the public web."], ["D", "Code execution, because running retrieval scripts in a sandbox lets the model fetch and cite ticket content directly."]]}, "vi": {"stem": "Một nhà cung cấp phần mềm muốn xây dựng một trợ lý RAG trên kho lưu trữ ticket hỗ trợ nội bộ của chính mình (không phải web công khai) và cần chất lượng ghi nguồn (source attribution) tương đương với các câu trả lời dựa trên trích dẫn (citation-grounded), mà không gửi truy vấn tới một chỉ mục tìm kiếm (search index) bên ngoài.\n\nTính năng nào phù hợp với yêu cầu này?", "opts": [["A", "Web search tool, vì nó bổ sung kiến thức của Claude bằng thông tin cập nhật bất kể tài liệu được lưu trữ ở đâu."], ["B", "Web fetch, vì việc truy xuất toàn bộ nội dung trang từ các URL được chỉ định hoạt động tốt như nhau với kho lưu trữ ticket riêng tư."], ["C", "Search results, vì nó cung cấp khả năng ghi nguồn đạt chất lượng trích dẫn (citation) cho các knowledge base tùy chỉnh nằm ngoài web công khai."], ["D", "Code execution, vì chạy các script truy xuất trong sandbox cho phép model trực tiếp lấy và trích dẫn nội dung ticket."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Search results, vì nó cung cấp khả năng ghi nguồn đạt chất lượng trích dẫn (citation) cho các knowledge base tùy chỉnh nằm ngoài web công khai.\n\nSearch results cho phép hệ truy hồi nội bộ đưa các đoạn ticket vào block có nguồn và tiêu đề để Claude trích dẫn. Bộ chỉ mục vẫn do doanh nghiệp quản lý; tính năng attribution không buộc gửi truy vấn sang công cụ tìm kiếm web. Cần bật citations cho các search result blocks được trả về.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Web search tool, vì nó bổ sung kiến thức của Claude bằng thông tin cập nhật bất kể tài liệu được lưu trữ ở đâu.**: Web search tìm trên web, không tự có quyền vào kho ticket riêng.\n- **Web fetch, vì việc truy xuất toàn bộ nội dung trang từ các URL được chỉ định hoạt động tốt như nhau với kho lưu trữ ticket riêng tư.**: Web fetch cần URL truy cập được và quyền phù hợp; không tự thay bộ truy hồi kho riêng.\n- **Code execution, vì chạy các script truy xuất trong sandbox cho phép model trực tiếp lấy và trích dẫn nội dung ticket.**: Code execution chạy mã nhưng tự nó không cung cấp cấu trúc attribution của search result.\n\n**Tham khảo:**\n\n- [Search results](https://platform.claude.com/docs/en/build-with-claude/search-results)"}, {"n": 133, "set": 4, "i": 7, "multi": false, "answer": ["A"], "en": {"stem": "A long-running autonomous coding agent needs two things in its architecture: automatically clearing stale tool results from context as a session approaches the token limit, and retaining key project facts across separate sessions run days apart.\n\nSelect all components that correctly satisfy these two needs.", "opts": [["A", "Context editing, which supports clearing tool results automatically as a conversation approaches the token limit"], ["B", "The memory tool, which lets Claude store and retrieve information across separate conversations over time"], ["C", "Fine-grained tool streaming, which reduces latency by streaming tool parameters without JSON buffering"], ["D", "Compaction, positioned as the sole mechanism that fully replaces context editing for long-running sessions"], ["E", "Code execution, which runs code in a sandboxed container for data analysis and file processing tasks"], ["F", "The Files API, which lets uploaded documents be referenced repeatedly without re-uploading their content"]]}, "vi": {"stem": "Một agent lập trình tự động (autonomous coding agent) chạy dài hạn cần hai điều trong kiến trúc: tự động xóa các kết quả tool đã cũ (stale) khỏi context khi phiên làm việc tiến gần giới hạn token, và lưu giữ các thông tin quan trọng của dự án qua các phiên riêng biệt chạy cách nhau nhiều ngày.\n\nChọn tất cả các thành phần đáp ứng đúng hai nhu cầu này.", "opts": [["A", "Context editing, hỗ trợ tự động xóa kết quả tool khi cuộc hội thoại tiến gần giới hạn token"], ["B", "Memory tool, cho phép Claude lưu trữ và truy xuất thông tin qua các cuộc hội thoại riêng biệt theo thời gian"], ["C", "Fine-grained tool streaming, giúp giảm độ trễ bằng cách stream các tham số tool mà không cần đệm (buffer) JSON"], ["D", "Compaction, được định vị là cơ chế duy nhất thay thế hoàn toàn context editing cho các phiên chạy dài"], ["E", "Code execution, chạy mã trong một container sandbox cho các tác vụ phân tích dữ liệu và xử lý file"], ["F", "Files API, cho phép tham chiếu lặp lại các tài liệu đã tải lên mà không cần tải lại nội dung của chúng"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Context editing, hỗ trợ tự động xóa kết quả tool khi cuộc hội thoại tiến gần giới hạn token\n\nContext editing xóa kết quả tool cũ theo ngưỡng, giải quyết áp lực trong phiên hiện tại. Nhưng nhu cầu nhớ thông tin qua nhiều ngày cần memory tool và nơi lưu bền vững do ứng dụng cung cấp. Khóa chỉ giữ context editing nên chưa bao phủ cả hai yêu cầu.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Memory tool, cho phép Claude lưu trữ và truy xuất thông tin qua các cuộc hội thoại riêng biệt theo thời gian**: Memory tool đáp ứng nhu cầu qua nhiều hội thoại; đây là đáp án hợp lệ bị khóa nguồn bỏ sót.\n- **Fine-grained tool streaming, giúp giảm độ trễ bằng cách stream các tham số tool mà không cần đệm (buffer) JSON**: Streaming tham số giảm thời gian chờ tool, không dọn kết quả cũ hoặc lưu trí nhớ dài hạn.\n- **Compaction, được định vị là cơ chế duy nhất thay thế hoàn toàn context editing cho các phiên chạy dài**: Compaction tóm tắt lịch sử, không phải cơ chế duy nhất và không thay mọi vai trò của context editing.\n- **Code execution, chạy mã trong một container sandbox cho các tác vụ phân tích dữ liệu và xử lý file**: Sandbox xử lý mã không tự tạo chính sách dọn context hoặc nhớ xuyên phiên.\n- **Files API, cho phép tham chiếu lặp lại các tài liệu đã tải lên mà không cần tải lại nội dung của chúng**: Files API giữ tài liệu upload, không tự ghi và truy hồi các sự kiện dự án quan trọng.\n\n**Cần xem lại:** Khóa PDF chỉ chọn context editing dù đề yêu cầu chọn tất cả thành phần cho cả hai nhu cầu. Memory tool cũng đúng. Cần sửa khóa sau duyệt; chưa tự đổi.\n\n**Tham khảo:**\n\n- [Context editing](https://platform.claude.com/docs/en/build-with-claude/context-editing)\n- [Memory tool](https://platform.claude.com/docs/en/agents-and-tools/tool-use/memory-tool)", "review": {"verdict": "missing", "key": ["A", "B"], "conf": "cao", "note": "Đề 'Select all' cho hai nhu cầu: A (context editing, clear_tool_uses) xử lý dọn tool result gần ngưỡng token, B (memory tool) lưu/truy hồi thông tin qua các phiên cách nhau nhiều ngày. Chính phần giải thích của site cũng ghi B là 'đáp án hợp lệ bị khóa nguồn bỏ sót'.", "src": ["https://platform.claude.com/docs/en/build-with-claude/context-editing", "https://platform.claude.com/docs/en/agents-and-tools/tool-use/memory-tool"]}}, {"n": 134, "set": 4, "i": 8, "multi": false, "answer": ["A"], "en": {"stem": "A team is choosing between orchestrator-workers and parallelization by sectioning for a document-analysis pipeline.\n\nWhich statements correctly distinguish orchestrator-workers from parallelization by sectioning?", "opts": [["A", "In orchestrator-workers, a central LLM determines subtasks at runtime, whereas sectioning requires subtasks predefined before execution"], ["B", "In orchestrator-workers, worker LLMs run in a fixed, predetermined order, whereas sectioning always runs its subtasks simultaneously"], ["C", "Orchestrator-workers suits subtasks that vary unpredictably case to case, while sectioning suits tasks that split cleanly into known subtasks"], ["D", "Parallelization by sectioning always requires a second LLM to evaluate the sectioned outputs before combining them into a final result"], ["E", "Orchestrator-workers and parallelization by sectioning both aggregate multiple independent votes on one input to reach a majority-based answer"]]}, "vi": {"stem": "Một nhóm đang cân nhắc giữa orchestrator-workers và parallelization theo kiểu sectioning cho một pipeline phân tích tài liệu.\n\nNhững phát biểu nào phân biệt đúng orchestrator-workers với parallelization theo kiểu sectioning?", "opts": [["A", "Trong orchestrator-workers, một LLM trung tâm xác định các tác vụ con (subtask) lúc runtime, trong khi sectioning yêu cầu các tác vụ con được định nghĩa trước khi thực thi"], ["B", "Trong orchestrator-workers, các LLM worker chạy theo một thứ tự cố định, định sẵn, trong khi sectioning luôn chạy các tác vụ con của nó đồng thời"], ["C", "Orchestrator-workers phù hợp với các tác vụ con thay đổi khó đoán theo từng trường hợp, còn sectioning phù hợp với các tác vụ có thể tách gọn thành các tác vụ con đã biết"], ["D", "Parallelization theo kiểu sectioning luôn cần một LLM thứ hai đánh giá các đầu ra đã chia phần trước khi gộp chúng thành kết quả cuối cùng"], ["E", "Orchestrator-workers và parallelization theo kiểu sectioning đều tổng hợp nhiều phiếu bầu (vote) độc lập trên cùng một đầu vào để đi đến câu trả lời theo đa số"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Trong orchestrator-workers, một LLM trung tâm xác định các tác vụ con (subtask) lúc runtime, trong khi sectioning yêu cầu các tác vụ con được định nghĩa trước khi thực thi\n\nOrchestrator-workers để LLM trung tâm xác định và giao việc sau khi nhìn đầu vào. Sectioning đã biết các phần việc có thể tách trước khi chạy. Vì vậy phát biểu về các subtasks thay đổi khó đoán cũng đúng; khóa nguồn chỉ chọn cơ chế runtime là thiếu.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Trong orchestrator-workers, các LLM worker chạy theo một thứ tự cố định, định sẵn, trong khi sectioning luôn chạy các tác vụ con của nó đồng thời**: Worker không bắt buộc chạy theo thứ tự cố định; cách mô tả này làm mất đặc điểm phân rã động.\n- **Orchestrator-workers phù hợp với các tác vụ con thay đổi khó đoán theo từng trường hợp, còn sectioning phù hợp với các tác vụ có thể tách gọn thành các tác vụ con đã biết**: Tác vụ biến thiên hợp orchestrator-workers, tác vụ tách sẵn hợp sectioning; phát biểu đúng nhưng bị bỏ khỏi khóa.\n- **Parallelization theo kiểu sectioning luôn cần một LLM thứ hai đánh giá các đầu ra đã chia phần trước khi gộp chúng thành kết quả cuối cùng**: Sectioning không bắt buộc có LLM thứ hai chấm điểm; có thể ghép kết quả bằng logic phù hợp.\n- **Orchestrator-workers và parallelization theo kiểu sectioning đều tổng hợp nhiều phiếu bầu (vote) độc lập trên cùng một đầu vào để đi đến câu trả lời theo đa số**: Bỏ phiếu là chạy nhiều lần cùng đầu vào, khác chia nhiệm vụ thành phần.\n\n**Cần xem lại:** PDF thiếu đáp án cho phát biểu “subtasks vary unpredictably…”. Giữ nguyên khóa; hai phát biểu về runtime decomposition và phù hợp tác vụ đều đúng.\n\n**Tham khảo:**\n\n- [Building effective agents](https://www.anthropic.com/research/building-effective-agents)", "review": {"verdict": "missing", "key": ["A", "C"], "conf": "cao", "note": "Đề hỏi 'Which statements' (số nhiều). Theo 'Building effective agents', orchestrator-workers có subtasks không định trước mà do orchestrator quyết định theo input (A), và phù hợp khi không đoán trước được subtasks, còn sectioning tách thành các subtask độc lập đã biết (C). Giải thích của site cũng nói C 'phát biểu đúng nhưng bị bỏ khỏi khóa'.", "src": ["https://www.anthropic.com/research/building-effective-agents"]}}, {"n": 135, "set": 4, "i": 9, "multi": false, "answer": ["A"], "en": {"stem": "A team is building an agent that must audit a large codebase across three distinct dimensions: security vulnerabilities, code quality, and test coverage.\n\nEach dimension requires a different set of tools and a different area of focus.\n\nWhich approach best decomposes this problem using the Agent SDK?", "opts": [["A", "Define an orchestrator agent that invokes specialized subagents through the Agent tool, each configured with a scoped tool set and description matching its subtask domain"], ["B", "Send one prompt to the main agent instructing it to sequentially perform code quality checks, then security scanning, then test coverage analysis without additional configuration"], ["C", "Configure a single MCP server that exposes security, quality, and coverage checks as three separate tools, and let the primary agent call each tool directly instead of delegating"], ["D", "Increase the primary agent's context window and rely on extended thinking so it can reason through all three review dimensions within one continuous session"]]}, "vi": {"stem": "Một nhóm đang xây dựng một agent phải kiểm toán (audit) một codebase lớn theo ba chiều riêng biệt: lỗ hổng bảo mật, chất lượng mã và độ bao phủ kiểm thử (test coverage).\n\nMỗi chiều cần một bộ tool khác nhau và một trọng tâm khác nhau.\n\nCách tiếp cận nào phân rã bài toán này tốt nhất bằng Agent SDK?", "opts": [["A", "Định nghĩa một agent điều phối (orchestrator) gọi các subagent chuyên biệt thông qua Agent tool, mỗi subagent được cấu hình với một bộ tool giới hạn phạm vi và phần mô tả (description) khớp với lĩnh vực tác vụ con của nó"], ["B", "Gửi một prompt tới agent chính, hướng dẫn nó lần lượt thực hiện kiểm tra chất lượng mã, rồi quét bảo mật, rồi phân tích độ bao phủ kiểm thử mà không cần cấu hình bổ sung"], ["C", "Cấu hình một MCP server duy nhất cung cấp các bước kiểm tra bảo mật, chất lượng và độ bao phủ dưới dạng ba tool riêng biệt, và để agent chính gọi trực tiếp từng tool thay vì ủy quyền (delegate)"], ["D", "Tăng context window của agent chính và dựa vào extended thinking để nó có thể suy luận qua cả ba chiều rà soát trong một phiên liên tục duy nhất"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Định nghĩa một agent điều phối (orchestrator) gọi các subagent chuyên biệt thông qua Agent tool, mỗi subagent được cấu hình với một bộ tool giới hạn phạm vi và phần mô tả (description) khớp với lĩnh vực tác vụ con của nó\n\nOrchestrator có thể gọi các subagent chuyên security, chất lượng mã và coverage bằng Agent tool. Mỗi subagent có mô tả và bộ tool đúng phạm vi, nên công việc được phân tách cả về mục tiêu lẫn quyền và ngữ cảnh.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Gửi một prompt tới agent chính, hướng dẫn nó lần lượt thực hiện kiểm tra chất lượng mã, rồi quét bảo mật, rồi phân tích độ bao phủ kiểm thử mà không cần cấu hình bổ sung**: Một prompt tuần tự vẫn để mọi lĩnh vực và quyền trong cùng agent, không tạo phân rã chuyên môn.\n- **Cấu hình một MCP server duy nhất cung cấp các bước kiểm tra bảo mật, chất lượng và độ bao phủ dưới dạng ba tool riêng biệt, và để agent chính gọi trực tiếp từng tool thay vì ủy quyền (delegate)**: Ba tool MCP tách thao tác nhưng vẫn để một agent điều khiển cả ba lĩnh vực.\n- **Tăng context window của agent chính và dựa vào extended thinking để nó có thể suy luận qua cả ba chiều rà soát trong một phiên liên tục duy nhất**: Context lớn và suy luận dài không tự tạo ranh giới chuyên môn hoặc tool riêng.\n\n**Tham khảo:**\n\n- [Subagents in the SDK](https://code.claude.com/docs/en/agent-sdk/subagents)"}, {"n": 136, "set": 4, "i": 10, "multi": false, "answer": ["A"], "en": {"stem": "An enterprise customer's support desk has committed to a contractual 99.9% uptime and sub-2-second p95 response SLA for its Claude-powered ticket triage assistant.\n\nDuring architecture review, the team must select which platform capabilities to prioritize primarily to protect this SLA commitment.\n\nWhich two capabilities are the most directly relevant to protecting a latency and availability SLA? (Select 2)", "opts": [["A", "Server-side fallback, which retries a refused request against a backup model within the same API call for a timely response"], ["B", "Choosing a model with faster comparative latency, such as Claude Haiku 4.5, for the latency-sensitive triage path"], ["C", "Batch processing, which processes large volumes of requests asynchronously at a discounted rate over an extended completion window"], ["D", "Agent Skills, which extend Claude's capabilities with pre-built instructions and scripts for document-format tasks"], ["E", "The Files API, which lets documents be uploaded once and referenced across multiple requests without re-uploading content"]]}, "vi": {"stem": "Bộ phận hỗ trợ (support desk) của một khách hàng doanh nghiệp đã cam kết theo hợp đồng SLA uptime 99.9% và thời gian phản hồi p95 dưới 2 giây cho trợ lý phân loại ticket (ticket triage) chạy bằng Claude.\n\nTrong buổi rà soát kiến trúc, nhóm phải chọn những năng lực nền tảng cần ưu tiên, chủ yếu để bảo vệ cam kết SLA này.\n\nHai năng lực nào liên quan trực tiếp nhất đến việc bảo vệ SLA về độ trễ và tính sẵn sàng (availability)? (Chọn hai.)", "opts": [["A", "Server-side fallback, cơ chế thử lại một yêu cầu bị từ chối với một model dự phòng ngay trong cùng một lệnh gọi API để có phản hồi kịp thời"], ["B", "Chọn một model có độ trễ tương đối nhanh hơn, chẳng hạn Claude Haiku 4.5, cho luồng phân loại nhạy cảm với độ trễ"], ["C", "Batch processing, xử lý bất đồng bộ khối lượng lớn yêu cầu với mức giá chiết khấu trong một khoảng thời gian hoàn thành kéo dài"], ["D", "Agent Skills, mở rộng năng lực của Claude bằng các hướng dẫn và script dựng sẵn cho các tác vụ liên quan đến định dạng tài liệu"], ["E", "Files API, cho phép tải tài liệu lên một lần và tham chiếu qua nhiều yêu cầu mà không cần tải lại nội dung"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Server-side fallback, cơ chế thử lại một yêu cầu bị từ chối với một model dự phòng ngay trong cùng một lệnh gọi API để có phản hồi kịp thời\n\nKhóa muốn dùng server-side fallback để thử model dự phòng khi model từ chối. Phải phân biệt refusal với lỗi mất dịch vụ: cơ chế đó không tự chứng minh uptime 99,9%. Chọn model nhanh hơn cũng trực tiếp hỗ trợ p95 dưới 2 giây và là lựa chọn hợp lệ bị thiếu; cần đo p95 trên tải thật.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Chọn một model có độ trễ tương đối nhanh hơn, chẳng hạn Claude Haiku 4.5, cho luồng phân loại nhạy cảm với độ trễ**: Model nhanh hơn là biện pháp latency trực tiếp, nhưng cần benchmark và phải được xem lại trong khóa.\n- **Batch processing, xử lý bất đồng bộ khối lượng lớn yêu cầu với mức giá chiết khấu trong một khoảng thời gian hoàn thành kéo dài**: Batch có cửa sổ hoàn tất bất đồng bộ, không phục vụ SLA phản hồi tức thời từng ticket.\n- **Agent Skills, mở rộng năng lực của Claude bằng các hướng dẫn và script dựng sẵn cho các tác vụ liên quan đến định dạng tài liệu**: Skills định nghĩa cách làm nhiệm vụ, không tự bảo đảm độ trễ hoặc availability.\n- **Files API, cho phép tải tài liệu lên một lần và tham chiếu qua nhiều yêu cầu mà không cần tải lại nội dung**: Files API giảm thao tác upload lặp, không giải quyết trực tiếp hai cam kết SLA này.\n\n**Cần xem lại:** Đề yêu cầu hai nhưng khóa chỉ có một; model nhanh hơn cũng trực tiếp phù hợp. Fallback cho refusal không tương đương xử lý outage. Cần sửa số lượng đáp án và cách mô tả SLA sau duyệt.\n\n**Tham khảo:**\n\n- [Define success and build evaluations](https://platform.claude.com/docs/en/test-and-evaluate/develop-tests)\n- [Refusals and fallback](https://platform.claude.com/docs/en/build-with-claude/refusals-and-fallback)\n- [Choosing the right model](https://platform.claude.com/docs/en/about-claude/models/choosing-a-model)", "review": {"verdict": "missing", "key": ["A", "B"], "conf": "trung bình", "note": "Đề 'Select 2' nhưng khóa chỉ có A. B (chọn model nhanh như Claude Haiku 4.5 cho đường triage) trực tiếp bảo vệ p95 latency; C/D/E không liên quan SLA. Lưu ý A yếu: docs ghi 'Only a safety classifier decline triggers the fallback', rate limit/overload/server error trả nguyên trạng, nên server-side fallback không thực sự bảo vệ availability; giải thích của site cũng nêu điều này.", "src": ["https://platform.claude.com/docs/en/build-with-claude/refusals-and-fallback", "https://platform.claude.com/docs/en/about-claude/models/choosing-a-model"]}}, {"n": 137, "set": 4, "i": 11, "multi": false, "answer": ["A"], "en": {"stem": "A manufacturing client wants a Claude-based quality-inspection assistant that repeatedly analyzes the same reference specification documents alongside new inspection reports throughout the day.\n\nThe client's stated goal is to reduce redundant token spend on the unchanging reference material while keeping individual inspection turnaround fast.\n\nWhich architectural choice best serves this efficiency and cost goal?", "opts": [["A", "Use prompt caching so the unchanging reference specification is cached and reused across requests, cutting cost and latency"], ["B", "Move the entire workload to the Message Batches API so all inspection reports are processed together once per day"], ["C", "Increase the effort parameter to xhigh on every inspection request so Claude reasons more thoroughly each time"], ["D", "Re-upload the full reference specification as plain text in every single request to guarantee the model always has the latest version"]]}, "vi": {"stem": "Một khách hàng trong ngành sản xuất muốn có một trợ lý kiểm tra chất lượng dựa trên Claude, liên tục phân tích cùng một bộ tài liệu đặc tả tham chiếu cùng với các báo cáo kiểm tra mới trong suốt cả ngày.\n\nMục tiêu đã nêu của khách hàng là giảm chi phí token dư thừa cho phần tài liệu tham chiếu không thay đổi, đồng thời giữ cho thời gian xử lý từng báo cáo kiểm tra luôn nhanh.\n\nLựa chọn kiến trúc nào phục vụ tốt nhất mục tiêu hiệu quả và chi phí này?", "opts": [["A", "Dùng prompt caching để phần đặc tả tham chiếu không thay đổi được cache và tái sử dụng qua các yêu cầu, giúp giảm chi phí và độ trễ"], ["B", "Chuyển toàn bộ khối lượng công việc sang Message Batches API để tất cả báo cáo kiểm tra được xử lý cùng lúc, mỗi ngày một lần"], ["C", "Tăng tham số effort lên xhigh cho mọi yêu cầu kiểm tra để Claude suy luận kỹ lưỡng hơn mỗi lần"], ["D", "Tải lại toàn bộ đặc tả tham chiếu dưới dạng văn bản thuần (plain text) trong từng yêu cầu để bảo đảm model luôn có phiên bản mới nhất"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Dùng prompt caching để phần đặc tả tham chiếu không thay đổi được cache và tái sử dụng qua các yêu cầu, giúp giảm chi phí và độ trễ\n\nPrompt caching tái sử dụng prefix đặc tả tham chiếu không đổi qua nhiều báo cáo mới. Khi cache hit, phần đó không phải tính lại đầy đủ, giúp giảm chi phí và thời gian xử lý mà vẫn cho phép trả từng lượt inspection ngay.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Chuyển toàn bộ khối lượng công việc sang Message Batches API để tất cả báo cáo kiểm tra được xử lý cùng lúc, mỗi ngày một lần**: Gom xử lý mỗi ngày gây chờ, trái yêu cầu turnaround nhanh.\n- **Tăng tham số effort lên xhigh cho mọi yêu cầu kiểm tra để Claude suy luận kỹ lưỡng hơn mỗi lần**: Effort cao hơn tăng tài nguyên suy luận, không xử lý lặp prefix tĩnh.\n- **Tải lại toàn bộ đặc tả tham chiếu dưới dạng văn bản thuần (plain text) trong từng yêu cầu để bảo đảm model luôn có phiên bản mới nhất**: Gửi text lại mà không cache vẫn xử lý token lặp; tài liệu vốn không đổi trong tình huống.\n\n**Tham khảo:**\n\n- [Prompt caching](https://platform.claude.com/docs/en/build-with-claude/prompt-caching)"}, {"n": 138, "set": 4, "i": 12, "multi": false, "answer": ["A"], "en": {"stem": "A coding assistant must modify an unknown number of files across a repository to implement a feature, where the exact files and scope of changes can only be determined once the assistant inspects the codebase.\n\nWhich pattern is most appropriate?", "opts": [["A", "Orchestrator-workers, where a central LLM inspects t
