iệu nội bộ có thẩm quyền"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** LLM tăng cường (augmented LLM) với retrieval-augmented generation (RAG) trên kho tài liệu có thẩm quyền đã được lập chỉ mục và hiển thị trích dẫn trong mỗi câu trả lời\n\nRAG trên corpus nội bộ có thẩm quyền lấy các đoạn liên quan rồi hiển thị trích dẫn nguồn cho câu trả lời. Đây là cách trực tiếp đáp ứng yêu cầu truy nguyên chính sách với số bước và phạm vi truy xuất có thể kiểm soát.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **điều phối đa agent (multi-agent orchestration) với một agent lập kế hoạch (planner), một agent nghiên cứu (researcher) và một agent viết (writer) cho mọi truy vấn**: Planner, researcher và writer cho mọi truy vấn thêm điều phối, độ trễ và chi phí khi nhu cầu chỉ là tra cứu chính sách đã lập chỉ mục.\n- **một prompt tĩnh với toàn bộ kho tài liệu chính sách được ghép nối vào mọi yêu cầu**: Nhét toàn corpus mỗi lần tăng token và có thể vượt cửa sổ ngữ cảnh; nó cũng không tự cung cấp trích dẫn từng câu trả lời.\n- **một vòng lặp agent thuần túy với các tool duyệt web mở để tìm thông tin chính sách mới nhất, không giới hạn việc truy xuất trong kho tài liệu nội bộ có thẩm quyền**: Duyệt web mở không giới hạn nguồn nội bộ nên có thể dùng chính sách ngoài thẩm quyền và khó kiểm toán đường đi.\n\n**Tham khảo:**\n\n- [Building effective agents](https://www.anthropic.com/research/building-effective-agents)"}, {"n": 68, "set": 2, "i": 8, "multi": false, "answer": ["C"], "en": {"stem": "You are reviewing a peer’s draft system prompt that contains contradictory instructions: one section says to never\nspeculate beyond the supplied source, and another says to confidently fill in any gaps.\n\nWhich response is most appropriate?", "opts": [["A", "Add a priority-ordering instruction that tells the model to evaluate all available instructions and apply the most contextually appropriate one on each request."], ["B", "Increase the temperature setting so that output randomness masks the contradictions."], ["C", "Resolve the contradiction by removing or rewording the gap-filling instruction so the prompt consistently constrains the model to source-supported content."], ["D", "Keep both contradictory instructions in place and rely on the model to select which one to follow on each individual request, accepting inconsistent behavior as a result."]]}, "vi": {"stem": "Bạn đang rà soát bản nháp system prompt của một đồng nghiệp có chứa các chỉ dẫn mâu thuẫn: một phần nói không bao giờ được suy đoán vượt ra ngoài nguồn được cung cấp, còn một phần khác nói hãy tự tin lấp đầy mọi khoảng trống.\n\nCách phản hồi nào phù hợp nhất?", "opts": [["A", "Thêm một chỉ dẫn sắp xếp thứ tự ưu tiên, yêu cầu model đánh giá mọi chỉ dẫn hiện có và áp dụng chỉ dẫn phù hợp nhất với ngữ cảnh ở mỗi yêu cầu."], ["B", "Tăng thiết lập temperature để tính ngẫu nhiên của đầu ra che lấp các mâu thuẫn."], ["C", "Giải quyết mâu thuẫn bằng cách xóa hoặc viết lại chỉ dẫn lấp khoảng trống để prompt nhất quán giới hạn model trong nội dung được nguồn hỗ trợ."], ["D", "Giữ nguyên cả hai chỉ dẫn mâu thuẫn và dựa vào model để chọn chỉ dẫn cần tuân theo ở từng yêu cầu riêng lẻ, chấp nhận hành vi không nhất quán như một hệ quả."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Giải quyết mâu thuẫn bằng cách xóa hoặc viết lại chỉ dẫn lấp khoảng trống để prompt nhất quán giới hạn model trong nội dung được nguồn hỗ trợ.\n\nCần bỏ hoặc sửa yêu cầu tự tin lấp chỗ trống để toàn prompt thống nhất với nguyên tắc chỉ dùng bằng chứng đã cung cấp. Khi thiếu thông tin, hướng dẫn nhất quán cho phép báo thiếu thay vì buộc model chọn giữa hai mục tiêu đối lập.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Thêm một chỉ dẫn sắp xếp thứ tự ưu tiên, yêu cầu model đánh giá mọi chỉ dẫn hiện có và áp dụng chỉ dẫn phù hợp nhất với ngữ cảnh ở mỗi yêu cầu.**: Yêu cầu tự chọn chỉ dẫn “phù hợp ngữ cảnh” vẫn để nguyên mâu thuẫn và chuyển quyết định grounding cho model mỗi lần.\n- **Tăng thiết lập temperature để tính ngẫu nhiên của đầu ra che lấp các mâu thuẫn.**: Tăng temperature thay độ ngẫu nhiên của đầu ra, không làm hai chỉ dẫn đối lập trở nên tương thích.\n- **Giữ nguyên cả hai chỉ dẫn mâu thuẫn và dựa vào model để chọn chỉ dẫn cần tuân theo ở từng yêu cầu riêng lẻ, chấp nhận hành vi không nhất quán như một hệ quả.**: Giữ cả hai mục tiêu khiến grounding phụ thuộc lựa chọn từng lần của model, không sửa lỗi thiết kế prompt.\n\n**Tham khảo:**\n\n- [Prompt engineering overview](https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview)"}, {"n": 69, "set": 2, "i": 9, "multi": false, "answer": ["C"], "en": {"stem": "You are designing the prompt for a ticket-triage classifier with thirty well-defined categories and clear category\ndescriptions in the prompt.\n\nWhich technique is most appropriate as the starting point?", "opts": [["A", "a prompt that demands the model invent new categories when the supplied ones do not fit"], ["B", "a chain-of-thought prompt for a routing decision that does not require multi-step reasoning"], ["C", "a zero-shot prompt that specifies the categories with their descriptions and the required output format"], ["D", "a prompt with no category descriptions, expecting the model to infer the category set"]]}, "vi": {"stem": "Bạn đang thiết kế prompt cho một bộ phân loại ticket (ticket-triage classifier) với ba mươi danh mục được định nghĩa rõ và mô tả danh mục rõ ràng trong prompt.\n\nKỹ thuật nào phù hợp nhất làm điểm khởi đầu?", "opts": [["A", "một prompt yêu cầu model tự tạo ra danh mục mới khi các danh mục được cung cấp không phù hợp"], ["B", "một prompt chain-of-thought cho một quyết định định tuyến không đòi hỏi suy luận nhiều bước"], ["C", "một prompt zero-shot nêu rõ các danh mục kèm mô tả và định dạng đầu ra bắt buộc"], ["D", "một prompt không có mô tả danh mục, kỳ vọng model tự suy ra tập danh mục"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** một prompt zero-shot nêu rõ các danh mục kèm mô tả và định dạng đầu ra bắt buộc\n\nZero-shot với đủ tên, mô tả của 30 nhóm và định dạng đầu ra là điểm xuất phát hợp lý cho phân loại tập đóng. Đánh giá lỗi thực tế rồi mới bổ sung ví dụ hoặc cách xử lý khó hơn nếu cần, thay vì tăng độ phức tạp ngay từ đầu.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **một prompt yêu cầu model tự tạo ra danh mục mới khi các danh mục được cung cấp không phù hợp**: Cho phép tự tạo nhóm làm phá vỡ tập 30 nhãn đã định nghĩa và hợp đồng routing phía sau.\n- **một prompt chain-of-thought cho một quyết định định tuyến không đòi hỏi suy luận nhiều bước**: Yêu cầu suy luận nhiều bước cho quyết định đơn giản tăng độ phức tạp mà chưa có lỗi nào cho thấy cần thiết.\n- **một prompt không có mô tả danh mục, kỳ vọng model tự suy ra tập danh mục**: Thiếu mô tả khiến model phải đoán ranh giới nhãn thay vì áp dụng quy tắc phân loại của hệ thống.\n\n**Tham khảo:**\n\n- [Prompt engineering overview](https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview)"}, {"n": 70, "set": 2, "i": 10, "multi": true, "answer": ["C", "E"], "en": {"stem": "You are selecting a model for a new production workload and must complete the upstream steps before testing\ncandidate models empirically.\n\nWhich two steps must be completed BEFORE running a representative sample on a candidate model? (Choose\ntwo.)\nEach correct answer presents part of the solution.", "opts": [["A", "Sign off the production rollout plan with the platform and security teams."], ["B", "Select the lightest model that consistently meets the quality bar across the sample."], ["C", "Choose a candidate model based on the requirements profile and known capabilities."], ["D", "Retest the model choice when a new model version becomes available."], ["E", "Define the quality bar, latency tolerance, and expected volume for the workload."]]}, "vi": {"stem": "Bạn đang chọn model cho một khối lượng công việc production mới và phải hoàn tất các bước đầu vào (upstream) trước khi kiểm thử thực nghiệm các model ứng viên.\n\nHai bước nào phải được hoàn tất TRƯỚC KHI chạy một mẫu đại diện trên một model ứng viên? (Chọn hai.)\nMỗi đáp án đúng là một phần của giải pháp.", "opts": [["A", "Ký duyệt kế hoạch triển khai lên production với nhóm nền tảng và nhóm bảo mật."], ["B", "Chọn model nhẹ nhất đáp ứng nhất quán ngưỡng chất lượng trên toàn bộ mẫu."], ["C", "Chọn một model ứng viên dựa trên hồ sơ yêu cầu và các năng lực đã biết."], ["D", "Kiểm thử lại lựa chọn model khi có phiên bản model mới."], ["E", "Xác định ngưỡng chất lượng, mức chịu đựng latency và khối lượng dự kiến cho khối lượng công việc."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Chọn một model ứng viên dựa trên hồ sơ yêu cầu và các năng lực đã biết.; Xác định ngưỡng chất lượng, mức chịu đựng latency và khối lượng dự kiến cho khối lượng công việc.\n\nTrước khi thử model cần định nghĩa mức chất lượng, độ trễ và lưu lượng dự kiến để biết ứng viên phải đạt gì. Dựa trên hồ sơ yêu cầu và năng lực đã biết mới chọn ứng viên đem chạy mẫu đại diện; quyết định model cuối cùng cần bằng chứng từ phép thử đó.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Ký duyệt kế hoạch triển khai lên production với nhóm nền tảng và nhóm bảo mật.**: Kế hoạch rollout cần kết quả chọn và xác minh model; ký kế hoạch sản xuất không phải điều kiện kỹ thuật để chạy mẫu ban đầu.\n- **Chọn model nhẹ nhất đáp ứng nhất quán ngưỡng chất lượng trên toàn bộ mẫu.**: Chọn model nhẹ nhất đạt chuẩn là quyết định sau khi đã đo ứng viên trên mẫu, không phải trước khi đo.\n- **Kiểm thử lại lựa chọn model khi có phiên bản model mới.**: Kiểm thử lại khi có phiên bản mới thuộc vòng đời vận hành sau này, không xác định ứng viên và tiêu chuẩn cho lần thử đầu.\n\n**Tham khảo:**\n\n- [Define success criteria and build evaluations](https://platform.claude.com/docs/en/test-and-evaluate/develop-tests)\n- [Prompt engineering overview](https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview)"}, {"n": 71, "set": 2, "i": 11, "multi": false, "answer": ["A"], "en": {"stem": "**HOTSPOT**\n\nYou are reviewing a peer’s end-to-end design for a Claude-based platform expected to scale to thousands of concurrent users.\n\nFor each statement, indicate yes if the statement reflects a sound architectural practice. Otherwise, select no.\n\nSelect the answer sequence in the displayed item order.", "opts": [["A", "Yes, Yes, No, No."], ["B", "Yes, Yes, Yes, No."], ["C", "No, Yes, No, No."], ["D", "Yes, Yes, No, Yes."]]}, "vi": {"stem": "**HOTSPOT**\n\nBạn đang rà soát thiết kế đầu-cuối (end-to-end) của một đồng nghiệp cho một nền tảng dựa trên Claude dự kiến mở rộng để phục vụ hàng nghìn người dùng đồng thời.\n\nVới mỗi phát biểu, chọn Có (Yes) nếu phát biểu phản ánh một thực hành kiến trúc đúng đắn. Nếu không, chọn Không (No).\n\nChọn chuỗi đáp án theo đúng thứ tự các mục được hiển thị.", "opts": [["A", "Có (Yes), Có (Yes), Không (No), Không (No)."], ["B", "Có (Yes), Có (Yes), Có (Yes), Không (No)."], ["C", "Không (No), Có (Yes), Không (No), Không (No)."], ["D", "Có (Yes), Có (Yes), Không (No), Có (Yes)."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Có (Yes), Có (Yes), Không (No), Không (No).\n\nXác thực và phân quyền trước truy xuất là hợp lý vì bộ lọc cần danh tính người gọi. Hàng đợi bất đồng bộ hấp thụ đợt tải tăng đột ngột nếu có giới hạn tải và worker phù hợp, dù không bảo đảm độ trễ từng yêu cầu. Tính thuế nên nằm trong mã có quy tắc và kiểm thử, không dựa vào system prompt. Lưu số định danh nhà nước không che trong log làm tăng phơi lộ dữ liệu, nên nhận định này không hợp lý.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Có (Yes), Có (Yes), Có (Yes), Không (No).**: Chuỗi chấp nhận tính thuế trong system prompt sai ở ranh giới tính toán: câu chữ hướng dẫn không thay mã nghiệp vụ xác định.\n- **Không (No), Có (Yes), Không (No), Không (No).**: Chuỗi phủ nhận xác thực trước truy xuất làm mất danh tính để áp dụng lọc tài liệu theo quyền.\n- **Có (Yes), Có (Yes), Không (No), Có (Yes).**: Chuỗi chấp nhận log định danh không che đánh đổi dữ liệu nhạy cảm lấy tín hiệu tuning mà không có tối thiểu hóa.\n\n**Tham khảo:**\n\n- [Security](https://code.claude.com/docs/en/security)\n- [AI RMF Core](https://airc.nist.gov/airmf-resources/airmf/5-sec-core/)"}, {"n": 72, "set": 2, "i": 12, "multi": false, "answer": ["A"], "en": {"stem": "**HOTSPOT**\n\nYou are sequencing decomposed components in an invoice-processing pipeline.\n\nFor each of the decomposed components, select the execution layer it belongs to:\n\nSelect the answer sequence in the displayed item order.", "opts": [["A", "Claude-based classification of invoice type: Model Stage<br>Persistence of validated records to the system of record: Post-Processing<br>Schema validation of the extracted fields: Post-Processing<br>Claude-based extraction of structured invoice fields: Model Stage<br>PII redaction on extracted text before model invocation: Pre-Processing<br>Optical character recognition (OCR) on scanned invoice images: Pre-Processing"], ["B", "Claude-based classification of invoice type: Model Stage<br>Persistence of validated records to the system of record: Post-Processing<br>Schema validation of the extracted fields: Model Stage<br>Claude-based extraction of structured invoice fields: Model Stage<br>PII redaction on extracted text before model invocation: Pre-Processing<br>Optical character recognition (OCR) on scanned invoice images: Pre-Processing"], ["C", "Claude-based classification of invoice type: Pre-Processing<br>Persistence of validated records to the system of record: Post-Processing<br>Schema validation of the extracted fields: Post-Processing<br>Claude-based extraction of structured invoice fields: Model Stage<br>PII redaction on extracted text before model invocation: Post-Processing<br>Optical character recognition (OCR) on scanned invoice images: Pre-Processing"], ["D", "Claude-based classification of invoice type: Model Stage<br>Persistence of validated records to -Processing"], ["D", "Phân loại loại hóa đơn bằng Claude: Model Stage<br>Lưu trữ (persist) các bản ghi đã xác thực vào hệ thống lưu trữ chính (system of record): Post-Processing<br>Xác thực schema cho các trường đã trích xuất: Post-Processing<br>Trích xuất các trường hóa đơn có cấu trúc bằng Claude: Model Stage<br>Che giấu (redaction) PII trên văn bản đã trích xuất trước khi gọi model: Post-Processing<br>Nhận dạng ký tự quang học (OCR) trên ảnh hóa đơn được quét: Pre-Processing"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Phân loại loại hóa đơn bằng Claude: Model Stage | Lưu trữ (persist) các bản ghi đã xác thực vào hệ thống lưu trữ chính (system of record): Post-Processing | Xác thực schema cho các trường đã trích xuất: Post-Processing | Trích xuất các trường hóa đơn có cấu trúc bằng Claude: Model Stage | Che giấu (redaction) PII trên văn bản đã trích xuất trước khi gọi model: Pre-Processing | Nhận dạng ký tự quang học (OCR) trên ảnh hóa đơn được quét: Pre-Processing\n\nPhân loại hóa đơn và trích trường bằng Claude thuộc Model Stage vì cần suy luận của model. OCR ảnh quét và che PII trên văn bản trước lời gọi thuộc Pre-Processing vì chuẩn bị đầu vào. Kiểm tra schema các trường đã trích và lưu bản ghi đã xác thực thuộc Post-Processing: mã kiểm tra kết quả rồi mới ghi vào hệ thống chính. Đây là phân loại trách nhiệm của pipeline, kể cả khi dùng thêm structured output để giảm lỗi định dạng.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Phân loại loại hóa đơn bằng Claude: Model Stage | Lưu trữ (persist) các bản ghi đã xác thực vào hệ thống lưu trữ chính (system of record): Post-Processing | Xác thực schema cho các trường đã trích xuất: Model Stage | Trích xuất các trường hóa đơn có cấu trúc bằng Claude: Model Stage | Che giấu (redaction) PII trên văn bản đã trích xuất trước khi gọi model: Pre-Processing | Nhận dạng ký tự quang học (OCR) trên ảnh hóa đơn được quét: Pre-Processing**: Mapping đưa kiểm tra schema vào Model Stage nhầm việc model sinh trường <br>Chunking theo từng bản ghi, trong đó mỗi bản ghi là một chunk: Long Structured Documents<br>Chunking theo ngữ nghĩa (semantic) dọc theo ranh giới điều khoản hoặc đoạn văn: Long Structured Documents<br>Chunking kích thước cố định có chồng lấn (overlap) cho các bản ghi ngắn có độ dài tương tự nhau: Code or Hierarchical Specs<br>Chunking phân cấp phản chiếu cấu trúc các mục của tài liệu: Long Structured Documents"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:**\n\nChunking ở cấp hàm hoặc cấp mục (section) cho các module mã nguồn: Code or Hierarchical Specs\n\nChunking nhận biết cấu trúc cây (tree-aware), bám theo phân cấp của mã nguồn hoặc đặc tả: Code or Hierarchical Specs\n\nChunking theo từng bản ghi, trong đó mỗi bản ghi là một chunk: Heterogeneous Short Records\n\nChunking theo ngữ nghĩa (semantic) dọc theo ranh giới điều khoản hoặc đoạn văn: Long Structured Documents\n\nChunking kích thước cố định có chồng lấn (overlap) cho các bản ghi ngắn có độ dài tương tự nhau: Heterogeneous Short Records\n\nChunking phân cấp phản chiếu cấu trúc các mục của tài liệu: Long Structured Documents\n\nTheo taxonomy của đề, cắt theo hàm/section của code và theo cây code/spec thuộc Code or Hierarchical Specs vì giữ đơn vị và quan hệ cấu trúc. Mỗi bản ghi thành một chunk cùng cắt cố định có overlap cho bản ghi ngắn tương tự độ dài được ghép với Heterogeneous Short Records. Cắt theo ranh giới điều khoản/đoạn và theo hệ thống section thuộc Long Structured Documents. Đây là gợi ý bắt đầu cần kiểm thử theo corpus, không phải giới hạn độc quyền của từng kỹ thuật; overlap cũng không cần thiết cho mọi bản ghi ngắn.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Chunking ở cấp hàm hoặc cấp mục (section) cho các module mã nguồn: Long Structured Documents | Chunking nhận biết cấu trúc cây (tree-aware), bám theo phân cấp của mã nguồn hoặc đặc tả: Code or Hierarchical Specs | Chunking theo từng bản ghi, trong đó mỗi bản ghi là một chunk: Heterogeneous Short Records | Chunking theo ngữ nghĩa (semantic) dọc theo ranh giới điều khoản hoặc đoạn văn: Long Structured Documents | Chunking kích thước cố định có chồng lấn (overlap) cho các bản ghi ngắn có độ dài tương tự nhau: Heterogeneous Short Records | Chunking phân cấp phản chiếu cấu trúc các mục của tài liệu: Long Structured Documents**: Mapping gán cắt theo hàm của code vào tài liệu dài bỏ qua đặc điểm quyết định là ranh giới code; nhóm Code or Hierarchical Specs khớp trực tiếp hơn.\n- **Chunking ở cấp hàm hoặc cấp mục (section) cho các module mã nguồn: Code or Hierarchical Specs | Chunking nhận biết cấu trúc cây (tree-aware), bám theo phân cấp của mã nguồn hoặc đặc tả: Long Structured Documents | Chunking theo từng bản ghi, trong đó mỗi bản ghi là một chunk: Heterogeneous Short Records | Chunking theo ngữ nghĩa (semantic) dọc theo ranh giới điều khoản hoặc đoạn văn: Long Structured Documents | Chunking kích thước cố định có chồng lấn (overlap) cho các bản ghi ngắn có độ dài tương tự nhau: Heterogeneous Short Records | Chunking phân cấp phản chiếu cấu trúc các mục của tài liệu: Heterogeneous Short Records**: Mapping này đưa cây code/spec sang tài liệu dài và hệ thống section tài liệu sang bản ghi ngắn; cả hai bỏ qua cấu trúc được mô tả cụ thể.\n- **Chunking ở cấp hàm hoặc cấp mục (section) cho các module mã nguồn: Code or Hierarchical Specs | Chunking nhận biết cấu trúc cây (tree-aware), bám theo phân cấp của mã nguồn hoặc đặc tả: Code or Hierarchical Specs | Chunking theo từng bản ghi, trong đó mỗi bản ghi là một chunk: Long Structured Documents | Chunking theo ngữ nghĩa (semantic) dọc theo ranh giới điều khoản hoặc đoạn văn: Long Structured Documents | Chunking kích thước cố định có chồng lấn (overlap) cho các bản ghi ngắn có độ dài tương tự nhau: Code or Hierarchical Specs | Chunking phân cấp phản chiếu cấu trúc các mục của tài liệu: Long Structured Documents**: Mapping đưa mỗi bản ghi thành chunk vào tài liệu dài và fixed-size cho bản ghi ngắn vào code; nó không khớp đơn vị nội dung mà các tactic đã nêu.\n\n**Cần xem lại:** Đề gốc nói “where in the request lifecycle” nhưng các lựa chọn là loại corpus. Mapping là cách phân loại dự kiến, không phải tuyên bố mỗi kỹ thuật chỉ dùng được với một corpus.\n\n**Tham khảo:**\n\n- [Chunk large documents for RAG and vector search](https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-chunk-documents)"}, {"n": 75, "set": 2, "i": 15, "multi": false, "answer": ["C"], "en": {"stem": "**HOTSPOT**\n\nYou are evaluating retrieval-strategy claims used by a peer team.\n\nFor each claim, select yes if the statement is generally accurate. Otherwise, select no.\n\nSelect the answer sequence in the displayed item order.", "opts": [["A", "Dense vector retrieval is well suited to recovering paraphrased intent against unstructured text: Yes<br>Sparse term-matching retrieval recovers exact terms, such as identifiers and rare tokens, more reliably than dense retrieval alone: Yes<br>Structured query retrieval is appropriate for filter-and-aggregate workloads against a relational store with schema and indexes: No<br>Hybrid retrieval is identical to dense-only retrieval and shares the same recall characteristics: No<br>Fixed-size chunking with overlap for short records of similar length: No"], ["B", "Dense vector retrieval is well suited to recovering paraphrased intent against unstructured text: Yes<br>Sparse term-matching retrieval recovers exact terms, such as identifiers and rare tokens, more reliably than dense retrieval alone: No<br>Structured query retrieval is appropriate for filter-and-aggregate workloads against a relational store with schema and indexes: Yes<br>Hybrid retrieval is identical to dense-only retrieval and shares the same recall characteristics: No<br>Fixed-size chunking with overlap for short records of similar length: No"], ["C", "Dense vector retrieval is well suited to recovering paraphrased intent against unstructured text: Yes<br>Sparse term-matching retrieval recovers exact terms, such as i ông (No)"], ["B", "Truy xuất vector dày đặc (dense vector retrieval) rất phù hợp để nắm bắt ý định được diễn đạt lại (paraphrase) trên văn bản phi cấu trúc: Có (Yes)<br>Truy xuất khớp thuật ngữ thưa (sparse term-matching) tìm lại các thuật ngữ chính xác, như mã định danh và các token hiếm, đáng tin cậy hơn so với chỉ dùng truy xuất dày đặc: Không (No)<br>Truy xuất bằng truy vấn có cấu trúc (structured query) phù hợp với các khối lượng công việc lọc và tổng hợp trên một kho dữ liệu quan hệ có schema và chỉ mục: Có (Yes)<br>Truy xuất lai (hybrid) giống hệt truy xuất chỉ dùng dense và có cùng đặc điểm về độ phủ (recall): Không (No)<br>Chunking kích thước cố định có chồng lấn (overlap) cho các bản ghi ngắn có độ dài tương tự nhau: Không (No)"], ["C", "Truy xuất vector dày đặc (dense vector retrieval) rất phù hợp để nắm bắt ý định được diễn đạt lại (paraphrase) trên văn bản phi cấu trúc: Có (Yes)<br>Truy xuất khớp thuật ngữ thưa (sparse term-matching) tìm lại các thuật ngữ chính xác, như mã định danh và các token hiếm, đáng tin cậy hơn so với chỉ dùng truy xuất dày đặc: Có (Yes)<br>Truy xuất bằng truy vấn có cấu trúc (structured query) phù hợp với các khối lượng công việc lọc và tổng hợp trên một kho dữ liệu quan hệ có schema và chỉ mục: Có (Yes)<br>Truy xuất lai (hybrid) giống hệt truy xuất chỉ dùng dense và có cùng đặc điểm về độ phủ (recall): Không (No)<br>Chunking kích thước cố định có chồng lấn (overlap) cho các bản ghi ngắn có độ dài tương tự nhau: Không (No)"], ["D", "Truy xuất vector dày đặc (dense vector retrieval) rất phù hợp để nắm bắt ý định được diễn đạt lại (paraphrase) trên văn bản phi cấu trúc: Có (Yes)<br>Truy xuất khớp thuật ngữ thưa (sparse term-matching) tìm lại các thuật ngữ chính xác, như mã định danh và các token hiếm, đáng tin cậy hơn so với chỉ dùng truy xuất dày đặc: Có (Yes)<br>Truy xuất bằng truy vấn có cấu trúc (structured query) phù hợp với các khối lượng công việc lọc và tổng hợp trên một kho dữ liệu quan hệ có schema và chỉ mục: Có (Yes)<br>Truy xuất lai (hybrid) giống hệt truy xuất chỉ dùng dense và có cùng đặc điểm về độ phủ (recall): Có (Yes)<br>Chunking kích thước cố định có chồng lấn (overlap) cho các bản ghi ngắn có độ dài tương tự nhau: Có (Yes)"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:**\n\nTruy xuất vector dày đặc (dense vector retrieval) rất phù hợp để nắm bắt ý định được diễn đạt lại (paraphrase) trên văn bản phi cấu trúc: Có (Yes)\n\nTruy xuất khớp thuật ngữ thưa (sparse term-matching) tìm lại các thuật ngữ chính xác, như mã định danh và các token hiếm, đáng tin cậy hơn so với chỉ dùng truy xuất dày đặc: Có (Yes)\n\nTruy xuất bằng truy vấn có cấu trúc (structured query) phù hợp với các khối lượng công việc lọc và tổng hợp trên một kho dữ liệu quan hệ có schema và chỉ mục: Có (Yes)\n\nTruy xuất lai (hybrid) giống hệt truy xuất chỉ dùng dense và có cùng đặc điểm về độ phủ (recall): Không (No)\n\nChunking kích thước cố định có chồng lấn (overlap) cho các bản ghi ngắn có độ dài tương tự nhau: Không (No)\n\nDense vector phù hợp ý định diễn đạt lại; sparse term matching hữu ích với mã định danh và từ hiếm; truy vấn có cấu trúc phù hợp lọc và tổng hợp trên cơ sở dữ liệu quan hệ. Hybrid kết hợp tín hiệu lexical và vector nên không đồng nhất với dense-only. Lấy mẫu ngẫu nhiên không bảo đảm tìm bằng chứng liên quan cho Q&A sản xuất. Tuy nhiên lựa chọn ghép được khóa nguồn chọn lại thay nhận định lấy mẫu ngẫu nhiên bằng fixed-size chunking: không thể xác nhận đáp án tổng hợp từ bảng này, và không được suy ra fixed-size chunking là sai.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Truy xuất vector dày đặc (dense vector retrieval) rất phù hợp để nắm bắt ý định được diễn đạt lại (paraphrase) trên văn bản phi cấu trúc: Có (Yes) | Truy xuất khớp thuật ngữ thưa (sparse term-matching) tìm lại các thuật ngữ chính xác, như mã định danh và các token hiếm, đáng tin cậy hơn so với chỉ dùng truy xuất dày đặc: Có (Yes) | Truy xuất bằng truy vấn có cấu trúc (structured query) phù hợp với các khối lượng công việc lọc và tổng hợp trên một kho dữ liệu quan hệ có schema và chỉ mục: Không (No) | Truy xuất lai (hybrid) giống hệt truy xuất chỉ dùng dense và có cùng đặc điểm về độ phủ (recall): Không (No) | Chunking kích thước cố định có chồng lấn (overlap) cho các bản ghi ngắn có độ dài tương tự nhau: Không (No)**: Phủ nhận truy vấn có cấu trúc cho lọc và tổng hợp bỏ qua khả năng trực tiếp của schema và chỉ mục quan hệ. Mục cuối vẫn mắc lỗi thay random sampling bằng chunking.\n- **Truy xuất vector dày đặc (dense vector retrieval) rất phù hợp để nắm bắt ý định được diễn đạt lại (paraphrase) trên văn bản phi cấu trúc: Có (Yes) | Truy xuất khớp thuật ngữ thưa (sparse term-matching) tìm lại các thuật ngữ chính xác, như mã định danh và các token hiếm, đáng tin cậy hơn so với chỉ dùng truy xuất dày đặc: Không (No) | Truy xuất bằng truy vấn có cấu trúc (structured query) phù hợp với các khối lượng công việc lọc và tổng hợp trên một kho dữ liệu quan hệ có schema và chỉ mục: Có (Yes) | Truy xuất lai (hybrid) giống hệt truy xuất chỉ dùng dense và có cùng đặc điểm về độ phủ (recall): Không (No) | Chunking kích thước cố định có chồng lấn (overlap) cho các bản ghi ngắn có độ dài tương tự nhau: Không (No)**: Phủ nhận lợi ích sparse với mã và từ hiếm bỏ qua tính khớp từ chính xác mà dense có thể làm mờ. Mục cuối vẫn không trả lời nhận định trong bảng.\n- **Truy xuất vector dày đặc (dense vector retrieval) rất phù hợp để nắm bắt ý định được diễn đạt lại (paraphrase) trên văn bản phi cấu trúc: Có (Yes) | Truy xuất khớp thuật ngữ thưa (sparse term-matching) tìm lại các thuật ngữ chính xác, như mã định danh và các token hiếm, đáng tin cậy hơn so với chỉ dùng truy xuất dày đặc: Có (Yes) | Truy xuất bằng truy vấn có cấu trúc (structured query) phù hợp với các khối lượng công việc lọc và tổng hợp trên một kho dữ liệu quan hệ có schema và chỉ mục: Có (Yes) | Truy xuất lai (hybrid) giống hệt truy xuất chỉ dùng dense và có cùng đặc điểm về độ phủ (recall): Có (Yes) | Chunking kích thước cố định có chồng lấn (overlap) cho các bản ghi ngắn có độ dài tương tự nhau: Có (Yes)**: Chấp nhận hybrid giống dense-only sai vì hybrid kết hợp thêm truy xuất từ khóa. Giá trị Yes ở mục chunking cũng không thể được dùng để chấm nhận định random sampling bị thiếu.\n\n**Cần xem lại:** Mismatch quan trọng: answer_area.slots hỏi random sampling ở mục cuối, còn mọi option nguồn nói fixed-size chunking. Không tự đổi option hoặc key; cần phục hồi lựa chọn đúng từ PDF trước khi dùng để chấm điểm. Không chấm câu này như đã xác minh đúng: đáp án tổng hợp không chứa nhận định random sampling mà bảng yêu cầu. Không suy ra fixed-size chunking nói chung là sai.\n\n**Tham khảo:**\n\n- [Hybrid search using vectors and full-text search](https://learn.microsoft.com/en-us/azure/search/hybrid-search-overview)\n- [Chunk large documents for RAG and vector search](https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-chunk-documents)"}, {"n": 76, "set": 2, "i": 16, "multi": false, "answer": ["B"], "en": {"stem": "**HOTSPOT**\n\nYou are evaluating prompting claims in a peer’s design document.\n\nFor each claim, select yes if the claim reflects sound practice. Otherwise, select no.\n\nSelect the answer sequence in the displayed item order.", "opts": [["A", "Zero-shot is appropriate as a starting point for closed-set classification when categories and descriptions are provided in the prompt: Yes<br>Adding a few-shot example set with exact field names helps establish output formatting for extraction tasks: Yes<br>Chain-of-thought should be the default on every task, regardless of complexity: Yes<br>Leading-question framing can be mitigated by requesting an even-handed comparison using explicit criteria: Yes<br>Behavioral differences across model versions can be ignored once a prompt has been validated on one version: No"], ["B", "Zero-shot is appropriate as a starting point for closed-set classification when categories and descriptions are provided in the prompt: Yes<br>Adding a  lực của nó: Có (Yes)<br>Chọn model dựa trên phiên bản nào được công bố gần đây nhất là cơ sở đúng đắn cho các quyết định production: Không (No)"], ["B", "Các model suy luận nặng hơn thường tiêu tốn nhiều ngân sách rate limit tính theo token hơn và chạy chậm hơn các model nhẹ hơn trên cùng một đầu vào: Có (Yes)<br>Một đánh giá trên mẫu đại diện của khối lượng công việc mục tiêu là cơ sở đúng đắn để xác nhận một lựa chọn model: Có (Yes)<br>Model có năng lực cao nhất luôn là lựa chọn đúng, bất kể hồ sơ khối lượng công việc: Không (No)<br>Định tuyến phân tầng (tiered routing) có thể phục vụ lưu lượng thông thường bằng một model nhẹ hơn, trong khi dành model nặng hơn cho những yêu cầu cần đến năng lực của nó: Có (Yes)<br>Chọn model dựa trên phiên bản nào được công bố gần đây nhất là cơ sở đúng đắn cho các quyết định production: Không (No)"], ["C", "Các model suy luận nặng hơn thường tiêu tốn nhiều ngân sách rate limit tính theo token hơn và chạy chậm hơn các model nhẹ hơn trên cùng một đầu vào: Có (Yes)<br>Một đánh giá trên mẫu đại diện của khối lượng công việc mục tiêu là cơ sở đúng đắn để xác nhận một lựa chọn model: Không (No)<br>Model có năng lực cao nhất luôn là lựa chọn đúng, bất kể hồ sơ khối lượng công việc: Không (No)<br>Định tuyến phân tầng (tiered routing) có thể phục vụ lưu lượng thông thường bằng một model nhẹ hơn, trong khi dành model nặng hơn cho những yêu cầu cần đến năng lực của nó: Có (Yes)<br>Chọn model dựa trên phiên bản nào được công bố gần đây nhất là cơ sở đúng đắn cho các quyết định production: Có (Yes)"], ["D", "Các model suy luận nặng hơn thường tiêu tốn nhiều ngân sách rate limit tính theo token hơn và chạy chậm hơn các model nhẹ hơn trên cùng một đầu vào: Không (No)<br>Một đánh giá trên mẫu đại diện của khối lượng công việc mục tiêu là cơ sở đúng đắn để xác nhận một lựa chọn model: Có (Yes)<br>Model có năng lực cao nhất luôn là lựa chọn đúng, bất kể hồ sơ khối lượng công việc: Không (No)<br>Định tuyến phân tầng (tiered routing) có thể phục vụ lưu lượng thông thường bằng một model nhẹ hơn, trong khi dành model nặng hơn cho những yêu cầu cần đến năng lực của nó: Không (No)<br>Chọn model dựa trên phiên bản nào được công bố gần đây nhất là cơ sở đúng đắn cho các quyết định production: Không (No)"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:**\n\nCác model suy luận nặng hơn thường tiêu tốn nhiều ngân sách rate limit tính theo token hơn và chạy chậm hơn các model nhẹ hơn trên cùng một đầu vào: Có (Yes)\n\nMột đánh giá trên mẫu đại diện của khối lượng công việc mục tiêu là cơ sở đúng đắn để xác nhận một lựa chọn model: Có (Yes)\n\nModel có năng lực cao nhất luôn là lựa chọn đúng, bất kể hồ sơ khối lượng công việc: Không (No) | Định tuyến phân tầng (tiered routing) có thể phục vụ lưu lượng thông thường bằng một model nhẹ hơn, trong khi dành model nặng hơn cho những yêu cầu cần đến năng lực của nó: Có (Yes)\n\nChọn model dựa trên phiên bản nào được công bố gần đây nhất là cơ sở đúng đắn cho các quyết định production: Không (No)\n\nMẫu đại diện của workload là cơ sở xác minh model; model mạnh nhất không luôn cần thiết khi chất lượng, độ trễ và chi phí có giới hạn. Routing theo độ khó có thể dùng model nhẹ cho việc thường và model mạnh cho việc cần năng lực đó; ngày công bố mới không thay bằng chứng đo. Khóa nguồn còn chấp nhận nhận định model suy luận nặng thường chậm và tốn ngân sách token hơn: phần độ trễ có thể đúng theo cấu hình, nhưng cùng input không tự chứng minh dùng nhiều rate limit hơn; còn phụ thuộc output/thinking token, cache, pool và giới hạn từng model.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Các model suy luận nặng hơn thường tiêu tốn nhiều ngân sách rate limit tính theo token hơn và chạy chậm hơn các model nhẹ hơn trên cùng một đầu vào: Có (Yes) | Một đánh giá trên mẫu đại diện của khối lượng công việc mục tiêu là cơ sở đúng đắn để xác nhận một lựa chọn model: Có (Yes) | Model có năng lực cao nhất luôn là lựa chọn đúng, bất kể hồ sơ khối lượng công việc: Có (Yes) | Định tuyến phân tầng (tiered routing) có thể phục vụ lưu lượng thông thường bằng một model nhẹ hơn, trong khi dành model nặng hơn cho những yêu cầu cần đến năng lực của nó: Có (Yes) | Chọn model dựa trên phiên bản nào được công bố gần đây nhất là cơ sở đúng đắn cho các quyết định production: Không (No)**: Chuỗi cho rằng model mạnh nhất luôn đúng bỏ qua việc model nhẹ hơn có thể đạt cùng chuẩn với chi phí và độ trễ thấp hơn; claim rate limit chung vẫn cần sửa.\n- **Các model suy luận nặng hơn thường tiêu tốn nhiều ngân sách rate limit tính theo token hơn và chạy chậm hơn các model nhẹ hơn trên cùng một đầu vào: Có (Yes) | Một đánh giá trên mẫu đại diện của khối lượng công việc mục tiêu là cơ sở đúng đắn để xác nhận một lựa chọn model: Không (No) | Model có năng lực cao nhất luôn là lựa chọn đúng, bất kể hồ sơ khối lượng công việc: Không (No) | Định tuyến phân tầng (tiered routing) có thể phục vụ lưu lượng thông thường bằng một model nhẹ hơn, trong khi dành model nặng hơn cho những yêu cầu cần đến năng lực của nó: Có (Yes) | Chọn model dựa trên phiên bản nào được công bố gần đây nhất là cơ sở đúng đắn cho các quyết định production: Có (Yes)**: Chuỗi phủ nhận đánh giá mẫu và chọn theo ngày ra mắt thay bằng chứng workload bằng tín hiệu marketing; đây không phải xác minh phù hợp sản xuất.\n- **Các model suy luận nặng hơn thường tiêu tốn nhiều ngân sách rate limit tính theo token hơn và chạy chậm hơn các model nhẹ hơn trên cùng một đầu vào: Không (No) | Một đánh giá trên mẫu đại diện của khối lượng công việc mục tiêu là cơ sở đúng đắn để xác nhận một lựa chọn model: Có (Yes) | Model có năng lực cao nhất luôn là lựa chọn đúng, bất kể hồ sơ khối lượng công việc: Không (No) | Định tuyến phân tầng (tiered routing) có thể phục vụ lưu lượng thông thường bằng một model nhẹ hơn, trong khi dành model nặng hơn cho những yêu cầu cần đến năng lực của nó: Không (No) | Chọn model dựa trên phiên bản nào được công bố gần đây nhất là cơ sở đúng đắn cho các quyết định production: Không (No)**: Phủ nhận hoàn toàn lợi ích routing là sai vì có thể phân tải theo độ khó. Việc phủ nhận claim rate limit quá rộng có cơ sở, nhưng không cứu được mapping routing sai trong lựa chọn này.\n\n**Cần xem lại:** Claim “heavier-reasoning models consume more rate limit on the same input” không đúng như quy tắc tổng quát. Input, output/thinking token, cache accounting, model-specific pool và limit cấu hình mới quyết định. Giữ khóa nguồn nhưng cần sửa claim có điều kiện.\n\n**Tham khảo:**\n\n- [Rate limits](https://platform.claude.com/docs/en/api/rate-limits)\n- [Reducing latency](https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-latency)\n- [Define success criteria and build evaluations](https://platform.claude.com/docs/en/test-and-evaluate/develop-tests)"}, {"n": 78, "set": 2, "i": 18, "multi": true, "answer": ["B", "E"], "en": {"stem": "You are compiling factors that should drive the choice between Model Context Protocol (MCP), direct API\nintegration, and agent-to-agent handoff.\n\nWhich two factors belong on the list? (Choose two.)\nEach correct answer presents a complete solution.", "opts": [["A", "whether the underlying transport supports encryption in transit between the integrated services"], ["B", "whether the interaction is stateless and latency-sensitive or stateful and longer-running"], ["C", "whether the vendor publishes detailed reference documentation for each candidate protocol"], ["D", "whether the team has prior implementation experience with any of the candidate protocols"], ["E", "whether the integration must be portable across multiple AI clients in the ecosystem"]]}, "vi": {"stem": "Bạn đang tổng hợp các yếu tố nên quyết định việc lựa chọn giữa Model Context Protocol (MCP), tích hợp API trực tiếp và chuyển giao giữa các agent (agent-to-agent handoff).\n\nHai yếu tố nào thuộc danh sách này? (Chọn hai.)\nMỗi đáp án đúng là một giải pháp hoàn chỉnh.", "opts": [["A", "liệu tầng truyền tải (transport) bên dưới có hỗ trợ mã hóa khi truyền (encryption in transit) giữa các dịch vụ được tích hợp hay không"], ["B", "liệu tương tác là phi trạng thái (stateless) và nhạy cảm với latency, hay có trạng thái (stateful) và chạy lâu hơn"], ["C", "liệu nhà cung cấp có công bố tài liệu tham chiếu chi tiết cho từng giao thức ứng viên hay không"], ["D", "liệu nhóm đã có kinh nghiệm triển khai với bất kỳ giao thức ứng viên nào trước đây hay chưa"], ["E", "liệu việc tích hợp có cần khả năng di chuyển (portable) giữa nhiều AI client trong hệ sinh thái hay không"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** liệu tương tác là phi trạng thái (stateless) và nhạy cảm với latency, hay có trạng thái (stateful) và chạy lâu hơn; liệu việc tích hợp có cần khả năng di chuyển (portable) giữa nhiều AI client trong hệ sinh thái hay không\n\nTính chất tương tác giúp chọn mức điều phối: một lời gọi stateless nhạy độ trễ khác tác vụ có trạng thái kéo dài và bàn giao công việc. Nhu cầu tái sử dụng qua nhiều AI client làm tiêu chuẩn mở như MCP đáng cân nhắc hơn tích hợp chỉ phục vụ một client; không có nghĩa MCP chỉ hỗ trợ tác vụ có trạng thái.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **liệu tầng truyền tải (transport) bên dưới có hỗ trợ mã hóa khi truyền (encryption in transit) giữa các dịch vụ được tích hợp hay không**: Mã hóa đường truyền là yêu cầu bảo mật hợp lệ với mọi cách tích hợp, nhưng tự nó không phân biệt tốt MCP, API trực tiếp và handoff.\n- **liệu nhà cung cấp có công bố tài liệu tham chiếu chi tiết cho từng giao thức ứng viên hay không**: Tài liệu nhà cung cấp ảnh hưởng tính khả thi, nhưng mức chi tiết tài liệu không định nghĩa semantics tương tác hoặc nhu cầu tương thích client.\n- **liệu nhóm đã có kinh nghiệm triển khai với bất kỳ giao thức ứng viên nào trước đây hay chưa**: Kinh nghiệm nhóm là đánh đổi triển khai hợp lệ; khóa ưu tiên đặc tính workload và hệ sinh thái, không phủ nhận yếu tố con người.\n\n**Tham khảo:**\n\n- [What is the Model Context Protocol?](https://modelcontextprotocol.io/docs/getting-started/intro)"}, {"n": 79, "set": 2, "i": 19, "multi": false, "answer": ["D"], "en": {"stem": "You are selecting a protocol for a single low-latency stateless tool call from a Claude-based assistant to an\ninternal pricing service that already exposes a stable HTTP API.\n\nWhich integration mechanism is the most appropriate?", "opts": [["A", "a bespoke streaming protocol layered over an unrelated asynchronous message bus"], ["B", "an agent-to-agent handoff that introduces another Claude-based agent in front of the pricing service"], ["C", "a long-lived stateful session protocol for a stateless single-call interaction"], ["D", "a direct API call to the existing endpoint with the appropriate scoped credentials"]]}, "vi": {"stem": "Bạn đang chọn giao thức cho một lệnh gọi tool đơn lẻ, phi trạng thái (stateless), độ trễ thấp từ một trợ lý dựa trên Claude tới một dịch vụ định giá nội bộ vốn đã cung cấp một HTTP API ổn định.\n\nCơ chế tích hợp nào phù hợp nhất?", "opts": [["A", "một giao thức streaming tự xây dựng, đặt trên một message bus bất đồng bộ không liên quan"], ["B", "một lần chuyển giao giữa các agent (agent-to-agent handoff), đưa thêm một agent dựa trên Claude khác vào trước dịch vụ định giá"], ["C", "một giao thức phiên có trạng thái (stateful) tồn tại lâu dài cho một tương tác phi trạng thái chỉ gồm một lệnh gọi"], ["D", "một lệnh gọi API trực tiếp tới endpoint hiện có với thông tin xác thực được giới hạn phạm vi phù hợp"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** một lệnh gọi API trực tiếp tới endpoint hiện có với thông tin xác thực được giới hạn phạm vi phù hợp\n\nGọi trực tiếp HTTP endpoint sẵn có với credential giới hạn quyền đáp ứng đúng một lần gọi stateless và tránh thêm tầng điều phối. Vì dịch vụ giá đã có hợp đồng API ổn định, không có nhu cầu trong đề biện minh cho một agent hoặc phiên dài hơn.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **một giao thức streaming tự xây dựng, đặt trên một message bus bất đồng bộ không liên quan**: Giao thức tự chế trên message bus không liên quan thêm độ phức tạp và điểm chuyển giao cho một truy vấn đồng bộ đơn giản.\n- **một lần chuyển giao giữa các agent (agent-to-agent handoff), đưa thêm một agent dựa trên Claude khác vào trước dịch vụ định giá**: Agent trung gian không bổ sung nhiệm vụ suy luận nào được yêu cầu nhưng có thể thêm độ trễ và chi phí.\n- **một giao thức phiên có trạng thái (stateful) tồn tại lâu dài cho một tương tác phi trạng thái chỉ gồm một lệnh gọi**: Phiên có trạng thái kéo dài buộc quản lý vòng đời không cần thiết cho một lần gọi stateless.\n\n**Tham khảo:**\n\n- [What is the Model Context Protocol?](https://modelcontextprotocol.io/docs/getting-started/intro)"}, {"n": 80, "set": 2, "i": 20, "multi": true, "answer": ["A", "E"], "en": {"stem": "You are designing a human-in-the-loop validation workflow.\n\nWhich two design elements belong in the workflow? (Choose two.)\nEach correct answer presents a complete solution.", "opts": [["A", "capture of reviewer decisions as labeled data that feeds the evaluation set over time"], ["B", "mandatory reviewer agreement with the model output to maintain consistent reviewer-model alignment"], ["C", "aggregate reviewer throughput metrics published weekly to leadership for headcount planning"], ["D", "uniform sampling of all model outputs to give every request an equal chance of review"], ["E", "risk-stratified sampling that concentrates reviewer attention on low-confidence and high-impact outputs"]]}, "vi": {"stem": "Bạn đang thiết kế một workflow xác thực có con người tham gia (human-in-the-loop).\n\nHai yếu tố thiết kế nào thuộc workflow này? (Chọn hai.)\nMỗi đáp án đúng là một giải pháp hoàn chỉnh.", "opts": [["A", "ghi nhận các quyết định của người rà soát dưới dạng dữ liệu có gán nhãn, bổ sung dần vào tập đánh giá theo thời gian"], ["B", "bắt buộc người rà soát đồng ý với đầu ra của model để duy trì sự thống nhất giữa người rà soát và model"], ["C", "các metric tổng hợp về năng suất của người rà soát, được công bố hằng tuần cho ban lãnh đạo để hoạch định nhân sự"], ["D", "lấy mẫu đồng đều trên mọi đầu ra của model để mỗi yêu cầu đều có cơ hội được rà soát như nhau"], ["E", "lấy mẫu phân tầng theo rủi ro (risk-stratified sampling), tập trung sự chú ý của người rà soát vào các đầu ra có độ tin cậy thấp và tác động cao"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** ghi nhận các quyết định của người rà soát dưới dạng dữ liệu có gán nhãn, bổ sung dần vào tập đánh giá theo thời gian; lấy mẫu phân tầng theo rủi ro (risk-stratified sampling), tập trung sự chú ý của người rà soát vào các đầu ra có độ tin cậy thấp và tác động cao\n\nLấy mẫu theo rủi ro tập trung người duyệt vào kết quả thiếu chắc chắn hoặc tác động cao, nơi sai sót đáng quan tâm nhất. Ghi quyết định người duyệt thành nhãn và đưa vào bộ đánh giá biến giám sát thành bằng chứng để cải tiến; nhãn vẫn cần hướng dẫn và kiểm tra chất lượng.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **bắt buộc người rà soát đồng ý với đầu ra của model để duy trì sự thống nhất giữa người rà soát và model**: Bắt người duyệt đồng ý với model triệt tiêu kiểm tra độc lập và che lỗi thay vì phát hiện lỗi.\n- **các metric tổng hợp về năng suất của người rà soát, được công bố hằng tuần cho ban lãnh đạo để hoạch định nhân sự**: Throughput hữu ích cho lập kế hoạch nhân sự nhưng không quy định mẫu rủi ro hoặc nội dung phán xét chất lượng.\n- **lấy mẫu đồng đều trên mọi đầu ra của model để mỗi yêu cầu đều có cơ hội được rà soát như nhau**: Lấy mẫu đều có ích để ước lượng chất lượng tổng thể, nhưng một mình nó có thể lấy quá ít trường hợp hiếm mà tác động cao; khóa ưu tiên phân tầng rủi ro.\n\n**Tham khảo:**\n\n- [AI RMF Core](https://airc.nist.gov/airmf-resources/airmf/5-sec-core/)\n- [Define success criteria and build evaluations](https://platform.claude.com/docs/en/test-and-evaluate/develop-tests)"}, {"n": 81, "set": 2, "i": 21, "multi": true, "answer": ["B", "C"], "en": {"stem": "A Claude-based research assistant begins producing responses that confidently contradict its retrieved source\ndocuments despite no change to the retrieval pipeline.\n\nWhich two diagnostic actions most directly identify the root cause of this behavior? (Choose two.)", "opts": [["A", "Switch the retrieval index to a denser embedding model to improve chunk relevance scores."], ["B", "Isolate whether the failure reproduces on the previous model version to test for model mismatch."], ["C", "Inspect system-prompt grounding instructions to determine whether citation constraints remain intact."], ["D", "Reduce the temperature setting to lower response variance across all query types."], ["E", "Increase the context window size to allow more retrieved chunks per query."]]}, "vi": {"stem": "Một trợ lý nghiên cứu dựa trên Claude bắt đầu tạo ra các phản hồi tự tin mâu thuẫn với chính các tài liệu nguồn mà nó truy xuất, dù pipeline truy xuất không hề thay đổi.\n\nHai hành động chẩn đoán nào xác định nguyên nhân gốc của hành vi này trực tiếp nhất? (Chọn hai.)", "opts": [["A", "Chuyển chỉ mục truy xuất sang một embedding model dày đặc hơn để cải thiện điểm liên quan của các chunk."], ["B", "Cô lập xem lỗi có tái hiện trên phiên bản model trước đó hay không để kiểm tra khả năng không tương thích model (model mismatch)."], ["C", "Kiểm tra các chỉ dẫn neo nguồn (grounding) trong system prompt để xác định các ràng buộc về trích dẫn có còn nguyên vẹn hay không."], ["D", "Giảm thiết lập temperature để hạ độ biến thiên của phản hồi trên mọi loại truy vấn."], ["E", "Tăng kích thước context window để cho phép nhiều chunk được truy xuất hơn trong mỗi truy vấn."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Cô lập xem lỗi có tái hiện trên phiên bản model trước đó hay không để kiểm tra khả năng không tương thích model (model mismatch).; Kiểm tra các chỉ dẫn neo nguồn (grounding) trong system prompt để xác định các ràng buộc về trích dẫn có còn nguyên vẹn hay không.\n\nChạy lại trên phiên bản model trước giúp cô lập thay đổi hành vi model khi truy xuất không đổi. Kiểm tra chỉ dẫn grounding và ràng buộc trích dẫn xác định prompt có đang yêu cầu hoặc cho phép suy diễn vượt nguồn; hai phép chẩn đoán này đánh vào lỗi mâu thuẫn với tài liệu đã tìm được.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Chuyển chỉ mục truy xuất sang một embedding model dày đặc hơn để cải thiện điểm liên quan của các chunk.**: Embedding mới thay khâu tìm đoạn dù đề chưa cho thấy tài liệu sai hoặc thiếu; nó không cô lập việc sinh trái với nguồn đã có.\n- **Giảm thiết lập temperature để hạ độ biến thiên của phản hồi trên mọi loại truy vấn.**: Giảm temperature có thể giảm biến thiên nhưng không chỉ ra prompt hay phiên bản model gây lỗi grounding.\n- **Tăng kích thước context window để cho phép nhiều chunk được truy xuất hơn trong mỗi truy vấn.**: Thêm ngữ cảnh không trực tiếp sửa việc model bỏ qua hoặc bóp méo đoạn nguồn đang có và có thể tăng nhiễu.\n\n**Tham khảo:**\n\n- [Reduce hallucinations](https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations)\n- [Define success criteria and build evaluations](https://platform.claude.com/docs/en/test-and-evaluate/develop-tests)"}, {"n": 82, "set": 2, "i": 22, "multi": true, "answer": ["A", "C"], "en": {"stem": "A pilot AI assistant for procurement specialists shows 89 percent first-response acceptance, but follow-up\nsurveys reveal that specialists frequently override the assistant’s vendor recommendations after consulting\nunrelated criteria the assistant did not consider.\n\nThe pilot owner wants to ship the assistant as is, given the strong\nacceptance rate.\n\nWhich two discernment-competency observations should you raise BEFORE approving the launch? (Choose two.)\nEach correct answer presents part of the solution.", "opts": [["A", "Acceptance does not measure whether recommendations are right after specialist review."], ["B", "The survey response rate may not be statistically representative of all the specialists."], ["C", "The unconsidered criteria represent a scope gap in the assistant’s input space directly."], ["D", "The acceptance rate alone is sufficient evidence of readiness for general production use."], ["E", "The pilot duration was likely too short to establish reliability across the full year."]]}, "vi": {"stem": "Một trợ lý AI thí điểm (pilot) dành cho các chuyên viên mua sắm cho thấy tỷ lệ chấp nhận phản hồi đầu tiên đạt 89 phần trăm, nhưng các khảo sát tiếp theo cho thấy các chuyên viên thường xuyên ghi đè khuyến nghị nhà cung cấp của trợ lý sau khi tham khảo những tiêu chí khác mà trợ lý không xem xét. Người phụ trách thí điểm muốn phát hành trợ lý nguyên trạng, dựa trên tỷ lệ chấp nhận cao.\n\nBạn nên nêu ra hai nhận định nào thuộc năng lực Discernment (Phân định) TRƯỚC KHI phê duyệt việc ra mắt? (Chọn hai.)\nMỗi đáp án đúng là một phần của giải pháp.", "opts": [["A", "Tỷ lệ chấp nhận không đo được liệu các khuyến nghị có đúng hay không sau khi chuyên viên rà soát."], ["B", "Tỷ lệ phản hồi khảo sát có thể không đại diện về mặt thống kê cho toàn bộ các chuyên viên."], ["C", "Các tiêu chí không được xem xét trực tiếp thể hiện một khoảng trống phạm vi trong không gian đầu vào của trợ lý."], ["D", "Riêng tỷ lệ chấp nhận đã là bằng chứng đủ về mức độ sẵn sàng cho việc sử dụng production rộng rãi."], ["E", "Thời gian thí điểm có lẽ quá ngắn để xác lập độ tin cậy trong suốt cả năm."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Tỷ lệ chấp nhận không đo được liệu các khuyến nghị có đúng hay không sau khi chuyên viên rà soát.; Các tiêu chí không được xem xét trực tiếp thể hiện một khoảng trống phạm vi trong không gian đầu vào của trợ lý.\n\nTỷ lệ chấp nhận ban đầu 89% không đo tính đúng đắn sau khi chuyên gia xem xét đầy đủ. Việc chuyên gia thường xuyên đổi nhà cung cấp theo tiêu chí model chưa có cho thấy khoảng trống đầu vào/phạm vi; cần bổ sung tiêu chí và đánh giá quyết định cuối thay vì lấy acceptance làm giấy phép triển khai.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Tỷ lệ phản hồi khảo sát có thể không đại diện về mặt thống kê cho toàn bộ các chuyên viên.**: Tính đại diện khảo sát đáng kiểm tra, nhưng đề không cho tỷ lệ phản hồi để kết luận; bằng chứng trực tiếp hiện có là quyết định bị đổi vì thiếu tiêu chí.\n- **Riêng tỷ lệ chấp nhận đã là bằng chứng đủ về mức độ sẵn sàng cho việc sử dụng production rộng rãi.**: Acceptance không đủ vì người dùng có thể chấp nhận sớm rồi sửa khuyến nghị sau khi cân nhắc thêm thông tin.\n- **Thời gian thí điểm có lẽ quá ngắn để xác lập độ tin cậy trong suốt cả năm.**: Đề không nêu thời lượng pilot hoặc biến thiên mùa vụ, nên quy lỗi cho thời gian ngắn là giả định chưa có bằng chứng.\n\n**Tham khảo:**\n\n- [Define success criteria and build evaluations](https://platform.claude.com/docs/en/test-and-evaluate/develop-tests)\n- [AI RMF Core](https://airc.nist.gov/airmf-resources/airmf/5-sec-core/)"}, {"n": 83, "set": 2, "i": 23, "multi": true, "answer": ["D", "E"], "en": {"stem": "The platform team at Trenova Systems, Inc. needs to reduce per-query cost and p95 latency for a high-volume\nClaude pipeline without degrading output quality on the core use case.\n\nWhich two optimizations directly target both cost and latency simultaneously? (Choose two.)", "opts": [["A", "Add a retrieval step that fetches the full source corpus into the context window before generation."], ["B", "Expand the system prompt to include additional few-shot examples for every request."], ["C", "Increase max _ tokens to reduce the frequency of truncated responses requiring follow-up calls"], ["D", "Enable prompt caching on the static system-prompt prefix to reduce billable input tokens on repeated calls."], ["E", "Route straightforward query types to a smaller, faster Claude model and reserve the full model for complex cases."]]}, "vi": {"stem": "Nhóm nền tảng tại Trenova Systems, Inc. cần giảm chi phí cho mỗi truy vấn và latency p95 của một pipeline Claude có khối lượng lớn mà không làm suy giảm chất lượng đầu ra ở use case cốt lõi.\n\nHai phương án tối ưu nào nhắm trực tiếp vào cả chi phí lẫn latency cùng lúc? (Chọn hai.)", "opts": [["A", "Thêm một bước truy xuất nạp toàn bộ kho dữ liệu nguồn vào context window trước khi sinh nội dung."], ["B", "Mở rộng system prompt để bổ sung thêm các ví dụ few-shot cho mọi yêu cầu."], ["C", "Tăng `max_tokens` để giảm tần suất các phản hồi bị cắt cụt cần thêm lệnh gọi tiếp theo."], ["D", "Bật prompt caching cho tiền tố system prompt tĩnh để giảm số input token bị tính phí ở các lệnh gọi lặp lại."], ["E", "Định tuyến các loại truy vấn đơn giản sang một model Claude nhỏ hơn, nhanh hơn và dành model đầy đủ cho các trường hợp phức tạp."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Bật prompt caching cho tiền tố system prompt tĩnh để giảm số input token bị tính phí ở các lệnh gọi lặp lại.; Định tuyến các loại truy vấn đơn giản sang một model Claude nhỏ hơn, nhanh hơn và dành model đầy đủ cho các trường hợp phức tạp.\n\nCache prefix ổn định giảm xử lý lặp và chi phí đầu vào khi có cache hit; hiệu quả phụ thuộc điều kiện cache và tần suất tái sử dụng. Routing truy vấn đơn giản sang model nhỏ, nhanh hơn giảm chi phí và độ trễ, miễn đánh giá xác nhận model đó vẫn đạt chất lượng cho nhóm truy vấn ấy.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Thêm một bước truy xuất nạp toàn bộ kho dữ liệu nguồn vào context window trước khi sinh nội dung.**: Nạp toàn corpus làm tăng đầu vào và xử lý, thường đi ngược cả hai mục tiêu so với chỉ lấy bằng chứng cần thiết.\n- **Mở rộng system prompt để bổ sung thêm các ví dụ few-shot cho mọi yêu cầu.**: Thêm ví dụ cho mọi yêu cầu tăng token lặp lại; có thể tăng chất lượng nhưng không trực tiếp tối ưu cả chi phí và độ trễ.\n- **Tăng `max_tokens` để giảm tần suất các phản hồi bị cắt cụt cần thêm lệnh gọi tiếp theo.**: Tăng max_tokens có thể giúp khi có bằng chứng cắt cụt và retry, nhưng đề chưa nêu lỗi này; trần cao hơn tự nó không giảm thời gian hay token thực sinh.\n\n**Tham khảo:**\n\n- [Prompt caching](https://platform.claude.com/docs/en/build-with-claude/prompt-caching)\n- [Reducing latency](https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-latency)"}, {"n": 84, "set": 2, "i": 24, "multi": false, "answer": ["B"], "en": {"stem": "You are integrating human review into a high-volume classification pipeline where reviewing every output is\ninfeasible.\n\nWhich sampling strategy best balances throughput with quality oversight?", "opts": [["A", "no sampling at all, relying entirely on user-submitted complaints to surface quality and safety issues after they have already affected end users at scale"], ["B", "risk-stratified sampling that reviews all low-confidence and high-impact outputs and a smaller random sample of high-confidence routine outputs"], ["C", "inverse sampling that reviews only high-confidence routine outputs and skips all low-confidence and high- impact outputs"], ["D", "universal sampling that reviews every output regardless of confidence level or throughput impact, treating all outputs as equally requiring human review"]]}, "vi": {"stem": "Bạn đang tích hợp bước rà soát của con người vào một pipeline phân loại khối lượng lớn, nơi việc rà soát mọi đầu ra là không khả thi.\n\nChiến lược lấy mẫu nào cân bằng tốt nhất giữa thông lượng và giám sát chất lượng?", "opts": [["A", "không lấy mẫu gì cả, hoàn toàn dựa vào khiếu nại của người dùng để phát hiện các vấn đề về chất lượng và an toàn sau khi chúng đã ảnh hưởng tới người dùng cuối trên diện rộng"], ["B", "lấy mẫu phân tầng theo rủi ro, rà soát mọi đầu ra có độ tin cậy thấp và tác động cao cùng một mẫu ngẫu nhiên nhỏ hơn từ các đầu ra thông thường có độ tin cậy cao"], ["C", "lấy mẫu đảo ngược, chỉ rà soát các đầu ra thông thường có độ tin cậy cao và bỏ qua mọi đầu ra có độ tin cậy thấp và tác động cao"], ["D", "lấy mẫu toàn bộ, rà soát mọi đầu ra bất kể mức độ tin cậy hay tác động tới thông lượng, coi mọi đầu ra đều cần con người rà soát như nhau"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** lấy mẫu phân tầng theo rủi ro, rà soát mọi đầu ra có độ tin cậy thấp và tác động cao cùng một mẫu ngẫu nhiên nhỏ hơn từ các đầu ra thông thường có độ tin cậy cao\n\nDuyệt mọi đầu ra thiếu chắc chắn hoặc tác động cao, đồng thời lấy một mẫu ngẫu nhiên nhỏ từ nhóm thường lệ, tập trung nhân lực vào nguy cơ mà vẫn quan sát được lỗi tự tin sai. Các ngưỡng và khối lượng cần được thiết kế để phù hợp năng lực reviewer, vì đề đã loại cách duyệt tất cả.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **không lấy mẫu gì cả, hoàn toàn dựa vào khiếu nại của người dùng để phát hiện các vấn đề về chất lượng và an toàn sau khi chúng đã ảnh hưởng tới người dùng cuối trên diện rộng**: Chỉ đợi khiếu nại không cung cấp giám sát chủ động và bỏ sót lỗi người dùng không nhận ra hoặc không báo.\n- **lấy mẫu đảo ngược, chỉ rà soát các đầu ra thông thường có độ tin cậy cao và bỏ qua mọi đầu ra có độ tin cậy thấp và tác động cao**: Chỉ duyệt nhóm tự tin cao bỏ qua chính nhóm bất định và tác động cao cần giám sát nhất.\n- **lấy mẫu toàn bộ, rà soát mọi đầu ra bất kể mức độ tin cậy hay tác động tới thông lượng, coi mọi đầu ra đều cần con người rà soát như nhau**: Duyệt toàn bộ không đáp ứng giới hạn throughput đã nêu, dù có thể phù hợp pipeline nhỏ hơn.\n\n**Tham khảo:**\n\n- [AI RMF Core](https://airc.nist.gov/airmf-resources/airmf/5-sec-core/)"}, {"n": 85, "set": 2, "i": 25, "multi": false, "answer": ["A"], "en": {"stem": "You are operating an interactive assistant whose dominant performance constraint is per-turn latency.\n\nQuality on\nroutine turns is already acceptable.\n\nWhich configuration adjustment most directly improves latency without disproportionately damaging quality?", "opts": [["A", "Reduce retrieval depth to the top-k passages that historically cover the answer, and cache stable system- prompt content."], ["B", "Increase retrieval depth to the corpus maximum to improve recall regardless of latency."], ["C", "Disable prompt caching entirely to ensure fresh context processing on every request, preventing stale prefix content from affecting latency-sensitive interactions."], ["D", "Switch every turn to the heaviest available model to maximize output quality, accepting that the increased model latency will worsen the per-turn SLO rather than improve it."]]}, "vi": {"stem": "Bạn đang vận hành một trợ lý tương tác có ràng buộc hiệu năng chủ đạo là latency của mỗi lượt (per-turn). Chất lượng ở các lượt thông thường đã ở mức chấp nhận được.\n\nĐiều chỉnh cấu hình nào cải thiện latency trực tiếp nhất mà không làm suy giảm chất lượng một cách quá mức?", "opts": [["A", "Giảm độ sâu truy xuất xuống top-k đoạn mà theo dữ liệu lịch sử đã bao quát được câu trả lời, và cache nội dung system prompt ổn định."], ["B", "Tăng độ sâu truy xuất lên mức tối đa của kho dữ liệu để cải thiện độ phủ (recall) bất kể latency."], ["C", "Vô hiệu hóa hoàn toàn prompt caching để bảo đảm context được xử lý mới ở mọi yêu cầu, ngăn nội dung tiền tố cũ ảnh hưởng tới các tương tác nhạy cảm với latency."], ["D", "Chuyển mọi lượt sang model nặng nhất hiện có để tối đa hóa chất lượng đầu ra, chấp nhận rằng latency tăng thêm của model sẽ làm xấu đi chứ không cải thiện SLO cho mỗi lượt."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Giảm độ sâu truy xuất xuống top-k đoạn mà theo dữ liệu lịch sử đã bao quát được câu trả lời, và cache nội dung system prompt ổn định.\n\nGiữ top-k đoạn đã có bằng chứng lịch sử là đủ giúp giảm xử lý đầu vào mà bảo vệ mức chất lượng đã đạt. Cache system prefix ổn định tránh tính lại phần lặp khi hit; cần đo p95 và chất lượng để chốt k thay vì cắt tùy ý.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Tăng độ sâu truy xuất lên mức tối đa của kho dữ liệu để cải thiện độ phủ (recall) bất kể latency.**: Lấy tối đa corpus tăng khối lượng xử lý dù chất lượng thường lệ đã đủ, trái với ưu tiên độ trễ từng lượt.\n- **Vô hiệu hóa hoàn toàn prompt caching để bảo đảm context được xử lý mới ở mọi yêu cầu, ngăn nội dung tiền tố cũ ảnh hưởng tới các tương tác nhạy cảm với latency.**: Tắt cache buộc xử lý lại prefix trùng khớp; cache không tự biến nội dung mới thành nội dung cũ khi prefix thay đổi.\n- **Chuyển mọi lượt sang model nặng nhất hiện có để tối đa hóa chất lượng đầu ra, chấp nhận rằng latency tăng thêm của model sẽ làm xấu đi chứ không cải thiện SLO cho mỗi lượt.**: Chuyển mọi lượt sang model nặng hơn nhắm năng lực chưa cần và có thể làm tệ hơn SLO độ trễ.\n\n**Tham khảo:**\n\n- [Prompt caching](https://platform.claude.com/docs/en/build-with-claude/prompt-caching)\n- [Reducing latency](https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-latency)"}, {"n": 86, "set": 2, "i": 26, "multi": false, "answer": ["A"], "en": {"stem": "You are operating an interactive assistant whose dominant performance constraint is per-turn latency.\n\nQuality on routine turns is already acceptable.\n\nWhich configuration adjustment most directly improves latency without disproportionately damaging quality?", "opts": [["A", "Reduce retrieval depth to the top-k passages that historically cover the answer, and cache stable system- prompt content."], ["B", "Increase retrieval depth to the corpus maximum to improve recall regardless of latency."], ["C", "Disable prompt caching entirely to ensure fresh context processing on every request, preventing stale prefix content from affecting latency-sensitive interactions."], ["D", "Switch every turn to the heaviest available model to maximize output quality, accepting that the increased model latency will worsen the per-turn SLO rather than improve it."]]}, "vi": {"stem": "Bạn đang vận hành một trợ lý tương tác có ràng buộc hiệu năng chủ đạo là latency của mỗi lượt (per-turn). Chất lượng ở các lượt thông thường đã ở mức chấp nhận được.\n\nĐiều chỉnh cấu hình nào cải thiện latency trực tiếp nhất mà không làm suy giảm chất lượng một cách quá mức?", "opts": [["A", "Giảm độ sâu truy xuất xuống top-k đoạn mà theo dữ liệu lịch sử đã bao quát được câu trả lời, và cache nội dung system prompt ổn định."], ["B", "Tăng độ sâu truy xuất lên mức tối đa của kho dữ liệu để cải thiện độ phủ (recall) bất kể latency."], ["C", "Vô hiệu hóa hoàn toàn prompt caching để bảo đảm context được xử lý mới ở mọi yêu cầu, ngăn nội dung tiền tố cũ ảnh hưởng tới các tương tác nhạy cảm với latency."], ["D", "Chuyển mọi lượt sang model nặng nhất hiện có để tối đa hóa chất lượng đầu ra, chấp nhận rằng latency tăng thêm của model sẽ làm xấu đi chứ không cải thiện SLO cho mỗi lượt."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Giảm độ sâu truy xuất xuống top-k đoạn mà theo dữ liệu lịch sử đã bao quát được câu trả lời, và cache nội dung system prompt ổn định.\n\nTrim truy xuất tới spans/top-k đủ bằng chứng và cache prefix là hai thay đổi nhắm input latency; phải giữ eval để không cắt mất đáp án.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Tăng độ sâu truy xuất lên mức tối đa của kho dữ liệu để cải thiện độ phủ (recall) bất kể latency.**: Tăng depth tối đa đi ngược mục tiêu latency.\n- **Vô hiệu hóa hoàn toàn prompt caching để bảo đảm context được xử lý mới ở mọi yêu cầu, ngăn nội dung tiền tố cũ ảnh hưởng tới các tương tác nhạy cảm với latency.**: Cache prefix ổn định không phải lấy dữ liệu stale nếu key nội dung thay đổi.\n- **Chuyển mọi lượt sang model nặng nhất hiện có để tối đa hóa chất lượng đầu ra, chấp nhận rằng latency tăng thêm của model sẽ làm xấu đi chứ không cải thiện SLO cho mỗi lượt.**: Đổi tất cả sang model nặng hơn chưa được quality gap yêu cầu.\n\n**Tham khảo:**\n\n- [Claude — Prompt caching](https://platform.claude.com/docs/en/build-with-claude/prompt-caching)"}, {"n": 87, "set": 2, "i": 27, "multi": true, "answer": ["A", "D"], "en": {"stem": "You are reviewing instrumentation in a multi-agent system.\n\nWhich two findings constitute valid observability gaps in the instrumentation? (Choose two.)\nEach correct answer presents a complete solution.", "opts": [["A", "Model identity and version on each turn are not recorded with the turn artifacts."], ["B", "Tool-call payloads and outcomes are recorded with redaction applied to known sensitive fields"], ["C", "Latency and token usage on every span are emitted to the central metrics pipeline."], ["D", "Request-scoped correlation identifiers do not propagate across agent and tool calls."], ["E", "Trace spans for each agent step are exported to the shared distributed-tracing backend."]]}, "vi": {"stem": "Bạn đang rà soát việc gắn công cụ đo (instrumentation) trong một hệ thống đa agent.\n\nHai phát hiện nào là những khoảng trống hợp lệ về khả năng quan sát (observability) trong instrumentation? (Chọn hai.)\nMỗi đáp án đúng là một giải pháp hoàn chỉnh.", "opts": [["A", "Danh tính và phiên bản model ở mỗi lượt không được ghi lại cùng với các artifact của lượt đó."], ["B", "Payload và kết quả của các lệnh gọi tool được ghi lại, có áp dụng che giấu (redaction) cho các trường nhạy cảm đã biết."], ["C", "Latency và mức sử dụng token trên mọi span được phát tới pipeline metric trung tâm."], ["D", "Các mã định danh tương quan (correlation identifier) theo phạm vi yêu cầu không được truyền qua các lệnh gọi agent và tool."], ["E", "Các trace span cho từng bước của agent được xuất tới backend truy vết phân tán (distributed tracing) dùng chung."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Danh tính và phiên bản model ở mỗi lượt không được ghi lại cùng với các artifact của lượt đó.; Các mã định danh tương quan (correlation identifier) theo phạm vi yêu cầu không được truyền qua các lệnh gọi agent và tool.\n\nThiếu tên và phiên bản model khiến khó gắn lỗi với thay đổi model hoặc tái hiện lượt chạy. Không truyền correlation ID qua agent và công cụ làm đứt trace của cùng yêu cầu; cần cả thuộc tính model lẫn liên kết nhân quả giữa các span để chẩn đoán luồng nhiều thành phần.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Payload và kết quả của các lệnh gọi tool được ghi lại, có áp dụng che giấu (redaction) cho các trường nhạy cảm đã biết.**: Ghi payload và kết quả với trường nhạy cảm đã che là tín hiệu quan sát hữu ích kết hợp bảo vệ dữ liệu, không phải thiếu instrumentation.\n- **Latency và mức sử dụng token trên mọi span được phát tới pipeline metric trung tâm.**: Phát latency và token usage từng span cung cấp số đo hiệu năng và chi phí, đúng với nhu cầu giám sát.\n- **Các trace span cho từng bước của agent được xuất tới backend truy vết phân tán (distributed tracing) dùng chung.**: Xuất span cho từng bước vào backend tracing chung giúp dựng lại luồng; vấn đề là liên kết và metadata còn thiếu, không phải việc xuất span.\n\n**Tham khảo:**\n\n- [Context propagation](https://opentelemetry.io/docs/concepts/context-propagation/)\n- [Define success criteria and build evaluations](https://platform.claude.com/docs/en/test-and-evaluate/develop-tests)"}, {"n": 88, "set": 2, "i": 28, "multi": true, "answer": ["D", "E"], "en": {"stem": "You are building an evaluation pipeline for a Claude-based deployment and must complete the specification steps\nbefore running the deployment against the dataset.\n\nWhich two steps must be completed BEFORE running the deployment against the evaluation dataset? (Choose\ntwo.)\nEach correct answer presents part of the solution.", "opts": [["A", "Score the deployment outputs against the reference labels and aggregate the metrics."], ["B", "Publish the aggregated metrics to a dashboard and gate releases on threshold checks."], ["C", "Review failure cases with subject matter experts to refine the scoring rubric."], ["D", "Define the metrics and slices the framework will report across representative, edge, and adversarial cases."], ["E", "Curate and label the evaluation dataset to match the defined slices."]]}, "vi": {"stem": "Bạn đang xây dựng một pipeline đánh giá cho một hệ thống triển khai dựa trên Claude và phải hoàn tất các bước đặc tả trước khi chạy hệ thống trên bộ dữ liệu.\n\nHai bước nào phải được hoàn tất TRƯỚC KHI chạy hệ thống trên bộ dữ liệu đánh giá? (Chọn hai.)\nMỗi đáp án đúng là một phần của giải pháp.", "opts": [["A", "Chấm điểm đầu ra của hệ thống so với các nhãn tham chiếu và tổng hợp các metric."], ["B", "Công bố các metric tổng hợp lên một dashboard và đặt cổng kiểm soát phát hành dựa trên kiểm tra ngưỡng."], ["C", "Rà soát các trường hợp thất bại cùng chuyên gia nghiệp vụ (subject matter expert) để tinh chỉnh tiêu chí chấm điểm (rubric)."], ["D", "Định nghĩa các metric và slice mà khung đánh giá sẽ báo cáo trên các trường hợp đại diện, trường hợp biên và trường hợp đối kháng."], ["E", "Tuyển chọn và gán nhãn bộ dữ liệu đánh giá cho khớp với các slice đã định nghĩa."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Định nghĩa các metric và slice mà khung đánh giá sẽ báo cáo trên các trường hợp đại diện, trường hợp biên và trường hợp đối kháng.; Tuyển chọn và gán nhãn bộ dữ liệu đánh giá cho khớp với các slice đã định nghĩa.\n\nTrước chạy đánh giá phải xác định metric và các lát cắt đại diện, biên và đối kháng để biết cần đo gì. Curate và gán nhãn dataset theo các lát cắt đó tạo đầu vào và chuẩn đối chiếu; sau khi có đầu ra mới chấm và tổng hợp được.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Chấm điểm đầu ra của hệ thống so với các nhãn tham chiếu và tổng hợp các metric.**: Chấm đầu ra cần deployment đã chạy và sinh kết quả, nên không thể hoàn tất trước lần chạy được hỏi.\n- **Công bố các metric tổng hợp lên một dashboard và đặt cổng kiểm soát phát hành dựa trên kiểm tra ngưỡng.**: Dashboard metric tổng hợp và gate theo số đo cần kết quả đánh giá; có thể thiết kế dashboard trước nhưng chưa thể công bố kết quả.\n- **Rà soát các trường hợp thất bại cùng chuyên gia nghiệp vụ (subject matter expert) để tinh chỉnh tiêu chí chấm điểm (rubric).**: Rà lỗi thực nghiệm với chuyên gia diễn ra sau khi quan sát lỗi; chuyên gia có thể giúp viết rubric trước nhưng đó không phải hoạt động đã mô tả.\n\n**Tham khảo:**\n\n- [Define success criteria and build evaluations](https://platform.claude.com/docs/en/test-and-evaluate/develop-tests)"}, {"n": 89, "set": 2, "i": 29, "multi": true, "answer": ["A", "C"], "en": {"stem": "An architect is reviewing a Claude-based candidate-screening tool prior to deployment.\n\nA stakeholder asserts that\nbecause the model was not trained on company data, no bias evaluation is necessary.\n\nWhich two responses most accurately challenge this assertion? (Choose two.)", "opts": [["A", "The model may carry demographic biases from pretraining that manifest in screening outcomes regardless of fine-tuning."], ["B", "Transparency obligations are satisfied by disclosing that an AI system is in use, without further evaluation."], ["C", "The system should be evaluated on outcome-disparity metrics across protected groups before deployment."], ["D", "Fairness testing is required only when the training dataset is known to contain protected-class labels."], ["E", "Bias evaluation is unnecessary when the model provider has published a responsible-use policy."]]}, "vi": {"stem": "Một kiến trúc sư đang rà soát một công cụ sàng lọc ứng viên dựa trên Claude trước khi triển khai. Một bên liên quan khẳng định rằng vì model không được huấn luyện trên dữ liệu của công ty nên không cần đánh giá thiên lệch (bias).\n\nHai phản hồi nào phản bác khẳng định này chính xác nhất? (Chọn hai.)", "opts": [["A", "Model có thể mang các thiên lệch nhân khẩu học từ quá trình tiền huấn luyện (pretraining), biểu hiện trong kết quả sàng lọc bất kể có fine-tuning hay không."], ["B", "Nghĩa vụ minh bạch được đáp ứng bằng cách công bố rằng có một hệ thống AI đang được sử dụng, không cần đánh giá thêm."], ["C", "Hệ thống nên được đánh giá bằng các metric chênh lệch kết quả (outcome disparity) giữa các nhóm được bảo vệ trước khi triển khai."], ["D", "Kiểm thử công bằng chỉ cần thiết khi bộ dữ liệu huấn luyện được biết là có chứa nhãn về nhóm được bảo vệ (protected class)."], ["E", "Đánh giá thiên lệch là không cần thiết khi nhà cung cấp model đã công bố chính sách sử dụng có trách nhiệm."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Model có thể mang các thiên lệch nhân khẩu học từ quá trình tiền huấn luyện (pretraining), biểu hiện trong kết quả sàng lọc bất kể có fine-tuning hay không.; Hệ thống nên được đánh giá bằng các metric chênh lệch kết quả (outcome disparity) giữa các nhóm được bảo vệ trước khi triển khai.\n\nKhông huấn luyện trên dữ liệu công ty không loại bỏ thiên lệch có sẵn từ pretraining hoặc thiên lệch do cách dùng hệ thống. Đo chênh lệch kết quả sàng lọc giữa các nhóm được bảo vệ trước triển khai giúp kiểm tra tác động trong đúng bối cảnh tuyển dụng; thiết kế phép đo và xử lý dữ liệu nhóm cần phù hợp quy định áp dụng.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Nghĩa vụ minh bạch được đáp ứng bằng cách công bố rằng có một hệ thống AI đang được sử dụng, không cần đánh giá thêm.**: Thông báo có AI hỗ trợ minh bạch nhưng không đo xem ai bị bất lợi trong kết quả sàng lọc.\n- **Kiểm thử công bằng chỉ cần thiết khi bộ dữ liệu huấn luyện được biết là có chứa nhãn về nhóm được bảo vệ (protected class).**: Không có nhãn nhóm trong dữ liệu huấn luyện vẫn có thể có tín hiệu proxy và mẫu thiên lệch; điều đó không miễn đánh giá tác động.\n- **Đánh giá thiên lệch là không cần thiết khi nhà cung cấp model đã công bố chính sách sử dụng có trách nhiệm.**: Chính sách nhà cung cấp là cam kết quản trị, không phải bằng chứng công cụ tuyển dụng cụ thể của khách hàng đạt fairness.\n\n**Tham khảo:**\n\n- [AI RMF Core](https://airc.nist.gov/airmf-resources/airmf/5-sec-core/)"}, {"n": 90, "set": 2, "i": 30, "multi": false, "answer": ["C"], "en": {"stem": "You are defining where human review must remain in a planned automated pipeline.\n\nWhich placement reflects sound human-in-the-loop design?", "opts": [["A", "Remove all human review steps from the pipeline to maximize throughput, accepting that high-impact and irreversible actions will be taken without any human approval or oversight."], ["B", "Place a human reviewer in the loop for a randomly selected sample of requests, without defining criteria for what the reviewer should check or which output categories require mandatory review."], ["C", "Place a human reviewer between the model’s output and any high-impact, irreversible action, with explicit criteria for what the reviewer must check before approval."], ["D", "Place a human reviewer only after the irreversible action has already executed, making the review a post-hoc audit rather than a meaningful pre-action check or approval gate."]]}, "vi": {"stem": "Bạn đang xác định những vị trí mà bước rà soát của con người phải được giữ lại trong một pipeline tự động đã được lên kế hoạch.\n\nVị trí đặt nào phản ánh thiết kế human-in-the-loop đúng đắn?", "opts": [["A", "Loại bỏ mọi bước rà soát của con người khỏi pipeline để tối đa hóa thông lượng, chấp nhận rằng các hành động có tác động lớn và không thể đảo ngược sẽ được thực hiện mà không có bất kỳ sự phê duyệt hay giám sát nào của con người."], ["B", "Đặt một người rà soát trong vòng lặp cho một mẫu yêu cầu được chọn ngẫu nhiên, mà không xác định tiêu chí người rà soát cần kiểm tra hay những loại đầu ra nào bắt buộc phải được rà soát."], ["C", "Đặt một người rà soát giữa đầu ra của model và bất kỳ hành động nào có tác động lớn, không thể đảo ngược, kèm theo tiêu chí rõ ràng về những gì người rà soát phải kiểm tra trước khi phê duyệt."], ["D", "Chỉ đặt người rà soát sau khi hành động không thể đảo ngược đã được thực thi, biến việc rà soát thành một cuộc kiểm toán hậu kỳ thay vì một bước kiểm tra hay cổng phê duyệt có ý nghĩa trước hành động."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Đặt một người rà soát giữa đầu ra của model và bất kỳ hành động nào có tác động lớn, không thể đảo ngược, kèm theo tiêu chí rõ ràng về những gì người rà soát phải kiểm tra trước khi phê duyệt.\n\nĐặt reviewer giữa đầu ra model và hành động tác động cao, không thể đảo ngược tạo cơ hội chặn lỗi trước khi gây hậu quả. Tiêu chí duyệt cụ thể giúp người duyệt biết phải kiểm gì và khi nào từ chối hoặc chuyển cấp, thay vì chỉ bấm đồng ý theo cảm tính.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Loại bỏ mọi bước rà soát của con người khỏi pipeline để tối đa hóa thông lượng, chấp nhận rằng các hành động có tác động lớn và không thể đảo ngược sẽ được thực hiện mà không có bất kỳ sự phê duyệt hay giám sát nào của con người.**: Bỏ mọi review tối đa hóa throughput bằng cách loại luôn cơ hội kiểm soát trước hành động khó khắc phục.\n- **Đặt một người rà soát trong vòng lặp cho một mẫu yêu cầu được chọn ngẫu nhiên, mà không xác định tiêu chí người rà soát cần kiểm tra hay những loại đầu ra nào bắt buộc phải được rà soát.**: Mẫu ngẫu nhiên không có tiêu chí có thể bỏ sót hành động nguy hiểm và khiến reviewer đánh giá không nhất quán.\n- **Chỉ đặt người rà soát sau khi hành động không thể đảo ngược đã được thực thi, biến việc rà soát thành một cuộc kiểm toán hậu kỳ thay vì một bước kiểm tra hay cổng phê duyệt có ý nghĩa trước hành động.**: Duyệt sau hành động không thể đảo ngược chỉ còn là kiểm toán; nó không còn khả năng ngăn tác động ban đầu.\n\n**Tham khảo:**\n\n- [AI RMF Core](https://airc.nist.gov/airmf-resources/airmf/5-sec-core/)"}, {"n": 91, "set": 2, "i": 31, "multi": false, "answer": ["C"], "en": {"stem": "An engineer inadvertently commits an API key to the repository by placing it in .claude/settings.json.\n\nWhich configuration design principle was violated?", "opts": [["A", "Project-scope configuration should always override user-scope configuration."], ["B", "MCP server definitions must reside in environment variables to prevent scope conflicts."], ["C", "Credentials must be resolved at runtime from a secret store and never stored in version-controlled files."], ["D", "Managed configuration must be applied before project-scope configuration is read."]]}, "vi": {"stem": "Một kỹ sư vô tình commit một API key vào repository do đặt nó trong .claude/settings.json.\n\nNguyên tắc thiết kế cấu hình
