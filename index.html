95 đo được so với các ngưỡng SLA đã thống nhất để các bên liên quan có dữ liệu chính xác."], ["D", "Cùng các bên liên quan điều chỉnh lại định nghĩa SLA nếu các mục tiêu hiện tại không thể đạt được trong điều kiện ràng buộc của môi trường production."], ["E", "Thông báo rằng vấn đề latency là một giới hạn đã biết của LLM và nằm ngoài khả năng kiểm soát của nhóm kiến trúc."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Trình bày các mốc latency p50 và p95 đo được so với các ngưỡng SLA đã thống nhất để các bên liên quan có dữ liệu chính xác.; Cùng các bên liên quan điều chỉnh lại định nghĩa SLA nếu các mục tiêu hiện tại không thể đạt được trong điều kiện ràng buộc của môi trường production.\n\nĐưa p50 và p95 đo thực tế cạnh SLA cho thấy cả trải nghiệm thông thường lẫn phần yêu cầu chậm, thay cho nhận xét cảm tính. Nếu mục tiêu không khả thi trong ràng buộc sản xuất, cùng stakeholder sửa mục tiêu và đánh đổi giúp khôi phục một cam kết được hiểu và chấp nhận chung.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Thay model Claude hiện tại bằng một model của bên thứ ba có thể cho latency thấp hơn mà không cần đánh giá.**: Đổi nhà cung cấp chưa đánh giá có thể ảnh hưởng chất lượng, chi phí và bảo mật; không trực tiếp tạo đồng thuận về kỳ vọng hiện tại.\n- **Tạm dừng toàn bộ việc phát triển và dồn toàn bộ nguồn lực kỹ thuật sang tối ưu latency.**: Dồn mọi nguồn lực vào độ trễ trước khi thống nhất mức cần đạt có thể bỏ các ưu tiên quan trọng khác và không giải thích cam kết cho stakeholder.\n- **Thông báo rằng vấn đề latency là một giới hạn đã biết của LLM và nằm ngoài khả năng kiểm soát của nhóm kiến trúc.**: Đổ cho giới hạn LLM bỏ qua quyền lựa chọn kiến trúc và trách nhiệm đo, trao đổi, điều chỉnh cam kết của đội triển khai.\n\n**Tham khảo:**\n\n- [Google SRE: Service Level Objectives](https://sre.google/sre-book/service-level-objectives/)"}, {"n": 21, "set": 1, "i": 21, "multi": true, "answer": ["C", "D"], "en": {"stem": "A Claude architect is designing a HIPAA-compliant pipeline that processes patient records.\n\nWhich two design decisions directly support HIPAA compliance requirements? (Select two.)", "opts": [["A", "Setting max _ tokens to a low value to minimize the volume of text generated per request."], ["B", "Selecting the highest-capability Claude model to maximize diagnostic accuracy."], ["C", "Enforcing role-based access controls so that PH is retrievable only by authorized personnel."], ["D", "Ensuring patient data is never included in training feedback loops sent to the model provider without a BAA in place."], ["E", "Using streaming responses to reduce perceived latency for clinical users."]]}, "vi": {"stem": "Một kiến trúc sư Claude đang thiết kế một pipeline tuân thủ HIPAA để xử lý hồ sơ bệnh nhân.\n\nHai quyết định thiết kế nào hỗ trợ trực tiếp các yêu cầu tuân thủ HIPAA? (Chọn hai.)", "opts": [["A", "Đặt `max_tokens` ở giá trị thấp để giảm thiểu lượng văn bản được sinh ra cho mỗi yêu cầu."], ["B", "Chọn model Claude có năng lực cao nhất để tối đa hóa độ chính xác chẩn đoán."], ["C", "Thực thi kiểm soát truy cập dựa trên vai trò (role-based access control) để PHI chỉ có thể được truy xuất bởi nhân sự được ủy quyền."], ["D", "Bảo đảm dữ liệu bệnh nhân không bao giờ được đưa vào các vòng phản hồi huấn luyện (training feedback loop) gửi tới nhà cung cấp model khi chưa có BAA."], ["E", "Dùng phản hồi dạng streaming để giảm độ trễ cảm nhận được cho người dùng lâm sàng."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Thực thi kiểm soát truy cập dựa trên vai trò (role-based access control) để PHI chỉ có thể được truy xuất bởi nhân sự được ủy quyền.; Bảo đảm dữ liệu bệnh nhân không bao giờ được đưa vào các vòng phản hồi huấn luyện (training feedback loop) gửi tới nhà cung cấp model khi chưa có BAA.\n\nKiểm soát theo vai trò giới hạn ai được lấy thông tin bệnh nhân, trực tiếp hỗ trợ giới hạn truy cập dữ liệu nhạy cảm. Việc ngăn gửi dữ liệu bệnh nhân vào vòng phản hồi huấn luyện khi chưa có thỏa thuận phù hợp tránh một đường tiết lộ không được thẩm định. “PH” trong đề có vẻ là PHI; có BAA vẫn không tự cho phép dùng PHI để huấn luyện, còn phải xét mục đích được phép và điều khoản.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Đặt `max_tokens` ở giá trị thấp để giảm thiểu lượng văn bản được sinh ra cho mỗi yêu cầu.**: Giảm max_tokens giới hạn độ dài đầu ra chứ không xác thực người nhận hoặc kiểm soát việc chuyển dữ liệu bệnh nhân.\n- **Chọn model Claude có năng lực cao nhất để tối đa hóa độ chính xác chẩn đoán.**: Mô hình mạnh hơn có thể cải thiện nội dung nhưng không cung cấp cơ chế phân quyền hoặc cơ sở cho việc chia sẻ PHI.\n- **Dùng phản hồi dạng streaming để giảm độ trễ cảm nhận được cho người dùng lâm sàng.**: Streaming thay đổi thời điểm hiển thị câu trả lời, không quyết định người xem có được phép truy cập dữ liệu hay không.\n\n**Cần xem lại:** Giữ khóa nguồn; “PH” có vẻ là lỗi OCR của PHI. Cách viết về BAA có thể khiến người đọc hiểu BAA đủ để cho phép training; cần thẩm định mục đích sử dụng và điều khoản cụ thể.\n\n**Tham khảo:**\n\n- [HHS: Summary of the HIPAA Security Rule](https://www.hhs.gov/hipaa/for-professionals/security/laws-regulations/index.html)\n- [HHS: Business Associates](https://www.hhs.gov/hipaa/for-professionals/privacy/guidance/business-associates/index.html)"}, {"n": 22, "set": 1, "i": 22, "multi": false, "answer": ["B"], "en": {"stem": "You are preparing an operational runbook for a Claude-based service.\n\nWhich content is essential to include in the runbook?", "opts": [["A", "Dashboard and log references only, without alert definitions, triage steps, escalation paths, or rollback procedures for the on-call engineer to act on."], ["B", "Common alerts and their triage steps, escalation paths, rollback procedures, and references to the relevant dashboards and logs."], ["C", "Alert definitions and triage steps only, without escalation paths, rollback procedures, or references to dashboards and logs for on-call use."], ["D", "Escalation paths and rollback procedures only, without alert definitions, triage steps, or dashboard references to guide initial incident response."]]}, "vi": {"stem": "Bạn đang chuẩn bị một runbook vận hành cho một dịch vụ dựa trên Claude.\n\nNội dung nào là thiết yếu cần đưa vào runbook?", "opts": [["A", "Chỉ các tham chiếu tới dashboard và log, không có định nghĩa cảnh báo, các bước phân loại xử lý (triage), lộ trình leo thang (escalation) hay quy trình rollback để kỹ sư trực (on-call) hành động."], ["B", "Các cảnh báo thường gặp cùng các bước triage, lộ trình leo thang, quy trình rollback và tham chiếu tới các dashboard và log liên quan."], ["C", "Chỉ định nghĩa cảnh báo và các bước triage, không có lộ trình leo thang, quy trình rollback hay tham chiếu tới dashboard và log cho việc trực on-call."], ["D", "Chỉ lộ trình leo thang và quy trình rollback, không có định nghĩa cảnh báo, các bước triage hay tham chiếu dashboard để định hướng phản ứng sự cố ban đầu."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Các cảnh báo thường gặp cùng các bước triage, lộ trình leo thang, quy trình rollback và tham chiếu tới các dashboard và log liên quan.\n\nRunbook phải biến cảnh báo thành hành động: cách phân loại và chẩn đoán ban đầu, khi nào chuyển cấp, cách quay lui và nơi tìm bằng chứng trên dashboard hoặc log. Kết hợp đủ các mục giúp người trực xử lý cả sự cố quen thuộc lẫn tình huống cần hỗ trợ thêm.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Chỉ các tham chiếu tới dashboard và log, không có định nghĩa cảnh báo, các bước phân loại xử lý (triage), lộ trình leo thang (escalation) hay quy trình rollback để kỹ sư trực (on-call) hành động.**: Chỉ có liên kết dashboard và log cho biết nơi xem dữ liệu nhưng thiếu hướng dẫn quyết định và khắc phục.\n- **Chỉ định nghĩa cảnh báo và các bước triage, không có lộ trình leo thang, quy trình rollback hay tham chiếu tới dashboard và log cho việc trực on-call.**: Định nghĩa cảnh báo và triage giúp bắt đầu nhưng không chỉ cách chuyển cấp hoặc khôi phục khi triage không đủ.\n- **Chỉ lộ trình leo thang và quy trình rollback, không có định nghĩa cảnh báo, các bước triage hay tham chiếu dashboard để định hướng phản ứng sự cố ban đầu.**: Chuyển cấp và rollback chưa chỉ cách nhận diện cảnh báo, kiểm tra triệu chứng hay chọn đúng thời điểm thực hiện.\n\n**Tham khảo:**\n\n- [Google SRE: On-Call](https://sre.google/workbook/on-call/)"}, {"n": 23, "set": 1, "i": 23, "multi": true, "answer": ["C", "E"], "en": {"stem": "A technical team is cataloguing risks specific to Claude's use in a document-grounded Q & A system.\n\nWhich two items represent failure modes intrinsic to LLM-based systems rather than generic software defects?\n(Select two.)", "opts": [["A", "An expired TLS certificate blocks outbound API calls to Claude."], ["B", "A database connection timeout causes retrieval to return an empty result set."], ["C", "The model refuses a legitimate query because surface features trigger an overly broad safety pattern."], ["D", "A misconfigured load balancer routes requests to a deprecated API version."], ["E", "The model generates a plausible-sounding answer unsupported by any retrieved document."]]}, "vi": {"stem": "Một nhóm kỹ thuật đang lập danh mục các rủi ro đặc thù khi dùng Claude trong một hệ thống hỏi đáp (Q&A) dựa trên tài liệu.\n\nHai mục nào là các chế độ lỗi (failure mode) vốn có của hệ thống dựa trên LLM, thay vì lỗi phần mềm thông thường?\n(Chọn hai.)", "opts": [["A", "Một chứng chỉ TLS hết hạn chặn các lệnh gọi API đi ra tới Claude."], ["B", "Hết thời gian chờ kết nối cơ sở dữ liệu khiến bước truy xuất trả về tập kết quả rỗng."], ["C", "Model từ chối một truy vấn hợp lệ vì các đặc điểm bề mặt kích hoạt một mẫu an toàn quá rộng."], ["D", "Một bộ cân bằng tải (load balancer) cấu hình sai định tuyến yêu cầu tới một phiên bản API đã ngừng hỗ trợ."], ["E", "Model tạo ra một câu trả lời nghe có vẻ hợp lý nhưng không được bất kỳ tài liệu truy xuất nào hỗ trợ."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Model từ chối một truy vấn hợp lệ vì các đặc điểm bề mặt kích hoạt một mẫu an toàn quá rộng.; Model tạo ra một câu trả lời nghe có vẻ hợp lý nhưng không được bất kỳ tài liệu truy xuất nào hỗ trợ.\n\nTừ chối nhầm truy vấn hợp lệ xuất phát từ cách mô hình khái quát hóa mẫu an toàn. Tạo câu trả lời nghe hợp lý nhưng không có nguồn là lỗi sinh nội dung không được grounding. Cả hai gắn với hành vi suy luận và sinh ngôn ngữ, dù các biện pháp kiến trúc có thể giảm chúng.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Một chứng chỉ TLS hết hạn chặn các lệnh gọi API đi ra tới Claude.**: Chứng chỉ TLS hết hạn là lỗi vận hành kết nối có thể xảy ra với bất kỳ API nào, không cần có mô hình ngôn ngữ.\n- **Hết thời gian chờ kết nối cơ sở dữ liệu khiến bước truy xuất trả về tập kết quả rỗng.**: Timeout cơ sở dữ liệu là lỗi phụ thuộc hạ tầng; ứng dụng truy xuất thông thường cũng gặp được.\n- **Một bộ cân bằng tải (load balancer) cấu hình sai định tuyến yêu cầu tới một phiên bản API đã ngừng hỗ trợ.**: Load balancer trỏ sai phiên bản là lỗi cấu hình định tuyến phần mềm, không phải hành vi sinh hoặc từ chối của LLM.\n\n**Tham khảo:**\n\n- [Reduce hallucinations](https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations)\n- [NIST AI Risks and Trustworthiness](https://airc.nist.gov/airmf-resources/airmf/3-sec-characteristics/)"}, {"n": 24, "set": 1, "i": 24, "multi": true, "answer": ["A", "C"], "en": {"stem": "You are rolling out monitoring for a Claude-based deployment and must complete the specification steps efore\ninstrumenting the deployment.\n\nWhich two steps must be completed BEFORE instrumenting the deployment to emit metrics and traces?\n(Select two.)\nEach correct answer presents part of the solution.", "opts": [["A", "Define the metrics and the slices the deployment will monitor across normal and adversarial traffic."], ["B", "Tune the alert thresholds based on observed normal-state distributions to reduce false positives."], ["C", "Define the service-level objectives (SLOs) and the error budgets the deployment will be held to."], ["D", "Build the dashboards that surface metrics across slices at the cadence the team operates on."], ["E", "Document the dashboards, alerts, and runbooks for the on-call rotation that will respond."]]}, "vi": {"stem": "Bạn đang triển khai giám sát (monitoring) cho một hệ thống dựa trên Claude và phải hoàn tất các bước đặc tả trước khi gắn công cụ đo (instrument) vào hệ thống.\n\nHai bước nào phải được hoàn tất TRƯỚC KHI gắn công cụ đo để hệ thống phát ra metric và trace?\n(Chọn hai.)\nMỗi đáp án đúng là một phần của giải pháp.", "opts": [["A", "Định nghĩa các metric và các lát cắt (slice) mà hệ thống sẽ giám sát trên cả lưu lượng bình thường lẫn lưu lượng đối kháng."], ["B", "Tinh chỉnh ngưỡng cảnh báo dựa trên phân phối quan sát được ở trạng thái bình thường để giảm cảnh báo sai (false positive)."], ["C", "Định nghĩa các mục tiêu mức dịch vụ (SLO) và ngân sách lỗi (error budget) mà hệ thống phải tuân theo."], ["D", "Xây dựng các dashboard hiển thị metric theo từng slice với tần suất phù hợp với nhịp vận hành của nhóm."], ["E", "Ghi lại tài liệu về dashboard, cảnh báo và runbook cho ca trực on-call sẽ phản ứng."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Định nghĩa các metric và các lát cắt (slice) mà hệ thống sẽ giám sát trên cả lưu lượng bình thường lẫn lưu lượng đối kháng.; Định nghĩa các mục tiêu mức dịch vụ (SLO) và ngân sách lỗi (error budget) mà hệ thống phải tuân theo.\n\nXác định metric và các lát dữ liệu cần theo dõi trước giúp instrumentation thu đúng tín hiệu ở cả lưu lượng thường và đối kháng. SLO cùng error budget xác định mức dịch vụ cần bảo vệ và mức sai lệch có thể chấp nhận, để việc đo có mục đích vận hành rõ ràng.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Tinh chỉnh ngưỡng cảnh báo dựa trên phân phối quan sát được ở trạng thái bình thường để giảm cảnh báo sai (false positive).**: Tinh chỉnh ngưỡng theo phân bố bình thường cần dữ liệu quan sát đã thu; nó phụ thuộc instrumentation thay vì hoàn tất trước đó.\n- **Xây dựng các dashboard hiển thị metric theo từng slice với tần suất phù hợp với nhịp vận hành của nhóm.**: Dashboard có thể được phác thảo sớm nhưng việc hiển thị metric thực tế phụ thuộc tín hiệu đã được định nghĩa và phát ra.\n- **Ghi lại tài liệu về dashboard, cảnh báo và runbook cho ca trực on-call sẽ phản ứng.**: Tài liệu dashboard, cảnh báo và runbook phải bám vào hệ thống quan sát được triển khai; nó không xác định ban đầu phải đo gì.\n\n**Tham khảo:**\n\n- [Google SRE: Service Level Objectives](https://sre.google/sre-book/service-level-objectives/)"}, {"n": 25, "set": 1, "i": 25, "multi": false, "answer": ["B"], "en": {"stem": "A document analysis service processes legal filings averaging 80,000 tokens each.\n\nEach filing is queried by\nattorneys an average of 14 times during a case.\n\nThe current architecture sends the full filing on every query.\n\nThe CFO has asked you to reduce per-query costs while preserving response quality.\n\nThe security officer requires\nthat filing contents not be stored outside Fabrikam's tenancy.\n\nWhich optimization approach should you recommend?", "opts": [["A", "Summarize each filing once at intake and run all subsequent queries against the summary."], ["B", "Cache the filing as the prompt prefix for reuse across the 14 queries per case."], ["C", "Index filings in a vector store and retrieve only the relevant passages per query."], ["D", "Move the workload to a smaller Claude model to reduce the per-token cost paid."]]}, "vi": {"stem": "Một dịch vụ phân tích tài liệu xử lý các hồ sơ pháp lý có độ dài trung bình 80,000 token mỗi hồ sơ. Mỗi hồ sơ được luật sư truy vấn trung bình 14 lần trong một vụ việc. Kiến trúc hiện tại gửi toàn bộ hồ sơ trong mỗi lần truy vấn. CFO yêu cầu bạn giảm chi phí cho mỗi truy vấn trong khi vẫn giữ chất lượng phản hồi. Cán bộ an ninh yêu cầu nội dung hồ sơ không được lưu trữ bên ngoài tenancy của Fabrikam.\n\nBạn nên đề xuất cách tối ưu nào?", "opts": [["A", "Tóm tắt mỗi hồ sơ một lần khi tiếp nhận và chạy mọi truy vấn sau đó trên bản tóm tắt."], ["B", "Cache hồ sơ làm tiền tố prompt (prompt prefix) để tái sử dụng cho 14 truy vấn của mỗi vụ việc."], ["C", "Lập chỉ mục hồ sơ trong một vector store và chỉ truy xuất các đoạn liên quan cho mỗi truy vấn."], ["D", "Chuyển khối lượng công việc sang một model Claude nhỏ hơn để giảm chi phí phải trả cho mỗi token."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Cache hồ sơ làm tiền tố prompt (prompt prefix) để tái sử dụng cho 14 truy vấn của mỗi vụ việc.\n\nCache phần tiền tố chứa nguyên hồ sơ có thể tái sử dụng việc xử lý 80.000 token cho nhiều câu hỏi mà không thay hồ sơ bằng bản tóm tắt, nên giữ nguyên bằng chứng đầu vào. Tuy nhiên, đáp án này chỉ phù hợp khi cache nằm trong ranh giới lưu trữ được chấp nhận và các lượt hỏi tạo cache hit trong TTL. Đề chưa chứng minh hai điều đó, vì vậy khóa được giữ nhưng cần thẩm định tenancy và nhịp truy vấn.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Tóm tắt mỗi hồ sơ một lần khi tiếp nhận và chạy mọi truy vấn sau đó trên bản tóm tắt.**: Tóm tắt một lần có thể bỏ mất điều khoản hoặc ngoại lệ mà câu hỏi pháp lý sau này cần; giữ chất lượng không được bảo đảm chỉ từ bản tóm tắt.\n- **Lập chỉ mục hồ sơ trong một vector store và chỉ truy xuất các đoạn liên quan cho mỗi truy vấn.**: Vector store trong tenancy có thể đáp ứng ràng buộc lưu trữ và giảm token; retrieval cần kiểm tra độ bao phủ bằng chứng. Đây là phương án hợp lệ tiềm năng mà đề chưa loại trừ.\n- **Chuyển khối lượng công việc sang một model Claude nhỏ hơn để giảm chi phí phải trả cho mỗi token.**: Mô hình nhỏ hơn giảm đơn giá nhưng có thể xử lý chi tiết pháp lý khác đi; chưa có đánh giá chứng minh chất lượng giữ nguyên.\n\n**Cần xem lại:** Giữ khóa nguồn dù chưa đủ căn cứ chọn caching khi cấm lưu ngoài tenancy. Vector store trong tenancy cũng có thể phù hợp. Không tự sửa đáp án; cần làm rõ kiến trúc triển khai và thời gian giữa 14 truy vấn.\n\n**Tham khảo:**\n\n- [Prompt caching](https://platform.claude.com/docs/en/build-with-claude/prompt-caching)"}, {"n": 26, "set": 1, "i": 26, "multi": false, "answer": ["C"], "en": {"stem": "When communicating an architectural decision to a security and compliance reviewer, which content set is most\naligned with that audience's primary concerns?", "opts": [["A", "Feature delivery schedule, roadmap dependencies, and scope boundaries for the product manager."], ["B", "Implementation timeline, component interfaces, and deployment sequence for the engineering team."], ["C", "Threat model, control mappings, residual-risk acceptance criteria, and audit traceability."], ["D", "Decision rationale, business outcomes, and high-level risk summary for executive review."]]}, "vi": {"stem": "Khi truyền đạt một quyết định kiến trúc cho người rà soát về bảo mật và tuân thủ, tập nội dung nào phù hợp nhất với các mối quan tâm chính của đối tượng này?", "opts": [["A", "Lịch bàn giao tính năng, các phụ thuộc trong lộ trình (roadmap) và ranh giới phạm vi dành cho product manager."], ["B", "Tiến độ triển khai, giao diện giữa các thành phần và trình tự triển khai dành cho nhóm kỹ thuật."], ["C", "Mô hình mối đe dọa (threat model), ánh xạ biện pháp kiểm soát (control mapping), tiêu chí chấp nhận rủi ro tồn dư và khả năng truy vết kiểm toán."], ["D", "Lý do ra quyết định, kết quả kinh doanh và tóm tắt rủi ro cấp cao dành cho ban điều hành xem xét."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Mô hình mối đe dọa (threat model), ánh xạ biện pháp kiểm soát (control mapping), tiêu chí chấp nhận rủi ro tồn dư và khả năng truy vết kiểm toán.\n\nThreat model cho biết nguy cơ nào được xét; ánh xạ kiểm soát chỉ cách xử lý từng nguy cơ. Tiêu chí chấp nhận rủi ro còn lại và dấu vết kiểm toán giúp người duyệt xác định ai chịu trách nhiệm và có bằng chứng nào để xác minh tuân thủ. Đây là nội dung gắn trực tiếp với nhiệm vụ an ninh và compliance.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Lịch bàn giao tính năng, các phụ thuộc trong lộ trình (roadmap) và ranh giới phạm vi dành cho product manager.**: Lịch tính năng và phụ thuộc roadmap phục vụ quản lý sản phẩm nhưng không cho biết kiểm soát bảo mật có đáp ứng nghĩa vụ hay không.\n- **Tiến độ triển khai, giao diện giữa các thành phần và trình tự triển khai dành cho nhóm kỹ thuật.**: Timeline, interface và thứ tự triển khai hữu ích cho kỹ sư nhưng thiếu ánh xạ rủi ro, kiểm soát và chứng cứ kiểm toán.\n- **Lý do ra quyết định, kết quả kinh doanh và tóm tắt rủi ro cấp cao dành cho ban điều hành xem xét.**: Tóm lược kinh doanh cho lãnh đạo quá cao cấp để người duyệt compliance kiểm tra từng kiểm soát và rủi ro còn lại.\n\n**Tham khảo:**\n\n- [NIST AI RMF Core](https://airc.nist.gov/airmf-resources/airmf/5-sec-core/)"}, {"n": 27, "set": 1, "i": 27, "multi": false, "answer": ["D"], "en": {"stem": "You are integrating Claude Code into a workflow that runs against a production database.\n\nWhich guardrail design most directly preserves safety on data-modifying operations?", "opts": [["A", "Allow Claude Code to write directly to the production database without subagent scoping, read-only credential defaults, or human confirmation gates on data-modifying operations."], ["B", "Configure the database MCP server with a fully privileged credential that can perform any read or write operation, and allow all operations to proceed without explicit human confirmation."], ["C", "Disable all logging and auditing on database operations through the MCP server to reduce alert noise, removing the observability needed to detect unintended data modifications."], ["D", "Configure the database MCP server with a read-only credential by default, restrict the subagent's tool list to read-only operations, and require explicit human confirmation on any operation that would modify data."]]}, "vi": {"stem": "Bạn đang tích hợp Claude Code vào một workflow chạy trên cơ sở dữ liệu production.\n\nThiết kế guardrail nào bảo toàn an toàn trực tiếp nhất đối với các thao tác sửa đổi dữ liệu?", "opts": [["A", "Cho phép Claude Code ghi trực tiếp vào cơ sở dữ liệu production mà không giới hạn phạm vi subagent, không mặc định dùng thông tin xác thực chỉ đọc, và không có cổng xác nhận của con người cho các thao tác sửa đổi dữ liệu."], ["B", "Cấu hình MCP server của cơ sở dữ liệu với một thông tin xác thực có đầy đủ đặc quyền, có thể thực hiện mọi thao tác đọc hoặc ghi, và cho phép mọi thao tác chạy mà không cần con người xác nhận rõ ràng."], ["C", "Vô hiệu hóa mọi hoạt động ghi log và kiểm toán đối với các thao tác cơ sở dữ liệu qua MCP server để giảm nhiễu cảnh báo, làm mất khả năng quan sát (observability) cần thiết để phát hiện các sửa đổi dữ liệu ngoài ý muốn."], ["D", "Cấu hình MCP server của cơ sở dữ liệu với thông tin xác thực chỉ đọc theo mặc định, giới hạn danh sách tool của subagent ở các thao tác chỉ đọc, và yêu cầu con người xác nhận rõ ràng đối với bất kỳ thao tác nào sẽ sửa đổi dữ liệu."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Cấu hình MCP server của cơ sở dữ liệu với thông tin xác thực chỉ đọc theo mặc định, giới hạn danh sách tool của subagent ở các thao tác chỉ đọc, và yêu cầu con người xác nhận rõ ràng đối với bất kỳ thao tác nào sẽ sửa đổi dữ liệu.\n\nThông tin đăng nhập chỉ đọc ở MCP tạo giới hạn ngay tại cơ sở dữ liệu; danh sách công cụ chỉ đọc của subagent thu hẹp thao tác được đề xuất. Khi cần sửa dữ liệu, phải có luồng được người có thẩm quyền xác nhận và quyền ghi thích hợp riêng biệt; xác nhận không tự biến credential chỉ đọc thành credential ghi.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Cho phép Claude Code ghi trực tiếp vào cơ sở dữ liệu production mà không giới hạn phạm vi subagent, không mặc định dùng thông tin xác thực chỉ đọc, và không có cổng xác nhận của con người cho các thao tác sửa đổi dữ liệu.**: Ghi thẳng production không giới hạn hoặc phê duyệt khiến một quyết định sai có thể sửa dữ liệu thật ngay.\n- **Cấu hình MCP server của cơ sở dữ liệu với một thông tin xác thực có đầy đủ đặc quyền, có thể thực hiện mọi thao tác đọc hoặc ghi, và cho phép mọi thao tác chạy mà không cần con người xác nhận rõ ràng.**: Credential toàn quyền cho mọi thao tác không tạo giới hạn thiệt hại và bỏ mất cổng xác nhận cho thay đổi dữ liệu.\n- **Vô hiệu hóa mọi hoạt động ghi log và kiểm toán đối với các thao tác cơ sở dữ liệu qua MCP server để giảm nhiễu cảnh báo, làm mất khả năng quan sát (observability) cần thiết để phát hiện các sửa đổi dữ liệu ngoài ý muốn.**: Tắt audit chỉ làm mất bằng chứng thao tác; nó không ngăn ghi sai và khiến phát hiện, truy vết khó hơn.\n\n**Tham khảo:**\n\n- [Configure permissions](https://code.claude.com/docs/en/permissions)\n- [Create custom subagents](https://code.claude.com/docs/en/sub-agents)"}, {"n": 28, "set": 1, "i": 28, "multi": false, "answer": ["D"], "en": {"stem": "You are identifying signals that a deployment should re-enter design rather than continue iterating in place.\n\nWhich signal most directly indicates the need for a new design cycle?", "opts": [["A", "A runbook step requires a clarification edit to improve on-call guidance accuracy, which can be handled as a documentation update without changes to component responsibilities or core contracts."], ["B", "A dashboard alert threshold needs a small numerical adjustment to reduce false-positive noise, which can be handled as an operational configuration change without a new design cycle."], ["C", "A minor copy edit is requested in a customer-facing string within the existing Ul, which can be handled as a localized content change without altering component responsibilities or contracts."], ["D", "The system's current architecture cannot meet the new requirements without changes to component responsibilities or core contracts."]]}, "vi": {"stem": "Bạn đang xác định các tín hiệu cho thấy một hệ thống đã triển khai nên quay lại giai đoạn thiết kế thay vì tiếp tục lặp cải tiến tại chỗ.\n\nTín hiệu nào cho thấy trực tiếp nhất nhu cầu cần một chu kỳ thiết kế mới?", "opts": [["A", "Một bước trong runbook cần chỉnh sửa làm rõ để cải thiện độ chính xác của hướng dẫn trực on-call, việc này có thể xử lý như một cập nhật tài liệu mà không thay đổi trách nhiệm của các thành phần hay các hợp đồng giao tiếp cốt lõi."], ["B", "Một ngưỡng cảnh báo trên dashboard cần điều chỉnh nhỏ về số liệu để giảm nhiễu cảnh báo sai, việc này có thể xử lý như một thay đổi cấu hình vận hành mà không cần chu kỳ thiết kế mới."], ["C", "Có yêu cầu chỉnh sửa nhỏ về câu chữ trong một chuỗi hiển thị cho khách hàng trong UI hiện có, việc này có thể xử lý như một thay đổi nội dung cục bộ mà không làm thay đổi trách nhiệm hay hợp đồng giao tiếp của các thành phần."], ["D", "Kiến trúc hiện tại của hệ thống không thể đáp ứng các yêu cầu mới nếu không thay đổi trách nhiệm của các thành phần hoặc các hợp đồng giao tiếp cốt lõi."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Kiến trúc hiện tại của hệ thống không thể đáp ứng các yêu cầu mới nếu không thay đổi trách nhiệm của các thành phần hoặc các hợp đồng giao tiếp cốt lõi.\n\nKhi yêu cầu mới buộc thay trách nhiệm thành phần hoặc hợp đồng cốt lõi, giả định thiết kế cũ không còn đủ. Mở chu kỳ thiết kế mới cho phép đánh giá lại ranh giới, luồng và đánh đổi trước khi sửa từng phần làm các thành phần mất nhất quán.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Một bước trong runbook cần chỉnh sửa làm rõ để cải thiện độ chính xác của hướng dẫn trực on-call, việc này có thể xử lý như một cập nhật tài liệu mà không thay đổi trách nhiệm của các thành phần hay các hợp đồng giao tiếp cốt lõi.**: Làm rõ một bước runbook sửa hướng dẫn vận hành trong kiến trúc hiện có, không tự đòi thay hợp đồng thành phần.\n- **Một ngưỡng cảnh báo trên dashboard cần điều chỉnh nhỏ về số liệu để giảm nhiễu cảnh báo sai, việc này có thể xử lý như một thay đổi cấu hình vận hành mà không cần chu kỳ thiết kế mới.**: Điều chỉnh nhỏ ngưỡng cảnh báo là tuning cấu hình dựa trên tín hiệu vận hành, chưa cho thấy kiến trúc không còn đáp ứng yêu cầu.\n- **Có yêu cầu chỉnh sửa nhỏ về câu chữ trong một chuỗi hiển thị cho khách hàng trong UI hiện có, việc này có thể xử lý như một thay đổi nội dung cục bộ mà không làm thay đổi trách nhiệm hay hợp đồng giao tiếp của các thành phần.**: Sửa câu chữ giao diện tại chỗ không thay trách nhiệm hay giao tiếp thành phần nên phù hợp vòng lặp hiện tại.\n\n**Tham khảo:**\n\n- [NIST AI RMF Core](https://airc.nist.gov/airmf-resources/airmf/5-sec-core/)"}, {"n": 29, "set": 1, "i": 29, "multi": false, "answer": ["C"], "en": {"stem": "You are reviewing a peer's Claude Code permission rules for an enterprise rollout.\n\nThe rules grant unrestricted Bash access to all projects across all developers.\n\nWhich response is most appropriate?", "opts": [["A", "Add unrestricted access to additional tool categories as well, so that Bash is not asymmetrically more permissive than other tools, expanding the attack surface further in the name of consistency."], ["B", "Approve the unrestricted Bash access as written on the grounds that narrowing the rules would add nfiguration complexity, accepting the full attack surface for all engineers across all projects."], ["C", "Replace unrestricted Bash with narrowly scoped tool patterns that allow only the specific commands the workflows require, and add explicit deny rules for sensitive operations."], ["D", "Disable all permission rules for the enterprise rollout so every command across every project runs without any tool-pattern scoping or explicit deny rules for sensitive operations."]]}, "vi": {"stem": "Bạn đang rà soát các quy tắc quyền Claude Code của một đồng nghiệp cho đợt triển khai cấp doanh nghiệp. Các quy tắc này cấp quyền truy cập Bash không giới hạn cho mọi project và mọi lập trình viên.\n\nCách phản hồi nào phù hợp nhất?", "opts": [["A", "Bổ sung thêm quyền truy cập không giới hạn cho các nhóm tool khác, để Bash không dễ dãi hơn một cách bất cân xứng so với các tool khác, qua đó mở rộng thêm bề mặt tấn công nhân danh sự nhất quán."], ["B", "Phê duyệt quyền truy cập Bash không giới hạn như đã viết với lý do thu hẹp quy tắc sẽ làm tăng độ phức tạp cấu hình, chấp nhận toàn bộ bề mặt tấn công cho mọi kỹ sư trên mọi project."], ["C", "Thay quyền Bash không giới hạn bằng các mẫu tool (tool pattern) có phạm vi hẹp, chỉ cho phép đúng những lệnh mà workflow cần, và bổ sung các quy tắc từ chối (deny rule) rõ ràng cho các thao tác nhạy cảm."], ["D", "Vô hiệu hóa mọi quy tắc quyền trong đợt triển khai doanh nghiệp để mọi lệnh trên mọi project đều chạy mà không có giới hạn phạm vi theo tool pattern hay quy tắc từ chối rõ ràng cho các thao tác nhạy cảm."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Thay quyền Bash không giới hạn bằng các mẫu tool (tool pattern) có phạm vi hẹp, chỉ cho phép đúng những lệnh mà workflow cần, và bổ sung các quy tắc từ chối (deny rule) rõ ràng cho các thao tác nhạy cảm.\n\nGiới hạn Bash theo các lệnh thật sự cần và thêm deny cho thao tác nhạy cảm giảm số hành động mà tài khoản triển khai có thể thực hiện ngoài nhiệm vụ. Quy tắc phải được kiểm tra với cú pháp ghép lệnh và phạm vi thực tế; pattern quyền không thay thế sandbox hay quyền hệ điều hành.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Bổ sung thêm quyền truy cập không giới hạn cho các nhóm tool khác, để Bash không dễ dãi hơn một cách bất cân xứng so với các tool khác, qua đó mở rộng thêm bề mặt tấn công nhân danh sự nhất quán.**: Mở rộng quyền sang công cụ khác làm nhiều đường hành động nguy hiểm hơn, không khắc phục Bash vốn đang quá rộng.\n- **Phê duyệt quyền truy cập Bash không giới hạn như đã viết với lý do thu hẹp quy tắc sẽ làm tăng độ phức tạp cấu hình, chấp nhận toàn bộ bề mặt tấn công cho mọi kỹ sư trên mọi project.**: Bớt công sức cấu hình không chứng minh cần toàn bộ quyền Bash cho mọi dự án và mọi kỹ sư.\n- **Vô hiệu hóa mọi quy tắc quyền trong đợt triển khai doanh nghiệp để mọi lệnh trên mọi project đều chạy mà không có giới hạn phạm vi theo tool pattern hay quy tắc từ chối rõ ràng cho các thao tác nhạy cảm.**: Tắt mọi quy tắc xóa cả giới hạn lẫn deny hiện có, tăng phạm vi ảnh hưởng của thao tác sai.\n\n**Tham khảo:**\n\n- [Configure permissions](https://code.claude.com/docs/en/permissions)"}, {"n": 30, "set": 1, "i": 30, "multi": false, "answer": ["A"], "en": {"stem": "A solutions architect is analyzing stakeholder feedback collected after the first quarter of a Claude-powered\nprocurement automation deployment.\n\nThe feedback includes four statements:\n\n(1) \"Our procurement team is processing 3x more purchase orders per analyst per day.\n\"\n\n(2) \"We have eliminated the manual data entry role entirely and redeployed those staff to vendor relationship\nmanagement.\n\"\n\n(3) \"The API integration costs are running 40% over the projected per-transaction budget.\n\"\n\n(4) \"Response latency during end-of-month batch runs is averaging 11 seconds, against our committed 5-second\nSLA.\n\"\n\nWhich of the following correctly identifies the primary business value pillar each stakeholder statement\nrepresents?", "opts": [["A", "Statement 1: Efficiency; Statement 2: Transformation; Statement 3: Solution Cost; Statement 4:Performance SLA"], ["B", "Statement 1: Productivity; Statement 2: Efficiency; Statement 3: Solution Cost; Statement 4:Performance SLA"], ["C", "Statement 1: Transformation; Statement 2: Productivity; Statement 3: Solution Cost; Statement 4:Efficiency"], ["D", "Statement 1: Efficiency; Statement 2: Productivity; Statement 3: Performance SLA; Statement 4:Solution Cost"]]}, "vi": {"stem": "Một kiến trúc sư giải pháp đang phân tích phản hồi của các bên liên quan được thu thập sau quý đầu tiên triển khai hệ thống tự động hóa mua sắm (procurement) chạy bằng Claude. Phản hồi gồm bốn phát biểu:\n\n(1) \"Nhóm mua sắm của chúng tôi đang xử lý số đơn đặt hàng gấp 3 lần trên mỗi chuyên viên phân tích mỗi ngày.\"\n\n(2) \"Chúng tôi đã loại bỏ hoàn toàn vị trí nhập liệu thủ công và điều chuyển những nhân sự đó sang quản lý quan hệ nhà cung cấp.\"\n\n(3) \"Chi phí tích hợp API đang vượt 40% so với ngân sách dự kiến cho mỗi giao dịch.\"\n\n(4) \"Độ trễ phản hồi trong các đợt chạy batch cuối tháng trung bình là 11 giây, so với SLA 5 giây mà chúng tôi đã cam kết.\"\n\nPhương án nào sau đây xác định đúng trụ cột giá trị kinh doanh chính mà mỗi phát biểu của các bên liên quan thể hiện?", "opts": [["A", "Phát biểu 1: Efficiency (Hiệu suất); Phát biểu 2: Transformation (Chuyển đổi); Phát biểu 3: Solution Cost (Chi phí giải pháp); Phát biểu 4: Performance SLA (SLA hiệu năng)"], ["B", "Phát biểu 1: Productivity (Năng suất); Phát biểu 2: Efficiency (Hiệu suất); Phát biểu 3: Solution Cost (Chi phí giải pháp); Phát biểu 4: Performance SLA (SLA hiệu năng)"], ["C", "Phát biểu 1: Transformation (Chuyển đổi); Phát biểu 2: Productivity (Năng suất); Phát biểu 3: Solution Cost (Chi phí giải pháp); Phát biểu 4: Efficiency (Hiệu suất)"], ["D", "Phát biểu 1: Efficiency (Hiệu suất); Phát biểu 2: Productivity (Năng suất); Phát biểu 3: Performance SLA (SLA hiệu năng); Phát biểu 4: Solution Cost (Chi phí giải pháp)"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Phát biểu 1: Efficiency (Hiệu suất); Phát biểu 2: Transformation (Chuyển đổi); Phát biểu 3: Solution Cost (Chi phí giải pháp); Phát biểu 4: Performance SLA (SLA hiệu năng)\n\nTheo cách phân loại của khóa, xử lý nhiều đơn hơn trên mỗi analyst là Efficiency vì tăng đầu ra trên cùng nguồn lực; bỏ vai nhập liệu và chuyển nhân sự sang quan hệ nhà cung cấp là Transformation vì thay đổi tổ chức công việc. Chi phí API vượt ngân sách thuộc Solution Cost; 11 giây so với cam kết 5 giây thuộc Performance SLA. Nhãn Efficiency và Productivity có thể chồng lấn nếu đề không định nghĩa riêng.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Phát biểu 1: Productivity (Năng suất); Phát biểu 2: Efficiency (Hiệu suất); Phát biểu 3: Solution Cost (Chi phí giải pháp); Phát biểu 4: Performance SLA (SLA hiệu năng)**: Productivity cũng là cách gọi hợp lý cho số đơn trên người, nhưng gán việc loại bỏ một vai trò chỉ là Efficiency làm mất thay đổi mô hình công việc mà khóa xem là Transformation.\n- **Phát biểu 1: Transformation (Chuyển đổi); Phát biểu 2: Productivity (Năng suất); Phát biểu 3: Solution Cost (Chi phí giải pháp); Phát biểu 4: Efficiency (Hiệu suất)**: Tăng số đơn trên cùng analyst chưa tự chứng minh Transformation; đồng thời thời gian đáp ứng vi phạm cam kết phải là Performance SLA, không chỉ Efficiency.\n- **Phát biểu 1: Efficiency (Hiệu suất); Phát biểu 2: Productivity (Năng suất); Phát biểu 3: Performance SLA (SLA hiệu năng); Phát biểu 4: Solution Cost (Chi phí giải pháp)**: Chi phí API vượt dự toán là vấn đề tiền trên giao dịch chứ không phải Performance SLA; độ trễ so với cam kết là SLA chứ không phải Solution Cost. Chuyển vai trò cũng không chỉ là tăng năng suất.\n\n**Cần xem lại:** Giữ khóa nguồn. Đề không định nghĩa ranh giới Efficiency và Productivity; lượng đơn trên analyst/ngày có thể được gọi là năng suất. Cần định nghĩa trụ cột trước khi chấm nhãn đầu là duy nhất.\n\n**Tham khảo:**\n\n- [Google SRE: Service Level Objectives](https://sre.google/sre-book/service-level-objectives/)\n- [NIST AI RMF Core](https://airc.nist.gov/airmf-resources/airmf/5-sec-core/)"}, {"n": 31, "set": 1, "i": 31, "multi": true, "answer": ["B", "E"], "en": {"stem": "An operations engineer reports that a Claude-based pipeline began returning malformed JSON responses after a\nscheduled maintenance window, causing downstream processing failures.\n\nWhich two investigative steps most directly isolate the root cause? (Select two.)", "opts": [["A", "Clear the prompt cache and resubmit all pending requests to eliminate stale cached prefixes."], ["B", "Compare the current system prompt and output schema configuration against the last known good version from before the maintenance window."], ["C", "Switch to a different Claude model tier to rule out provider-side changes as a contributing factor."], ["D", "Increase the max _ tokens limit to determine whether output truncation is causing incomplete JSON structures."], ["E", "Replay a set of premaintenance requests against the current configuration and inspect the raw model output before downstream parsing."]]}, "vi": {"stem": "Một kỹ sư vận hành báo cáo rằng một pipeline dựa trên Claude bắt đầu trả về các phản hồi JSON sai định dạng sau một khung giờ bảo trì theo lịch, gây ra lỗi ở các bước xử lý phía sau (downstream).\n\nHai bước điều tra nào cô lập nguyên nhân gốc trực tiếp nhất? (Chọn hai.)", "opts": [["A", "Xóa prompt cache và gửi lại mọi yêu cầu đang chờ để loại bỏ các tiền tố đã cache bị cũ."], ["B", "So sánh cấu hình system prompt và output schema hiện tại với phiên bản tốt đã biết gần nhất từ trước khung giờ bảo trì."], ["C", "Chuyển sang một hạng model Claude khác để loại trừ khả năng thay đổi phía nhà cung cấp là một yếu tố góp phần."], ["D", "Tăng giới hạn `max_tokens` để xác định xem việc đầu ra bị cắt cụt có gây ra cấu trúc JSON không hoàn chỉnh hay không."], ["E", "Chạy lại một tập yêu cầu từ trước đợt bảo trì trên cấu hình hiện tại và kiểm tra đầu ra thô của model trước bước phân tích cú pháp (parsing) downstream."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** So sánh cấu hình system prompt và output schema hiện tại với phiên bản tốt đã biết gần nhất từ trước khung giờ bảo trì.; Chạy lại một tập yêu cầu từ trước đợt bảo trì trên cấu hình hiện tại và kiểm tra đầu ra thô của model trước bước phân tích cú pháp (parsing) downstream.\n\nĐối chiếu system prompt và schema với phiên bản hoạt động trước bảo trì tìm ra cấu hình đã thay đổi đúng thời điểm lỗi xuất hiện. Phát lại yêu cầu cũ và xem đầu ra thô trước parser giúp phân biệt mô hình sinh JSON sai, bị cắt ngắn hay bộ xử lý sau làm hỏng dữ liệu. Hai bước tạo bằng chứng trước khi thay thành phần.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Xóa prompt cache và gửi lại mọi yêu cầu đang chờ để loại bỏ các tiền tố đã cache bị cũ.**: Xóa cache không xác định thay đổi nào gây JSON lỗi; cache prompt không phải bộ lưu câu trả lời để xóa là sửa đầu ra. API cũng không cung cấp thao tác xóa thủ công cache prefix.\n- **Chuyển sang một hạng model Claude khác để loại trừ khả năng thay đổi phía nhà cung cấp là một yếu tố góp phần.**: Đổi model tier thay thêm một biến trước khi so sánh cấu hình, nên khó quy lỗi cho thay đổi xảy ra trong bảo trì.\n- **Tăng giới hạn `max_tokens` để xác định xem việc đầu ra bị cắt cụt có gây ra cấu trúc JSON không hoàn chỉnh hay không.**: Tăng max_tokens hợp lý nếu đầu ra thô và stop_reason cho thấy cắt ngắn; chưa có dấu hiệu đó thì đây là giả thuyết cần kiểm chứng, không phải bước cô lập đầu tiên tốt nhất.\n\n**Tham khảo:**\n\n- [Google SRE: Effective Troubleshooting](https://sre.google/sre-book/effective-troubleshooting/)\n- [Structured outputs](https://platform.claude.com/docs/en/build-with-claude/structured-outputs)\n- [Prompt caching](https://platform.claude.com/docs/en/build-with-claude/prompt-caching)"}, {"n": 32, "set": 1, "i": 32, "multi": true, "answer": ["C", "E"], "en": {"stem": "You are compiling a diagnostic toolkit for Claude Code operational issues.\n\nWhich two diagnostic actions belong in the toolkit? (Select two.)\nEach correct answer presents a complete solution.", "opts": [["A", "Increase the model sampling temperature so that intermittent issues surface more frequently for analysis."], ["B", "File a support ticket with vendor support before any local reproduction or evidence collection."], ["C", "Reproduce the issue with a minimal reproduction case that isolates one variable at a time."], ["D", "Roll back to the previous Claude Code version immediately to confirm whether the issue is version specific."], ["E", "List the configured Model Context Protocol (MCP) servers and inspect server status to identify connection failures."]]}, "vi": {"stem": "Bạn đang tổng hợp một bộ công cụ chẩn đoán cho các sự cố vận hành Claude Code.\n\nHai hành động chẩn đoán nào thuộc bộ công cụ này? (Chọn hai.)\nMỗi đáp án đúng là một giải pháp hoàn chỉnh.", "opts": [["A", "Tăng sampling temperature của model để các sự cố không liên tục xuất hiện thường xuyên hơn cho việc phân tích."], ["B", "Gửi phiếu hỗ trợ (support ticket) tới bộ phận hỗ trợ của nhà cung cấp trước khi thực hiện bất kỳ việc tái hiện cục bộ hay thu thập bằng chứng nào."], ["C", "Tái hiện sự cố bằng một trường hợp tái hiện tối giản, mỗi lần chỉ cô lập một biến."], ["D", "Quay lui (roll back) ngay về phiên bản Claude Code trước đó để xác nhận sự cố có phụ thuộc vào phiên bản hay không."], ["E", "Liệt kê các máy chủ Model Context Protocol (MCP) đã cấu hình và kiểm tra trạng thái server để xác định lỗi kết nối."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Tái hiện sự cố bằng một trường hợp tái hiện tối giản, mỗi lần chỉ cô lập một biến.; Liệt kê các máy chủ Model Context Protocol (MCP) đã cấu hình và kiểm tra trạng thái server để xác định lỗi kết nối.\n\nMột ca tái hiện tối giản giảm yếu tố gây nhiễu và cho phép thay từng biến để quan sát nguyên nhân. Liệt kê MCP server và kiểm tra trạng thái kết nối xác minh lớp công cụ có thật sự sẵn sàng. Hai hành động tạo dữ liệu chẩn đoán trực tiếp cho lỗi Claude Code thay vì đoán hoặc sửa đồng thời nhiều biến.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Tăng sampling temperature của model để các sự cố không liên tục xuất hiện thường xuyên hơn cho việc phân tích.**: Tăng temperature thay đổi tính ngẫu nhiên của đầu ra nhưng không làm lỗi kết nối hoặc cấu hình dễ cô lập một cách có kiểm soát.\n- **Gửi phiếu hỗ trợ (support ticket) tới bộ phận hỗ trợ của nhà cung cấp trước khi thực hiện bất kỳ việc tái hiện cục bộ hay thu thập bằng chứng nào.**: Support có thể cần sau đó; gửi yêu cầu trước khi có tái hiện và bằng chứng thường thiếu dữ liệu để phân biệt nguyên nhân.\n- **Quay lui (roll back) ngay về phiên bản Claude Code trước đó để xác nhận sự cố có phụ thuộc vào phiên bản hay không.**: Rollback có thể là thử nghiệm hữu ích nếu nghi phiên bản, nhưng làm ngay trước khi thu bằng chứng có thể mất trạng thái lỗi và chưa cô lập được biến.\n\n**Tham khảo:**\n\n- [Google SRE: Effective Troubleshooting](https://sre.google/sre-book/effective-troubleshooting/)\n- [Connect Claude Code to tools via MCP](https://code.claude.com/docs/en/mcp)"}, {"n": 33, "set": 1, "i": 33, "multi": false, "answer": ["C"], "en": {"stem": "You are assessing data-exfiltration risk in a Claude-based assistant that has tools for both internal-document\nretrieval and outbound HTTP calls.\n\nWhich scenario most directly indicates a data-exfiltration risk?", "opts": [["A", "The outbound HTTP tool returns a 200 response when the assistant calls an allow-listed domain to fulfil a user-initiated data-lookup request."], ["B", "The user submits a routine question and receives a routine answer."], ["C", "Adversarial content in a retrieved document instructs the model to call the outbound HTTP tool and send sensitive content to an attacker-controlled URL."], ["D", "The internal-document retrieval tool returns a document that the user is authorized to view."]]}, "vi": {"stem": "Bạn đang đánh giá rủi ro rò rỉ dữ liệu (data exfiltration) trong một trợ lý dựa trên Claude có các tool vừa để truy xuất tài liệu nội bộ vừa để thực hiện lệnh gọi HTTP ra bên ngoài.\n\nTình huống nào cho thấy trực tiếp nhất rủi ro rò rỉ dữ liệu?", "opts": [["A", "Tool HTTP ra ngoài trả về phản hồi 200 khi trợ lý gọi một domain nằm trong danh sách cho phép để thực hiện một yêu cầu tra cứu dữ liệu do người dùng khởi tạo."], ["B", "Người dùng gửi một câu hỏi thông thường và nhận được một câu trả lời thông thường."], ["C", "Nội dung đối kháng trong một tài liệu được truy xuất hướng dẫn model gọi tool HTTP ra ngoài và gửi nội dung nhạy cảm tới một URL do kẻ tấn công kiểm soát."], ["D", "Tool truy xuất tài liệu nội bộ trả về một tài liệu mà người dùng được phép xem."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Nội dung đối kháng trong một tài liệu được truy xuất hướng dẫn model gọi tool HTTP ra ngoài và gửi nội dung nhạy cảm tới một URL do kẻ tấn công kiểm soát.\n\nTài liệu truy xuất chứa chỉ dẫn gửi nội dung nhạy cảm tới URL của kẻ tấn công tạo chuỗi từ dữ liệu nội bộ qua công cụ HTTP ra ngoài. Đây là prompt injection gián tiếp nhằm exfiltration: nội dung tài liệu cố vượt ranh giới từ dữ liệu sang mệnh lệnh sử dụng công cụ.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Tool HTTP ra ngoài trả về phản hồi 200 khi trợ lý gọi một domain nằm trong danh sách cho phép để thực hiện một yêu cầu tra cứu dữ liệu do người dùng khởi tạo.**: HTTP 200 từ miền được cho phép trong tra cứu do người dùng yêu cầu chỉ cho biết gọi thành công; tự nó chưa có dấu hiệu gửi dữ liệu nhạy cảm sai mục đích.\n- **Người dùng gửi một câu hỏi thông thường và nhận được một câu trả lời thông thường.**: Hỏi đáp bình thường không mô tả đường chuyển dữ liệu nội bộ tới người nhận không được phép.\n- **Tool truy xuất tài liệu nội bộ trả về một tài liệu mà người dùng được phép xem.**: Truy xuất tài liệu mà người dùng được phép xem là truy cập được ủy quyền; rủi ro nêu trong đáp án cần thêm bước gửi ra ngoài sai quyền.\n\n**Tham khảo:**\n\n- [Mitigate jailbreaks and prompt injections](https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/mitigate-jailbreaks)"}, {"n": 34, "set": 1, "i": 34, "multi": false, "answer": ["C"], "en": {"stem": "After a prompt-template update, several previously passing test cases now produce unexpected outputs.\n\nWhich test type is specifically designed to detect this category of failure?", "opts": [["A", "Integration tests that validate cross-component pipeline behavior."], ["B", "Adversarial tests that probe for prompt-injection vulnerabilities."], ["C", "Regression tests scored against a stable reference set of known-good behavior."], ["D", "Smoke tests that confirm high-level system availability after the change."]]}, "vi": {"stem": "Sau một lần cập nhật prompt template, một số test case trước đây vượt qua giờ lại tạo ra các đầu ra không mong đợi.\n\nLoại kiểm thử nào được thiết kế riêng để phát hiện loại lỗi này?", "opts": [["A", "Kiểm thử tích hợp xác thực hành vi của pipeline giữa các thành phần."], ["B", "Kiểm thử đối kháng dò tìm các lỗ hổng prompt injection."], ["C", "Kiểm thử hồi quy được chấm điểm so với một tập tham chiếu ổn định gồm các hành vi đã biết là đúng."], ["D", "Kiểm thử khói xác nhận tính sẵn sàng tổng thể của hệ thống sau thay đổi."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Kiểm thử hồi quy được chấm điểm so với một tập tham chiếu ổn định gồm các hành vi đã biết là đúng.\n\nRegression test chạy lại tập hành vi đã được chấp nhận sau khi prompt đổi, rồi chấm theo tiêu chí ổn định để thấy trường hợp từng đạt nay bị lỗi. Với LLM, nên đánh giá ý nghĩa và tiêu chí nhiệm vụ thay vì đòi chuỗi văn bản giống hệt nếu nhiệm vụ cho phép nhiều cách diễn đạt.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Kiểm thử tích hợp xác thực hành vi của pipeline giữa các thành phần.**: Integration test tập trung vào phối hợp giữa thành phần; có thể phát hiện hồi quy nhưng không phải loại được định nghĩa riêng để giữ hành vi cũ.\n- **Kiểm thử đối kháng dò tìm các lỗ hổng prompt injection.**: Adversarial test thăm dò cách hệ thống bị tấn công, trong khi đề nói trường hợp bình thường từng đạt bị hỏng sau thay prompt.\n- **Kiểm thử khói xác nhận tính sẵn sàng tổng thể của hệ thống sau thay đổi.**: Smoke test kiểm tra dịch vụ và đường chính còn hoạt động; hệ thống vẫn có thể qua smoke test dù nhiều kết quả cũ đã sai.\n\n**Tham khảo:**\n\n- [Define success criteria and build evaluations](https://platform.claude.com/docs/en/test-and-evaluate/develop-tests)"}, {"n": 35, "set": 1, "i": 35, "multi": false, "answer": ["C"], "en": {"stem": "You are identifying the highest-impact optimization for a deployment whose token cost is dominated by a long,\nrepeated system prompt and a large retrieved context per request.\n\nWhich optimization most directly targets the dominant cost driver?", "opts": [["A", "Increase retrieval depth on every request to maximize recall, worsening the dominant cost driver by adding more retrieved tokens per request rather than reducing them."], ["B", "Add additional repeated content to the system prompt to give the model more guidance."], ["C", "Move the long, repeated system prompt into a cacheable prefix and trim retrieved context to the spans relevant to each query."], ["D", "Switch every request to the heaviest available model to maximize output quality, accepting that higher per- request inference cost compounds rather than addresses the dominant cost driver."]]}, "vi": {"stem": "Bạn đang xác định phương án tối ưu có tác động lớn nhất cho một hệ thống có chi phí token bị chi phối bởi một system prompt dài, lặp lại và một lượng lớn context được truy xuất trong mỗi yêu cầu.\n\nPhương án tối ưu nào nhắm trực tiếp nhất vào yếu tố chi phí chi phối?", "opts": [["A", "Tăng độ sâu truy xuất cho mọi yêu cầu để tối đa hóa độ phủ (recall), làm trầm trọng thêm yếu tố chi phí chi phối do bổ sung thêm token truy xuất cho mỗi yêu cầu thay vì giảm bớt."], ["B", "Thêm nội dung lặp lại vào system prompt để cung cấp thêm hướng dẫn cho model."], ["C", "Chuyển system prompt dài, lặp lại vào một tiền tố có thể cache (cacheable prefix) và cắt giảm context truy xuất xuống chỉ còn các đoạn liên quan đến từng truy vấn."], ["D", "Chuyển mọi yêu cầu sang model nặng nhất hiện có để tối đa hóa chất lượng đầu ra, chấp nhận rằng chi phí suy luận cao hơn cho mỗi yêu cầu sẽ làm trầm trọng thêm chứ không giải quyết yếu tố chi phí chi phối."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Chuyển system prompt dài, lặp lại vào một tiền tố có thể cache (cacheable prefix) và cắt giảm context truy xuất xuống chỉ còn các đoạn liên quan đến từng truy vấn.\n\nĐưa phần system prompt lặp lại vào prefix có thể cache giảm chi phí xử lý phần tĩnh khi có cache hit. Chọn đúng đoạn tài liệu liên quan giảm số token động phải gửi và xử lý cho mỗi truy vấn. Cặp tối ưu này nhắm đúng hai nguồn token đang chiếm chi phí, đồng thời cần giữ đủ bằng chứng để trả lời.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Tăng độ sâu truy xuất cho mọi yêu cầu để tối đa hóa độ phủ (recall), làm trầm trọng thêm yếu tố chi phí chi phối do bổ sung thêm token truy xuất cho mỗi yêu cầu thay vì giảm bớt.**: Tăng retrieval depth trên mọi truy vấn thêm văn bản ngay vào thành phần chi phí đã lớn; chỉ nên tăng khi đánh giá cho thấy cần bằng chứng đó.\n- **Thêm nội dung lặp lại vào system prompt để cung cấp thêm hướng dẫn cho model.**: Thêm nội dung lặp vào prompt làm tăng prefix cần xử lý, không giảm lượng token hoặc cải thiện tỷ lệ tái sử dụng theo đề.\n- **Chuyển mọi yêu cầu sang model nặng nhất hiện có để tối đa hóa chất lượng đầu ra, chấp nhận rằng chi phí suy luận cao hơn cho mỗi yêu cầu sẽ làm trầm trọng thêm chứ không giải quyết yếu tố chi phí chi phối.**: Đổi mọi lượt sang model nặng hơn tăng đơn giá mà không xử lý prompt lặp và context thừa.\n\n**Tham khảo:**\n\n- [Prompt caching](https://platform.claude.com/docs/en/build-with-claude/prompt-caching)"}, {"n": 36, "set": 1, "i": 36, "multi": false, "answer": ["B"], "en": {"stem": "You are designing a feedback session for a deployment in flight.\n\nWhich structure best supports productive stakeholder feedback?", "opts": [["A", "Hold an open-ended meeting with no pre-distributed agenda or artifacts, and rely on participants' memory to carry decisions and follow-up owners forward."], ["B", "Define a focused agenda, share the artifacts in advance, capture decisions and follow-ups in writing, and confirm action owners and dates."], ["C", "Distribute artifacts at the session start rather than in advance, so stakeholders review materials in real timewithout preparation before the discussion begins."], ["D", "End the session without recording decisions, follow-up items, action owners, or dates, relying on participant memory to carry the session's outcomes forward."]]}, "vi": {"stem": "Bạn đang thiết kế một buổi thu thập phản hồi cho một hệ thống đang trong quá trình triển khai.\n\nCấu trúc nào hỗ trợ tốt nhất việc thu thập phản hồi hiệu quả từ các bên liên quan?", "opts": [["A", "Tổ chức một cuộc họp mở, không có chương trình nghị sự hay tài liệu phân phát trước, và dựa vào trí nhớ của người tham dự để ghi nhớ các quyết định và người phụ trách việc tiếp theo."], ["B", "Xác định một chương trình nghị sự tập trung, chia sẻ tài liệu trước, ghi lại bằng văn bản các quyết định và việc cần làm tiếp theo, và xác nhận người phụ trách hành động cùng thời hạn."], ["C", "Phân phát tài liệu khi bắt đầu buổi họp thay vì gửi trước, để các bên liên quan xem tài liệu theo thời gian thực mà không có sự chuẩn bị trước khi thảo luận bắt đầu."], ["D", "Kết thúc buổi họp mà không ghi lại các quyết định, việc cần làm tiếp theo, người phụ trách hành động hay thời hạn, dựa vào trí nhớ của người tham dự để duy trì kết quả của buổi họp."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Xác định một chương trình nghị sự tập trung, chia sẻ tài liệu trước, ghi lại bằng văn bản các quyết định và việc cần làm tiếp theo, và xác nhận người phụ trách hành động cùng thời hạn.\n\nAgenda tập trung xác định quyết định cần góp ý; gửi tài liệu trước cho người tham gia thời gian đọc và chuẩn bị phản hồi. Ghi quyết định, việc tiếp theo, người phụ trách và ngày hoàn tất biến thảo luận thành các hành động có thể theo dõi, giảm hiểu khác nhau sau buổi họp.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Tổ chức một cuộc họp mở, không có chương trình nghị sự hay tài liệu phân phát trước, và dựa vào trí nhớ của người tham dự để ghi nhớ các quyết định và người phụ trách việc tiếp theo.**: Không agenda hay tài liệu trước khiến buổi họp dễ trôi khỏi mục tiêu; dựa trí nhớ còn làm mất quyết định và trách nhiệm.\n- **Phân phát tài liệu khi bắt đầu buổi họp thay vì gửi trước, để các bên liên quan xem tài liệu theo thời gian thực mà không có sự chuẩn bị trước khi thảo luận bắt đầu.**: Phát tài liệu lúc bắt đầu lấy mất thời gian chuẩn bị, buộc người tham gia vừa đọc vừa đưa nhận xét thay vì cân nhắc trước.\n- **Kết thúc buổi họp mà không ghi lại các quyết định, việc cần làm tiếp theo, người phụ trách hành động hay thời hạn, dựa vào trí nhớ của người tham dự để duy trì kết quả của buổi họp.**: Không ghi kết quả, chủ sở hữu và hạn làm việc tiếp theo khó được thực hiện và kiểm tra.\n\n**Tham khảo:**\n\n- [NIST AI RMF Core](https://airc.nist.gov/airmf-resources/airmf/5-sec-core/)"}, {"n": 37, "set": 1, "i": 37, "multi": true, "answer": ["A", "B"], "en": {"stem": "A loan pre-qualification assistant shows 94 percent approval recommendations that match the human underwriter\ndecision.\n\nThe fairness team has reviewed approval rate parity across protected groups and reported no significant\ndifference.\n\nA board member has asked whether this evidence is sufficient to declare the assistant fair.\n\nWhich two Discernment-competency findings should you report? (Select two.) Each correct answer presents part\nof the solution.", "opts": [["A", "Approval rate parity does not by itself assess error rate parity across protected groups."], ["B", "Match with human underwriters does not establish freedom from underwriter-introduced bias."], ["C", "The 94 percent match rate is sufficient evidence of fairness for the assistant's decisions."], ["D", "The fairness team's review process likely missed at least some of the protected groups studied."], ["E", "A larger sample is needed before any meaningful fairness claim can be made about the model."]]}, "vi": {"stem": "Một trợ lý sơ duyệt khoản vay (loan pre-qualification) cho thấy 94 phần trăm khuyến nghị phê duyệt khớp với quyết định của chuyên viên thẩm định (underwriter) là con người. Nhóm phụ trách công bằng (fairness) đã rà soát sự cân bằng tỷ lệ phê duyệt giữa các nhóm được bảo vệ (protected group) và báo cáo không có khác biệt đáng kể. Một thành viên hội đồng quản trị hỏi liệu bằng chứng này đã đủ để tuyên bố trợ lý là công bằng hay chưa.\n\nBạn nên báo cáo hai phát hiện nào thuộc năng lực Discernment (Phân định)? (Chọn hai.) Mỗi đáp án đúng là một phần của giải pháp.", "opts": [["A", "Sự cân bằng tỷ lệ phê duyệt tự nó không đánh giá được sự cân bằng tỷ lệ lỗi giữa các nhóm được bảo vệ."], ["B", "Việc khớp với chuyên viên thẩm định không chứng minh được rằng không có thiên lệch (bias) do chính chuyên viên thẩm định đưa vào."], ["C", "Tỷ lệ khớp 94 phần trăm là bằng chứng đủ về tính công bằng cho các quyết định của trợ lý."], ["D", "Quy trình rà soát của nhóm fairness có khả năng đã bỏ sót ít nhất một vài nhóm được bảo vệ trong phạm vi nghiên cứu."], ["E", "Cần một mẫu lớn hơn trước khi có thể đưa ra bất kỳ khẳng định có ý nghĩa nào về tính công bằng của model."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Sự cân bằng tỷ lệ phê duyệt tự nó không đánh giá được sự cân bằng tỷ lệ lỗi giữa các nhóm được bảo vệ.; Việc khớp với chuyên viên thẩm định không chứng minh được rằng không có thiên lệch (bias) do chính chuyên viên thẩm định đưa vào.\n\nTỷ lệ phê duyệt bằng nhau giữa nhóm không cho biết các nhóm có tỷ lệ từ chối nhầm hoặc phê duyệt nhầm bằng nhau. Đồng thời, khớp 94% với underwriter chỉ đo mức đồng thuận; nếu quyết định người có thiên lệch, mô hình có thể học hoặc lặp lại thiên lệch đó. Vì vậy hai bằng chứng hiện có chưa đủ tuyên bố công bằng.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Tỷ lệ khớp 94 phần trăm là bằng chứng đủ về tính công bằng cho các quyết định của trợ lý.**: 94% khớp người không xác định nhóm nào chịu lỗi hoặc liệu nhãn người có công bằng, nên không đủ làm kết luận fairness.\n- **Quy trình rà soát của nhóm fairness có khả năng đã bỏ sót ít nhất một vài nhóm được bảo vệ trong phạm vi nghiên cứu.**: Đề nói nhóm fairness đã xem các nhóm được bảo vệ; không có bằng chứng họ bỏ sót nhóm để kết luận điều đó.\n- **Cần một mẫu lớn hơn trước khi có thể đưa ra bất kỳ khẳng định có ý nghĩa nào về tính công bằng của model.**: Không có cỡ mẫu hoặc khoảng tin cậy nên chưa thể khẳng định phải tăng mẫu. Vấn đề chắc chắn là thiếu loại phép đo và tính độc lập với thiên lệch người.\n\n**Tham khảo:**\n\n- [NIST AI Risks and Trustworthiness](https://airc.nist.gov/airmf-resources/airmf/3-sec-characteristics/)"}, {"n": 38, "set": 1, "i": 38, "multi": false, "answer": ["D"], "en": {"stem": "You are an architect supporting the iteration phase of a deployed Claude-based system.\n\nWhich activity most directly fits this phase?", "opts": [["A", "Rebuild the entire system architecture from scratch at the start of every iteration cycle regardless of what production telemetry, evaluations, and stakeholder feedback indicate is needed."], ["B", "Stop measuring production outcomes once the deployment has successfully launched, treating the go-live milestone as the end of the evaluation and iteration cycle."], ["C", "Discard the evaluation framework and reference set once the deployment is in production, accepting that future iterations will have no structured basis for measuring the impact of changes."], ["D", "Review production telemetry, sampled output evaluations, and stakeholder feedback to identify the highest- impact change for the next cycle, then plan the change against the evaluation framework."]]}, "vi": {"stem": "Bạn là kiến trúc sư hỗ trợ giai đoạn lặp cải tiến (iteration) của một hệ thống dựa trên Claude đã triển khai.\n\nHoạt động nào phù hợp trực tiếp nhất với giai đoạn này?", "opts": [["A", "Xây dựng lại toàn bộ kiến trúc hệ thống từ đầu vào đầu mỗi chu kỳ lặp, bất kể telemetry production, kết quả đánh giá và phản hồi của các bên liên quan cho thấy điều gì là cần thiết."], ["B", "Ngừng đo lường kết quả production sau khi hệ thống ra mắt thành công, coi mốc go-live là điểm kết thúc của chu kỳ đánh giá và lặp cải tiến."], ["C", "Loại bỏ khung đánh giá (evaluation framework) và tập tham chiếu khi hệ thống đã lên production, chấp nhận rằng các lần lặp sau sẽ không có cơ sở có cấu trúc để đo lường tác động của thay đổi."], ["D", "Rà soát telemetry production, kết quả đánh giá đầu ra được lấy mẫu và phản hồi của các bên liên quan để xác định thay đổi có tác động lớn nhất cho chu kỳ tiếp theo, sau đó lập kế hoạch thay đổi dựa trên khung đánh giá."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Rà soát telemetry production, kết quả đánh giá đầu ra được lấy mẫu và phản hồi của các bên liên quan để xác định thay đổi có tác động lớn nhất cho chu kỳ tiếp theo, sau đó lập kế hoạch thay đổi dựa trên khung đánh giá.\n\nTrong giai đoạn lặp, telemetry cho biết hệ thống đang vận hành thế nào, đánh giá mẫu cho biết chất lượng đầu ra, còn phản hồi cho biết nhu cầu thực tế. Dùng ba nguồn để chọn thay đổi có tác động cao nhất rồi đo lại bằng khung đánh giá tạo vòng cải tiến có căn cứ.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Xây dựng lại toàn bộ kiến trúc hệ thống từ đầu vào đầu mỗi chu kỳ lặp, bất kể telemetry production, kết quả đánh giá và phản hồi của các bên liên quan cho thấy điều gì là cần thiết.**: Xây lại kiến trúc mỗi vòng không phụ thuộc bằng chứng gây chi phí và rủi ro không cần thiết; chỉ thiết kế lại khi yêu cầu hoặc giới hạn kiến trúc đòi hỏi.\n- **Ngừng đo lường kết quả production sau khi hệ thống ra mắt thành công, coi mốc go-live là điểm kết thúc của chu kỳ đánh giá và lặp cải tiến.**: Ngừng đo sau go-live làm mất tín hiệu drift, lỗi và giá trị thực tế cần để chọn bước cải tiến.\n- **Loại bỏ khung đánh giá (evaluation framework) và tập tham chiếu khi hệ thống đã lên production, chấp nhận rằng các lần lặp sau sẽ không có cơ sở có cấu trúc để đo lường tác động của thay đổi.**: Bỏ reference set và khung đánh giá khiến không có cơ sở nhất quán để biết phiên bản sau tốt hơn hay làm hỏng hành vi cũ.\n\n**Tham khảo:**\n\n- [Define success criteria and build evaluations](https://platform.claude.com/docs/en/test-and-evaluate/develop-tests)\n- [NIST AI RMF Core](https://airc.nist.gov/airmf-resources/airmf/5-sec-core/)"}, {"n": 39, "set": 1, "i": 39, "multi": false, "answer": ["C"], "en": {"stem": "You are explaining the precedence of Claude Code configuration scopes to the team.\n\nWhich precedence ordering, from highest to lowest, is correct?", "opts": [["A", "Local # managed # user # command-line arguments # project"], ["B", "Project # user # managed # local # command-line arguments"], ["C", "Managed # command-line arguments # local # project # user"], ["D", "User # project # local # command-line arguments # managed"]]}, "vi": {"stem": "Bạn đang giải thích thứ tự ưu tiên của các scope cấu hình Claude Code cho nhóm.\n\nThứ tự ưu tiên nào, từ cao nhất đến thấp nhất, là đúng?", "opts": [["A", "Local > managed > user > command-line arguments > project"], ["B", "Project > user > managed > local > command-line arguments"], ["C", "Managed > command-line arguments > local > project > user"], ["D", "User > project > local > command-line arguments > managed"]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Managed > command-line arguments > local > project > user\n\nTrong thứ tự scope settings của đề, managed đứng trước cấu hình dòng lệnh, rồi local của dự án, project dùng chung và user. Quy tắc này giải thích giá trị nào thắng khi cùng khóa được đặt ở nhiều nơi. Không nên áp dụng máy móc cho mọi permission list: nhiều danh sách được hợp nhất và deny vẫn có ngữ nghĩa riêng.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Local > managed > user > command-line arguments > project**: Đặt local trên managed cho phép sở thích cá nhân vượt chính sách tổ chức, trái thứ tự được tài liệu mô tả; user cũng không đứng trên cấu hình phiên dòng lệnh.\n- **Project > user > managed > local > command-line arguments**: Project và user không ưu tiên cao hơn managed; local cũng đứng trên project chứ không nằm dưới user.\n- **User > project > local > command-line arguments > managed**: User là mức thấp nhất trong chuỗi này, còn managed là cao nhất; đảo chúng làm sai cơ chế áp dụng chính sách chung.\n\n**Tham khảo:**\n\n- [Settings files and precedence](https://code.claude.com/docs/en/settings)"}, {"n": 40, "set": 1, "i": 40, "multi": false, "answer": ["A"], "en": {"stem": "A Claude architect observes that after a recent model-version upgrade, grounded responses began including\nclaims not supported by the retrieved source documents.\nWhich mitigation is most directly targeted at this failure mode?", "opts": [["A", "Constrain responses to source-supported content, require citations, and add a verification step."], ["B", "Score each new model version against a stable adversarial evaluation set."], ["C", "Replace the shared API key with per-user Auth tokens to restrict data access."], ["D", "Treat retrieved data as untrusted and apply input classifiers at ingestion time."]]}, "vi": {"stem": "Một kiến trúc sư Claude nhận thấy rằng sau một lần nâng cấp phiên bản model gần đây, các phản hồi có neo nguồn (grounded) bắt đầu chứa các khẳng định không được tài liệu nguồn truy xuất hỗ trợ.\n\nBiện pháp giảm thiểu nào nhắm trực tiếp nhất vào chế độ lỗi này?", "opts": [["A", "Giới hạn phản hồi trong nội dung được nguồn hỗ trợ, yêu cầu trích dẫn và thêm một bước xác minh."], ["B", "Chấm điểm mỗi phiên bản model mới trên một tập đánh giá đối kháng ổn định."], ["C", "Thay API key dùng chung bằng các token xác thực (Auth token) theo từng người dùng để hạn chế quyền truy cập dữ liệu."], ["D", "Coi dữ liệu truy xuất là không đáng tin cậy và áp dụng bộ phân loại đầu vào tại thời điểm nạp dữ liệu (ingestion)."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Giới hạn phản hồi trong nội dung được nguồn hỗ trợ, yêu cầu trích dẫn và thêm một bước xác minh.\n\nBuộc mỗi khẳng định có bằng chứng truy xuất, yêu cầu trích dẫn và kiểm chứng mối liên hệ giữa câu trả lời với nguồn tác động trực tiếp vào lỗi grounding sau nâng model. Trích dẫn một mình chưa đủ vì mô hình có thể gắn nguồn không hỗ trợ; bước xác minh phải kiểm tra nội dung thực sự được chứng minh.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Chấm điểm mỗi phiên bản model mới trên một tập đánh giá đối kháng ổn định.**: Adversarial evaluation sau đổi phiên bản hữu ích để phát hiện lỗi an toàn nhưng không trực tiếp cưỡng chế từng khẳng định bám tài liệu khi chạy.\n- **Thay API key dùng chung bằng các token xác thực (Auth token) theo từng người dùng để hạn chế quyền truy cập dữ liệu.**: Token xác thực từng người giới hạn truy cập dữ liệu, không giải quyết việc mô hình thêm khẳng định ngoài dữ liệu đã truy xuất.\n- **Coi dữ liệu truy xuất là không đáng tin cậy và áp dụng bộ phân loại đầu vào tại thời điểm nạp dữ liệu (ingestion).**: Input classifier chống chỉ dẫn độc hại trong dữ liệu; đề mô tả nội dung không có căn cứ sau nâng model, chưa có dấu hiệu injection.\n\n**Tham khảo:**\n\n- [Reduce hallucinations](https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations)"}, {"n": 41, "set": 1, "i": 41, "multi": false, "answer": ["D"], "en": {"stem": "You are distinguishing functional from non-functional requirements during discovery.\n\nWhich item is a non-functional requirement?", "opts": [["A", "The system must extract a defined set of specific fields from invoice attachments and populate a downstream data record."], ["B", "The system must produce a draft response that a human reviewer can edit before sending."], ["C", "The system must classify inbound tickets into a defined set of categories."], ["D", "The system must respond at p95 latency under 800 milliseconds at the expected request volume."]]}, "vi": {"stem": "Bạn đang phân biệt yêu cầu chức năng với yêu cầu phi chức năng trong giai đoạn khám phá (discovery).\n\nMục nào là một yêu cầu phi chức năng?", "opts": [["A", "Hệ thống phải trích xuất một tập trường cụ thể đã được xác định từ các tệp đính kèm hóa đơn và điền vào một bản ghi dữ liệu downstream."], ["B", "Hệ thống phải tạo ra một bản nháp phản hồi mà người rà soát có thể chỉnh sửa trước khi gửi."], ["C", "Hệ thống phải phân loại các phiếu yêu cầu (ticket) đến vào một tập danh mục đã xác định."], ["D", "Hệ thống phải phản hồi với latency p95 dưới 800 mili giây ở lưu lượng yêu cầu dự kiến."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Hệ thống phải phản hồi với latency p95 dưới 800 mili giây ở lưu lượng yêu cầu dự kiến.\n\nYêu cầu p95 dưới 800 ms ở lưu lượng dự kiến mô tả chất lượng thực thi của hệ thống khi có tải, không phải một chức năng xử lý nghiệp vụ mới. Điều kiện lưu lượng làm tiêu chí đo có ý nghĩa, vì cùng mô hình có thể đáp ứng khác nhau dưới mức tải khác nhau.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Hệ thống phải trích xuất một tập trường cụ thể đã được xác định từ các tệp đính kèm hóa đơn và điền vào một bản ghi dữ liệu downstream.**: Trích xuất trường hóa đơn và tạo bản ghi mô tả hệ thống phải làm gì với đầu vào, nên là chức năng.\n- **Hệ thống phải tạo ra một bản nháp phản hồi mà người rà soát có thể chỉnh sửa trước khi gửi.**: Tạo bản nháp cho người sửa xác định một khả năng và bước của quy trình làm việc, nên là chức năng.\n- **Hệ thống phải phân loại các phiếu yêu cầu (ticket) đến vào một tập danh mục đã xác định.**: Phân loại ticket vào danh mục xác định là thao tác nghiệp vụ mà hệ thống phải thực hiện, nên là chức năng.\n\n**Tham khảo:**\n\n- [Google SRE: Service Level Objectives](https://sre.google/sre-book/service-level-objectives/)"}, {"n": 42, "set": 1, "i": 42, "multi": false, "answer": ["A"], "en": {"stem": "You are integrating Claude Code into the team's pull-request workflow.\n\nThe team wants Al-assisted review without\nremoving human approval.\n\nWhich integration design best fits this requirement?", "opts": [["A", "Claude Code reviews the pull request and posts a structured analysis as a comment, while a human reviewer etains the approval decision under the existing branch-protection rules"], ["B", "Claude Code merges every pull request automatically after completing its analysis, bypassing human approval and the existing branch-protection rules."], ["C", "Claude Code disables all existing branch-protection rules to streamline the merge process, removing human approval as a required gate."], ["D", "Claude Code silently deletes pull requests it assesses as low quality without posting a comment or notifying the author."]]}, "vi": {"stem": "Bạn đang tích hợp Claude Code vào quy trình pull request của nhóm. Nhóm muốn có rà soát được AI hỗ trợ nhưng không loại bỏ bước phê duyệt của con người.\n\nThiết kế tích hợp nào phù hợp nhất với yêu cầu này?", "opts": [["A", "Claude Code rà soát pull request và đăng một bản phân tích có cấu trúc dưới dạng bình luận, trong khi người rà soát là con người vẫn giữ quyền quyết định phê duyệt theo các quy tắc bảo vệ nhánh (branch-protection rules) hiện có."], ["B", "Claude Code tự động merge mọi pull request sau khi hoàn tất phân tích, bỏ qua bước phê duyệt của con người và các quy tắc bảo vệ nhánh hiện có."], ["C", "Claude Code vô hiệu hóa mọi quy tắc bảo vệ nhánh hiện có để đơn giản hóa quy trình merge, loại bỏ phê duyệt của con người khỏi vai trò cổng bắt buộc."], ["D", "Claude Code âm thầm xóa các pull request mà nó đánh giá là chất lượng thấp mà không đăng bình luận hay thông báo cho tác giả."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Claude Code rà soát pull request và đăng một bản phân tích có cấu trúc dưới dạng bình luận, trong khi người rà soát là con người vẫn giữ quyền quyết định phê duyệt theo các quy tắc bảo vệ nhánh (branch-protection rules) hiện có.\n\nĐể Claude Code đưa phân tích có cấu trúc vào bình luận pull request cung cấp bằng chứng và gợi ý cho reviewer. Quyết định phê duyệt vẫn thuộc người và được branch protection cưỡng chế, nên lợi ích phân tích tự động không làm mất cổng duyệt đã yêu cầu.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Claude Code tự động merge mọi pull request sau khi hoàn tất phân tích, bỏ qua bước phê duyệt của con người và các quy tắc bảo vệ nhánh hiện có.**: Tự merge sau phân tích thay thế quyết định của người, trực tiếp vi phạm yêu cầu giữ phê duyệt con người.\n- **Claude Code vô hiệu hóa mọi quy tắc bảo vệ nhánh hiện có để đơn giản hóa quy trình merge, loại bỏ phê duyệt của con người khỏi vai trò cổng bắt buộc.**: Tắt branch protection gỡ cơ chế cưỡng chế gate duyệt mà nhóm muốn giữ lại.\n- **Claude Code âm thầm xóa các pull request mà nó đánh giá là chất lượng thấp mà không đăng bình luận hay thông báo cho tác giả.**: Xóa pull request âm thầm không cung cấp review có thể kiểm tra và tự quyết kết quả thay người có thẩm quyền.\n\n**Tham khảo:**\n\n- [Claude Code GitHub Actions](https://code.claude.com/docs/en/github-actions)"}, {"n": 43, "set": 1, "i": 43, "multi": true, "answer": ["C", "E"], "en": {"stem": "A revenue projection assistant has missed its monthly cost target by 38 percent.\n\nProfiling shows three\ncontributors: a 6,000-token policy preamble repeated on every call (45 percent of cost), retrieval of historical sales\nchunks averaging 3,000 tokens per call (30 percent), and inference on a flagship-tier model (25 percent).\n\nStakeholders require that projection accuracy remain unchanged.\n\nWhich two optimizations should you sequence first to reduce cost without affecting accuracy? (Select two.)\nEach correct answer presents part of the solution.", "opts": [["A", "Reduce the number of historical sales chunks retrieved across each query run."], ["B", "Truncate the policy preamble to remove non-essential clauses from the prompt."], ["C", "Enable prompt caching on the static policy preamble across the recurring calls."], ["D", "Switch the workload to a smaller, faster Claude model tier across all queries."], ["E", "Cache common retrieved sales chunks accessed across many of the daily queries."]]}, "vi": {"stem": "Một trợ lý dự báo doanh thu đã vượt mục tiêu chi phí hằng tháng 38 phần trăm. Kết quả profiling cho thấy ba yếu tố đóng góp: một đoạn mở đầu chính sách (policy preamble) dài 6,000 token lặp lại ở mọi lệnh gọi (45 phần trăm chi phí), việc truy xuất các đoạn (chunk) dữ liệu bán hàng lịch sử trung bình 3,000 token mỗi lệnh gọi (30 phần trăm), và suy luận trên một model hạng flagship (25 phần trăm). Các bên liên quan yêu cầu độ chính xác của dự báo phải giữ nguyên.\n\nBạn nên ưu tiên thực hiện trước hai phương án tối ưu nào để giảm chi phí mà không ảnh hưởng đến độ chính xác? (Chọn hai.)\nMỗi đáp án đúng là một phần của giải pháp.", "opts": [["A", "Giảm số lượng chunk dữ liệu bán hàng lịch sử được truy xuất trong mỗi lần chạy truy vấn."], ["B", "Cắt ngắn policy preamble để loại bỏ các điều khoản không thiết yếu khỏi prompt."], ["C", "Bật prompt caching cho policy preamble tĩnh qua các lệnh gọi lặp lại."], ["D", "Chuyển khối lượng công việc sang một hạng model Claude nhỏ hơn, nhanh hơn cho mọi truy vấn."], ["E", "Cache các chunk dữ liệu bán hàng thường được truy xuất, được dùng chung bởi nhiều truy vấn hằng ngày."]]}, "expl": "**Nội dung đáp án theo khóa nguồn:** Bật prompt caching cho policy preamble tĩnh qua các lệnh gọi lặp lại.; Cache các chunk dữ liệu bán hàng thường được truy xuất, được dùng chung bởi nhiều truy vấn hằng ngày.\n\nCache policy preamble tĩnh nhắm vào phần 45% mà không xóa chỉ dẫn, nên ít thay đổi ngữ nghĩa đầu vào hơn rút ngắn prompt hay đổi model. Khóa còn chọn cache các sales chunk dùng lại để giữ nguyên bằng chứng. Tuy nhiên, cache ứng dụng chỉ tiết kiệm retrieval; muốn giảm tiền input token phải có cơ chế prompt-cache hit thích hợp. Chưa biết khoản 30% tính loại chi phí nào nên lợi ích thứ hai cần làm rõ và đo lại chất lượng.\n\n#### Vì sao các phương án khác không phù hợp?\n\n- **Giảm số lượng chunk dữ liệu bán hàng lịch sử được truy xuất trong mỗi lần chạy truy vấn.**: Giảm số sales chunk có thể làm mất dữ liệu cần cho dự báo; không thể bảo đảm accuracy giữ nguyên nếu chưa đánh giá mức liên quan và độ phủ.\n- **Cắt ngắn policy preamble để loại bỏ các điều khoản không thiết yếu khỏi prompt.**: Loại điều khoản được cho là không cần có thể thay đổi ràng buộc dự báo; chưa có bằng chứng chúng thật sự không ảnh hưởng kết quả.\n- **Chuyển khối lượng công việc sang một hạng model Claude nhỏ hơn, nhanh hơn cho mọi truy vấn.**: Model nhỏ hơn có thể rẻ hơn nhưng làm thay đổi năng lực suy luận dự báo, nên chưa đáp ứng yêu cầu giữ accuracy.\n\n**Cần xem lại:** Khóa nguồn chọn cache retrieved chunks nhưng đề không nói chi phí retrieval riêng hay bố trí prefix. Nếu 30% là token inference, cache ứng dụng đơn thuần không tiết kiệm khoản này; cần làm rõ giả định.\n\n**Tham khảo:**\n\n- [Prompt caching](https://platform.claude.com/docs/en/build-with-claude/prompt-caching)"}, {"n": 44, "set": 1, "i": 44, "multi": true, "answer": ["B", "C"], "en": {"stem": "You are building an ethics-review checklist for deployments supported by artificial intelligence.\n\nWhich two checks belong on the list? (Select two.)\nEach correct answer presents a complete solution.", "opts": [["A", "Confirm that vendor licensing terms permit the planned production use of the model."], ["B", "Verify that outputs do not rely on generalizations about people that the underlying data does not support."], ["C", "Confirm that high-impact decisions retain human accountability rather than being attributed to the model."], ["D", "Restrict ethics review to outputs that exceed a defined model-confidence threshold."], ["E", "Confirm that latency and throughput targets are met across supported user populations."]]}, "vi": {"stem": "Bạn đang xây dựng một danh sách kiểm tra rà soát đạo đức cho các hệ thống triển khai có sự hỗ trợ của trí tuệ nhân tạo.\n\nHai mục kiểm tra nào thuộc danh sách này? (Chọn hai.)\nMỗi đáp án đúng là một giải pháp hoàn chỉnh.", "opts": [["A", "Xác nhận rằng các điều khoản cấp phép của nhà cung cấp cho phép việc sử dụng model trong production theo kế hoạch."], ["B", "Xác minh rằng đầu ra không dựa vào những khái quát hóa về con người mà dữ liệu nền tảng không hỗ trợ."], ["C", "Xác nhận rằng các quyết định có tác động lớn vẫn giữ trách nhiệm giải trình của con người thay vì quy trách nhiệm cho model."], ["D", "Chỉ giới hạn việc rà soát đạo
